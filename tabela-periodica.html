<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiobook interativo da Tabela Periódica Moderna</title>
<meta name="theme-color" content="#EDEAF2">
<!-- só clara: o modo escuro automático de alguns celulares escurecia
     o fundo fora do palco, e as laterais ficavam pretas -->
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audiobook da Tabela">
<meta name="description" content="O audiobook interativo da Tabela Periódica do Prof. Amauri Junior: a aula guiada por áudio, com os 118 elementos em cubos que giram.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<!-- AS FONTES MORAM AQUI DENTRO, como no app do professor: o aluno abre
     isto no celular da casa dele, e nada é pedido para fora. -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
/* ============================================================
   PALETA — as 3 cores do tema, as mesmas do app do professor
   papel-lavanda (fundo) · índigo (estrutura) · âmbar (destaque)
   ============================================================ */
:root{
  --fundo:      #EDEAF2;
  --fundo-alto: #F4F2F8;
  --fundo-2:    #E2DDEE;
  --tinta:      #201C42;
  --tinta-dim:  rgba(32,28,66,.62);
  --tinta-faint:rgba(32,28,66,.28);
  --indigo:     #4C3FBF;
  --indigo-dim: rgba(76,63,191,.22);
  --ouro:       #A96B10;
  --ouro-luz:   #E2A22B;
  --ouro-dim:   rgba(226,162,43,.26);

  /* ---- as cores das famílias da tabela ----
     Copiadas tal e qual da aula do professor: as duas telas têm de
     pintar a mesma casa da mesma cor, senão o aluno não reconhece em
     casa a tabela que viu na sala. */
  --cat-alcalinos:   #D2591F;
  --cat-alcterrosos: #C58A0E;
  --cat-transicao:   #2E7BAE;
  --cat-metais:      #1E8F7D;
  --fam-boro:        #6F8C1E;
  --cat-ametais:     #2E9450;
  --cat-halogenios:  #C13757;
  --cat-nobres:      #5B4BD6;
  --cat-lantanideos: #8B3FBE;
  --cat-actinideos:  #B1408C;
  --cat-calcogenios: #128B86;

  /* tempos e curvas das transições */
  --t-capa: .82s;
  --e-capa: cubic-bezier(.42,.02,.24,1);
  --t-desl: .58s;
  --e-desl: cubic-bezier(.32,.72,.24,1);
  --e-salto: cubic-bezier(.3,1.05,.35,1);

  --display: 'Space Grotesk', system-ui, sans-serif;
  --body:    'IBM Plex Sans', system-ui, sans-serif;
  --mono:    'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#DAD5E6}
body{
  font-family:var(--body);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:pan-y;
}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px;border-radius:4px}

/* ---------- palco 16:9 que escala pra qualquer tela ---------- */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{
  position:absolute;top:50%;left:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--fit,1));
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  box-shadow:0 26px 70px rgba(32,28,66,.28);
  overflow:hidden;
  touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  /* a profundidade em que o cubo da capa gira */
  perspective:1500px;perspective-origin:50% 50%;
}

/* a grade da tabela como papel de fundo: células, não milimetrado */
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(76,63,191,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,63,191,.07) 1px,transparent 1px);
  background-size:52px 58px;
}
/* duas luzes, uma fria e uma quente, para o papel não ficar chapado */
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
             radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%);
}

/* ---- O CELULAR DEITADO: o palco até às bordas (ver ajustaPalco) ----
   A tela é mais larga do que 16:9, e a cena, medida pela altura, deixava
   duas faixas nos lados. Aqui o papel de fundo passa para a tela inteira
   (a grade alinhada com a do palco), o palco deixa de cortar o que sai
   dele, as camadas que cobrem a cena cobrem também as faixas — por uma
   sombra sem desfoque, que não mexe no que está dentro delas —, e o play
   e a versão vão para os cantos de verdade. Só no celular: tablets,
   Chromebooks e computadores nunca entram aqui. */
html.palco-largo #viewport{
  background-color:var(--fundo);
  background-image:
    linear-gradient(rgba(76,63,191,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,63,191,.07) 1px,transparent 1px),
    radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
    radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%),
    linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  background-size:calc(52px * var(--fit,1)) calc(58px * var(--fit,1)),
                  calc(52px * var(--fit,1)) calc(58px * var(--fit,1)),
                  100% 100%, 100% 100%, 100% 100%;
  background-position:var(--gx,0) var(--gy,0), var(--gx,0) var(--gy,0), 0 0, 0 0, 0 0;
  background-repeat:repeat, repeat, no-repeat, no-repeat, no-repeat;
}
html.palco-largo #stage{background:transparent;box-shadow:none;overflow:visible}
html.palco-largo #stage::before, html.palco-largo #stage::after{display:none}
html.palco-largo .veu     {box-shadow:0 0 0 var(--folga) rgba(12,10,32,.87)}
html.palco-largo .quiz    {box-shadow:0 0 0 var(--folga) rgba(12,10,32,.55)}
html.palco-largo .memoria {box-shadow:0 0 0 var(--folga) rgba(7,6,22,.995)}
html.palco-largo #flash-erro{box-shadow:0 0 0 var(--folga) rgba(220,38,60,.55)}
html.palco-largo #som, html.palco-largo #som-dica{translate:var(--folga) 0}
html.palco-largo #versao{translate:calc(-1 * var(--folga)) 0}
/* e a barrinha do progresso, de borda a borda: a fração vem em --prog */
html.palco-largo #progress{left:calc(-1 * var(--folga));right:calc(-1 * var(--folga));width:auto!important;
  transform-origin:left center;transform:scaleX(var(--prog,0));transition:transform .45s cubic-bezier(.4,0,.2,1)}

/* barra de progresso da apresentação */
#progress{position:absolute;top:0;left:0;height:3px;background:var(--ouro-luz);z-index:6;
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- a tabelinha colorida, a marca do tema ---------- */
#tabela{
  position:absolute;z-index:0;pointer-events:none;
  width:320px;right:-24px;bottom:-20px;opacity:.4;
  transition:width .8s var(--e-capa),right .8s var(--e-capa),
             bottom .8s var(--e-capa),opacity .8s var(--e-capa);
}
#tabela .cel{stroke:rgba(255,255,255,.72);stroke-width:.5;
  transition:fill 1.2s ease}
/* A CASA QUE ACENDE — de vez em quando uma casinha da capa diz quem é */
#tabela .luz{
  opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.84);
  transition:opacity .3s ease, transform .4s cubic-bezier(.2,1.35,.4,1);
}
#tabela .luz.on{opacity:1;transform:scale(1)}
#tabela .luz .carta{fill:#FFFDF8;fill-opacity:.96;stroke:var(--cl);stroke-width:.7}
#tabela .luz .n{font-family:var(--mono);font-size:2.7px;fill:var(--tinta-dim)}
#tabela .luz .s{font-family:var(--display);font-weight:600;font-size:5.4px;
  fill:var(--cl);text-anchor:middle}
/* Na capa a tabelinha é a ilustração, mas agora em ponto pequeno: o
   título cresceu e é ele que manda na folha. Ela fica no canto de
   baixo à direita, do tamanho de um selo — e acima do botão da
   narração, que mora no mesmo canto. */
#stage.na-capa #tabela{width:520px;right:30px;bottom:88px;opacity:1}
/* onde há uma tabela de verdade em cena, a do canto sai */
#stage.sem-marca #tabela{opacity:0}

/* ---------- slides ---------- */
/* o deck é o volume 3D onde as faces do cubo giram */
#deck{position:absolute;inset:0;z-index:1;transform-style:preserve-3d}
.slide{
  position:absolute;inset:0;
  padding:56px 80px 58px;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  backface-visibility:hidden;
}
.slide.is-active {opacity:1;visibility:visible;z-index:3}
.slide.is-leaving{opacity:1;visibility:visible;z-index:2}

/* ===== capa <-> slide 1: o cubo girando =====
   As duas faces giram juntas em torno do mesmo eixo, cada uma
   empurrada meia volta para longe do observador e trazida de volta —
   é isso que faz o vinco do canto do cubo aparecer no meio do giro. */
.slide::after{content:'';position:absolute;inset:0;z-index:9;pointer-events:none;
  background:#0B0D20;opacity:0}

.fx-cube-in-next {animation:cubeInNext  var(--t-capa) var(--e-capa) both}
.fx-cube-out-next{animation:cubeOutNext var(--t-capa) var(--e-capa) both}
.fx-cube-in-prev {animation:cubeInPrev  var(--t-capa) var(--e-capa) both}
.fx-cube-out-prev{animation:cubeOutPrev var(--t-capa) var(--e-capa) both}
.fx-cube-in-next::after,.fx-cube-in-prev::after {animation:faceClara var(--t-capa) var(--e-capa) both}
.fx-cube-out-next::after,.fx-cube-out-prev::after{animation:faceEscura var(--t-capa) var(--e-capa) both}

@keyframes cubeInNext{
  from{transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutNext{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
}
@keyframes cubeInPrev{
  from{transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutPrev{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
}
@keyframes faceClara {from{opacity:.5} to{opacity:0}}
@keyframes faceEscura{from{opacity:0}  to{opacity:.5}}

/* ---------- CAPA ----------
   Três faixas verticais, da esquerda para a direita: o título, o
   retrato, e a tabelinha no canto de baixo. O título é agora o nome do
   que isto é — um audiobook —, e é a peça mais comprida da capa: por
   ele ganhar largura, o retrato foi para a direita e a tabelinha
   encolheu para o canto. O endereço saiu de debaixo do nome e foi
   morar no rodapé, sozinho: ali ele se lê sem disputar com nada. */
.slide.capa{justify-content:center;padding-left:88px}
.capa .marca{
  font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:22px;
}
.capa h1{
  font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;
  letter-spacing:-.028em;color:var(--tinta);
}
.capa h1 em{font-style:normal;color:var(--ouro)}
/* a última palavra fica no meio da caixa do título, e não encostada à
   esquerda: sozinha numa linha curta, alinhada com as outras ela
   parecia uma sobra da linha de cima */
.capa h1 .ult{display:block;text-align:center}
/* e "Tabela Periódica" também, na linha dela: as duas linhas âmbar
   descem pelo eixo do título, uma debaixo da outra */
.capa h1 .linha{display:block;text-align:center}

/* ---- os blocos gigantes da capa ----
   Três cubos em tamanho grande, ao lado da tabelinha: o sódio, o ítrio
   e o lantânio — os três primeiros que a tabelinha acende. São os
   mesmos cubos da tabela do slide 1, na mesma construção de seis faces
   iguais; aqui em ponto grande, para quem chega ver de perto do que é
   feita a tabela que está ao lado. */
.capa .blocos{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ---- as frases digitadas ----
   Aparecem no vazio à direita do retrato, letra a letra, como alguém a
   escrever depressa. A caixa tem tamanho fixo mesmo vazia: é peça de
   montagem, e uma caixa de altura zero não se deixaria pegar. */
.capa .digitado{
  position:absolute;left:305px;top:350px;width:410px;height:250px;z-index:3;
  pointer-events:none;
}
body.montagem .capa .digitado{pointer-events:auto}
.capa .frase{
  display:none;margin:0 0 12px;
  font-family:var(--display);font-weight:500;font-size:27px;line-height:1.22;
  letter-spacing:-.01em;color:var(--tinta);
  transition:opacity .35s ease;
}
.capa .frase.on{display:block}
.capa .frase.saindo{opacity:0}
/* o tracinho: firme enquanto escreve, a piscar quando espera */
.capa .frase .cursor{
  display:inline-block;width:3px;height:.95em;margin-left:3px;vertical-align:-.12em;
  background:var(--ouro-luz);border-radius:1px;
}
.capa .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
@keyframes piscaCursor{50%{opacity:0}}
.capa .risco{
  width:200px;height:4px;margin:26px 0 20px;border-radius:2px;
  background:linear-gradient(90deg,var(--ouro-luz),var(--indigo));
}
.capa .autor{font-size:22px;font-weight:300;color:var(--tinta-dim);letter-spacing:.01em}
.capa .autor b{font-weight:500;color:var(--tinta)}
/* o endereço, no rodapé: quem lê isto de longe está lendo o título, e
   quem quer o contato está perto — e é no pé da folha que se procura */
.capa .email{
  position:absolute;left:88px;bottom:46px;
  font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:.01em;
  color:var(--indigo);text-decoration:none;cursor:pointer;
  /* é um link, e o palco inteiro não deixa selecionar texto: aqui deixa,
     para quem preferir copiar o endereço à mão */
  user-select:text;-webkit-user-select:text;
  border-bottom:1px solid transparent;transition:border-color .2s,color .2s;
}
.capa .email:hover{color:var(--ouro);border-bottom-color:var(--ouro-dim)}

/* ---- o menu do endereço (botão direito, ou dedo demorado) ----
   Uma opção só, com o desenho da barra de controles. */
#menu-email{
  position:fixed;z-index:95;min-width:180px;padding:6px;
  background:rgba(255,255,255,.97);border:1px solid var(--indigo-dim);
  border-radius:11px;backdrop-filter:blur(9px);
  box-shadow:0 14px 36px rgba(32,28,66,.24);
}
#menu-email[hidden]{display:none}
#menu-email button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border:0;border-radius:7px;background:transparent;cursor:pointer;
  font-family:var(--body);font-size:14px;color:var(--tinta);text-align:left;
}
#menu-email button:hover,#menu-email button:focus-visible{
  background:rgba(76,63,191,.1);color:var(--indigo);outline:none;
}
#menu-email svg{flex:none;color:var(--ouro)}
/* o retrato do autor, enquadrado como uma célula da tabela */
.capa .foto{
  position:absolute;left:790px;top:400px;width:164px;height:242px;margin:0;
  transform:translate(-50%,-50%) scale(1.1);
  padding:7px;background:#fff;border:1.5px solid var(--indigo);border-radius:6px;
  box-shadow:0 12px 28px rgba(32,28,66,.2);
}
.capa .foto img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}

/* ---------- cabeçalho: a tira do alto ----------
   É a arrumação que o professor deixou nos slides de conteúdo: régua,
   número, título e subtítulo lado a lado numa tira só, no alto. Vale
   aqui pela mesma razão que vale lá — a tabela precisa da folha
   inteira, e um cabeçalho de quatro andares comeria um terço dela. */
.slide:not(.capa){padding:0}
.tira{
  position:absolute;left:80px;right:80px;top:10px;height:48px;z-index:5;
  display:flex;align-items:center;gap:24px;
}
.num{
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1;
  color:var(--indigo);opacity:.34;
}
.title{
  font-family:var(--display);font-weight:700;font-size:35px;line-height:1.05;
  letter-spacing:-.02em;color:var(--tinta);
  max-width:none;white-space:nowrap;
}
/* a assinatura do tema: a régua dos períodos.
   Uma célula por slide; a acesa é onde a aula está. */
.regua{display:flex;gap:5px;flex:none}
.regua button{
  width:15px;height:15px;padding:0;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid rgba(76,63,191,.32);
  transition:background .25s,border-color .25s,transform .25s;
}
.regua button:hover{border-color:var(--indigo);transform:translateY(-2px)}
.regua button.feito{background:rgba(76,63,191,.42);border-color:transparent}
.regua button.aqui{
  background:var(--ouro-luz);border-color:var(--ouro);
  box-shadow:0 0 0 3px rgba(226,162,43,.24);
}
.subtitle{font-size:28px;font-weight:300;color:var(--ouro);letter-spacing:.005em;
  white-space:nowrap}

/* área de conteúdo — o palco inteiro, por baixo da tira.
   Como ela cobre o slide todo, as contas da tabela são feitas em
   coordenadas do palco: x e y aqui são os mesmos x e y de 1280x720. */
.body-area{position:absolute;inset:0}

/* ============================================================
   A MESA DOS 118 CUBOS  (slide 1)
   Uma camada que cobre o slide inteiro, para a tabela poder passar
   por baixo do cabeçalho sem ficar presa à caixa do conteúdo. Ela
   não pega o dedo: só o cubo pega.
   ============================================================ */
.cena{position:absolute;inset:0;z-index:4;pointer-events:none}
/* A mesa é plana: quem tem volume são os cubos, cada um no seu
   próprio espaço 3D. Sem 'preserve-3d' aqui, a ordem em que eles se
   cobrem continua a ser a do z-index — e é dela que precisamos para
   pôr por cima o cubo que está girando ou aceso. */
.mesa{
  position:absolute;inset:0;
  /* --abre: o encolher da tabela aberta em linhas ou em colunas (LC25) */
  transform:translate(var(--px,0px),var(--py,0px)) scale(calc(var(--zoom,1) * var(--abre,1)));
}
/* A TABELA ABERTA (LC25): as cartas andam para as linhas ou para as
   colunas, os números vão junto, e a mesa encolhe um fio para caber */
.mesa.lc25{transition:transform .55s cubic-bezier(.3,.85,.3,1)}
.mesa.lc25 .pc{transition:left .55s cubic-bezier(.3,.85,.3,1), top .55s cubic-bezier(.3,.85,.3,1),
  transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease, opacity .45s ease}
.mesa.lc25 .casa{transition:left .55s cubic-bezier(.3,.85,.3,1), top .55s cubic-bezier(.3,.85,.3,1), opacity .3s ease}
.mesa.aberta25 .casa:not(.serie){opacity:0}
.mesa.lc25 .eixo{transition:left .55s cubic-bezier(.3,.85,.3,1), top .55s cubic-bezier(.3,.85,.3,1),
  opacity .3s, color .25s, background .25s, border-color .25s, transform .25s}
/* o número no modelo do professor: a bolinha índigo, com o aro; entra
   em cascata — as linhas pela esquerda, as colunas caindo de cima */
.eixo.prof{width:30px;height:30px;font-family:var(--display);font-weight:600;font-size:16px;
  letter-spacing:0;color:var(--indigo);background:rgba(76,63,191,.12);border:1.5px solid var(--indigo);
  animation:numLinha25 .26s cubic-bezier(.2,1.5,.4,1) var(--atraso,0ms) backwards}
.eixo.prof[data-grupo]{width:27px;height:27px;font-size:14px;animation-name:numColuna25}
.eixo.some25{opacity:0}
@keyframes numLinha25{
  from{opacity:0;transform:translate(calc(-50% - 24px),-50%) scale(.5)}
  to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes numColuna25{
  from{opacity:0;transform:translate(-50%,calc(-50% - 24px)) scale(.5)}
  to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* as coordenadas da tabela: o grupo em cima, o período à esquerda.
   Discretas — são a moldura, não o assunto. */
/* O número do eixo é uma bolinha que quase não se vê — e que, quando a
   cruz de um elemento acende, vira a medalha âmbar do app do
   professor. É a mesma peça nos dois estados: assim ela não aparece do
   nada, ela ACENDE. */
.eixo{
  position:absolute;display:grid;place-items:center;
  width:19px;height:19px;border-radius:50%;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;line-height:1;
  color:var(--tinta-faint);background:transparent;border:1px solid transparent;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:opacity .3s,color .25s,background .25s,border-color .25s,transform .25s;
}
/* a família que sobe passa por cima do número do grupo dela; o número
   dá-lhe passagem e volta quando ela pousa */
.eixo.recuado{opacity:0}
.eixo.acesa{
  background:var(--ouro-luz);border-color:var(--ouro);color:#fff;font-weight:600;
  transform:translate(-50%,-50%) scale(1.28);
}

/* ============================================================
   AS COORDENADAS DE UM ELEMENTO
   O sistema do slide 3 da aula do professor, trazido para cá: o
   elemento salta, dá a volta e cai no mesmo lugar — e enquanto está no
   ar, a linha e a coluna dele acendem inteiras, os dois números viram
   medalha, e o resto da tabela recua. É o encontro das duas faixas que
   dá o lugar dele, e é isso que a cena mostra sem dizer.
   ============================================================ */
.mesa.tem-cruz .pc{transition:transform var(--tsobe,.42s) var(--e-salto),opacity .35s ease}
/* (e o card guarda uma transição de opacidade também sem a cruz — ver
   .pc —: apagada ela, a tabela volta em fade, e não de uma vez) */
.mesa.tem-cruz .pc:not(.cruz){opacity:.34}
.pc.escolhido{z-index:12}
/* o número aceso da cruz fica por cima dos cards: o elemento em destaque,
   crescido, não o tapa (o Na, na coluna 1, ficava por cima do seu 3) */
.mesa .eixo.acesa{z-index:15}
.pc.escolhido .cubo{--sc:1.18}
.pc.escolhido .face{box-shadow:0 0 0 2px rgba(226,162,43,.9), 0 10px 24px rgba(80,40,0,.34)}

/* a faixa que acende a linha (ou a coluna) inteira, número junto */
.banda{
  position:absolute;opacity:0;pointer-events:none;z-index:0;border-radius:10px;
  background:rgba(226,162,43,.18);border:1px solid rgba(226,162,43,.5);
  transition:top .3s cubic-bezier(.3,.85,.3,1),left .3s cubic-bezier(.3,.85,.3,1),
             width .3s ease,height .3s ease,opacity .45s ease;
}
.banda.on{opacity:1}

/* a ficha do escolhido, no vazio que a tabela tem acima dos metais de
   transição — o mesmo lugar onde ela mora na aula do professor */
.ficha{
  position:absolute;z-index:8;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  font-family:var(--display);line-height:1;
}
.ficha.on{opacity:1}
.ficha span{font-family:var(--mono);font-size:19px;color:var(--tinta-dim);margin-bottom:5px}
.ficha b{font-size:58px;font-weight:600;color:var(--indigo);letter-spacing:-.02em}
/* e os nomes das duas coordenadas, ao lado dela */
.coords-el{
  position:absolute;z-index:8;transform:translateY(-50%);pointer-events:none;
  display:flex;flex-direction:column;gap:9px;
}
.coords-el span{
  opacity:0;transition:opacity .3s ease;white-space:nowrap;
  font-family:var(--display);font-weight:500;font-size:23px;color:var(--tinta);
}
.coords-el span.on{opacity:1}
.coords-el b{color:var(--ouro);font-weight:700}

/* A CASA — o encaixe vazio onde o cubo pousa. É ela que faz a sombra
   do cubo: um cubo sem chão flutua, e a tabela deixa de ser uma mesa. */
.casa{
  position:absolute;transform:translate(-50%,-50%);
  border-radius:2px;background:rgba(32,28,66,.07);
  box-shadow:inset 0 1px 2px rgba(32,28,66,.10);
  pointer-events:none;
}
/* as duas casas que guardam as séries: elas não têm elemento dentro,
   têm um bilhete dizendo onde procurar */
.casa.serie{
  display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;line-height:1.4;text-align:center;
  color:var(--tinta-dim);background:rgba(139,63,190,.10);
  border:1px dashed rgba(139,63,190,.45);
}
.casa.serie.act{background:rgba(177,64,140,.10);border-color:rgba(177,64,140,.45)}

/* ---------- O CUBO ----------
   Cada elemento é um cubo de seis faces iguais: em todas elas o mesmo
   número atômico, o mesmo símbolo, a mesma massa e o mesmo nome. É
   assim de propósito — o cubo pode girar para qualquer lado, em
   qualquer jogo, que a informação nunca se perde de vista.

   A perspectiva é de cada cubo, e não do palco inteiro: cada um tem o
   seu ponto de fuga, e por isso o da ponta da tabela não sai deitado
   quando gira. */
/* O SALTO E A SUBIDA vão na carta, e não no cubo: o cubo já usa o
   transform dele para os três giros, e animar a mesma propriedade nos
   dois lugares apagaria um deles. Aqui a peça sobe e desce; lá dentro,
   ela gira. As duas coisas podem acontecer ao mesmo tempo. */
.pc{
  position:absolute;width:var(--L,58px);height:var(--L,58px);
  /* --onda é o crescer das ondas da narração; o brilho delas vai num
     filter escrito à mão, só enquanto a onda passa — um filter fixo nos
     118 obrigaria o navegador a manter 118 camadas acesas à toa */
  /* --vx/--vy: o deslocamento de um voo em arco (voaEmArco), que anda
     dentro do transform e não obriga a refazer o desenho da página */
  transform:translate(-50%,-50%) translate(var(--vx,0px),var(--vy,0px))
            translateY(var(--sobe,0px)) scale(var(--onda,1));
  transition:transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease,
             opacity .45s ease;
  perspective:var(--persp,620px);
  pointer-events:auto;cursor:pointer;
}
/* quem está no ar passa por cima de quem ficou na mesa */
.pc.sobe{z-index:6}
/* os lantanídeos e os actinídeos, enquanto não são revelados */
.pc.serie-oculta{display:none}
/* A ordem importa: o LEVANTAR (--dz) vem primeiro, para ser sempre na
   direção do olho e não na do cubo já virado; depois a CORREÇÃO da
   leitura (--rzc), que é um giro no plano da tela; e só então os três
   giros do cubo. */
.cubo{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:translateZ(var(--dz,0px)) rotateZ(var(--rzc,0deg))
            rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg))
            scale(var(--sc,1));
  transition:transform var(--dur,.7s) var(--curva,cubic-bezier(.3,.85,.3,1));
}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:calc(3px * var(--k,1)) calc(4px * var(--k,1)) calc(4px * var(--k,1));
  background:linear-gradient(145deg,color-mix(in srgb,var(--cor) 84%,#fff),
                                    color-mix(in srgb,var(--cor) 86%,#000));
  border:1px solid rgba(255,255,255,.24);
  backface-visibility:hidden;
  overflow:hidden;
}
/* o vidro por cima: claro no alto, some antes da metade */
.face::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 42%)}
/* as seis faces do cubo, meio lado para fora cada uma */
.f1{transform:translateZ(var(--H,29px))}
.f2{transform:rotateY( 90deg) translateZ(var(--H,29px))}
.f3{transform:rotateY(180deg) translateZ(var(--H,29px))}
.f4{transform:rotateY(-90deg) translateZ(var(--H,29px))}
.f5{transform:rotateX( 90deg) translateZ(var(--H,29px))}
.f6{transform:rotateX(-90deg) translateZ(var(--H,29px))}
/* as faces de lado escurecem um fio: é o que dá volume ao cubo
   enquanto ele roda. Paradas, as seis são a mesma carta.
   Não é um filter (eram mil e tantas faces filtradas nas duas mesas,
   e cada filter é uma superfície à parte para o navegador pintar): é
   um véu por cima da cor, abaixo da letra — o mesmo tom, de graça. */
.f2::after,.f3::after,.f4::after,.f5::after,.f6::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none}
.f2::after,.f4::after{background:rgba(0,0,0,.07)}
.f3::after{background:rgba(0,0,0,.12)}
.f5::after,.f6::after{background:rgba(255,255,255,.05)}
/* O TABULEIRO LISO (slide 4, as coordenadas): todas as cartas na mesma
   cor, o lilás claro do app do professor (FUNDO_FACE2) — a tabela deixa
   de falar de famílias. Em cor clara a letra branca se perderia, então
   ela escurece junto. */
.mesa.lisa .face{background:linear-gradient(145deg,#DCD7F3,#C0B8E8);border-color:rgba(76,63,191,.42)}
.mesa.lisa .face::before{opacity:0}
.mesa.lisa .face i,.mesa.lisa .face u,.mesa.lisa .face em{color:rgba(32,28,66,.58);text-shadow:none}
.mesa.lisa .face b{color:var(--tinta);text-shadow:none}

.face i,.face b,.face u,.face em{
  position:relative;z-index:3;font-style:normal;text-decoration:none;color:#fff;
}
/* A letra da carta anda com o tamanho do cubo: --k é o quanto ele é
   maior do que a carta da tabela. Na tabela vale 1; nos blocos
   gigantes da capa, quase dois e meio. Uma conta só, e as quatro
   linhas da face crescem todas juntas, na mesma proporção. */
.face i{font-family:var(--mono);font-size:calc(9.5px * var(--k,1));line-height:1;
  letter-spacing:.02em;align-self:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.face b{flex:1;display:grid;place-items:center;
  font-family:var(--display);font-weight:500;font-size:calc(21px * var(--k,1));line-height:1;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
.face u{font-family:var(--mono);font-size:calc(7.8px * var(--k,1));line-height:1.1;
  text-align:center;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.face em{
  font-size:calc(var(--fn,7px) * var(--k,1));line-height:1.15;text-align:center;font-weight:400;
  color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}

/* a entrada: cada cubo nasce do nada, passa do tamanho e assenta */
@keyframes pousa{
  0%  {opacity:0;transform:rotateY(-90deg) scale(.3)}
  62% {opacity:1;transform:rotateY(10deg)  scale(1.14)}
  100%{opacity:1;transform:rotateY(0deg)   scale(1)}
}
.pc.pousando .cubo{animation:pousa .62s cubic-bezier(.2,.9,.3,1) both}

/* GIRANDO — um cubo a meio de uma volta é mais largo do que a casa
   dele: a quina sai para os lados. Enquanto roda, ele passa por cima
   dos vizinhos, senão a volta aparece recortada pelas cartas ao lado. */
.pc.girando{z-index:7}

/* O CHAMADO — o cubo que a narração está apontando. Sobe um pouco,
   cresce e ganha um halo âmbar: dá para achá-lo no meio dos 118 mesmo
   do fundo da sala. */
.pc.aceso{z-index:9}
.pc.aceso .cubo{--sc:1.14;--dz:10px}
.pc.aceso .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 0 22px 4px rgba(226,162,43,.55)}
/* o apagado: quando a narração fala de um grupo, os outros recuam */
.pc.apagado .cubo{--sc:.96}
/* na carta inteira (uma superfície por cubo), e não em cada uma das
   seis faces: o mesmo desbotado, com um sexto do trabalho */
.pc.apagado{filter:saturate(.22) brightness(1.06);opacity:.55}

/* O VERDE — o elemento que a narração sorteia: cresce e acende. */
.pc.verde{z-index:9}
.pc.verde .cubo{--sc:1.4;--dz:12px;--dur:.3s}
.pc.verde .face{box-shadow:0 0 0 2px #3EE08A, 0 0 26px 7px rgba(46,204,113,.78)}

/* O ELEITO — o que o aluno tocou: sai da casa a girar e a crescer, e
   pousa no vazio acima do ferro e do cobalto */
.pc.eleito{z-index:40;pointer-events:none}
.pc.eleito .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 18px 40px rgba(32,28,66,.35),
                            0 0 40px rgba(226,162,43,.5)}

/* ---- o eleito, pousado: o número e a massa em foco ----
   O número cresce a partir do canto dele (em cima, à esquerda), para
   não sair pela borda da face, que corta o que passa; a massa cresce do
   meio. Estão nas seis faces, e crescem nas seis. */
.face i{transform-origin:left top;transition:transform .35s var(--e-salto), text-shadow .35s ease}
.face u{transition:transform .35s var(--e-salto), text-shadow .35s ease}
.face b,.face em{transition:transform .35s var(--e-salto)}
/* O QUE CRESCE PEDE LICENÇA AOS VIZINHOS. A face é pequena, e crescido
   o número caía em cima do símbolo, e a massa em cima do nome. Por isso
   eles crescem um pouco menos — e, enquanto crescem, o símbolo encolhe
   e afasta-se do número, e o nome desce um fio para dar lugar à massa. */
.pc.foco-num .face i{
  transform:scale(1.75);color:#FFF6D2;
  text-shadow:0 0 6px rgba(255,208,90,1), 0 0 14px rgba(255,190,60,.8), 0 1px 3px rgba(0,0,0,.6);
}
.pc.foco-num .face b{transform:translate(4px,4px) scale(.84)}
.pc.foco-massa .face u{
  transform:scale(1.7);color:#FFF6D2;
  text-shadow:0 0 6px rgba(255,208,90,1), 0 0 14px rgba(255,190,60,.8), 0 1px 3px rgba(0,0,0,.6);
}
.pc.foco-massa .face b {transform:translateY(-3px) scale(.88)}
.pc.foco-massa .face em{transform:translateY(2.5px) scale(.92)}
.pc.pulsa .face{box-shadow:0 0 0 3px var(--ouro-luz), 0 0 60px 14px rgba(226,162,43,.7)}
/* ---- os eventos da "1.3A" ----
   As pulsadas de uma peça da face (o símbolo, o nome) vão numa escala
   escrita a cada tique; a transição é curta para seguir o tique. */
.pc.pulsa-sym .face b {transform:scale(var(--psym,1));transition:transform 80ms linear}
/* o símbolo partido em duas letras (só no card do escolhido, na "1.3B"):
   lado a lado, e a segunda pulsa sozinha */
.face b .sym{display:inline-flex;align-items:baseline}
.face b .l1,.face b .l2{display:inline-block}
/* a segunda letra cresce a partir da esquerda dela, para a direita: a
   partir do meio avançava sobre a primeira e as duas colavam */
.pc.pulsa-l2 .face b .l2{transform:scale(var(--pl2,1));transform-origin:left 78%;
  transition:transform 80ms linear}
.pc.pulsa-nome .face em{transform:scale(var(--pnome,1));transition:transform 80ms linear}
/* o nome a pulsar cresce para cima, por cima da massa: ela dá licença,
   sobe um fio e encolhe enquanto ele pulsa */
.pc.pulsa-nome .face u{transform:translateY(-3px) scale(.82);transition:transform 120ms ease-out}
/* as ondas de um em um: âmbar a dos de duas letras, marrom a dos que
   têm o nome a começar pelo símbolo */
.pc.luz-onda .face  {box-shadow:0 0 0 2px var(--ouro-luz), 0 0 18px 4px rgba(226,162,43,.6)}
.pc.luz-marrom .face{box-shadow:0 0 0 2px #8B5A2B, 0 0 24px 7px rgba(139,90,43,.8)}
/* e vinho a da "1.4": os que têm o símbolo sem nada a ver com o nome */
.pc.luz-vinho .face {box-shadow:0 0 0 2px #9C2F4A, 0 0 24px 7px rgba(156,47,74,.75)}
/* o nome escondido enquanto o elemento está lá fora ("1.4"): some, e na
   hora dele volta a aparecer, e pulsa */
.pc.nome-oculto .face em{color:transparent;text-shadow:none}
/* o F, o Ca e o O, a crescer no lugar: por cima de todos */
.pc.zoom-el{z-index:46}
.pc.zoom-el .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 16px 36px rgba(12,10,32,.35),
                              0 0 36px rgba(226,162,43,.55)}
.pc.zoom-el .face em{transition:color .35s ease, transform 80ms linear}
/* a palavra latina ao lado do elemento crescido ("1.4"): escrita letra a
   letra, e sai a girar junto com a volta dele. A posição, o giro e o
   tamanho são escritos a cada tique pela narração. */
.latim{position:absolute;z-index:47;display:none;pointer-events:none;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:40px;line-height:1;letter-spacing:.01em;
  color:var(--ouro);padding:10px 20px 12px;border-radius:14px;
  background:rgba(255,252,242,.96);border:2px solid var(--ouro-luz);
  box-shadow:0 0 0 4px rgba(226,162,43,.18), 0 12px 30px rgba(80,40,0,.22), 0 0 34px rgba(226,162,43,.45);
  transition:transform 80ms linear, opacity 80ms linear}
.latim.on{display:block}
/* o cursor, só enquanto a palavra está a ser escrita */
.latim.digitando::after{content:'';display:inline-block;width:3px;height:.8em;margin-left:4px;
  background:currentColor;vertical-align:-.05em}

/* medir é fotografar em repouso, também por dentro do cubo */
.pc.medindo *{transition:none!important}

/* os nomes do que cresce, à esquerda do card, a apontar para ele */
.rotulo-el{
  position:absolute;z-index:41;transform:translate(-100%,-50%);
  display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none;
  font-family:var(--display);font-weight:600;font-size:25px;color:var(--tinta);
  opacity:0;transition:opacity .35s ease, color .35s ease, text-shadow .35s ease;
}
.rotulo-el.on{opacity:1}
.rotulo-el svg{flex:none;color:var(--ouro)}
.rotulo-el.brilha{
  color:var(--ouro);
  text-shadow:0 0 16px rgba(226,162,43,.9), 0 0 34px rgba(226,162,43,.5);
}

/* ---- o quiz ----
   Mora DENTRO da mesa, entre os cubos: o fundo escuro fica por cima da
   tabela, o cartão por cima do fundo, e o cubo da pergunta por cima do
   cartão. Fora da mesa isto não era possível — a mesa inteira desenha-se
   numa camada só, e o cubo ficava por baixo do fundo escuro. */
.quiz{
  position:absolute;inset:0;z-index:20;
  background:rgba(12,10,32,.55);
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
.quiz.on{opacity:1;pointer-events:auto}
.quiz-card{
  position:absolute;left:640px;top:372px;width:860px;min-height:330px;
  padding:34px 40px 28px 350px;border-radius:22px;text-align:left;
  background:#FFFDF8;border:1px solid var(--ouro-dim);
  box-shadow:0 30px 80px rgba(12,10,32,.45);
  transform:translate(-50%,-50%) scale(.92);opacity:0;
  transition:transform .5s var(--e-salto), opacity .35s ease;
}
.quiz.card-on .quiz-card{transform:translate(-50%,-50%);opacity:1}
/* a luz por trás do cubo, na coluna esquerda do cartão */
.quiz-card::before{
  content:'';position:absolute;left:40px;top:50%;width:260px;height:260px;margin-top:-130px;
  border-radius:50%;background:radial-gradient(circle,rgba(226,162,43,.3),transparent 70%);
}
.quiz-marca{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ouro);margin-bottom:8px}
.quiz-q{margin:0 0 20px;font-family:var(--display);font-weight:600;font-size:32px;
  line-height:1.15;color:var(--tinta)}
.quiz-ops{display:flex;flex-direction:column;gap:12px}
.quiz-op{
  height:56px;padding:0 24px;border-radius:14px;text-align:left;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:24px;color:var(--tinta);
  background:#fff;border:2px solid var(--indigo-dim);
  box-shadow:0 4px 12px rgba(32,28,66,.08);
  transition:transform .22s var(--e-salto), border-color .2s, background .3s, color .3s, opacity .3s;
}
.quiz-op:hover:not(:disabled){border-color:var(--indigo);transform:translateX(5px)}
.quiz-op:disabled{cursor:default}
.quiz-op.certa{
  background:linear-gradient(135deg,#3CC47A,#1F8A4C);color:#fff;border-color:transparent;
  box-shadow:0 0 0 3px rgba(62,224,138,.45), 0 0 30px rgba(46,204,113,.6);
}
.quiz-op.errada{background:linear-gradient(135deg,#D9546E,#A92742);color:#fff;border-color:transparent}
.quiz-op.fora{opacity:.35}
.quiz-msg{min-height:28px;margin-top:14px;font-family:var(--display);font-weight:600;font-size:21px}
.quiz-msg.ok{color:#1F8A4C}
.quiz-msg.erro{color:#B42E48}
/* a palavra latina: as letras que viraram o símbolo, em ouro e sublinhadas */
.quiz-latim b{color:var(--ouro);font-weight:700;text-decoration:underline;
  text-decoration-thickness:2px;text-underline-offset:4px}

/* durante o quiz o play sai de cena: quem faz a aula andar é a escolha */
#stage.em-entendi #som, #stage.em-entendi #som-dica,
#stage.em-quiz #som, #stage.em-quiz #som-dica,
#stage.em-toque #som, #stage.em-toque #som-dica,
#stage.em-jogo #som, #stage.em-jogo #som-dica{display:none!important}
/* e com a tela escura também: ali o que faz a aula seguir é o toque na tela */
#stage.tela-escura #som, #stage.tela-escura #som-dica{display:none!important}

/* ---- o cartão da nota, no fim do quiz ---- */
.nota-card{
  position:absolute;left:640px;top:360px;width:580px;padding:32px 44px 30px;
  border-radius:24px;text-align:center;
  background:#FFFDF8;border:1px solid var(--ouro-dim);
  box-shadow:0 30px 80px rgba(12,10,32,.45);
  transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;
  transition:transform .6s var(--e-salto), opacity .35s ease;
}
.quiz.nota-on .nota-card{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.nota-rotulo{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ouro)}
.nota-valor{margin:6px 0 4px;font-family:var(--display);font-weight:700;line-height:1;color:var(--indigo)}
.nota-num{font-size:128px;letter-spacing:-.04em}
.nota-de{font-size:36px;color:var(--tinta-faint);margin-left:4px}
.nota-acertos{font-size:20px;color:var(--tinta-dim);margin-bottom:14px}
.nota-msg{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.25;color:var(--ouro)}
/* os dois botões: Refazer (outro quiz igual) e Continuar (a narração
   seguinte). O play do canto fica fora de cena: quem segue são eles. */
.nota-botoes{display:flex;justify-content:center;gap:12px;margin-top:24px}
.nota-botoes button{font-family:var(--display);font-weight:700;font-size:17px;
  padding:12px 26px;border-radius:13px;cursor:pointer;
  border:1.5px solid var(--indigo);background:#fff;color:var(--indigo);
  transition:background .2s,color .2s,transform .15s}
.nota-botoes button:hover{background:var(--indigo);color:#fff}
.nota-botoes button:active{transform:scale(.95)}
.nota-botoes .nota-segue{background:var(--indigo);color:#fff}
.nota-botoes .nota-segue:hover{background:var(--tinta)}
.quiz.sem-seguir .nota-segue{display:none}

/* o cubo da pergunta: à frente do cartão, e com um "?" no lugar do nome */
.pc.pergunta{z-index:45;pointer-events:none}
.pc.pergunta .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 18px 40px rgba(12,10,32,.4),
                                0 0 44px rgba(226,162,43,.55)}
.pc.sem-nome .face em{color:transparent;text-shadow:none}
.pc.sem-nome .face em::after{
  content:'?';position:absolute;left:0;right:0;top:0;text-align:center;
  color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* o erro: a tela treme e pisca de vermelho. O tremor vai em 'translate',
   que se soma ao transform com que o palco se ajusta à janela. */
#stage.treme{animation:telaTreme .5s ease}
@keyframes telaTreme{0%,100%{translate:0 0} 15%{translate:-14px 0} 30%{translate:12px 0}
  45%{translate:-9px 0} 60%{translate:7px 0} 75%{translate:-4px 0}}
#flash-erro{
  position:absolute;inset:0;z-index:90;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(220,38,60,.12),rgba(220,38,60,.55));
}
#flash-erro.on{animation:flashErro .75s ease-out}
@keyframes flashErro{0%{opacity:0} 15%{opacity:1} 100%{opacity:0}}

.confete{position:absolute;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ---- a tela escura do slide 1 ----
   Cai por cima de tudo o que é do slide, mas não do botão da narração,
   que mora no palco e continua à mão. */
.veu{
  position:absolute;inset:0;z-index:30;
  background:rgba(12,10,32,.87);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .8s ease;
}
.veu.on{opacity:1;pointer-events:auto}
.veu-frases{width:1040px;text-align:center}
.veu .frase{
  display:none;margin:0 0 18px;
  font-family:var(--display);font-weight:600;font-size:46px;line-height:1.15;
  letter-spacing:-.015em;color:#F4F2F8;
}
.veu .frase:nth-child(2){color:var(--ouro-luz)}
.veu .frase.on{display:block}
.veu .frase .cursor{
  display:inline-block;width:4px;height:.9em;margin-left:6px;vertical-align:-.1em;
  background:var(--ouro-luz);border-radius:1px;
}
.veu .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
.toque-continuar{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
  font-family:var(--mono);font-size:14px;letter-spacing:.26em;text-transform:uppercase;
  color:#F4F2F8;opacity:0;transition:opacity .5s ease;pointer-events:none;white-space:nowrap;
}
/* visível por si, e a respirar por cima: sem animação (movimento
   reduzido no aparelho) o pedido continua lá */
.toque-continuar.on{opacity:1;animation:respira 2.2s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:.4} 50%{opacity:1}}
.veu.pede-toque{cursor:pointer}

/* ---- o slide 3 ---- */
/* o brilho verde que atravessa a tabela aos 14 s: uma lavagem verde por
   cima da cor do card, o contorno e o halo, na força --verde (de 0 a 1),
   que o relógio escreve em cada card — forte na frente, a apagar atrás */
.pc.luz-verde .face{box-shadow:inset 0 0 0 60px rgba(46,204,113,calc(.36 * var(--verde,1))),
  0 0 0 2px rgba(62,224,138,var(--verde,1)), 0 0 20px 5px rgba(46,204,113,calc(.6 * var(--verde,1)))}
.pc.luz-verde .cubo{--sc:calc(1 + .06 * var(--verde,1))}
/* o próximo card a tocar: brilha em vermelho neon e pulsa (o brilho fica
   mesmo sem a animação, para quem tem o movimento reduzido) */
.pc.chama{z-index:20;cursor:pointer}
.pc.chama .face{box-shadow:0 0 0 3px #FF2E4C, 0 0 22px 7px rgba(255,46,76,.8);
  animation:chamaCard 1.1s ease-in-out infinite}
@keyframes chamaCard{
  0%,100%{box-shadow:0 0 0 3px #FF2E4C, 0 0 16px 4px rgba(255,46,76,.6)}
  50%    {box-shadow:0 0 0 4px #FF2E4C, 0 0 40px 16px rgba(255,46,76,1)}
}
/* as colunas da "2.4": à frente dos espalhados */
/* (com .mesa à frente: a regra dos que já estão em casa, .pc.no-lugar,
   vem mais abaixo e ganhava destas, e o H ficava atrás dos vizinhos) */
.mesa .pc.coluna-frente{z-index:12}
/* o H em destaque, na "2.4": à frente de todos, com luz dourada */
.mesa .pc.destaque-h{z-index:16}
.pc.destaque-h .face{box-shadow:0 0 0 3px var(--ouro-luz), 0 0 30px 10px rgba(226,162,43,.85)}
/* a frase no vazio da tabela, num quadro claro por cima dos espalhados */
.texto-colunas{position:absolute;left:170px;top:196px;width:660px;z-index:25;pointer-events:none;
  padding:16px 26px 18px;border-radius:18px;background:rgba(255,255,255,.95);
  border:1px solid var(--indigo-dim);box-shadow:0 16px 40px rgba(32,28,66,.18);
  opacity:0;transition:opacity .4s ease}
.texto-colunas:has(.frase.on:not(.saindo)){opacity:1}
.texto-colunas .frase{display:none;margin:0;font-family:var(--display);font-weight:600;
  font-size:34px;line-height:1.25;color:var(--indigo);text-align:center}
.texto-colunas .frase.on{display:block}
.texto-colunas .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;
  vertical-align:-.1em;background:var(--ouro)}
.texto-colunas .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* no slide 4 o quadro é mais estreito: com a tabela aberta em linhas
   ou em colunas ele cabe entre a coluna 2 e a 13, sem tapar ninguém */
.texto-colunas.texto3{left:232px;width:578px}
/* O QUIZ DO SLIDE 4: o quadro padrão das perguntas (o do quiz do slide
   3), no vazio da tabela do slide 4; na primeira, o cursor da digitação */
.quiz3.q4{left:190px;width:640px}
.quiz3.q4 .q3-q b{color:var(--ouro)}
.quiz3.q4.digitando .q3-q::after{content:'';display:inline-block;width:3px;height:.9em;margin-left:5px;
  vertical-align:-.1em;background:var(--ouro);animation:piscaCursor 1.05s steps(1) infinite}
/* A CAIXA DO CARROSSEL (questão 04), com o uso da do app de referência:
   pequena, centrada no meio da altura da tabela, do lado oposto ao do
   elemento; entra com um salto, treme e avermelha no erro */
.roda4{position:absolute;z-index:40;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:12px 18px 14px;border-radius:14px;background:rgba(255,255,255,.97);
  border:1px solid var(--indigo-dim);box-shadow:0 10px 28px rgba(20,17,46,.35);
  transform:translate(-50%,-50%);transition:background .3s ease, border-color .3s ease;
  animation:rodaEntra .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rodaEntra{
  0%  {transform:translate(-50%,-50%) scale(.1) rotate(-15deg);opacity:0}
  55% {transform:translate(-50%,-50%) scale(1.18) rotate(6deg);opacity:1}
  80% {transform:translate(-50%,-50%) scale(.95) rotate(-3deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1}
}
.roda4.pousada{animation:none}
.roda4.treme{animation:rodaTreme .4s ease}
@keyframes rodaTreme{
  0%,100%{transform:translate(-50%,-50%)}
  20%{transform:translate(calc(-50% - 8px),-50%)} 40%{transform:translate(calc(-50% + 8px),-50%)}
  60%{transform:translate(calc(-50% - 5px),-50%)} 80%{transform:translate(calc(-50% + 5px),-50%)}
}
.roda4.sai{animation:rodaSai .35s ease forwards}
@keyframes rodaSai{to{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.roda4.errada{border-color:rgba(255,46,76,.75);background:rgba(255,226,230,.97)}
.rd-marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro)}
.rd-el{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
.rd-el span{font-family:var(--mono);font-size:15px;color:var(--tinta-dim)}
.rd-el b{font-family:var(--display);font-size:46px;font-weight:700;color:var(--indigo)}
.rd-el em{font-style:normal;font-family:var(--display);font-size:14px;color:var(--tinta-dim)}
.rd-colunas{display:flex;gap:14px;align-items:flex-end}
.rd-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.rd-tit{font-family:var(--display);font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--tinta-dim)}
/* o carrossel: três números à vista, o do meio é o escolhido */
.rd-roda{width:56px;height:108px;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;
  touch-action:pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:rgba(255,255,255,.8);border:1px solid var(--indigo-dim);border-radius:8px}
.rd-roda::-webkit-scrollbar{display:none}
.rd-roda.arrastando{scroll-snap-type:none}
.rd-pad{height:36px}
.rd-v{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;cursor:pointer;
  font-family:var(--display);font-size:15px;font-weight:500;color:rgba(32,28,66,.4);
  transition:color .2s, font-size .2s}
.rd-v.atual{color:var(--indigo);font-size:21px;font-weight:700}
.rd-msg{max-width:190px;font-family:var(--display);font-size:13px;font-weight:600;line-height:1.3;text-align:center}
.rd-msg:empty{display:none}
.rd-msg.ok{color:#1F9D55}
.rd-ok{padding:6px 18px;border:1px solid var(--indigo-dim);border-radius:8px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;
  color:var(--indigo);background:rgba(76,63,191,.1)}
.rd-ok:hover{background:rgba(76,63,191,.18)}
.rd-ok:active{transform:scale(.96)}
.rd-ok:disabled{opacity:.5;cursor:default}
/* o botão do fim da narração "3", no vazio da tabela, à direita do símbolo */
.entendi3{position:absolute;z-index:30;transform:translate(-50%,-50%) scale(.9);
  padding:12px 36px;border:0;border-radius:14px;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:20px;color:#fff;background:var(--indigo);
  box-shadow:0 12px 28px rgba(32,28,66,.28);opacity:0;pointer-events:none;
  transition:opacity .35s ease, transform .35s cubic-bezier(.2,.9,.3,1.2)}
.entendi3.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.entendi3:active{transform:translate(-50%,-50%) scale(.95)}
/* tocado, acende (e o "right" toca) */
.entendi3.tocado{transform:translate(-50%,-50%) scale(1.1);background:#1F9D55;
  box-shadow:0 0 0 4px rgba(62,224,138,.55), 0 0 30px 10px rgba(46,204,113,.6)}
/* a tabela montada inteira: uma luz dourada que acende e se vai */
.mesa.brilho-final .pc .face{animation:brilhoFinal 1.8s ease}
@keyframes brilhoFinal{
  0%,100%{box-shadow:none}
  35%{box-shadow:0 0 0 2px var(--ouro-luz), 0 0 26px 8px rgba(226,162,43,.85)}
}
/* o card que volta para casa voa por cima dos espalhados, e depois de
   pousar continua acima deles: a tabela que se forma não fica tapada */
.pc.no-lugar{z-index:8}
.pc.no-lugar.encaixando{z-index:30}
/* o toque fora de ordem: um tremor curto */
.pc.nao{animation:naoTreme .35s ease}
/* o toque errado no fim do slide 3: balança, em vermelho */
.pc.nao-verm{z-index:20;animation:naoTreme .42s ease}
.pc.nao-verm .face{box-shadow:0 0 0 3px #FF2E4C, 0 0 22px 7px rgba(255,46,76,.8)}
/* e a pergunta dele, no vazio da tabela */
.dica-final{position:absolute;left:170px;top:190px;width:664px;z-index:26;pointer-events:none;
  padding:18px 26px;border-radius:18px;text-align:center;
  background:rgba(255,255,255,.96);border:1px solid var(--indigo-dim);
  box-shadow:0 16px 40px rgba(32,28,66,.18);
  font-family:var(--display);font-weight:600;font-size:28px;line-height:1.25;color:var(--indigo);
  opacity:0;transform:translateY(-8px);transition:opacity .35s ease, transform .35s ease}
.dica-final.on{opacity:1;transform:none}
/* O ESCURO DO QUIZ (slide 3), como no quiz do professor: preto cheio,
   em fade, por baixo de tudo o que vem depois dele no slide — a tabela,
   o cabeçalho e a questão continuam acesos por cima */
.breu-quiz{position:absolute;inset:0;z-index:0;pointer-events:none;background:#000;
  opacity:0;transition:opacity .55s ease}
.breu-quiz.on{opacity:1}
/* e o cabeçalho clareia junto: no escuro, a letra escura some */
.slide.quiz-escuro .title{color:#F3F0FB}
.slide.quiz-escuro .subtitle{color:var(--ouro-luz)}
.slide.quiz-escuro .num{color:#CFC6F5;opacity:.42}
.slide.quiz-escuro .regua button{border-color:rgba(207,198,245,.4)}
.slide.quiz-escuro .regua button.feito{background:rgba(207,198,245,.5)}
.slide.quiz-escuro .title, .slide.quiz-escuro .subtitle, .slide.quiz-escuro .num,
.slide.quiz-escuro .regua button{transition:color .5s ease, background .5s ease, border-color .5s ease}
/* os números da tabela, no escuro: o índigo não se lê, passam a âmbar */
.slide.quiz-escuro .eixo{color:rgba(243,240,251,.6)}
.slide.quiz-escuro .eixo.prof{color:var(--ouro-luz);border-color:rgba(226,162,43,.75);background:rgba(226,162,43,.14)}
.slide.quiz-escuro .casa.serie{color:rgba(243,240,251,.6)}
@keyframes naoTreme{0%,100%{translate:0 0} 25%{translate:-6px 0} 75%{translate:6px 0}}
/* a desordem: a posição anda a cada tique do relógio, e uma transição
   curta alisa o caminho entre um tique e o seguinte */
/* e, desarrumada a mesa, as casas vazias e os números saem de cena */
.mesa.sem-casas .casa, .mesa.sem-casas .eixo{opacity:0;transition:opacity .35s ease}
/* A MESA PLANA — no slide 3, calada a vida solta, nenhum cubo gira de
   lado: só a face da frente é desenhada (as outras cinco saem), e sem a
   perspectiva de cada cubo o navegador tem 88 camadas a compor em vez
   de 528 — a tela escura por cima e a montagem automática deixam de
   pesar. A face da frente cresce na medida em que a perspectiva a
   mostrava (--plano), e nada salta à vista na troca. */
/* quem chega por um atalho vê a mesa já como ela está naquele ponto, e
   não os cards a correr para lá */
.mesa.sem-transicao .pc, .mesa.sem-transicao .pc .cubo{transition:none!important}
/* O QUIZ DO SLIDE 3: a pergunta num quadro claro, no vazio da tabela (a
   resposta é um toque num card: o quadro não pega o dedo) */
.quiz3{position:absolute;left:170px;top:178px;width:664px;z-index:26;pointer-events:none;
  padding:16px 26px 18px;border-radius:18px;background:rgba(255,255,255,.96);
  border:1px solid var(--indigo-dim);box-shadow:0 16px 40px rgba(32,28,66,.18);
  /* a esteira do quiz do professor: a questão respondida sai pela
     direita no mesmo instante em que a seguinte entra pela esquerda */
  opacity:0;translate:-1240px 0;
  transition:opacity .3s ease, translate .52s cubic-bezier(.24,.84,.3,1)}
.quiz3.on{opacity:1;translate:0 0}
.quiz3.sai{opacity:0;translate:1240px 0;
  transition:opacity .46s ease .14s, translate .5s cubic-bezier(.45,.02,.62,1)}
/* O GIRO DA TROCA, também o do professor: trocada a questão, a tabela
   inteira gira, uma carta pouco depois da vizinha, na diagonal,
   encolhendo um pouco no meio da volta. É o do professor, no plano da
   tela: a mesa do quiz é plana (uma face por cubo) e fica leve. Vai nas
   propriedades 'rotate' e 'scale', e não no transform, que é o giro
   do cubo e continua valendo. */
@keyframes giraCarta3{
  0%  {rotate:0deg;   scale:1}
  50% {rotate:180deg; scale:.82}
  100%{rotate:360deg; scale:1}
}
.mesa.gira-troca .pc .cubo{animation:giraCarta3 .72s var(--giro-atraso,0ms) cubic-bezier(.42,0,.36,1)}
.q3-marca{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ouro)}
.q3-q{margin-top:6px;font-family:var(--display);font-weight:600;font-size:26px;line-height:1.25;color:var(--indigo)}
.q3-msg{min-height:24px;margin-top:8px;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.3}
.q3-msg.ok{color:#1F9D55}
.q3-msg.erro{color:#B42E48}
/* a dica do erro: debaixo da pergunta, em âmbar escuro */
.q3-msg.dica{color:#9A6410;font-weight:500;font-size:17px}
.pc.errada3{animation:naoTreme .42s ease}
/* o certo, crescido, à frente dos outros — na ida e na volta */
.mesa .pc.frente3{z-index:30}
/* a pista do segundo erro: a resposta pulsa em âmbar */
.pc.pista3{z-index:19}
/* o brilho fica mesmo sem a animação (movimento reduzido) */
.pc.pista3 .face{box-shadow:0 0 0 3px var(--ouro-luz), 0 0 22px 6px rgba(226,162,43,.75);
  animation:pista3 1s ease-in-out infinite}
@keyframes pista3{
  0%,100%{box-shadow:0 0 0 3px var(--ouro-luz), 0 0 16px 4px rgba(226,162,43,.55)}
  50%    {box-shadow:0 0 0 3px var(--ouro-luz), 0 0 30px 10px rgba(226,162,43,.9)}
}
/* a resposta na tabela: verde a certa, vermelho a errada */
.pc.certa3, .pc.errada3{z-index:20}
.pc.certa3 .face{box-shadow:0 0 0 3px #1F9D55, 0 0 26px 8px rgba(46,204,113,.85)}
.pc.errada3 .face{box-shadow:0 0 0 3px #FF2E4C, 0 0 26px 8px rgba(255,46,76,.85)}
.mesa.plana .pc{perspective:none}
.mesa.plana .pc .face:not(.f1){display:none}
.mesa.plana .pc .face.f1{transform:scale(var(--plano,1.05))}
.pc.desordem{transition:left 90ms linear, top 90ms linear,
  transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease}
/* o clarão da desordem, o do professor */
.clarao2{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(255,255,255,.9),rgba(255,255,255,0) 72%)}
/* Henry Moseley na tela escura: a foto à esquerda, o critério à direita */
.veu-moseley .moseley{position:absolute;left:150px;top:118px;width:268px;margin:0;
  opacity:0;text-align:center;will-change:transform;
  /* o relógio da narração escreve a posição de 60 em 60 ms: a transição
     curta alisa o caminho entre um tique e o seguinte */
  transition:transform 90ms linear, opacity .25s ease}
.veu-moseley .moseley img{display:block;width:268px;height:auto;border-radius:14px;
  border:3px solid rgba(255,255,255,.9);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.veu-moseley figcaption{margin-top:14px;font-family:var(--display);color:#F4F2F8}
.veu-moseley figcaption b{display:block;font-size:26px;font-weight:600}
.veu-moseley figcaption span{display:block;margin-top:2px;font-family:var(--mono);
  font-size:18px;letter-spacing:.2em;color:var(--ouro-luz)}
.veu-moseley .veu-frases{position:absolute;left:490px;top:200px;width:750px;text-align:left}
/* o critério em duas linhas: a quebra vem escrita no próprio texto */
.veu-moseley .frase{font-size:30px;line-height:1.3;font-weight:500;color:#F4F2F8;white-space:pre-line}
/* um critério de cada vez: o da narração em que se está */
.veu-moseley[data-criterio="1"] .frases-c2, .veu-moseley[data-criterio="2"] .frases-c1{display:none}
.veu-moseley .frase:first-child{font-size:54px;font-weight:700;color:var(--ouro-luz);margin-bottom:22px}
.veu-moseley .frase:nth-child(2){color:#F4F2F8}

/* o convite para escolher um elemento, no rodapé do slide */
.dica-escolha{
  position:absolute;left:50%;bottom:18px;z-index:20;transform:translateX(-50%) translateY(10px);
  padding:10px 22px;border-radius:30px;white-space:nowrap;pointer-events:none;
  background:rgba(255,255,255,.94);border:1px solid var(--ouro-dim);
  font-family:var(--display);font-weight:600;font-size:17px;color:var(--ouro);
  opacity:0;transition:opacity .4s ease, transform .4s var(--e-salto);
}
.dica-escolha.on{opacity:1;transform:translateX(-50%) translateY(0);
  animation:somChama 2.6s ease-in-out infinite}

/* ---- o botão vira o do JOGO quando a narração do jogo acaba ----
   O play e a pausa saem, entra o controle; o anel sai também, porque
   já não há áudio a correr. */
#som #ic-jogo{display:none}
#som.jogo #ic-play,#som.jogo #ic-pause,#som.jogo .anel{display:none}
#som.jogo #ic-jogo{display:block}
/* e o do QUIZ, quando a narração "2.5" acaba (a classe não é 'quiz':
   .quiz é a caixa do quiz do slide 1) */
#som #ic-quiz{display:none}
#som.botao-quiz #ic-play,#som.botao-quiz #ic-pause,#som.botao-quiz .anel{display:none}
#som.botao-quiz #ic-quiz{display:block}

/* ---- o botão vira "Iniciar" quando a abertura acaba ----
   Cresce para a esquerda, a partir do canto onde estava: o lado direito
   dele fica no mesmo sítio, e a borda do palco não o corta. */
#som .rotulo-iniciar{display:none}
#som.iniciar{width:auto!important;padding:0 29px 0 34px;border-radius:36px}
#som.iniciar .anel,#som.iniciar .icone{display:none}
#som.iniciar .rotulo-iniciar{
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:.01em;
}
#stage .solto#som.iniciar{transform:translate(calc(-100% + 35px),-50%) scale(var(--esc,1))}
#stage .solto#som.iniciar:hover{
  transform:translate(calc(-100% + 35px),-50%) scale(var(--esc,1)) translateY(-3px)}

/* ============================================================
   O BOTÃO DA NARRAÇÃO — canto de baixo, à direita
   É o único comando do aluno nesta tela: aperta, e a aula anda
   sozinha. O anel em volta é o quanto do áudio já correu.
   ============================================================ */
#som{
  position:absolute;right:26px;bottom:22px;z-index:12;
  /* 70 px: 20 % maior do que os 58 de antes, a pedido do professor */
  width:70px;height:70px;padding:0;cursor:pointer;
  display:grid;place-items:center;
  background:rgba(255,255,255,.92);border:1px solid var(--ouro-dim);
  border-radius:50%;   /* sem backdrop-filter: por cima da tabela que anda, pesava */
  box-shadow:0 12px 30px rgba(32,28,66,.22);
  /* o âmbar do "Tabela Periódica": o botão é da cor do que a capa tem
     de mais importante escrito nela */
  color:var(--ouro);
  transition:transform .25s var(--e-salto),box-shadow .25s,color .2s,border-color .2s;
}
#som:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(32,28,66,.26)}
/* PARADO, ELE CHAMA. Um brilho que respira e um anel que se abre e se
   desfaz: é ali que a aula começa, e quem nunca viu esta tela precisa
   de o descobrir. A tocar, cala-se — já foi encontrado. */
#som.parado{animation:somChama 2.6s ease-in-out infinite}
@keyframes somChama{
  0%,100%{box-shadow:0 12px 30px rgba(32,28,66,.22),
                     0 0 22px rgba(226,162,43,.45),
                     0 0 0 0 rgba(226,162,43,.5)}
  55%    {box-shadow:0 12px 30px rgba(32,28,66,.22),
                     0 0 34px rgba(226,162,43,.75),
                     0 0 0 14px rgba(226,162,43,0)}
}
/* solto pela montagem, ele vive por left/top e um transform próprio —
   o pulinho do hover tem de ser somado a esse, e não escrito por cima */
#stage .solto#som:hover{transform:translate(-50%,-50%) scale(var(--esc,1)) translateY(-3px)}
#som.tocando{border-color:rgba(169,107,16,.4)}
/* sem o arquivo do áudio ainda no lugar, o botão fica à vista mas
   apagado: o lugar dele não dança quando a narração chegar */
#som.mudo{opacity:.72}
#som .anel{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#som .anel circle{fill:none;stroke-width:2.5;stroke-linecap:round}
#som .trilho{stroke:rgba(169,107,16,.18)}
#som .curso{stroke:var(--ouro-luz);
  stroke-dasharray:var(--volta,163);stroke-dashoffset:var(--falta,163);
  transition:stroke-dashoffset .2s linear}
#som .icone{position:relative;z-index:2;display:grid;place-items:center;
  width:26px;height:26px}
#som .icone svg{display:block;width:26px;height:26px}
#som .icone #ic-jogo{width:31px;height:31px}
#som .icone svg[hidden]{display:none}
/* slide sem narração: o botão sai de cena inteiro */
#som[hidden],#som-dica[hidden]{display:none}
/* o nome do que o botão faz, para quem nunca viu esta tela. Fica à
   ESQUERDA do botão, e não por cima dele: em cima ele cairia na última
   linha da tabela, que chega até ali. */
#som-dica{
  position:absolute;right:108px;bottom:44px;z-index:12;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tinta-faint);text-align:right;pointer-events:none;white-space:nowrap;
  transition:opacity .4s;
}
#som-dica.fora{opacity:0}

/* ---------- barra de controles ----------
   A mesma barra do app do professor, reduzida ao que o aluno precisa:
   ir e voltar entre a capa e a tabela. */
#bar{
  position:fixed;left:50%;bottom:18px;z-index:70;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;padding:7px 9px;
  background:rgba(255,255,255,.92);border:1px solid var(--indigo-dim);
  border-radius:14px;
  box-shadow:0 12px 34px rgba(32,28,66,.2);
  transition:transform .42s var(--e-desl),opacity .3s;
}
#bar.hidden{transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none}
#bar .btn{
  position:relative;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:0;border-radius:9px;color:var(--tinta-dim);
  transition:background .2s,color .2s;
}
#bar .btn:hover{background:rgba(76,63,191,.12);color:var(--indigo)}
/* o botão aceso: o modo que ele abriu está em cena */
#bar .btn.on{background:rgba(226,162,43,.26);color:var(--ouro)}
#bar .sep{width:1px;height:22px;background:var(--indigo-dim);margin:0 3px}
#counter{font-family:var(--mono);font-size:13px;color:var(--tinta-dim);
  min-width:58px;text-align:center;user-select:none}
#counter b{color:var(--tinta);font-weight:500}

/* a alça que chama a barra: a única coisa da interface que fica em
   cena durante a aula */
#puxador{
  position:fixed;left:50%;bottom:0;z-index:69;transform:translateX(-50%);
  width:82px;height:18px;cursor:pointer;border:0;
  background:transparent;display:grid;place-items:center;
  transition:transform .35s var(--e-desl),opacity .3s;
}
#puxador::before{content:'';width:46px;height:4px;border-radius:3px;
  background:rgba(76,63,191,.4);transition:background .25s,width .25s}
#puxador:hover::before{background:var(--ouro-luz);width:60px}
#puxador.fora{transform:translateX(-50%) translateY(120%);opacity:0;pointer-events:none}

/* ============================================================
   O JOGO DA MEMÓRIA — o do slide 2 do app do professor
   Vinte cartas viradas para baixo, dez pares: de um lado o símbolo,
   do outro o nome do elemento. As faces chamam-se mem-face, e não
   face como lá: aqui .face é a face dos cubos da tabela.
   ============================================================ */
.memoria{
  --neon:#FF2E4C;--natural:#1F9D55;
  position:absolute;inset:0;z-index:52;pointer-events:auto;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;transition:opacity .4s ease;
  background:radial-gradient(ellipse 92% 82% at 50% 46%,
             rgba(20,17,46,.95) 0%, rgba(11,9,30,.985) 62%, rgba(7,6,22,.995) 100%);
}
.memoria.on{opacity:1}
.mem-topo{
  display:flex;align-items:baseline;gap:26px;margin:72px 0 10px;
  font-family:var(--display);color:#EDE8FA;
}
.mem-topo b{font-size:30px;font-weight:800;color:var(--ouro-luz);line-height:1}
.mem-topo i{font-style:normal;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(226,222,240,.5);margin-left:7px}
/* a grelha: cinco por quatro, medida para caber no palco */
.mem-grade{
  display:grid;grid-template-columns:repeat(5, 168px);
  grid-auto-rows:126px;gap:10px;
}
.mem-carta{perspective:900px;cursor:pointer}
.mem-carta .giro{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.3,.9,.3,1);
}
.mem-carta.virada .giro, .mem-carta.casada .giro{transform:rotateY(180deg)}
.mem-carta .mem-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(6,5,26,.5), inset 0 1px 0 rgba(255,255,255,.18);
}
/* o verso: o átomo, na cor da estrutura */
.mem-carta .costas{
  background:linear-gradient(150deg,#3A3270,#221D4C 60%,#171338);
  border:1px solid rgba(207,198,245,.26);
  font-size:44px;color:rgba(207,198,245,.5);
}
.mem-carta .frente{
  transform:rotateY(180deg);gap:3px;padding:8px;
  background:linear-gradient(160deg,#FBFAFE,#E9E5F4);
  border:1px solid rgba(255,255,255,.5);
}
.mem-carta .chapeu{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tinta-faint);
}
.mem-carta .simbolo{font-family:var(--display);font-size:44px;font-weight:700;
  color:var(--indigo);line-height:1}
.mem-carta .nome{font-family:var(--display);font-size:19px;font-weight:700;
  color:var(--tinta);line-height:1.1;text-align:center}
.mem-carta .miudo{font-family:var(--mono);font-size:10px;color:var(--tinta-dim)}
.mem-carta .emoji{font-size:26px;line-height:1}
/* o par certo assenta e apaga-se, na cor do par; o errado treme em
   vermelho. A cor (--ph, --ps) é posta na carta ao nascer: é etiqueta
   de par, e no fim diz qual símbolo é de qual nome. */
.mem-carta.casada{pointer-events:none}
.mem-carta.casada .frente{
  background:linear-gradient(160deg,
             hsl(var(--ph,150) var(--ps,45%) 94%),
             hsl(var(--ph,150) var(--ps,45%) 83%));
  border-color:hsl(var(--ph,150) var(--ps,45%) 58% / .6);
  box-shadow:0 0 0 2.5px hsl(var(--ph,150) var(--ps,45%) 46%),
             0 0 20px 5px hsl(var(--ph,150) var(--ps,45%) 50% / .38);
}
.mem-carta.casada .simbolo,
.mem-carta.casada .nome{color:hsl(var(--ph,150) var(--ps,45%) 26%)}
.mem-carta.casada .chapeu,
.mem-carta.casada .miudo{color:hsl(var(--ph,150) var(--ps,45%) 38% / .8)}
.mem-carta.casada{opacity:.62;transition:opacity .5s ease .3s}
.mem-carta.errada .frente{
  box-shadow:0 0 0 2.5px var(--neon), 0 0 20px 6px rgba(255,46,76,.5);
  animation:memTreme .4s ease;
}
@keyframes memTreme{
  0%,100%{translate:0 0} 25%{translate:-7px 0} 60%{translate:6px 0} 85%{translate:-3px 0}
}
.mem-dica{
  margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(226,222,240,.42);
}

/* o cartão do resultado do jogo — o do professor: troféu, o anel da
   pontuação, a conta, um recado, e Refazer e Sair */
.quiz-cartao{
  position:absolute;left:640px;top:380px;z-index:60;
  transform:translate(-50%,-50%) scale(.86);
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:280px;padding:22px 30px 20px;
  background:var(--fundo-alto);border:1.5px solid var(--indigo-dim);
  border-radius:20px;box-shadow:0 22px 60px rgba(32,28,66,.34);
  font-family:var(--display);text-align:center;pointer-events:auto;
  opacity:0;transition:opacity .45s ease, transform .5s cubic-bezier(.2,1.3,.4,1);
}
.quiz-cartao.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* as cores da conta, as do jogo da memória, onde o cartão nasceu: fora
   dele (no quiz do slide 3) o cartão traz as suas */
.quiz-cartao{--neon:#FF2E4C;--natural:#1F9D55}
.quiz-cartao .trofeu{font-size:44px;line-height:1}
.quiz-cartao .chapeu{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta-faint);
}
.quiz-cartao .anel{position:relative;width:118px;height:118px}
.quiz-cartao .anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.quiz-cartao .anel .miolo{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;
}
.quiz-cartao .anel .miolo span{font-size:10px;color:var(--tinta-faint);font-weight:600}
.quiz-cartao .anel .miolo b{font-size:34px;color:var(--tinta);font-weight:800}
.quiz-cartao .conta{font-size:15px;color:var(--tinta-dim);font-weight:600}
.quiz-cartao .conta em{font-style:normal;font-weight:800}
.quiz-cartao .conta em.acerto{color:var(--natural)}
.quiz-cartao .conta em.erro{color:var(--neon)}
.quiz-cartao .recado{font-size:17px;color:var(--tinta);font-weight:600;max-width:270px}
.quiz-cartao .botoes{display:flex;gap:10px;margin-top:6px}
.quiz-cartao button{
  font-family:var(--display);font-weight:700;font-size:14px;
  padding:9px 18px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--indigo);background:#fff;color:var(--indigo);
  transition:background .2s,color .2s,transform .15s;
}
.quiz-cartao button:hover{background:var(--indigo);color:#fff}
.quiz-cartao button:active{transform:scale(.95)}
.quiz-cartao button.forte{background:var(--indigo);color:#fff}
.quiz-cartao button.forte:hover{background:var(--tinta)}

/* ---------- o ajuste da tabela (temporário, só no celular) ----------
   Uma ferramenta de medida: ligado, a tabela do slide 1 fica travada e
   move-se com um dedo e cresce ou encolhe com a pinça. O painel no alto
   mostra a medida e copia-a. Fica fora do palco, como a barra. */
#ajuste{position:fixed;top:10px;left:50%;z-index:77;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;
  background:rgba(255,255,255,.94);border:1px solid var(--indigo-dim);border-radius:12px;
  backdrop-filter:blur(9px);box-shadow:0 10px 28px rgba(32,28,66,.2);
  font-family:var(--mono);font-size:12px;color:var(--tinta);white-space:nowrap;
  touch-action:manipulation}
#ajuste[hidden]{display:none}
#ajuste .aj-rot{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo)}
#ajuste output{min-width:176px}
#ajuste button{font-family:var(--display);font-weight:700;font-size:13px;padding:6px 12px;
  border-radius:9px;cursor:pointer;border:1.5px solid var(--indigo);background:#fff;color:var(--indigo)}
#ajuste button.forte{background:var(--indigo);color:#fff}
#ajuste button.x{border:0;background:transparent;color:var(--tinta-dim);font-size:18px;
  line-height:1;padding:4px 8px}
#ajuste.copiado .aj-copia{background:#1F9D55;border-color:#1F9D55;color:#fff}
/* travada: os cubos não recebem o dedo, e o arrastar é da mesa inteira */
#stage.ajustando .mesa .pc{pointer-events:none}
#stage.ajustando .slide{cursor:grab}

/* ---------- navegação rápida (tecla N) ----------
   Uma ferramenta de desenvolvimento: a alça na borda direita, a partir
   do slide da tabela, abre a gaveta com os tópicos do slide. Fica fora
   do palco, como a barra, e por baixo da visão geral. */
#nav-alca{
  position:fixed;right:0;top:50%;z-index:69;transform:translateY(-50%);
  width:26px;height:132px;padding:0;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.9);border:1px solid var(--indigo-dim);border-right:0;
  border-radius:12px 0 0 12px;
  box-shadow:-6px 8px 24px rgba(32,28,66,.14);color:var(--tinta-dim);
  transition:transform .35s var(--e-desl),opacity .3s,color .2s,background .2s;
}
#nav-alca span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase}
#nav-alca:hover{color:var(--ouro);background:#fff}
#nav-alca.fora,#nav-alca.some{transform:translate(110%,-50%);opacity:0;pointer-events:none}
#nav-fundo{position:fixed;inset:0;z-index:75;background:rgba(32,28,66,.16);
  opacity:0;pointer-events:none;transition:opacity .3s}
#nav-fundo.on{opacity:1;pointer-events:auto}
#nav{
  position:fixed;top:0;right:0;bottom:0;z-index:76;width:min(360px,88vw);
  display:flex;flex-direction:column;font-family:var(--display);
  background:rgba(255,255,255,.97);border-left:1px solid var(--indigo-dim);
  box-shadow:-18px 0 44px rgba(32,28,66,.2);
  transform:translateX(104%);transition:transform .42s var(--e-desl);
}
#nav.aberta{transform:none}
#nav header{position:relative;padding:26px 24px 18px;border-bottom:1px solid var(--indigo-dim)}
.nav-rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--indigo)}
#nav h2{margin:8px 0 0;font-size:22px;font-weight:600;color:var(--tinta)}
.nav-fecha{position:absolute;top:18px;right:14px;width:34px;height:34px;border:0;border-radius:9px;
  background:transparent;color:var(--tinta-dim);cursor:pointer;display:grid;place-items:center}
.nav-fecha:hover{background:rgba(76,63,191,.12);color:var(--indigo)}
.nav-lista{list-style:none;margin:0;padding:12px;overflow-y:auto;flex:1}
.nav-item{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;position:relative;
  padding:12px;border:0;border-radius:12px;background:transparent;cursor:pointer;
  font:inherit;color:var(--tinta);transition:background .2s}
.nav-item:hover{background:rgba(76,63,191,.08)}
.nav-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;color:var(--ouro);
  border:1.5px solid var(--ouro-luz);background:rgba(226,162,43,.1)}
.nav-txt b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.nav-txt small{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;
  line-height:1.4;color:var(--tinta-dim)}
/* o tópico em que a aula está agora */
.nav-item.atual{background:rgba(226,162,43,.14)}
.nav-item.atual::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:2px;background:var(--ouro)}
.nav-item.atual .nav-n{background:var(--ouro);border-color:var(--ouro);color:#fff}
.nav-aqui{display:none;margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);vertical-align:2px}
.nav-item.atual .nav-aqui{display:inline}
/* o engatilhado: ainda não existe */
.nav-item:disabled{cursor:default;opacity:.55}
.nav-item:disabled:hover{background:transparent}
.nav-breve{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:99px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-dim);border:1px dashed var(--tinta-faint)}
/* os atalhos para uma variante do tópico (a 1.3A ou a 1.3B) */
.nav-variantes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px 54px}
.nav-var{padding:5px 10px;border-radius:8px;border:1px solid var(--indigo-dim);background:#fff;
  cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--tinta-dim);
  transition:border-color .2s,color .2s}
.nav-var:hover{border-color:var(--ouro-luz);color:var(--ouro)}
.nav-pe{margin:0;padding:14px 24px 22px;font-size:12px;line-height:1.45;color:var(--tinta-faint);
  border-top:1px solid var(--indigo-dim)}

/* ---------- visão geral (tecla O) ----------
   As miniaturas não são desenhos dos slides: são os próprios slides,
   copiados e postos em escala. O que estiver dentro deles aparece ali
   — a tabela montada, os cubos como estiverem virados, a carta que a
   narração deixou acesa. */
#overview{
  position:fixed;inset:0;z-index:80;background:rgba(237,234,242,.97);
  backdrop-filter:blur(8px);padding:44px 52px;overflow-y:auto;
}
#overview[hidden]{display:none}
#overview h2{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:24px;font-weight:400;text-align:center}
/* auto-FIT, e não auto-fill: as colunas que sobram encolhem a zero, e
   dois slides ficam mesmo no meio da tela em vez de encostados à
   esquerda de uma fila de lugares vazios. Enquanto a aula for curta os
   cartões crescem até 340; quando os onze slides chegarem, a fila se
   parte em linhas sozinha. */
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,340px));
  justify-content:center;gap:20px}
.card{
  position:relative;aspect-ratio:16/9;padding:0;cursor:pointer;text-align:left;display:block;
  background:var(--fundo);border:1px solid var(--indigo-dim);border-radius:8px;
  color:inherit;font:inherit;overflow:hidden;
  box-shadow:0 4px 14px rgba(32,28,66,.08);
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.card:hover{border-color:var(--indigo);transform:translateY(-3px);box-shadow:0 10px 24px rgba(32,28,66,.16)}
/* o cartão do slide em que a aula está: âmbar, como a casa acesa da régua */
.card.aqui{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro-dim),0 8px 20px rgba(32,28,66,.14)}
.mini{position:absolute;inset:0;overflow:hidden}
.mini-palco{
  position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  pointer-events:none;
}
.mini-palco .slide{opacity:1;visibility:visible}
/* na miniatura nada se mexe: ela é uma fotografia do slide */
.mini-palco *{animation:none!important;transition:none!important}
/* a tabelinha da capa mora fora do slide, no palco; a miniatura leva
