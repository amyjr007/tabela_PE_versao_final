/* a capa nova: o título, o risco e o autor alinhados à esquerda; a
   tabelinha grande à direita, cortada pela borda; as três cartas por
   cima dela; as frases digitadas no vão entre o título e as cartas */
/* (marca, autor e e-mail: o lugar que o professor deixou na montagem, no
   Chromebook — a marca numa linha só) */
const LAYOUT_CAPA_NOVA = {
  marca:      {esq: 41.5, y:145, esc:1.00},
  titulo:     {esq: 74, y:322, esc:1.00},
  risco:      {esq: 74, y:500, esc:1.00},
  foto:       {x:  124, y:592, esc:1.00},
  autor:      {esq:198.5, y:570, esc:1.00},
  email:      {esq:196.5, y:612, esc:1.00},
  tabelinha:  {x:  945, y:392, esc:1.58},
  'bloco-Na': {x:  850, y:158, esc:1.08},
  'bloco-La': {x: 1122, y:300, esc:1.08},
  'bloco-Y':  {x:  930, y:470, esc:1.08},
  frases:     {x:  690, y:420, esc:1.00},
  som:        {x: 1160, y:612, esc:1.00},
  /* o botão do carrossel, na capa um fio mais acima e à direita; nos
     outros slides ele volta ao lugar do CSS (arrumaPecasDoPalco) */
  carrossel:  {x: 1220, y: 62, esc:1.00}
};
if (CAPA_NOVA) LAYOUTS[0] = LAYOUT_CAPA_NOVA;

function aplicaLayout(i){
  const mapa = LAYOUTS[i];
  if (!mapa) return;
  const sl = slides[i];
  soltaSlide(sl);                    /* mede cada peça onde o layout a pôs */
  const pecas = pecasDe(sl).filter(Boolean);
  /* pôr no lugar não é uma viagem: as peças aparecem já lá. Sem isto, a
     escala que o layout lhes dá seria animada pela transição do
     destaque, e a capa abria com o retrato a crescer do nada. */
  pecas.forEach(el => { el.style.transition = 'none'; });
  pecas.forEach(el => {
    const p = mapa[nomeDe(el)], m = MEDIDAS.get(el);
    if (!p || !m) return;
    m.esc = p.esc;
    m.cy  = p.y;
    m.cx  = p.x !== undefined ? p.x : p.esq + (m.w*p.esc)/2;
    aplicaEl(el);
  });
  void sl.offsetWidth;
  pecas.forEach(el => { el.style.removeProperty('transition'); });
}

/* A TABELINHA E O BOTÃO MORAM NO PALCO, e não num slide: eles
   atravessam a apresentação inteira. Na capa quem manda neles é o
   layout fixado; fora dela têm de voltar ao lugar que o CSS lhes dá,
   senão ficariam para sempre onde a capa os deixou. */
function arrumaPecasDoPalco(){
  if (atual === 0) return;
  ['tabela','som','som-dica','ver-slides'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}

/* tira as peças do slide da mão e devolve-as ao fluxo do CSS */
function desprende(sl){
  pecasDe(sl).forEach(el => {
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}
/* devolve o slide ao lugar de origem — o do arquivo, que é o que o
   layout fixado diz, e não o que o CSS sozinho faria */
function refazLayout(){
  const sl = slides[atual];
  /* de volta à origem, as peças deixam de contar como mexidas */
  pecasDe(sl).forEach(el => MEXIDAS.delete(el));
  desprende(sl);
  if (LAYOUTS[atual]) aplicaLayout(atual);
  else if (naMontagem()) soltaSlide(sl);
  TP.diz('Slide devolvido ao lugar de origem.');
}

/* ---- o gesto: um dedo move, dois dedos pinçam ----
   Os dois casos são a mesma conta. A cada toque novo guardo onde estão
   os dedos — o ponto médio deles e a distância entre eles — e o estado
   da peça. Enquanto os dedos andam, a peça segue o ponto médio e a
   escala segue a razão entre a distância de agora e a do começo. Com um
   dedo só a distância não existe, e sobra o arrasto puro. */
const gestos = new Map();
/* as peças que a mão mexeu (arrasto, pinça, roda ou texto editado): só
   elas vão para a cópia das posições */
const MEXIDAS = new Set();

function centroDe(mapa){
  const pts = [...mapa.values()];
  const cx = pts.reduce((s,p) => s + p.x, 0)/pts.length;
  const cy = pts.reduce((s,p) => s + p.y, 0)/pts.length;
  const d  = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  return {cx, cy, d};
}
const estadoDedos = g => centroDe(g.ptr);
function reancora(el, g){
  const m = MEDIDAS.get(el);
  g.base = Object.assign(estadoDedos(g), {mcx:m.cx, mcy:m.cy, esc:m.esc});
}
const naMontagem = () => document.body.classList.contains('montagem');
function pecaDe(ev){
  const sl = slides[atual];
  const el = ev.target.closest(MOVEIS + ', #tabela, #vel, #ver-slides, #som-dica');
  if (!el) return null;
  if (['vel', 'ver-slides', 'som', 'som-dica'].includes(el.id)) return pecasDe(sl).includes(el) ? el : null;
  return (sl.contains(el) || el.id === 'tabela') ? el : null;
}
/* o rótulo que diz onde a peça está, enquanto ela anda */
function mostraCoord(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  coord.textContent = 'x: ' + Math.round(m.cx) + '   y: ' + Math.round(m.cy) +
                      '   esc: ' + m.esc.toFixed(2);
  coord.style.left = m.cx.toFixed(0) + 'px';
  coord.style.top  = (m.cy - m.h*m.esc/2).toFixed(0) + 'px';
  coord.classList.add('on');
}

/* ---- OS TEXTOS, EDITADOS NA PRÓPRIA FOLHA ----
   Dois toques num texto (ou duplo clique) e ele vira caixa de escrever.
   As linhas passam a ser só as que se escrevem: o Enter quebra a linha,
   e o que não tiver Enter fica numa linha só. Para isso, ao começar, as
   quebras que a largura da caixa fazia viram quebras de verdade (<br>) —
   o texto não salta — e a caixa passa a crescer com o que se escreve.
   Os pedaços com nome (os que a narração acende) ficam onde estão. O
   Esc, ou um toque fora, termina; o Ctrl+C leva também os textos. */
/* e os textos por cima dos slides: o convite, o toque para continuar, os
   rótulos, as frases das telas escuras e dos quadros, a legenda de
   Moseley, a dica final, o Entendi (nas frases digitadas, edita-se o que
   já está escrito — a narração parada não o reescreve) */
const TEXTOS = '.capa .marca, .capa h1, .capa .autor, .capa .email, .tira .title, .tira .subtitle, .quiz3.q4 .q3-q,' +
               ' .dica-escolha .txt, .toque-continuar, .rotulo-el .txt, .veu-frases .frase .txt,' +
               ' .texto-colunas .frase .txt, .veu-moseley figcaption b, .dica-final, .entendi3, .coords-el,' +
               ' .conta-lc25 .txt, .alerta4C, .alerta4E, .alertaAm2, .alertaAm3, .propAm .frase .txt, .propAm1 .frase .txt, .propAm2 .frase .txt';
const EDICAO = {
  el:null, ultimo:null, tUlt:0, editados:new Set(),
  /* o bloco de linhas a que um texto pertence, dentro da peça */
  bloco(e, raiz){
    for (; e && e !== raiz; e = e.parentElement)
      if (getComputedStyle(e).display === 'block') return e;
    return raiz;
  },
  /* a quebra que a largura fazia vira um <br> antes da palavra que desceu */
  fixaLinhas(el){
    const r = document.createRange(), quebras = [];
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    let ant = null;
    for (let t; (t = w.nextNode()); ){
      /* uma quebra que já é <br> não ganha outra */
      if (t.nodeName === 'BR'){ ant = null; continue; }
      if (t.nodeType !== 3) continue;
      const bloco = this.bloco(t.parentElement, el);
      for (const m of t.data.matchAll(/\S+/g)){
        r.setStart(t, m.index); r.setEnd(t, m.index + m[0].length);
        const q = r.getClientRects()[0];
        if (!q) continue;                          /* escondido (display:none) */
        if (ant && ant.bloco === bloco && q.top > ant.top + q.height*.5) quebras.push([t, m.index]);
        ant = { top:q.top, bloco };
      }
    }
    quebras.reverse().forEach(([t, i]) => {
      /* o espaço do fim da linha fica: lá ele não se vê, e juntadas as
         linhas outra vez as palavras não colam */
      const resto = t.splitText(i);
      resto.parentNode.insertBefore(document.createElement('br'), resto);
    });
  },
  /* a peça solta cresce para a direita e para baixo: a borda esquerda e
     a de cima ficam paradas (os textos da capa são alinhados por elas),
     e o centro acompanha */
  esq:0, topo:0, peca:null,
  /* a peça que cresce: o próprio texto, se for peça solta, ou a caixa
     solta que o contém (a pergunta do quiz mora numa caixa) */
  pecaDe(el){ return el.classList.contains('solto') ? el : el.closest('.solto'); },
  acompanha(){
    const el = this.peca, m = el && MEDIDAS.get(el);
    if (!m || !el.classList.contains('solto')) return;
    MEXIDAS.add(el);
    el.style.width = 'max-content';
    m.w = el.offsetWidth;
    m.h = el.offsetHeight;
    m.cx = this.esq  + m.w*m.esc/2;
    m.cy = this.topo + m.h*m.esc/2;
    aplicaEl(el);
    el.style.width = 'max-content';
  },
  comeca(el, x, y){
    this.termina();
    /* o ponto do cursor é tirado antes de qualquer mudança: a caixa vai
       mudar de largura, e o texto debaixo do dedo com ela (o Range
       acompanha as quebras que o fixaLinhas fizer) */
    const p = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
    if (!el.classList.contains('texto-livre')){ this.fixaLinhas(el); el.classList.add('texto-livre'); }
    this.el = el;
    this.peca = this.pecaDe(el);
    const m = this.peca && MEDIDAS.get(this.peca);
    if (m){
      this.esq  = m.cx - m.w*m.esc/2;
      this.topo = m.cy - m.h*m.esc/2;
      this.acompanha();
    }
    el.classList.add('editando');
    el.contentEditable = 'true';
    el.spellcheck = false;
    el.focus();
    /* o cursor vai para onde se tocou */
    const sel = getSelection();
    if (p && el.contains(p.startContainer)){
      /* tocado no começo de uma linha que era quebra da largura, o ponto
         ficou no fim da linha de cima: passa para depois do <br> */
      const n = p.startContainer;
      if (n.nodeType === 3 && p.startOffset >= n.length && n.nextSibling && n.nextSibling.nodeName === 'BR'){
        const depois = n.nextSibling.nextSibling;
        if (depois) p.setStart(depois, 0); else p.setStartAfter(n.nextSibling);
        p.collapse(true);
      }
      sel.removeAllRanges(); sel.addRange(p);
    }
    this.editados.add(el);
    coord.classList.remove('on');
    this.barra(true);
    TP.diz('Editando o texto · Enter quebra a linha · "Uma linha só" junta tudo · Esc ou um toque fora termina', 3600);
  },
  /* A BARRINHA DA EDIÇÃO, por cima do texto: quebrar a linha onde está o
     cursor, ou juntar o texto todo numa linha só. Os botões não roubam o
     cursor do texto (pointerdown sem efeito). */
  barra(sim){
    let b = document.getElementById('edita-barra');
    if (!b){
      b = document.createElement('div');
      b.id = 'edita-barra';
      b.innerHTML = '<button type="button" data-faz="quebra">↵ Quebrar linha</button>' +
                    '<button type="button" data-faz="junta">Uma linha só</button>';
      b.addEventListener('pointerdown', ev => ev.preventDefault());
      b.addEventListener('click', ev => {
        const f = ev.target.closest('button') && ev.target.closest('button').dataset.faz;
        if (f === 'quebra') this.quebra();
        if (f === 'junta') this.junta();
      });
      document.body.appendChild(b);
    }
    b.hidden = !sim;
    if (sim) this.poeBarra();
  },
  poeBarra(){
    const b = document.getElementById('edita-barra');
    if (!b || b.hidden || !this.el) return;
    const r = this.el.getBoundingClientRect();
    b.style.left = Math.max(8, Math.min(innerWidth - b.offsetWidth - 8, r.left)) + 'px';
    /* em cima do texto; sem lugar em cima (o título, no alto), embaixo */
    const cima = r.top - b.offsetHeight - 10;
    b.style.top  = (cima >= 8 ? cima : r.bottom + 10) + 'px';
  },
  quebra(){
    if (!this.el) return;
    /* a localização do elemento ("3º período" / "grupo 1") são duas peças:
       quebrar é pô-las uma debaixo da outra */
    if (this.el.classList.contains('coords-el')){ this.el.classList.remove('uma-linha'); this.el.classList.add('duas-linhas'); this.acompanha(); this.poeBarra(); return; }
    this.el.focus();
    document.execCommand('insertLineBreak');
    this.semEspacoNoInicio();
    this.acompanha(); this.poeBarra();
  },
  /* a linha nova não começa com o espaço que separava as palavras (o
     navegador guardava-o como espaço duro, e a linha saía deslocada) */
  semEspacoNoInicio(){
    const s = getSelection();
    if (!s.rangeCount) return;
    let n = s.anchorNode, o = s.anchorOffset;
    if (n.nodeType !== 3){ n = n.childNodes[o] || null; o = 0; }
    if (n && n.nodeType === 3 && o === 0 && /^[\s ]/.test(n.data)) n.deleteData(0, 1);
  },
  /* tudo numa linha: cada quebra vira um espaço, sem espaços dobrados */
  junta(){
    const el = this.el;
    if (!el) return;
    /* e juntar, pô-las lado a lado */
    if (el.classList.contains('coords-el')){ el.classList.add('uma-linha'); el.classList.remove('duas-linhas'); this.acompanha(); this.poeBarra(); return; }
    el.querySelectorAll('br').forEach(br => br.replaceWith(' '));
    el.normalize();
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let t; (t = w.nextNode()); ) t.data = t.data.replace(/\s{2,}/g, ' ');
    this.acompanha(); this.poeBarra();
  },
  termina(){
    const el = this.el;
    if (!el) return;
    this.barra(false);
    /* a peça solta fica com a largura do que se escreveu */
    this.acompanha();
    const peca = this.peca;
    this.el = this.peca = null;
    el.removeAttribute('contenteditable');
    el.classList.remove('editando');
    if (peca && MEDIDAS.get(peca)) aplicaEl(peca);
    getSelection().removeAllRanges();
  },
  nome(el){
    if (el.classList.contains('title'))    return 'titulo-do-slide';
    if (el.classList.contains('subtitle')) return 'subtitulo-do-slide';
    if (el.closest('figcaption'))          return 'legenda-moseley';
    /* uma frase de uma caixa de frases: o nome da caixa e qual frase é */
    const fr = el.closest('.frase');
    if (fr) return nomeDe(fr.parentNode) + ' (frase ' + ([...fr.parentNode.children].indexOf(fr) + 1) + ')';
    /* o texto de dentro de uma peça (o convite, os rótulos): o nome dela */
    const dono = el.closest(TEXTOS_SOLTOS);
    if (dono && dono !== el) return nomeDe(dono);
    /* a pergunta do quiz leva o rótulo dela: "pergunta (Questão 01)" */
    if (el.classList.contains('q3-q')){
      const r = el.parentNode.querySelector('.q3-marca');
      return 'pergunta (' + (r ? r.textContent : '') + ')';
    }
    return nomeDe(el);
  }
};
/* o Enter quebra a linha (e não abre um parágrafo novo); colado, entra
   só o texto, sem a letra e as cores de onde veio */
stage.addEventListener('keydown', ev => {
  if (!EDICAO.el || !EDICAO.el.contains(ev.target)) return;
  if (ev.key === 'Enter'){ ev.preventDefault(); EDICAO.quebra(); }
  /* o Backspace logo depois de uma quebra junta as duas linhas com um
     espaço entre as palavras (o navegador apagaria o espaço também) */
  if (ev.key === 'Backspace'){
    const s = getSelection();
    if (!s.isCollapsed) return;
    const n = s.anchorNode, o = s.anchorOffset;
    const br = n.nodeType === 3 ? (o === 0 ? n.previousSibling : null) : n.childNodes[o - 1];
    if (!br || br.nodeName !== 'BR') return;
    ev.preventDefault();
    const antes = br.previousSibling, depois = br.nextSibling;
    br.remove();
    const r = document.createRange();
    if (antes && antes.nodeType === 3){
      const colaDepois = depois && depois.nodeType === 3 && /^\S/.test(depois.data);
      if (/\S$/.test(antes.data) && colaDepois) antes.appendData(' ');
      r.setStart(antes, antes.length);
    } else if (depois) r.setStartBefore(depois);
    else r.selectNodeContents(EDICAO.el), r.collapse(false);
    r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
    EDICAO.acompanha();
  }
});
/* escrevendo, a caixa cresce com o texto (e a barrinha acompanha) */
stage.addEventListener('input', ev => {
  if (EDICAO.el && EDICAO.el.contains(ev.target)){ EDICAO.acompanha(); EDICAO.poeBarra(); }
});
stage.addEventListener('paste', ev => {
  if (!EDICAO.el || !EDICAO.el.contains(ev.target)) return;
  ev.preventDefault();
  document.execCommand('insertText', false, (ev.clipboardData || window.clipboardData).getData('text/plain'));
});

stage.addEventListener('pointerdown', (ev) => {
  if (!naMontagem()) return;
  /* escrevendo: o toque dentro do texto é do cursor; fora, termina */
  if (EDICAO.el){
    if (EDICAO.el.contains(ev.target)) return;
    EDICAO.termina();
  }
  /* dois toques no mesmo texto, e ele abre para escrever */
  const txt = ev.target.closest && ev.target.closest(TEXTOS);
  if (txt && slides[atual].contains(txt)){
    const agora = performance.now();
    if (EDICAO.ultimo === txt && agora - EDICAO.tUlt < 450){
      EDICAO.ultimo = null;
      ev.preventDefault();
      ev.stopPropagation();
      /* o dedo do primeiro toque pode ter deixado a peça na mão */
      gestos.delete(txt); txt.classList.remove('pego');
      EDICAO.comeca(txt, ev.clientX, ev.clientY);
      return;
    }
    EDICAO.ultimo = txt; EDICAO.tUlt = agora;
  }
  const el = pecaDe(ev);
  if (!el){
    /* fora das peças, um cubo ou o vazio da tabela: é a mesa inteira que
       se pega — um dedo arrasta, dois pinçam */
    const mesa = ev.target.closest && ev.target.closest('.mesa');
    if (mesa && slides[atual].contains(mesa)){ MESA_MONT.pega(ev, mesa); ev.preventDefault(); ev.stopPropagation(); }
    return;
  }
  soltaSlide(slides[atual]);
  let g = gestos.get(el);
  if (!g){ g = {ptr:new Map()}; gestos.set(el, g); }
  g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  try { el.setPointerCapture(ev.pointerId); } catch(_){}
  reancora(el, g);
  el.classList.add('pego');
  mostraCoord(el);
  ev.preventDefault();
  ev.stopPropagation();            /* na montagem, o gesto é da peça */
}, true);

document.addEventListener('pointermove', (ev) => {
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    const agora = estadoDedos(g), b = g.base, m = MEDIDAS.get(el);
    m.cx = b.mcx + (agora.cx - b.cx)/fitScale;
    m.cy = b.mcy + (agora.cy - b.cy)/fitScale;
    if (g.ptr.size > 1 && b.d > 12)
      m.esc = Math.max(.15, Math.min(8, b.esc * (agora.d / b.d)));
    MEXIDAS.add(el);
    aplicaEl(el);
    mostraCoord(el);
  });
}, true);

function largaDedo(ev){
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.delete(ev.pointerId);
    /* saiu um dedo dos dois: o que ficou recomeça a contar dali, senão
       a peça daria um salto no instante em que o outro se levanta */
    if (g.ptr.size) reancora(el, g);
    else { gestos.delete(el); el.classList.remove('pego'); }
  });
}
document.addEventListener('pointerup', largaDedo, true);
document.addEventListener('pointercancel', largaDedo, true);

/* A MESA INTEIRA NA MONTAGEM: anda e cresce pelas mesmas variáveis com
   que o ajuste do celular a move (--px, --py, --zoom). O Ctrl+C leva-a
   como { el:'tabela', x, y, esc } — o deslocamento, em px do palco, e a
   escala. Um toque num cubo, na montagem, não o faz girar. */
const MESA_MONT = {
  mesa:null, ptr:new Map(), base:null, mexidas:new Set(),
  le(mesa){
    const cs = getComputedStyle(mesa), v = (n, d) => { const x = parseFloat(mesa.style.getPropertyValue(n) || cs.getPropertyValue(n)); return isNaN(x) ? d : x; };
    return { x:v('--px', 0), y:v('--py', 0), e:v('--zoom', 1) };
  },
  poe(mesa, p){
    mesa.style.setProperty('--px', p.x.toFixed(1) + 'px');
    mesa.style.setProperty('--py', p.y.toFixed(1) + 'px');
    mesa.style.setProperty('--zoom', p.e.toFixed(3));
    this.mexidas.add(mesa);
    /* os números soltos andam com a mesa: o lugar guardado deles (no
       slide) é refeito, senão saltavam ao serem pegos outra vez */
    const rs = mesa.closest('.slide').getBoundingClientRect();
    mesa.querySelectorAll('.solto').forEach(el => {
      const m = MEDIDAS.get(el);
      if (!m) return;
      const r = el.getBoundingClientRect();
      m.cx = (r.left + r.width/2  - rs.left) / fitScale;
      m.cy = (r.top  + r.height/2 - rs.top ) / fitScale;
      m.w  = r.width / fitScale / (m.esc || 1);
    });
    coord.textContent = 'tabela · x: ' + Math.round(p.x) + '   y: ' + Math.round(p.y) + '   esc: ' + p.e.toFixed(2);
    coord.style.left = '640px'; coord.style.top = '80px';
    coord.classList.add('on');
  },
  ancora(){ this.base = Object.assign(centroDe(this.ptr), this.le(this.mesa)); },
  pega(ev, mesa){
    if (this.mesa !== mesa){ this.ptr.clear(); this.mesa = mesa; }
    mesa.style.transition = 'none';            /* na mão, sem inércia */
    this.ptr.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
    try { mesa.setPointerCapture(ev.pointerId); } catch(_){}
    this.ancora();
  },
  move(ev){
    if (!this.mesa || !this.ptr.has(ev.pointerId)) return;
    this.ptr.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
    const a = centroDe(this.ptr), b = this.base;
    const e = this.ptr.size > 1 && b.d > 12 ? Math.max(.3, Math.min(3, b.e * a.d / b.d)) : b.e;
    this.poe(this.mesa, { x: b.x + (a.cx - b.cx)/fitScale, y: b.y + (a.cy - b.cy)/fitScale, e });
  },
  larga(ev){
    if (!this.ptr.has(ev.pointerId)) return;
    this.ptr.delete(ev.pointerId);
    if (this.ptr.size) this.ancora();
    else { this.mesa.style.removeProperty('transition'); this.mesa = null; }
  }
};
document.addEventListener('pointermove', ev => MESA_MONT.move(ev), true);
document.addEventListener('pointerup', ev => MESA_MONT.larga(ev), true);
document.addEventListener('pointercancel', ev => MESA_MONT.larga(ev), true);
/* na montagem o toque na mesa é gesto, e não clique: o cubo não gira e a
   resposta do quiz não conta */
stage.addEventListener('click', ev => {
  if (naMontagem() && ev.target.closest && ev.target.closest('.mesa')){ ev.stopPropagation(); ev.preventDefault(); }
}, true);

/* a roda do mouse faz o que a pinça faz */
stage.addEventListener('wheel', (ev) => {
  if (!naMontagem()) return;
  const el = pecaDe(ev);
  if (!el){
    const mesa = ev.target.closest && ev.target.closest('.mesa');
    if (mesa && slides[atual].contains(mesa)){
      const p = MESA_MONT.le(mesa);
      p.e = Math.max(.3, Math.min(3, p.e * (1 - ev.deltaY * 0.0015)));
      MESA_MONT.poe(mesa, p);
      ev.preventDefault();
    }
    return;
  }
  soltaSlide(slides[atual]);
  const m = MEDIDAS.get(el);
  if (!m) return;
  m.esc = Math.max(.15, Math.min(8, m.esc * (1 - ev.deltaY * 0.0015)));
  MEXIDAS.add(el);
  aplicaEl(el);
  mostraCoord(el);
  ev.preventDefault();
}, {passive:false});

/* o toque demorado no palco chama o menu do navegador, e aqui dentro
   não há o que copiar nem pesquisar: ele só atrapalha o arrasto */
stage.addEventListener('contextmenu', ev => { if (naMontagem()) ev.preventDefault(); });

/* A MONTAGEM abre e fecha segurando a versão, no canto de baixo à
   esquerda, por 1 s (ou com a tecla G). Ao fechar, as posições e os
   tamanhos do slide são copiados sozinhos — a folha abre com eles. */
function modoMontagem(v){
  const abre = v === undefined ? !naMontagem() : !!v;
  if (abre === naMontagem()) return;
  document.body.classList.toggle('montagem', abre);
  if (abre){
    /* a tabela viva mexeria as peças por baixo da mão */
    VIDA.desliga();
    som.pause(); mostraPausa(false);
    calaAbertura();          /* nem a narração, nem a abertura do capítulo */
    soltaSlide(slides[atual]);
    TP.diz('Montagem: arraste as peças · roda ou pinça muda o tamanho · dois toques num texto o editam · R devolve · segure a versão para sair e copiar', 4800);
  } else {
    EDICAO.termina();
    coord.classList.remove('on');
    copiaCoords();
    /* o que foi copiado já foi entregue: a próxima montagem conta do zero */
    MEXIDAS.clear(); MESA_MONT.mexidas.clear(); EDICAO.editados.clear();
    if (temMesa(atual)) VIDA.liga();
  }
}
/* o dedo (ou o rato) na versão: segurando 1 s, a montagem abre ou fecha.
   O traço por baixo dela enche-se enquanto se segura */
const versaoEl = document.getElementById('versao');
let seguraVersao = 0;
versaoEl.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  clearTimeout(seguraVersao);
  versaoEl.classList.add('segurando');
  seguraVersao = setTimeout(() => { versaoEl.classList.remove('segurando'); modoMontagem(); }, 1000);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => versaoEl.addEventListener(t, () => {
  clearTimeout(seguraVersao);
  versaoEl.classList.remove('segurando');
}));
versaoEl.addEventListener('contextmenu', ev => ev.preventDefault());

/* ---- a folha das posições ---- */
const coordsCx  = document.getElementById('coords');
const coordsTxt = document.getElementById('coords-txt');
const coordsDe  = document.getElementById('coords-de');
const coordsMsg = document.getElementById('coords-msg');

function nomeDe(el){
  if (el.dataset.mont) return el.dataset.mont;   /* peça com nome próprio */
  if (el.id === 'tabela') return 'tabelinha';
  if (el.id === 'vel')    return 'velocidade';
  if (el.id === 'ver-slides') return 'carrossel';
  if (el.id === 'som-dica')   return 'dica-do-play';
  const c = el.classList;
  /* os textos por cima dos slides */
  if (c.contains('dica-escolha'))    return 'toque-em-um-elemento';
  if (c.contains('toque-continuar')) return 'toque-para-continuar';
  if (c.contains('frases-c1'))       return 'frases-criterio-1';
  if (c.contains('frases-c2'))       return 'frases-criterio-2';
  if (c.contains('veu-frases'))      return 'frases-da-tela-escura';
  if (c.contains('r-num'))           return 'rotulo-numero-atomico';
  if (c.contains('r-massa'))         return 'rotulo-massa';
  if (c.contains('texto-colunas'))   return 'quadro-de-frases';
  if (c.contains('entendi3'))        return 'botao-entendi';

  if (c.contains('conta-lc25'))      return el.dataset.vez === 'colunas' ? 'sao-18-colunas' : 'sao-7-linhas';
  /* no slide 4, com o exemplo em que se está (Na, Mn ou Pb) */
  const ex = (c.contains('ficha') || c.contains('coords-el')) && el.closest('.mesa') && el.closest('.mesa').dataset.ex;
  if (c.contains('ficha'))           return 'simbolo-do-elemento' + (ex ? ' (' + ex + ')' : '');
  if (c.contains('coords-el'))       return 'localizacao-do-elemento' + (ex ? ' (' + ex + ')' : '');

  if (c.contains('email')) return 'email';
  if (c.contains('foto'))  return 'foto';
  if (el.tagName === 'H1') return 'titulo';
  return el.tagName.toLowerCase();
}
/* mede tudo o que está no slide, em px do palco, com x,y no centro */
function medeSlide(i){
  const sl = slides[i], rs = sl.getBoundingClientRect();
  soltaSlide(sl);                  /* mede pelo mesmo critério da montagem */
  return pecasDe(sl).filter(el => el && el.classList.contains('solto')).map(el => {
    const r = el.getBoundingClientRect();   /* já vem com a escala aplicada */
    const m = MEDIDAS.get(el);
    const esc = m ? m.esc : 1;
    return {
      el,
      nome:  nomeDe(el),
      x:     Math.round((r.left + r.width/2  - rs.left)/fitScale),
      y:     Math.round((r.top  + r.height/2 - rs.top )/fitScale),
      larg:  Math.round(r.width /fitScale),
      alt:   Math.round(r.height/fitScale),
      /* a fonte medida não conhece a escala do transform: entra na conta */
      fonte: el.matches(COM_LETRA)
             ? Math.round(parseFloat(getComputedStyle(el).fontSize) * esc * 10)/10
             : null,
      esc:   Math.round(esc*100)/100
    };
  });
}
const pad = (v,n) => String(v).padStart(n, ' ');

function textoDoSlide(i){
  const sl = SLIDES[i];
  let out = '/* slide ' + (i+1) + ' · ' + (sl.kind === 'capa' ? 'Capa' : sl.title) + ' */\n';
  /* só as peças que a mão mexeu: as que ficaram como estavam não vão */
  const mexidas = medeSlide(i).filter(o => MEXIDAS.has(o.el));
  if (!mexidas.length && !(slides[i].querySelector('.mesa') && MESA_MONT.mexidas.has(slides[i].querySelector('.mesa'))) &&
      ![...EDICAO.editados].some(el => slides[i].contains(el)))
    out += '  /* nenhuma peça foi mexida */\n';
  mexidas.forEach(o => {
    out += '  { ' + ("el:'" + o.nome + "',").padEnd(16, ' ') +
           ' x:' + pad(o.x,4) + ', y:' + pad(o.y,3) +
           ', larg:' + pad(o.larg,4) + ', alt:' + pad(o.alt,3) +
           /* a peça sem letra deixa a coluna em branco, para a escala
              ficar debaixo da escala na linha de cima */
           (o.fonte === null ? ' '.repeat(13) : ', fonte:' + pad(o.fonte,5)) +
           ', esc:' + o.esc.toFixed(2) + ' },\n';
  });
  /* a mesa inteira, se foi movida ou mudou de tamanho na montagem */
  const mesaI = slides[i].querySelector('.mesa');
  if (mesaI && MESA_MONT.mexidas.has(mesaI)){
    const p = MESA_MONT.le(mesaI);
    out += "  { el:'tabela',     x:" + pad(Math.round(p.x),4) + ", y:" + pad(Math.round(p.y),3) +
           ", esc:" + p.e.toFixed(2) + " },   /* o deslocamento da mesa inteira, em px do palco */\n";
  }
  /* e os textos que foram editados neste slide, como estão agora (o <br>
     é cada Enter). 'linhas' é quantas linhas o texto mostra: editado, ele
     só quebra onde houver Enter, e isso não se vê no texto */
  const textos = [...EDICAO.editados].filter(el => slides[i].contains(el));
  /* as linhas contam-se pelos pedaços de texto que se sobrepõem na
     altura: letras de tamanhos diferentes na mesma linha são uma linha */
  const linhas = el => {
    /* só os pedaços de texto: o retângulo de um bloco cobre várias linhas */
    const r = document.createRange(), qs = [];
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let t; (t = w.nextNode()); ){
      if (!t.data.trim()) continue;
      r.selectNodeContents(t);
      qs.push(...[...r.getClientRects()].filter(q => q.width > 0 && q.height > 0));
    }
    /* um pedaço é linha nova quando o centro dele não cai perto do centro
       de uma linha já contada (a letra grande passa da altura da linha,
       e os retângulos das linhas vizinhas encostam) */
    const centros = [];
    qs.forEach(q => {
      const c = (q.top + q.bottom) / 2;
      if (!centros.some(x => Math.abs(x - c) < q.height * .4)) centros.push(c);
    });
    return centros.length;
  };
  if (textos.length){
    out += '  /* textos editados (numa linha só, a não ser onde houver <br>) */\n';
    textos.forEach(el => {
      out += "  { el:'" + EDICAO.nome(el) + "', linhas:" + linhas(el) + ", texto:'" +
             el.innerHTML.replace(/\s*\n\s*/g, ' ').replace(/'/g, "\\'") + "' },\n";
    });
  }
  return out;
}

function abreMenuEmail(x, y){

function copiaTexto(txt){
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(txt);
  /* aberto do disco, ou sem https, a área de transferência moderna não
     existe: vai pelo caminho antigo, que funciona em todo o lado */
  return new Promise((ok, falha) => {
    const t = document.createElement('textarea');
    t.value = txt;
    t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy') ? ok() : falha(); }
    catch(e){ falha(e); }
    t.remove();
  });
}

const NAV = { geracao:0, eleitoAntes:null };

function irPara(i, variante){
  const item = NAV_TOPICOS[i];
  if (!item || item.engatilhado) return;
  fechaNav();
  TEMPO_FORCADO = null;
  const g = ++NAV.geracao;
  /* o elemento que o aluno tinha escolhido fica guardado: chegando a um
     quiz, é ele que volta a valer (se servir) */
  if (SEQ.eleito) NAV.eleitoAntes = +SEQ.eleito.dataset.z;
  /* um subtópico já começa com a narração dele: a abertura do capítulo
     não toca, senão as duas vozes falavam por cima uma da outra */
  const capitulo = NAV_TOPICOS.findIndex(t => t.slide === item.slide) === i;
  if (!capitulo) ABERTURA_SUSPENSA = true;
  const segue = () => {
    if (g !== NAV.geracao || atual !== item.slide) return;
    NAV_TOPICOS.slice(0, i).forEach(t => { if (t.slide === item.slide && t.deixa) t.deixa(); });
    item.entra(variante, g);
  };
  /* de outro slide, o go() já recomeça este; no mesmo, recomeça-se à mão */
  if (atual !== item.slide){ go(item.slide); setTimeout(segue, 900); }
  else { recomecaSlide(item.slide); segue(); }
  ABERTURA_SUSPENSA = false;
}

/* o slide recomeça no lugar, como se o aluno acabasse de chegar a ele: é o
   que o go() faz, e ele não faz nada quando o destino é o slide atual */
function recomecaSlide(i){
  som.pause();
  mostraPausa(false);
  VIDA.desliga();
  DEMO.corta();
  recomecaMesa(i);
  trilhaAtual = -1;          /* a mesma trilha também recomeça */
  carregaTrilha(TRILHA_DO_SLIDE[i]);
  tocaAbertura(i);
}

/* O ELEITO de quem chega direto: na aula ele sai da escolha do aluno na
   "1.1", e é o símbolo dele que decide entre a "1.3A" e a "1.3B" (e fica
   fora do quiz). Vale o que tinha sido escolhido antes, se servir; senão
   um ao acaso — de uma letra, de duas, ou qualquer um. Chegando ao
   quiz, ele já voltou para casa: não leva classe nenhuma. */
function eleitoDaNavegacao(letras){
  const serve = c => !!c && (!letras || c.dataset.sym.length === letras);
  const todos = TP.todos();
  let c = todos.find(x => +x.dataset.z === NAV.eleitoAntes);
  if (!serve(c)){
    const pool = todos.filter(serve);
    c = pool[Math.floor(Math.random() * pool.length)];
  }
  SEQ.eleito = c;
  return c;
}

  neutro(c, false);
}

/* a narração só volta depois de a mesa pousar; e a mesa não se põe a
   respirar à espera do play, porque a aula já vai adiantada */
function depoisDaMesa(g, fn){
  SEQ.comecou = true;
  VIDA.desliga();
  setTimeout(() => { if (g === NAV.geracao) fn(); }, 1500);
}

/* toca uma trilha a partir de um segundo. O salto só pode ser dado com
   o áudio já a saber a duração (loadedmetadata). Os eventos seguem o
   relógio, e por isso a mesa fica logo como naquele segundo; e se o
   áudio não carregar, o quiz daquela trilha abre na mesma. */
/* O SALTO VEM ANTES DO PLAY: tocar e saltar ao mesmo tempo deixava o
   celular tocar uma fração de segundo do começo da narração antes de
   chegar ao segundo pedido. A trilha só é recarregada se for outra (a
   mesma, já carregada, recomeça o roteiro sem baixar tudo de novo). */
function tocaDesde(id, t, g){
  if (trilhaAtual === id && som.readyState >= 1){ som.pause(); zeraRoteiro(id); }
  else { trilhaAtual = -1; carregaTrilha(id); }
  const vai = () => {
    if (g !== NAV.geracao || trilhaAtual !== id) return;
    const toca = () => { if (g === NAV.geracao && trilhaAtual === id) som.play().catch(avisaSeNaoTocou); };
    if (Math.abs(som.currentTime - t) < 0.05) toca();
    else { som.addEventListener('seeked', toca, { once:true }); som.currentTime = t; }
  };
  if (som.readyState >= 1) vai();
  else som.addEventListener('loadedmetadata', vai, { once:true });
  som.addEventListener('error', () => {
    if (g === NAV.geracao && trilhaAtual === id && id in QUIZ_NA_HORA) SEQ.abreQuiz(id);
  }, { once:true });
}

/* em que tópico a aula está agora — é o que a gaveta acende */
function topicoAtual(){
  if (atual === 4){
    const base = NAV_TOPICOS.findIndex(t => t.slide === 4);
    if (trilhaAtual === '4C') return base + 11;
    if (trilhaAtual === '4B3' || trilhaAtual === '4B4') return base + 10;
    if (trilhaAtual === '4B2' || trilhaAtual === '4B2.1') return base + 9;
    if (trilhaAtual === '4B1') return base + 8;
    if (trilhaAtual === '4B') return base + 7;
    if (trilhaAtual === '4A4' || trilhaAtual === '4A5') return base + 6;
    if (trilhaAtual === '4A3') return base + 5;
    if (trilhaAtual === '4A2') return base + 4;
    if (trilhaAtual === '4A1') return base + 3;
    if (trilhaAtual === '4A') return base + 2;
    return base + (trilhaAtual === '4' && (som.currentTime || 0) >= EV4.escolhaDe ? 1 : 0);
  }
  if (atual === 5) return NAV_TOPICOS.findIndex(t => t.slide === 5);
  if (atual === 6) return NAV_TOPICOS.findIndex(t => t.slide === 6);
  if (atual === 7) return NAV_TOPICOS.findIndex(t => t.slide === 7);
  if (atual === 8) return NAV_TOPICOS.findIndex(t => t.slide === 8);
  if (atual === 9) return NAV_TOPICOS.findIndex(t => t.slide === 9);
  if (atual === 10) return NAV_TOPICOS.findIndex(t => t.slide === 10);
  if (atual === 3){
    const base = NAV_TOPICOS.findIndex(t => t.slide === 3);
    if (!QUIZ4.ativo && !QUIZ4.trilhas.includes(trilhaAtual)) return base;
    return base + ({ 'Quiz 1':1, 'Quiz 2':2, 'Quiz 3':3 }[QUIZ4.nomeDaParte(trilhaAtual)]);
  }
  if (atual === 2){
    const base = NAV_TOPICOS.findIndex(t => t.slide === 2);
    const tr = trilhaAtual, t = som.currentTime || 0;
    if (QUIZ3.aberto || tr === '2.5' || tr === '2.5A') return base + 3;
    if (tr === '2.3' || tr === '2.4' || FINAL.feito) return base + 2;
    if ((tr === '2' && t >= 25) || tr === '2.1' || tr === '2.2') return base + 1;
    return base;
  }
  if (atual !== 1) return -1;
  if (memAberto || trilhaAtual === '1.jogo') return NAV_TOPICOS.findIndex(t => t.titulo === 'Jogo da memória');
  if (QUIZ.aberto && QUIZ.origem === '1.4') return 2;
  if (QUIZ.aberto || trilhaAtual === '1.4') return 1;
  return 0;
}

/* A GAVETA. As peças são var, e não let: o cabeçalho pergunta por elas
   (navNoSlide) antes de elas existirem, e um let ali ainda não existe. */
var navAlca = null, navGaveta = null, navFundo = null;
function montaNav(){
  navAlca = document.createElement('button');
  navAlca.id = 'nav-alca';
  navAlca.type = 'button';
  navAlca.title = 'Sumário (N)';
  navAlca.setAttribute('aria-label', 'Abrir o sumário');
  navAlca.innerHTML = '<span>Sumário</span>';
  navAlca.addEventListener('click', abreNav);

  navFundo = document.createElement('div');
  navFundo.id = 'nav-fundo';
  navFundo.addEventListener('click', fechaNav);

  navGaveta = document.createElement('aside');
  navGaveta.id = 'nav';
  navGaveta.setAttribute('aria-label', 'Sumário');
  navGaveta.setAttribute('aria-hidden', 'true');
  navGaveta.innerHTML =
    '<header><div class="nav-rotulo">Sumário</div><h2>A Tabela Periódica Moderna</h2>' +
    /* a velocidade da narração mora aqui (saiu da tela) */
    '<button type="button" class="nav-vel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"' +
    ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 16a8 8 0 1 1 15 0"/><path d="M12 13l4-4"/>' +
    '<circle cx="12" cy="13" r="1.2" fill="currentColor"/></svg><span class="nav-vel-txt">Velocidade da fala</span>' +
    '<b class="nav-vel-v">1×</b></button>' +
    /* e as legendas, com o ícone da surdez (a orelha riscada) */
    '<button type="button" class="nav-leg" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 3.2-2.8 4.2-2.8 7a3.2 3.2 0 0 1-5.9 1.7"/><path d="M9.6 9a2.4 2.4 0 0 1 4.8 0"/>' +
    '<path d="M3.5 3.5l17 17"/></svg><span class="nav-leg-txt">Legendas</span><span class="nav-leg-chave"></span></button>' +
    '<button class="nav-fecha" type="button" aria-label="Fechar o sumário">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"' +
    ' stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>' +
    '<ol class="nav-lista"></ol>' +
    '<p class="nav-pe">Cada tópico abre com a mesa montada como se os anteriores ' +
    'tivessem acontecido. Tecla N abre e fecha.</p>';
  navGaveta.querySelector('.nav-fecha').addEventListener('click', fechaNav);
  navGaveta.querySelector('.nav-vel').addEventListener('click', () => Velocidade.trocar());
  Velocidade.botao();
  navGaveta.querySelector('.nav-leg').addEventListener('click', () => LEGENDA.trocar());
  LEGENDA.botao();
  const lista = navGaveta.querySelector('.nav-lista');
  /* O SUMÁRIO: um capítulo por slide, com o número dele ("1. A Tabela
     Periódica"), e debaixo os subtópicos, por letra (a, b, c…). O
     primeiro tópico de cada slide (a "Visão geral", o "Início") é o
     próprio capítulo: tocar no título leva ao começo do slide. */
  const letra = k => String.fromCharCode(97 + k);
  for (let s = 1; s < SLIDES.length; s++){
    const doSlide = NAV_TOPICOS.map((t, i) => ({ t, i })).filter(o => o.t.slide === s);
    if (!doSlide.length) continue;
    const cap = document.createElement('li');
    cap.className = 'sum-cap';
    cap.dataset.slide = s;
    const cb = document.createElement('button');
    cb.type = 'button';
    cb.className = 'nav-item sum-cap-bt';
    cb.dataset.topico = doSlide[0].i;
    cb.innerHTML = '<span class="sum-num">' + s + '.</span><span class="nav-txt"><b></b><small></small></span>';
    cb.querySelector('b').textContent = SLIDES[s].sumario || SLIDES[s].title;
    cb.querySelector('b').insertAdjacentHTML('beforeend', '<span class="nav-aqui">aqui</span>');
    cb.querySelector('small').textContent = SLIDES[s].subtitle || '';
    cb.addEventListener('click', () => irPara(doSlide[0].i));
    cap.appendChild(cb);
    const subs = doSlide.slice(1);
    if (subs.length){
      const ol = document.createElement('ol');
      ol.className = 'sum-subs';
      /* um tópico com 'secao' ("4.1") abre uma seção: leva o número dela no
         lugar da letra, e as letras dos que vêm depois recomeçam do a */
      let k = 0, naSecao = false;
      subs.forEach(({ t, i }) => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'nav-item sum-sub' + (t.secao ? ' sum-secao' : naSecao ? ' na-secao' : '');
        b.dataset.topico = i;
        const marca = t.secao ? t.secao + '.' : letra(k++) + ' –';
        if (t.secao){ k = 0; naSecao = true; }
        /* só o título: o 'sub' de cada tópico é nota técnica, e fica no código */
        b.innerHTML = '<span class="sum-letra">' + marca + '</span><span class="nav-txt"><b></b>' +
          (t.engatilhado ? '<span class="nav-breve">em breve</span>' : '') + '</span>';
        b.querySelector('b').textContent = t.titulo;
        b.querySelector('b').insertAdjacentHTML('beforeend', '<span class="nav-aqui">aqui</span>');
        if (t.engatilhado) b.disabled = true;
        else b.addEventListener('click', () => irPara(i));
        /* os atalhos das variantes (1.3A, 1.3B, o jogo direto) ficam fora do
           sumário: eram ferramenta de teste, e o aluno não precisa deles. O
           tópico, tocado, escolhe a variante sozinho. */
        li.appendChild(b);
        ol.appendChild(li);
      });
      cap.appendChild(ol);
    }
    lista.appendChild(cap);
  }
  document.body.append(navAlca, navFundo, navGaveta);
  navNoSlide();
}
function navAberta(){ return !!navGaveta && navGaveta.classList.contains('aberta'); }
function abreNav(){
  if (!navGaveta || atual < 1) return;
  const aqui = topicoAtual();
  /* acende o capítulo em que se está e, dentro dele, o tópico */
  navGaveta.querySelectorAll('.sum-cap').forEach(li => li.classList.toggle('aqui', +li.dataset.slide === atual));
  navGaveta.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('atual', +b.dataset.topico === aqui));
  const cap = navGaveta.querySelector('.sum-cap.aqui');
  /* o capítulo de agora à vista, no alto da lista (sem rolar a página) */
  if (cap) navGaveta.querySelector('.nav-lista').scrollTop = cap.offsetTop - 12;
  navGaveta.classList.add('aberta');
  navGaveta.setAttribute('aria-hidden', 'false');
  navFundo.classList.add('on');
  navAlca.classList.add('fora');
}
function fechaNav(){
  if (!navGaveta) return;
  navGaveta.classList.remove('aberta');
  navGaveta.setAttribute('aria-hidden', 'true');
  navFundo.classList.remove('on');
  navAlca.classList.remove('fora');
}
function alternaNav(){ navAberta() ? fechaNav() : abreNav(); }
/* a alça só existe do slide da tabela em diante */
function navNoSlide(){
  if (!navAlca) return;
  navAlca.classList.toggle('some', atual < 1);
  if (atual < 1) fechaNav();
}
montaNav();

/* ============================================================
   O AJUSTE DA TABELA — a ferramenta de medir a mesa no celular
   GUARDADA E DESLIGADA (AJUSTE_LIGADO = false): a medida tirada com ela
   está em MESA_NO_CELULAR, e é aplicada no celular. Para medir outra vez
   — nesta mesa ou, mais adiante, noutra peça —, basta ligá-la.
   SÓ NO CELULAR (ehCelular): tablets, Chromebooks e computadores não
   veem nada disto, e a tabela deles não muda.
   Ligado (AJUSTE_LIGADO), a tabela do slide 1 fica travada: os cubos não
   respondem ao toque, os toques no slide não fazem nada, e a mesa não
   se mexe sozinha à espera do play. Um dedo arrasta a tabela; dois, em
   pinça, aumentam ou diminuem em volta do ponto entre eles, como num
   mapa (num computador que se passe por celular, o rato arrasta e a
   roda muda o tamanho).
   A medida — o deslocamento em pixels do palco e a escala — aparece no
   painel do alto, e o Copiar leva-a, com o tamanho da tela, para ser
   colada na conversa e aplicada no app. O × desliga o ajuste até a
   página recarregar (a medida fica aplicada, para ver a tabela assim).
   A medida vive nas variáveis que a .mesa já tinha para isso: --px,
   --py e --zoom, com a origem no meio do palco.
   ============================================================ */
/* DESLIGADO: a medida já foi tirada. Para medir de novo, true — o painel
   volta no celular, a começar da medida em uso. */
var AJUSTE_LIGADO = false;
/* A MESA NO CELULAR — a medida tirada no aparelho do professor (tela
   832 × 384, palco 0,533, folga 140): a tabela um fio acima e 15,6 %
   maior, a avançar pelas laterais que o celular tem a mais. Só no
   celular: nas telas maiores a mesa não é tocada. */
const MESA_NO_CELULAR = { x:2, y:-22, e:1.156 };
var AJUSTE = { ligado:false, x:MESA_NO_CELULAR.x, y:MESA_NO_CELULAR.y, e:MESA_NO_CELULAR.e,
               dedos:new Map(), ini:null };
const limitaEscala = e => Math.max(0.4, Math.min(2.5, e));
/* um ponto da tela, em pixels do palco */
function noPalco(pt){
  const r = stage.getBoundingClientRect();
  return { x:(pt.x - r.left) / fitScale, y:(pt.y - r.top) / fitScale };
}
function meioDosDedos(d){
  const n = d.length || 1;
  return { x:d.reduce((a, p) => a + p.x, 0) / n, y:d.reduce((a, p) => a + p.y, 0) / n };
}
const distDosDedos = d => d.length > 1 ? Math.hypot(d[0].x - d[1].x, d[0].y - d[1].y) : 0;

function montaAjuste(){
  const p = document.createElement('div');
  p.id = 'ajuste';
  p.hidden = true;
  p.innerHTML = '<span class="aj-rot">Ajuste da tabela</span><output></output>' +
    '<button type="button" class="aj-zera">Zerar</button>' +
    '<button type="button" class="forte aj-copia">Copiar</button>' +
    '<button type="button" class="x" aria-label="Desligar o ajuste da tabela">×</button>';
  document.body.appendChild(p);
  p.querySelector('.aj-zera').addEventListener('click', () => {
    AJUSTE.x = AJUSTE.y = 0; AJUSTE.e = 1; aplicaAjuste();
  });
  p.querySelector('.aj-copia').addEventListener('click', copiaAjuste);
  p.querySelector('.x').addEventListener('click', () => { AJUSTE_LIGADO = false; ajusteNoSlide(); });
  const sl = slides[1];
  sl.addEventListener('pointerdown', dedoDesce);
  sl.addEventListener('pointermove', dedoAnda);
  sl.addEventListener('pointerup', dedoSobe);
  sl.addEventListener('pointercancel', dedoSobe);
  sl.addEventListener('wheel', rodaAjuste, { passive:false });
  /* ZERO INTERAÇÕES: nenhum clique chega a quem está no slide (a tela
     escura, o quiz, os cubos) enquanto o ajuste está ligado */
  sl.addEventListener('click', ev => {
    if (AJUSTE.ligado){ ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  ajusteNoSlide();
}
/* o ajuste só existe no slide da tabela, e só no celular: nas telas
   maiores a tabela continua como sempre, interativa, sem painel e sem
   nenhuma medida aplicada */
function ajusteNoSlide(){
  if (!window.AJUSTE) return;
  const celular = ehCelular();
  const on = AJUSTE_LIGADO && atual === 1 && celular;
  AJUSTE.ligado = on;
  AJUSTE.dedos.clear();
  stage.classList.toggle('ajustando', on);
  const p = document.getElementById('ajuste');
  if (p) p.hidden = !on;
  if (on) VIDA.desliga();
  /* no celular a mesa fica na medida (a de MESA_NO_CELULAR, ou a que o
     ajuste estiver a tirar); fora dele, volta ao desenho de sempre */
  if (celular) aplicaAjuste();
  else tiraAjuste();
}
function tiraAjuste(){
  document.querySelectorAll('#deck .mesa').forEach(m =>
    ['--px', '--py', '--zoom'].forEach(v => m.style.removeProperty(v)));
}
function aplicaAjuste(){
  /* a medida vale para a mesa de todos os slides com tabela */
  document.querySelectorAll('#deck .mesa').forEach(m => {
    m.style.setProperty('--px', AJUSTE.x.toFixed(1) + 'px');
    m.style.setProperty('--py', AJUSTE.y.toFixed(1) + 'px');
    m.style.setProperty('--zoom', AJUSTE.e.toFixed(3));
  });
  const o = document.querySelector('#ajuste output');
  if (o) o.textContent = 'x ' + Math.round(AJUSTE.x) + ' · y ' + Math.round(AJUSTE.y) +
                         ' · escala ' + AJUSTE.e.toFixed(2);
}

/* O GESTO. No começo de cada gesto (e sempre que um dedo entra ou sai)
   guarda-se onde a mesa estava e o ponto da mesa que está debaixo do meio
   dos dedos; a cada passo, a mesa é posta de modo que esse mesmo ponto
   continue debaixo do meio dos dedos, no tamanho que a pinça pede. Com um
   dedo só, isso é arrastar. */
function comecaGesto(){
  const d = [...AJUSTE.dedos.values()];
  const m0 = noPalco(meioDosDedos(d));
  AJUSTE.ini = { x:AJUSTE.x, y:AJUSTE.y, e:AJUSTE.e, dist:distDosDedos(d),
                 p:{ x:(m0.x - 640 - AJUSTE.x) / AJUSTE.e, y:(m0.y - 360 - AJUSTE.y) / AJUSTE.e } };
}
function dedoDesce(ev){
  if (!AJUSTE.ligado) return;
  ev.preventDefault();
  try { slides[1].setPointerCapture(ev.pointerId); } catch(_){}
  AJUSTE.dedos.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  comecaGesto();
}
function dedoAnda(ev){
  if (!AJUSTE.ligado || !AJUSTE.dedos.has(ev.pointerId)) return;
  AJUSTE.dedos.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  const d = [...AJUSTE.dedos.values()], i = AJUSTE.ini;
  const e = (d.length > 1 && i.dist > 0) ? limitaEscala(i.e * distDosDedos(d) / i.dist) : i.e;
  const m = noPalco(meioDosDedos(d));
  AJUSTE.e = e;
  AJUSTE.x = m.x - 640 - e * i.p.x;
  AJUSTE.y = m.y - 360 - e * i.p.y;
  aplicaAjuste();
}
function dedoSobe(ev){
  if (!AJUSTE.dedos.has(ev.pointerId)) return;
  AJUSTE.dedos.delete(ev.pointerId);
  /* o dedo que fica continua o arrasto, sem salto */
  if (AJUSTE.dedos.size) comecaGesto();
}
/* a roda do rato: cresce e encolhe em volta do ponteiro */
function rodaAjuste(ev){
  if (!AJUSTE.ligado) return;
  ev.preventDefault();
  const m = noPalco({ x:ev.clientX, y:ev.clientY });
  const p = { x:(m.x - 640 - AJUSTE.x) / AJUSTE.e, y:(m.y - 360 - AJUSTE.y) / AJUSTE.e };
  AJUSTE.e = limitaEscala(AJUSTE.e * Math.exp(-ev.deltaY * 0.0015));
  AJUSTE.x = m.x - 640 - AJUSTE.e * p.x;
  AJUSTE.y = m.y - 360 - AJUSTE.e * p.y;
  aplicaAjuste();
}

/* A MEDIDA PARA A CONVERSA: o deslocamento e a escala da mesa, e a tela
   em que foram medidos (com a folga dos lados, no celular) */
function textoDoAjuste(){
  const folga = parseFloat(stage.style.getPropertyValue('--folga')) || 0;
  return 'mesa: x ' + Math.round(AJUSTE.x) + ', y ' + Math.round(AJUSTE.y) +
         ', escala ' + AJUSTE.e.toFixed(3) + ' | tela ' + innerWidth + 'x' + innerHeight +
         ', palco ' + fitScale.toFixed(3) + ', folga ' + Math.round(folga);
}
async function copiaAjuste(){
  const t = textoDoAjuste();
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(_){}
  if (!ok){
    /* sem a área de transferência (alguns navegadores negam): o velho
       caminho, por um campo de texto escondido */
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove();
  }
  const p = document.getElementById('ajuste'), b = p.querySelector('.aj-copia');
  b.textContent = ok ? 'Copiado!' : 'Copie o aviso';
  p.classList.toggle('copiado', ok);
  /* e o texto aparece na tela, para conferir — ou copiar à mão */
  TP.diz(t);
  setTimeout(() => { p.classList.remove('copiado'); b.textContent = 'Copiar'; }, 1800);
}
montaAjuste();
/* a tela gira ou muda de tamanho: o celular pode deixar de o ser */
addEventListener('resize', ajusteNoSlide);

addEventListener('keydown', ev => {
  const k = ev.key;
  /* com o pop-up do nome aberto, o teclado é da escrita; o Esc segue sem nome */
  if (NOME.aberto()){
    if (k === 'Escape'){ NOME.segue(); ev.preventDefault(); }
    return;
  }
  /* no carrossel da questão 04 em diante, as setas são dele */
  if (ev.target && ev.target.closest && ev.target.closest('.rd-roda')) return;
  /* escrevendo um texto, o teclado é da escrita; o Esc termina */
  if (EDICAO.el){
    if (k === 'Escape'){ EDICAO.termina(); ev.preventDefault(); }
    return;
  }
  /* com o carrossel dos slides aberto, o teclado é só dele */
  if (CAR.aberto){
    if (k === 'ArrowRight') CAR.vai(CAR.sel + 1);
    else if (k === 'ArrowLeft') CAR.vai(CAR.sel - 1);
    else if (k === 'Enter' || k === ' ') CAR.entra(CAR.sel);
    else if (k === 'Escape') CAR.fecha();
    else return;
    ev.preventDefault();
    return;
  }
  /* a gaveta aberta fecha com o Esc antes de tudo o resto */
  if (navAberta() && k === 'Escape'){ fechaNav(); ev.preventDefault(); return; }
  if (memAberto && k === 'Escape'){ fechaMemoria(); ev.preventDefault(); return; }
  /* o menu do endereço aberto fecha com o Esc antes de tudo o resto */
  if (!menuEmail.hidden && k === 'Escape'){ fechaMenuEmail(); ev.preventDefault(); return; }
  /* ---- a montagem ---- */
  if ((ev.ctrlKey || ev.metaKey) && (k === 'c' || k === 'C')){
    /* com a folha aberta, o Ctrl+C é o do navegador: o texto já está
       selecionado ali dentro à espera dele */
    if (!coordsCx.hidden) return;
    if (naMontagem()){ copiaCoords(); ev.preventDefault(); }
    return;
  }
  if (k === 'Escape' && !coordsCx.hidden){ coordsCx.hidden = true; ev.preventDefault(); return; }
  if (k === 'g' || k === 'G'){ modoMontagem(); ev.preventDefault(); return; }
  if (naMontagem() && (k === 'r' || k === 'R')){ refazLayout(); ev.preventDefault(); return; }
  /* com a visão geral aberta, o teclado é só dela: as setas não podem
     trocar o slide por baixo de quem está a escolher um */
  if (!overview.hidden){
    if (k === 'Escape' || k === 'o' || k === 'O'){ mostraOverview(false); ev.preventDefault(); }
    return;
  }
  if (k === 'o' || k === 'O'){ mostraOverview(true); ev.preventDefault(); return; }
  if ((k === 'n' || k === 'N') && atual >= 1 && !naMontagem()){ alternaNav(); ev.preventDefault(); return; }
  if (k === 'ArrowRight' || k === 'PageDown'){ go(atual+1); ev.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ go(atual-1); ev.preventDefault(); }
  else if (k === ' '){ tocaOuPara(); ev.preventDefault(); }
  else if (k === 'Home'){ go(0); }
  else if (k === 'End'){ go(SLIDES.length-1); }
  else if (k === 'f' || k === 'F'){ telaCheia(); }
  else if (k >= '1' && k <= '9'){ go(+k - 1); }
});

/* ------------------------------------------------------------
   A ABERTURA
   ------------------------------------------------------------ */
slides[0].classList.add('is-active');
SLIDES_COM_MESA.forEach(i => montaTabela(i));
montaBlocosDaCapa();
montaFrases();
montaDigitacaoDaCapa();
montaCenaDoSlide1();
montaCenaDoSlide3();
atualizaCabecalho();
/* a capa vai para o lugar que ficou arrumado à mão */
aplicaLayout(0);
/* e vai outra vez quando as fontes chegarem: a medida de um texto é a
   medida da letra dele, e até a fonte de casa carregar quem está na
   tela é a do sistema, que tem outra largura */
if (document.fonts && document.fonts.ready)
  /* (só se ainda se está na capa: aberto direto noutro slide, o play e a
     tabelinha, que moram no palco, iam parar ao lugar que têm na capa) */
  document.fonts.ready.then(() => { desprende(slides[0]); if (atual === 0) aplicaLayout(0); else arrumaPecasDoPalco(); });
animaCapa();
vidaDosBlocos();
carregaTrilha('capa');

/* ============================================================
   CONTINUAR DE ONDE PAROU
   A cada segundo, e ao sair do app, guarda-se no aparelho onde a aula
   está: o slide, a narração e o segundo dela, o elemento escolhido, o
   quiz (as perguntas, em qual está, acertos e erros, o cartão da nota),
   o jogo da memória (a ordem das cartas e os pares feitos). Ao abrir, a
   aula volta para lá, com a narração parada naquele segundo à espera do
   play — tudo o que anima é função do tempo dela, e a mesa aparece como
   estava. A capa recomeça sempre do zero (é curta).
   ============================================================ */
const ONDE = {
  CHAVE: 'tabela-aluno-onde',
  restaurando: false,
  foto(){
    if (naMontagem() || andando) return null;
    const t = som.currentTime || 0;
    const o = { v:1, slide:atual, trilha:trilhaAtual, t:+t.toFixed(2),
                fim: som.ended || (!!som.duration && t >= som.duration - 0.05) };
    /* a capa (e a demonstração dela, que passa pelo slide 1) recomeça */
    if (trilhaAtual === 'capa' || atual === 0) return { v:1, slide:0 };
    if (SEQ.eleito) o.z = +SEQ.eleito.dataset.z;
    if (QUIZ.aberto) o.quiz = { origem:QUIZ.origem, itens:QUIZ.itens.map(i => i.z), passo:QUIZ.passo,
                                acertos:QUIZ.acertos, erros:QUIZ.erros, nota:!!QUIZ.mostrandoNota };
    if (QUIZ3.aberto) o.quiz3 = true;
    if (memAberto) o.jogo = { ordem:memCartas.map(c => c.dataset.z + ':' + c.dataset.tipo),
                              casadas:[...new Set(memCartas.filter(c => c.classList.contains('casada')).map(c => +c.dataset.z))],
                              pontos:memPontos, erros:memErros, ultimoG:memUltimoG };
    return o;
  },
  guarda(){
    if (this.restaurando) return;
    const o = this.foto();
    if (o) try { localStorage.setItem(this.CHAVE, JSON.stringify(o)); } catch (_) {}
  },
  le(){ try { return JSON.parse(localStorage.getItem(this.CHAVE) || 'null'); } catch (_) { return null; } },

  /* volta para onde a aula estava; false se não havia nada a que voltar */
  restaura(o){
    if (!o || o.v !== 1 || !o.slide || !SLIDES[o.slide] || !TRILHAS[o.trilha]) return false;
    this.restaurando = true;
    let tr = o.trilha, t = o.t || 0, fim = !!o.fim;
    /* a meio do encaixe do slide 3 o estado é do toque do aluno, e não do
       tempo: volta-se ao fim da "2", à espera do toque que o recomeça */
    if (o.slide === 2 && (tr === '2.1' || tr === '2.2')){ tr = '2'; t = 1e4; fim = true; }
    /* calado: a abertura do capítulo não toca por cima da volta */
    ABERTURA_SUSPENSA = true;
    vaiDireto(o.slide);
    ABERTURA_SUSPENSA = false;
    pousaTabela();
    SEQ.comecou = true;
    VIDA.desliga();
    if (o.z) SEQ.eleito = TP.todos().find(c => +c.dataset.z === o.z) || null;
    /* o escolhido, na "1.2", está lá em cima, crescido — já, sem viagem e
       sem pousar, para os nomes dele serem medidos com ele no lugar (o voo
       dele não é função do tempo; na "1.3A/B" a volta já é) */
    const c = SEQ.eleito;
    if (c && tr === '1.2'){
      c.classList.remove('pousando');
      c.classList.add('eleito');
      c.style.transition = 'none';
      c.style.left = ((xDaColuna(8) + xDaColuna(9))/2).toFixed(1) + 'px';
      c.style.top  = yDaLinha(2).toFixed(1) + 'px';
      c.style.setProperty('--onda', '2.8');
      void c.offsetWidth;
      c.style.transition = 'transform 110ms ease-out';
      delete c._marcas;
    }
    /* o quiz guardado é o que volta: a hora do quiz no relógio não abre outro */
    if (o.quiz) SEQ.quizDa = o.quiz.origem;
    /* o slide 3: a tabela montada como a narração em que se está a deixa */
    if (o.slide === 2){
      semTransicaoUmInstante();
      if (tr === '2.3' || tr === '2.4') TP.todos().filter(c => +c.dataset.z <= ENCAIXE.sozinhoAte).forEach(poeNoLugarJa);
      if (tr === '2.5' || tr === '2.5A'){ TP.todos().forEach(poeNoLugarJa); FINAL.feito = true; if (tr === '2.5A') LC25.liga(); }
    }
    trilhaAtual = -1;
    carregaTrilha(tr);
    TEMPO_FORCADO = { id:tr, t };
    const vai = () => {
      if (trilhaAtual !== tr){ this.restaurando = false; return; }
      som.currentTime = Math.min(t, som.duration || t);
      if (o.quiz) QUIZ.retoma(o.quiz);
      else if (o.jogo) this.jogo(o.jogo);
      else if (o.quiz3){ viraQuiz(true); QUIZ3.abre(); }
      /* acabada a narração, o que vinha a seguir (o véu à espera do toque,
         a escolha de um elemento, o botão do jogo…) */
      else if (fim) SEQ.acabou(tr);
      this.restaurando = false;
    };
    if (som.readyState >= 1) vai(); else som.addEventListener('loadedmetadata', vai, { once:true });
    som.addEventListener('error', () => { this.restaurando = false; }, { once:true });
    return true;
  },
  /* o jogo da memória com as mesmas cartas, os mesmos pares feitos */
  jogo(j){
    viraJogo(true);
    abreMemoria(j.ordem);
    if (!memAberto) return;
    memCartas.forEach(c => { if (j.casadas.includes(+c.dataset.z)) c.classList.add('casada'); });
    memPares = j.casadas.length; memPontos = j.pontos || 0; memErros = j.erros || 0; memUltimoG = j.ultimoG ?? null;
    placarMemoria();
    if (memPares === MEM_PARES.length) fimDaMemoria();
  }
};
setInterval(() => ONDE.guarda(), 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) ONDE.guarda(); });
addEventListener('pagehide', () => ONDE.guarda());

/* ao abrir: onde a aula parou; sem nada guardado, a capa. As fotos do
   carrossel (?miniaturas) começam sempre na capa, sem nada guardado. */
if (!/miniaturas/.test(location.search)) ONDE.restaura(ONDE.le());

/* ============================================================
   O BOTÃO INSTALAR — na capa, no canto de cima à direita.
   No Chrome e no Edge (computador, Chromebook, celular e tablet Android)
   é o convite do próprio navegador (beforeinstallprompt), guardado e
   mostrado quando o botão é tocado. No iPhone e no iPad, que não têm esse
   convite, o botão mostra como se faz: Compartilhar → Adicionar à Tela
   de Início. Aberto já como app instalado — ou num navegador sem
   nenhuma das duas saídas —, o botão não aparece; instalado, some.
   ============================================================ */
const INSTALA = { convite:null };
function jaInstalado(){
  return ['standalone', 'fullscreen', 'minimal-ui'].some(m => matchMedia('(display-mode: ' + m + ')').matches) ||
         navigator.standalone === true;
}
function ehIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   /* o iPad que se diz Mac */
}
const ICONE_BAIXAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
const ICONE_PARTILHAR = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/>' +
  '<path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function montaInstalar(){
  const sl = slides[0];
  if (!sl || sl.querySelector('.instalar')) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'instalar';
  b.hidden = true;
  b.innerHTML = ICONE_BAIXAR + '<span>Instalar app</span>';
  const ajuda = document.createElement('div');
  ajuda.className = 'instalar-ajuda';
  ajuda.hidden = true;
  ajuda.innerHTML = '<b>No iPhone e no iPad:</b> toque em ' + ICONE_PARTILHAR + ' <b>Compartilhar</b>' +
                    ' e depois em <b>Adicionar à Tela de Início</b>.';
  b.addEventListener('click', async ev => {
    ev.stopPropagation();
    if (naMontagem()) return;
    const c = INSTALA.convite;
    if (c){
      /* o convite do navegador só pode ser usado uma vez */
      INSTALA.convite = null;
      try { await c.prompt(); await c.userChoice; } catch(_){}
      mostraInstalar();
    } else if (ehIOS()) ajuda.hidden = !ajuda.hidden;
  });
  /* a ajuda fecha com qualquer toque fora dela */
  document.addEventListener('click', ev => {
    if (!ajuda.hidden && !(ev.target.closest && ev.target.closest('.instalar, .instalar-ajuda'))) ajuda.hidden = true;
  });
  sl.appendChild(b);
  sl.appendChild(ajuda);
  mostraInstalar();
}
function mostraInstalar(){
  const b = slides[0] && slides[0].querySelector('.instalar');
  if (!b) return;
  b.hidden = jaInstalado() || !(INSTALA.convite || ehIOS());
  if (b.hidden){ const a = slides[0].querySelector('.instalar-ajuda'); if (a) a.hidden = true; }
}
window.addEventListener('beforeinstallprompt', ev => {
  /* o convite fica guardado para o botão (e a barrinha do navegador não
     aparece por cima da capa) */
  ev.preventDefault();
  INSTALA.convite = ev;
  mostraInstalar();
});
window.addEventListener('appinstalled', () => { INSTALA.convite = null; mostraInstalar(); });
montaInstalar();

/* o serviço que guarda a aula no aparelho */
/* o selo da versão, no canto */
document.getElementById('versao').textContent = VERSAO;
if ('serviceWorker' in navigator)
  addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(VERSAO)).catch(() => {}));
</script>
