/* ---- o que o tempo da narração desenha, a cada tique ---- */
/* O RELÓGIO DOS EVENTOS — o segundo em que a narração está. Chegando por
   um atalho da navegação rápida a meio de uma trilha, o áudio ainda não
   carregou e diz 0: até ele saltar para o segundo pedido, vale esse
   segundo (TEMPO_FORCADO), e a mesa já aparece como deve estar ali. */
var TEMPO_FORCADO = null;
function tempoDaNarracao(){
  const t = som.currentTime || 0, f = TEMPO_FORCADO;
  if (!f) return t;
  if (f.id !== trilhaAtual || t >= f.t - 0.05){ TEMPO_FORCADO = null; return t; }
  return f.t;
}
function efeitosDoTempo(){
  const t = tempoDaNarracao();
  /* TELA ESCURA, BOTÃO FORA. Decide-se antes de qualquer outra coisa, e
     para todos os slides: saindo do slide 1 com a tela escura, o botão
     tem de voltar — e o resto desta função nem corre fora do slide 1. */
  stage.classList.toggle('tela-escura', atual === 1 && trilhaAtual === '1' && t >= 13.6);
  if (trilhaAtual === 'capa' && DIG_CAPA) DIG_CAPA.escreve(t);
  /* o slide 3 tem os eventos dele */
  if (atual === 2){ efeitos2(t); return; }
  /* o slide 4 tem os eventos dele (a narração "3") */
  if (atual === 3){ efeitos3(t); return; }
  if (atual !== 1 || !veu) return;

  /* a tela escura é da trilha "1", dos 13,6 s em diante — e continua
     depois de ela acabar, até o toque. Mudada a trilha, esmaece. */
  veu.classList.toggle('on', trilhaAtual === '1' && t >= 13.6);
  if (trilhaAtual === '1'){
    ondaDasFamilias(t);
    DIG_VEU.escreve(t);
  }
  if (trilhaAtual === '1.1'){
    ondaDos118(t);
    verdeAoAcaso(t);
  }
  /* saída a "1.1", nenhum verde fica aceso para trás */
  else if (VERDE.z > 0) verdeAoAcaso(-1);
  if (trilhaAtual === '1.2') efeitos12(t);
  if (trilhaAtual === '1.3A' || trilhaAtual === '1.3B') efeitos13(t);
  if (trilhaAtual === '1.3A') efeitos13A(t);
  if (trilhaAtual === '1.3B') efeitos13B(t);
  if (trilhaAtual === '1.4')  efeitos14(t);
  quizNaHora(t);
}

/* A ONDA DAS FAMÍLIAS — de 2,6 a 4,8 s: cada coluna sobe e desce, uma
   depois da outra, da esquerda para a direita. A altura de cada coluna
   é um seno do tempo: sobe, chega ao alto no meio, e desce. */
const ONDA_FAM = { de:2.6, ate:4.8, dura:0.6, alto:26, suja:false };
function ondaDasFamilias(t){
  const o = ONDA_FAM;
  const dentro = t >= o.de && t <= o.ate + 0.1;
  if (!dentro && !o.suja) return;          /* fora dela, e já arrumada */
  const passo = (o.ate - o.de - o.dura) / 17;
  TP.todos().forEach(c => {
    if (!dentro){
      c.style.removeProperty('--sobe'); c.style.removeProperty('--tsobe');
      c.classList.remove('sobe');
      return;
    }
    const p = (t - o.de - (+c.dataset.col - 1)*passo) / o.dura;
    const h = (p > 0 && p < 1) ? Math.sin(Math.PI*p) * o.alto : 0;
    /* a transição curta segue o tique sem o atrasar */
    c.style.setProperty('--tsobe', '90ms');
    c.style.setProperty('--sobe', (-h).toFixed(1) + 'px');
    c.classList.toggle('sobe', h > .5);
  });
  o.suja = dentro;
}

/* A ONDA DOS 118 — de 5,1 a 7 s: cada elemento cresce e pisca, e a onda
   atravessa a tabela da esquerda para a direita, com uma pequena
   descida em cada coluna, de cima para baixo. */
const ONDA_118 = { de:5.1, ate:7.0, dura:0.5, cresce:0.45, brilho:0.75, suja:false };
function ondaDos118(t){
  const o = ONDA_118;
  const dentro = t >= o.de && t <= o.ate + 0.1;
  if (!dentro && !o.suja) return;
  const passo = (o.ate - o.de - o.dura - 8*0.02) / 17;
  TP.todos().forEach(c => {
    if (!dentro){
      c.style.removeProperty('--onda'); c.style.removeProperty('--tsobe');
      c.style.removeProperty('filter'); c.classList.remove('sobe');
      return;
    }
    const atraso = (+c.dataset.col - 1)*passo + (+c.dataset.linha - 1)*0.02;
    const p = (t - o.de - atraso) / o.dura;
    const k = (p > 0 && p < 1) ? Math.sin(Math.PI*p) : 0;
    c.style.setProperty('--tsobe', '90ms');
    c.style.setProperty('--onda', (1 + o.cresce*k).toFixed(3));
    if (k > 0) c.style.filter = 'brightness(' + (1 + o.brilho*k).toFixed(3) + ')';
    else c.style.removeProperty('filter');
    c.classList.toggle('sobe', k > .05);
  });
  o.suja = dentro;
}

/* O VERDE AO ACASO — dos 8 s até o fim da "1.1": um elemento de cada
   vez cresce e acende de verde, e o anterior volta ao normal. A ordem é
   um baralho fixo dos 118, para o mesmo segundo dar sempre o mesmo
   elemento: voltar o áudio atrás mostra outra vez os mesmos. */
const VERDE = { de:8.0, cada:0.75, z:-1 };
const ORDEM_VERDE = (() => {
  let s = 118;
  const r = () => (s = (s*1664525 + 1013904223) % 4294967296) / 4294967296;
  const a = Array.from({length:118}, (_,i) => i+1);
  for (let i = a.length-1; i > 0; i--){ const j = (r()*(i+1))|0; [a[i], a[j]] = [a[j], a[i]]; }
  return a.filter(z => SERIES_VISIVEIS || !ehDaSerie(z));
})();
function verdeAoAcaso(t){
  /* e nunca depois da escolha: entre o toque e a trilha seguinte o
     segundo do áudio ainda cai dentro do sorteio, e ele reacendia um
     verde por baixo do voo do eleito */
  const ativo = t >= VERDE.de && !som.ended && !SEQ.escolhendo && !SEQ.eleito;
  const z = ativo ? ORDEM_VERDE[Math.floor((t - VERDE.de) / VERDE.cada) % ORDEM_VERDE.length] : 0;
  if (z === VERDE.z) return;               /* só mexe quando troca */
  VERDE.z = z;
  TP.todos().forEach(c => c.classList.toggle('verde', +c.dataset.z === z));
}

/* O ELEITO NA "1.2" — o número atômico e a massa, cada um na sua vez.
     1,0 s        o card dá uma pulsada
     2,9 → 3,8 s  o número cresce, e "Número atômico" aparece a brilhar
     3,8 → 7,3 s  a massa cresce e "Massa atômica" escreve-se a brilhar;
                  o número volta, e o nome dele fica, sem brilho
     9 → 14 s     o número outra vez, e o nome dele volta a brilhar
     15,7 s →     e outra vez, até o fim
   Os dois nomes, uma vez escritos, ficam. */
const FOCO12 = {
  pulso:{ de:1.0, dura:0.55, mais:0.14 },
  num:  [[2.9, 3.8], [9.0, 14.0], [15.7, Infinity]],
  massa:[[3.8, 7.3]],
  escreveMassa:{ de:3.8, ate:4.5, txt:'Massa atômica' }
};
const dentroDe = (t, faixas) => faixas.some(([a,b]) => t >= a && t < b);

/* onde estão o número e a massa no card pousado, em px do palco. Mede-se
   no próprio card, e não por conta: o aluno pode ter escolhido qualquer
   um dos 118, e o nome comprido de uns muda a altura da massa. Mede-se
   com os dois em repouso, para a medida não sair de um número crescido. */
function medeMarcas(c){
  c.classList.add('medindo');
  const tinha = [c.classList.contains('foco-num'), c.classList.contains('foco-massa')];
  c.classList.remove('foco-num','foco-massa');
  const rs = stage.getBoundingClientRect();
  const f1 = c.querySelector('.f1');
  const px = r => ({ x:(r.left-rs.left)/fitScale, y:(r.top-rs.top)/fitScale,
                     w:r.width/fitScale, h:r.height/fitScale });
  const rc = px(c.getBoundingClientRect());
  const ri = px(f1.querySelector('i').getBoundingClientRect());
  const ru = px(f1.querySelector('u').getBoundingClientRect());
  c.classList.toggle('foco-num', tinha[0]);
  c.classList.toggle('foco-massa', tinha[1]);
  void c.offsetWidth;
  c.classList.remove('medindo');
  /* o número cresce 1,75× a partir do canto de cima: o meio dele,
     crescido, fica a 1,75/2 da altura dele abaixo do topo */
  c._marcas = { esq: rc.x - 18, yNum: ri.y + ri.h*1.75/2, yMassa: ru.y + ru.h/2 };
}

function efeitos12(t){
  const c = SEQ.eleito;
  if (!c || !rotNum) return;
  if (!c._marcas){
    medeMarcas(c);
    rotNum.style.left   = rotMassa.style.left = c._marcas.esq.toFixed(1) + 'px';
    rotNum.style.top    = c._marcas.yNum.toFixed(1)   + 'px';
    rotMassa.style.top  = c._marcas.yMassa.toFixed(1) + 'px';
  }
  /* a pulsada: um seno curto por cima do tamanho de pousado */
  const o = FOCO12.pulso, p = (t - o.de) / o.dura;
  const k = (p > 0 && p < 1) ? Math.sin(Math.PI*p) : 0;
  c.style.setProperty('--onda', (2.8 * (1 + o.mais*k)).toFixed(3));
  c.classList.toggle('pulsa', k > .05);

  const numG = dentroDe(t, FOCO12.num), massaG = dentroDe(t, FOCO12.massa);
  c.classList.toggle('foco-num', numG);
  c.classList.toggle('foco-massa', massaG);

  rotNum.classList.toggle('on', t >= FOCO12.num[0][0]);
  rotNum.classList.toggle('brilha', numG);

  const e = FOCO12.escreveMassa;
  const n = t < e.de ? 0 : Math.round(Math.min(1, (t - e.de)/(e.ate - e.de)) * e.txt.length);
  if (massaTxt.textContent.length !== n) massaTxt.textContent = e.txt.slice(0, n);
  rotMassa.classList.toggle('on', n > 0);
  rotMassa.classList.toggle('brilha', massaG);
}

/* A VOLTA PARA CASA — na "1.3A" aos 11,7 s, na "1.3B" aos 12 s.
   É a ida vista ao contrário. A ida sai depressa e chega devagar; a
   volta, portanto, sai devagar e chega depressa: a fração do caminho
   feita é p³. Posição, tamanho e giro seguem a mesma curva, e tudo é
   função do tempo — pausar congela o voo, voltar o áudio atrás
   devolve o elemento ao alto. */
const VOLTA13 = { '1.3A':11.7, '1.3B':10.5, dura:1.4 };

/* ============================================================
   OS EVENTOS DA "1.3A" — os símbolos de uma letra e os de duas
     1,2 s        o símbolo dentro do card do escolhido pulsa duas vezes
     8,7 → 13 s   oito de duas letras crescem, um a um, com luz âmbar
     16 → 23 s    oito elementos cujo nome em português COMEÇA PELO
                  SÍMBOLO crescem, um a um (luz marrom)
     24,9 s       o F gira e cresce no lugar; 26 s o nome dele pulsa 2×;
                  27 s volta, com a animação ao contrário
     29,2 s       o mesmo com o Ca; 31 s pulsa o nome; 33 s volta
     33,8 s       o mesmo com o O;  35,7 s pulsa o nome; 38 s volta
   Tudo é função do tempo da narração: pausar congela, voltar desfaz.
   ============================================================ */
const EV13A = {
  pulsoSimbolo:{ de:1.2, dura:0.9, mais:0.32 },
  duasLetras:  { de:8.7,  ate:13.0, largura:0.8, cresce:0.55, classe:'luz-onda',   suja:false },
  /* os oito da onda âmbar: de duas letras, espalhados pela tabela, e
     nenhum repetido da onda marrom que vem logo a seguir */
  duas:['He','Li','Mg','Si','Zn','Br','Ag','Pt'],
  iniciais:    { de:16.0, ate:23.0, largura:1.0, cresce:0.6,  classe:'luz-marrom', suja:false },
  /* os oito da onda marrom: nome a começar pelo símbolo, de uma e de duas
     letras (esta é a trilha dos de uma letra), espalhados da linha 1 à 6.
     F, Ca e O ficam de fora — são eles que aparecem logo a seguir. */
  oito:['H','C','N','Al','Cl','Fe','I','Ba'],
  zooms: [
    { sym:'F',  cresce:24.9, pulsa:26.0, volta:27.0, suja:false },
    { sym:'Ca', cresce:29.2, pulsa:31.0, volta:33.0, suja:false },
    { sym:'O',  cresce:33.8, pulsa:35.7, volta:38.0, suja:false }
  ],
  durZoom:1.0, escalaZoom:2.6, pulsoNome:{ dura:0.9, mais:0.38 }
};

/* as duas listas das ondas, feitas uma vez, na ordem do número atômico */
let LISTA_DUAS = null, LISTA_INICIAIS = null;
function listasDas13A(){
  if (LISTA_DUAS) return;
  /* só oito, um de cada vez: todos os de duas letras eram demais */
  LISTA_DUAS     = EV13A.duas.map(s => TP.cubo(s)).filter(Boolean);
  /* só oito, um de cada vez — todos os 53 eram demais para sete segundos */
  LISTA_INICIAIS = EV13A.oito.map(s => TP.cubo(s)).filter(Boolean);
}

/* duas pulsadas num intervalo: o módulo de um seno de volta inteira */
const duasPulsadas = (t, de, dura) => {
  const q = (t - de) / dura;
  return (q > 0 && q < 1) ? Math.abs(Math.sin(2*Math.PI*q)) : 0;
};

/* UMA ONDA DE UM EM UM: cada elemento da lista cresce e volta, um logo
   depois do outro, e o último acaba exatamente no fim da janela */
function ondaDeUmEmUm(t, o, lista){
  const dentro = t >= o.de - 0.05 && t <= o.ate + 0.1;
  if (!dentro && !o.suja) return;
  const passo = (o.ate - o.de - o.largura) / Math.max(1, lista.length - 1);
  lista.forEach((c, i) => {
    if (!dentro){
      c.style.removeProperty('--onda'); c.style.removeProperty('--tsobe');
      c.classList.remove('sobe', o.classe);
      return;
    }
    const p = (t - o.de - i*passo) / o.largura;
    const k = (p > 0 && p < 1) ? Math.sin(Math.PI*p) : 0;
    c.style.setProperty('--tsobe', '90ms');
    c.style.setProperty('--onda', (1 + o.cresce*k).toFixed(3));
    c.classList.toggle('sobe', k > .05);
    c.classList.toggle(o.classe, k > .2);
  });
  o.suja = dentro;
}

/* O ZOOM NO LUGAR: gira e cresce ao mesmo tempo; o nome pulsa duas vezes;
   e volta com a animação ao contrário. A ida sai depressa e chega devagar
   (1-(1-p)³); a volta é ela vista de trás para a frente (1-p³): sai
   devagar e chega depressa, a desenrolar o giro. */
function zoomNoLugar(t, o){
  const c = TP.cubo(o.sym);
  if (!c) return;
  const D = EV13A.durZoom, E = EV13A.escalaZoom;
  const ativo = t >= o.cresce && t < o.volta + D;
  if (!ativo && !o.suja) return;
  const cubo = c.querySelector('.cubo');
  if (!ativo){
    c.classList.remove('zoom-el', 'sobe', 'pulsa-nome', 'nome-oculto');
    c.style.left = alvoDe(+c.dataset.z).x.toFixed(1) + 'px';
    if (o.pulsaSym){ c.classList.remove('pulsa-sym'); c.style.removeProperty('--psym'); }
    if (o._latim) o._latim.classList.remove('on');
    ['--onda', '--tsobe', '--pnome'].forEach(v => c.style.removeProperty(v));
    cubo.style.setProperty('--ry', '0deg');
    c.dataset.ry = 0;
    o.suja = false;
    return;
  }
  let e;
  if (t < o.cresce + D)  e = 1 - Math.pow(1 - (t - o.cresce)/D, 3);
  else if (t < o.volta)  e = 1;
  else                   e = 1 - Math.pow((t - o.volta)/D, 3);
  c.classList.add('zoom-el', 'sobe');
  /* crescido, não passa das bordas do palco: empurra-se para dentro na
     mesma medida em que cresce */
  const casa = alvoDe(+c.dataset.z), meia = LADO*(1 + (E - 1)*e)/2 + 14;
  const dx = Math.max(0, meia - casa.x) - Math.max(0, casa.x + meia - 1280);
  c.style.left = (casa.x + dx).toFixed(1) + 'px';
  /* com 'esconde', o nome some quando o elemento sai, e volta na hora
     em que pulsa */
  c.classList.toggle('nome-oculto', !!o.esconde && t < [].concat(o.pulsa)[0]);
  c.style.setProperty('--tsobe', '90ms');
  c.style.setProperty('--onda', (1 + (E - 1)*e).toFixed(3));
  cubo.style.setProperty('--dur', '90ms');
  cubo.style.setProperty('--rzc', '0deg');
  cubo.style.setProperty('--ry', (360*e).toFixed(1) + 'deg');
  c.dataset.ry = 360*e;
  /* o nome pulsa 2× em cada hora de 'pulsa' (uma ou várias) */
  const k = Math.max(...[].concat(o.pulsa).map(p => duasPulsadas(t, p, EV13A.pulsoNome.dura)));
  c.classList.toggle('pulsa-nome', k > .01);
  c.style.setProperty('--pnome', (1 + EV13A.pulsoNome.mais*k).toFixed(3));
  /* e o símbolo, 2× em cada hora de 'pulsaSym' */
  if (o.pulsaSym){
    const ps = EV13A.pulsoSimbolo;
    const ks = Math.max(...o.pulsaSym.map(p => duasPulsadas(t, p, ps.dura)));
    c.classList.toggle('pulsa-sym', ks > .01);
    c.style.setProperty('--psym', (1 + ps.mais*ks).toFixed(3));
  }
  if (o.latim) caixaDoLatim(o, t, casa.x + dx, casa.y, meia - 14, e);
  o.suja = true;
}

/* A PALAVRA LATINA ao lado do elemento crescido: escrita letra a letra a
   partir de 'de', encostada ao lado dele ('direita' ou 'esquerda'). Na
   volta do elemento ela sai a girar e a encolher até sumir, na mesma
   curva do giro de volta dele — e, encostada a ele, acompanha-o enquanto
   ele encolhe. Tudo função do tempo: voltar o áudio atrás des-escreve. */
function caixaDoLatim(o, t, x, y, meiaCubo, e){
  const L = o.latim;
  let b = o._latim;
  if (!b){
    b = document.createElement('div');
    b.className = 'latim';
    b.setAttribute('aria-hidden', 'true');
    slides[1].querySelector('.mesa').appendChild(b);
    o._latim = b;
  }
  const visivel = t >= L.de;
  b.classList.toggle('on', visivel);
  if (!visivel) return;
  const n = Math.min(L.texto.length, Math.floor((t - L.de) / EV14.porLetra) + 1);
  const txt = L.texto.slice(0, n);
  if (b.textContent !== txt) b.textContent = txt;
  b.classList.toggle('digitando', n < L.texto.length);
  /* na volta, 'e' desce de 1 a 0: a caixa gira uma volta e encolhe */
  const g = t >= o.volta ? e : 1;
  const vao = 18, direita = L.lado === 'direita';
  b.style.left = (direita ? x + meiaCubo + vao : x - meiaCubo - vao).toFixed(1) + 'px';
  b.style.top  = y.toFixed(1) + 'px';
  b.style.transform = (direita ? 'translate(0,-50%)' : 'translate(-100%,-50%)') +
    ' rotate(' + (360*(1 - g)).toFixed(1) + 'deg) scale(' + g.toFixed(3) + ')';
  b.style.opacity = g.toFixed(3);
}

/* ============================================================
   OS EVENTOS DA "1.3B" — o escolhido tem símbolo de duas letras
     1 s          o símbolo do card do escolhido pulsa duas vezes
     5,4 s        só a SEGUNDA letra dele pulsa duas vezes
     9 s          o símbolo todo pulsa uma vez
     10,5 s       o escolhido volta para casa (em efeitos13)
     13 → 20 s    oito elementos cujo nome começa pelo símbolo crescem,
                  um a um, com luz marrom
     21,7 s       o F gira e cresce; 22,8 s o nome pulsa 2×; 24 s volta
     25,6 s       o Ca gira e cresce; 27 s o nome pulsa 2×; 28 s volta
     28 s         e o O gira e cresce; 29 s o nome pulsa 2×; 32 s volta
   ============================================================ */
const EV13B = {
  pulsosSimbolo:[ { de:1.0, dura:0.9,  vezes:2, mais:0.32 },
                  { de:9.0, dura:0.55, vezes:1, mais:0.34 } ],
  pulsoSegunda:   { de:5.4, dura:0.9,  vezes:2, mais:0.6 },
  /* os oito da onda marrom: todos de duas letras, porque esta é a trilha
     dos símbolos de duas letras, e espalhados pela tabela. F, Ca e O ficam
     de fora — são eles que aparecem logo a seguir, um de cada vez. */
  oito:['He','Li','Ne','Al','Cl','Fe','Ni','Ba'],
  iniciais:{ de:13.0, ate:20.0, largura:1.0, cresce:0.6, classe:'luz-marrom', suja:false },
  zooms:[
    { sym:'F',  cresce:21.7, pulsa:22.8, volta:24.0, suja:false },
    { sym:'Ca', cresce:25.6, pulsa:27.0, volta:28.0, suja:false },
    { sym:'O',  cresce:28.0, pulsa:29.0, volta:32.0, suja:false }
  ]
};

/* uma, duas, n pulsadas num intervalo: o módulo de um seno de n meias voltas */
const pulsadas = (t, de, dura, vezes) => {
  const q = (t - de) / dura;
  return (q > 0 && q < 1) ? Math.abs(Math.sin(vezes*Math.PI*q)) : 0;
};

/* A SEGUNDA LETRA À PARTE. O símbolo é um texto só, e um texto só não
   pulsa uma letra: no card do escolhido ele é partido em duas peças, nas
   seis faces — dentro de um invólucro, porque a face arruma o símbolo numa
   grelha, e duas peças soltas ali ficariam uma por cima da outra. */
function partilhaLetras(c){
  if (c._letras) return;
  const s = c.dataset.sym;
  c.querySelectorAll('.face b').forEach(b => {
    b.innerHTML = '<span class="sym"><span class="l1">' + s.charAt(0) + '</span>' +
                  '<span class="l2">' + s.slice(1) + '</span></span>';
  });
  c._letras = true;
}

let LISTA_OITO = null;
function efeitos13B(t){
  const c = SEQ.eleito;
  if (c){
    partilhaLetras(c);
    const k = Math.max(...EV13B.pulsosSimbolo.map(p => pulsadas(t, p.de, p.dura, p.vezes) * p.mais));
    c.classList.toggle('pulsa-sym', k > .003);
    c.style.setProperty('--psym', (1 + k).toFixed(3));
    const s2 = EV13B.pulsoSegunda, k2 = pulsadas(t, s2.de, s2.dura, s2.vezes);
    c.classList.toggle('pulsa-l2', k2 > .01);
    c.style.setProperty('--pl2', (1 + s2.mais*k2).toFixed(3));
  }
  if (!LISTA_OITO) LISTA_OITO = EV13B.oito.map(s => TP.cubo(s)).filter(Boolean);
  ondaDeUmEmUm(t, EV13B.iniciais, LISTA_OITO);
  EV13B.zooms.forEach(z => zoomNoLugar(t, z));
}

function efeitos13A(t){
  listasDas13A();
  /* o símbolo do escolhido, lá em cima, pulsa duas vezes */
  const c = SEQ.eleito;
  if (c){
    const ps = EV13A.pulsoSimbolo, k = duasPulsadas(t, ps.de, ps.dura);
    c.classList.toggle('pulsa-sym', k > .01);
    c.style.setProperty('--psym', (1 + ps.mais*k).toFixed(3));
  }
  ondaDeUmEmUm(t, EV13A.duasLetras, LISTA_DUAS);
  ondaDeUmEmUm(t, EV13A.iniciais,   LISTA_INICIAIS);
  EV13A.zooms.forEach(z => zoomNoLugar(t, z));
}
/* ============================================================
   O SLIDE 3 · OS CRITÉRIOS DE ORGANIZAÇÃO — A LEI PERIÓDICA
   Os eventos da narração "2", todos função do relógio dela:
     14 → 17,2 s  um brilho verde cobre a tabela da esquerda para a
                  direita (até 15,6 s) e volta, da direita para a esquerda
     18 s         os cards desorganizam-se pela tela, todos de uma vez,
                  com o clarão — a desordem do slide 2 do professor
     29 s         a tela escurece, e Henry Moseley entra pela borda
                  direita, com o nome e o ano (1913) embaixo
     39 s         "Critério 1", à direita
     40,2 → 44 s  o critério, escrito
     fim          o play sai e fica "Toque na tela para continuar"; o
                  toque desfaz a tela escura (em fade) e toca a "2.1"
   A desordem continua depois do toque: é dela que as narrações seguintes
   vão tirar a ordem.
   ============================================================ */
/* a vida solta da mesa acompanha a narração "2" até aqui */
const VIDA_ATE_2 = 12.0;
function vidaSegueNa2(){
  /* e no slide 4, até aos 5 s da narração "3" (efeitos3 cala-a lá) */
  if (atual === 3) return trilhaAtual === '3' && (som.currentTime || 0) < EV3.vidaAte;
  return atual === 2 && trilhaAtual === '2' && (som.currentTime || 0) < VIDA_ATE_2;
}
/* 'cauda' é quantas colunas o brilho leva a apagar-se atrás da frente */
const ONDA_VERDE = { de:14.0, meio:15.6, ate:17.2, cauda:3, suja:false };
/* A DESORDEM, um card de cada vez: 'dura' é quanto leva cada um a voar,
   'fila' o atraso de um para o seguinte — com 88 cards, 0,8 + 87 × 0,06
   ≈ 6 s ao todo: os números a acertar de ouvido. 'curva' é o quanto o
   salto se dobra (fração da distância), 'giro' a inclinação máxima, 'clarao' o clarão do professor (0:
   sem ele, que era da desordem de uma vez só). */
const DESORDEM = { de:18.0, dura:0.8, fila:0.06, curva:0.35, giro:12, clarao:0, suja:false, pousou:false };
/* as trilhas do slide 3 depois da "2": nelas a desordem já está feita */
const DEPOIS_DA_2 = ['2.1', '2.2', '2.3', '2.4', '2.5', '2.5A'];
const FRASES_CRITERIO1 = [
  { de:39.0, ate:39.8, txt:'Critério 1' },
  { de:40.2, ate:44.0, txt:'Os elementos serão organizados em linhas,\nem ordem crescente de número atômico.' }
];
/* o critério 2, na "2.3": o título já está escrito quando a tela escurece */
const FRASES_CRITERIO2 = [
  { de:0,   ate:0.01, txt:'Critério 2' },
  { de:3.6, ate:7.0,  txt:'Os elementos quimicamente semelhantes\nformarão colunas.' }
];
/* A "2.4" · AS COLUNAS, função do relógio dela:
     2,8 s        o que está montado (do 1 ao 36) abre-se em colunas —
                  um pouco menores, para caberem — e fica à frente dos
                  espalhados, sem brilho fixo
     7 → 12 s     "Nessas colunas todos são semelhantes", no vazio da
                  tabela (digitada dos 7 aos 10 s, apaga-se aos 12 s);
                  junto, um brilho verde varre uma coluna de cada vez —
                  só as que têm mais de um card: a 1, a 2 e da 13 à 18 —,
                  de cima para baixo, e não fica
     15 s         o H cresce e destaca-se, em dourado
     18,2 → 21 s  só na coluna 1: o Li, o Na e o K crescem e brilham em
                  sequência, descendo e subindo de volta
     25 s         as colunas juntam-se de novo, e o H volta ao normal
   No fim, o 37 brilha; tocado, a tabela inteira arruma-se (FINAL). */

  separa:2.8, volta:25.0, dura:1.0, vao:14, zoom:0.88,

  varre:{ de:7.0, ate:12.0, colunas:[1, 2, 13, 14, 15, 16, 17, 18] },

/* um cubo de frente, sem animação: as rotações a zero (a inclinação da
   desordem fica, que é no plano da tela) */
function deFrente(c){
  const cubo = c.querySelector('.cubo');
  clearTimeout(c._giro);
  c.classList.remove('girando');
  c.dataset.rx = 0; c.dataset.ry = 0; c.dataset.rz = 0;
  cubo.style.setProperty('--dur', '0s');
  ['--rx', '--ry', '--rzc'].forEach(v => cubo.style.setProperty(v, '0deg'));
  if (!c.classList.contains('desordem')) cubo.style.setProperty('--rz', '0deg');
}
function efeitos2(t){
  /* a mesa plana, calada a vida solta (ver o CSS de .mesa.plana) */
  const m3 = slides[2].querySelector('.mesa');
  /* e fica plana até ao fim do slide — a "2.5", os toques, o quiz: só a
     face da frente é desenhada, 88 cubos de uma face em vez de seis. O
     giro da troca do quiz é no plano da tela (o do professor). */
  const plana = DEPOIS_DA_2.includes(trilhaAtual) || (trilhaAtual === '2' && t >= VIDA_ATE_2);
  if (m3 && plana !== m3.classList.contains('plana')){
    /* entrando nela, cada cubo é posto de frente — sem se ver, porque as
       seis faces são iguais. A plana só desenha a face da frente, e um
       cubo que a vida solta deixou de lado (meia volta, um quarto)
       ficava invisível: faltava na tabela, e depois na montagem. */
    if (plana) TP.todos().forEach(c => deFrente(c));
    m3.classList.toggle('plana', plana);
  }
  /* a vida solta da mesa acompanha a narração "2" até aos 12 s, e nunca
     volta nas seguintes: no encaixe, a mesa é do aluno */
  if (VIDA.ligada && (DEPOIS_DA_2.includes(trilhaAtual) || (trilhaAtual === '2' && t >= VIDA_ATE_2))) VIDA.desliga();
  ondaVerde(t);
  desordem(t);
  colunas24(t);
  LC25.tick(t);
  cena2(t);
}

const suave = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
const entre01 = p => Math.max(0, Math.min(1, p));
/* um card sai do estado das colunas: tamanho, brilho, escuro e frente */
function limpaColuna(c, fica){
  ['--onda', '--verde', '--tsobe'].forEach(v => c.style.removeProperty(v));
  c.style.removeProperty('filter');
  c.classList.remove('luz-verde', 'coluna-frente', 'destaque-h');
  if (!fica && c._noLugar){
    const casa = alvoDe(+c.dataset.z);
    c.style.left = casa.x.toFixed(1) + 'px';
    c.style.top  = casa.y.toFixed(1) + 'px';
  }
}
function colunas24(t){
  const o = COLUNAS_24;
  if (FINAL.ativo || FINAL.feito) return;
  const na24 = trilhaAtual === '2.4';
  if (!na24){
    if (o.suja){ TP.todos().forEach(c => limpaColuna(c)); o.suja = false; }
    return;
  }
  /* as colunas abrem-se aos 2,8 s e juntam-se de novo aos 25 s */
  const es = suave(entre01((t - o.separa) / o.dura)) * (1 - suave(entre01((t - o.volta) / o.dura)));
  const Z = 1 - (1 - o.zoom)*es, vao = o.vao*es;
  const cy = (yDaLinha(1) + yDaLinha(4)) / 2;
  const oh = o.hidrogenio;
  const eh = suave(entre01((t - oh.de) / oh.dura)) * (1 - suave(entre01((t - o.volta) / oh.dura)));
  const w = o.onda, vr = o.varre, vez = (vr.ate - vr.de) / vr.colunas.length;
  TP.todos().filter(c => c._noLugar).forEach(c => {
    if (c._voo) return;                       /* ainda a pousar */
    const z = +c.dataset.z, col = +c.dataset.col, row = +c.dataset.linha;
    const casa = alvoDe(z);
    /* as colunas afastam-se umas das outras, e o bloco encolhe um fio
       em volta do meio, para caber no palco */
    let x = 640 + ((casa.x - 640) + (col - 9.5)*vao) * Z;
    let y = cy + (casa.y - cy) * Z;
    let k = 0, cresce = 1;
    /* a varredura: na vez da coluna, um brilho desce das linhas de cima
       para as de baixo; fora da vez dela, nada fica aceso */
    const vc = vr.colunas.indexOf(col);
    const q = vc < 0 ? -1 : (t - vr.de - vc*vez) / vez;
    if (q >= 0 && q < 1) k = Math.exp(-Math.pow((row - (0.5 + 4*q)) / 0.7, 2));
    /* a onda da coluna 1 (sem o H): cresce e brilha, descendo e subindo */
    if (col === w.coluna && z !== 1 && t >= w.de && t <= w.ate){
      const f = t < w.meio ? 1 + 3*(t - w.de)/(w.meio - w.de) : 4 - 3*(t - w.meio)/(w.ate - w.meio);
      const b = Math.exp(-Math.pow((row - f)/0.55, 2));
      cresce += w.cresce * b;
      k = Math.max(k, b);
    }
    if (z === 1){
      /* o H cresce e destaca-se (em dourado, e não em verde), e aos 25 s
         volta ao normal, com as colunas */
      x += oh.desvio.x * eh;
      y += oh.desvio.y * eh;
      cresce += oh.cresce * eh;
      if (eh > .02) k = 0;
      c.classList.toggle('destaque-h', eh > .02);
    }
    c.style.left = x.toFixed(1) + 'px';
    c.style.top  = y.toFixed(1) + 'px';
    c.style.setProperty('--tsobe', '90ms');
    c.style.setProperty('--onda', (Z*cresce).toFixed(3));
    c.classList.toggle('luz-verde', k > .02);
    if (k > .02) c.style.setProperty('--verde', k.toFixed(3)); else c.style.removeProperty('--verde');
    c.classList.toggle('coluna-frente', es > .001);
  });
  o.suja = true;
  if (DIG_COL) DIG_COL.escreve(t);
}

/* ============================================================
   A TABELA ABERTA — a narração "2.5" e o toque depois dela
   Aos 4,8 s a tabela abre-se em 7 linhas, com os números delas no
   modelo do professor; dos 6 aos 8 s um brilho verde com um aumento
   sutil corre do 1 ao 118, forte na frente e a apagar atrás. Aos 9,1 s
   ela troca para as 18 colunas, com os números delas, e dos 12 aos 16 s
   o mesmo brilho corre coluna a coluna (de cima para baixo). No fim da
   narração ela junta-se, toca a "2.5A", e daí em diante um toque em
   qualquer lugar da tabela a abre em linhas, o seguinte em colunas, e o
   terceiro fecha. A leitura (linhas, colunas, junta) é a do professor:
   o mesmo vão de 14 px, e a mesa encolhe para caber.
   ============================================================ */
const LC25 = {
  linhas:  { de:4.8, onda:{ de:6.0,  ate:8.0  } },
  colunas: { de:9.1, onda:{ de:12.0, ate:16.0 } },
  vao:14, zoom:{ linhas:.9, colunas:.88 },
  cauda:12,          /* por quantos cards o brilho se apaga atrás da frente */
  cresce:.1,         /* o aumento sutil, na frente da onda */
  modo:'junta', livre:false, suja:false, ouve:false, _ordL:null, _ordC:null,
  /* a mesa do slide em cena: o 3 e o 4 abrem-se da mesma maneira */
  mesa(){ const sl = slideDaMesa(); return sl && sl.querySelector('.mesa'); },
  pos(z, modo){
    const p = posDe(z);
    let x = xDaColuna(p.col), y = yDaLinha(p.row);
    if (modo === 'linhas')  y += (p.row - 4) * this.vao;
    if (modo === 'colunas') x += (p.col - 9.5) * this.vao;
    return { x, y };
  },
  /* a tabela numa das três leituras: as cartas, os números e o zoom */
  poe(modo){
    const m = this.mesa();
    if (!m || this.modo === modo) return;
    this.modo = modo;
    m.classList.add('lc25');
    m.style.setProperty('--abre', modo === 'junta' ? 1 : this.zoom[modo]);
    /* aberta, as sombras das casas saem (ficariam soltas nos vãos), e os
       bilhetes das séries (57–71, 89–103) andam com a coluna 3 */
    m.classList.toggle('aberta25', modo !== 'junta');
    this.series(m, modo);
    TP.todos().forEach(c => {
      const a = this.pos(+c.dataset.z, modo);
      c.style.left = a.x.toFixed(1) + 'px';
      c.style.top  = a.y.toFixed(1) + 'px';
    });
    const vL = modo === 'linhas' ? this.vao : 0, vC = modo === 'colunas' ? this.vao : 0;
    /* os números das linhas, à esquerda da coluna 1 (nas colunas saem:
       a tabela alarga-se e não sobra lugar para eles) */
    m.querySelectorAll('.eixo[data-periodo]').forEach(e => {
      /* mostrados uma vez no modelo do professor, ficam assim */
      if (modo === 'linhas') e.classList.add('prof');
      const p = +e.dataset.periodo, prof = e.classList.contains('prof');
      e.classList.toggle('some25', modo === 'colunas');
      e.style.setProperty('--atraso', (p - 1) * 40 + 'ms');
      e.style.left = (xDaColuna(1) - LADO/2 - (prof ? 26 : 19)).toFixed(1) + 'px';
      e.style.top  = (yDaLinha(p) + (p - 4) * vL).toFixed(1) + 'px';
    });
    /* e os das colunas, em cima da primeira linha */
    m.querySelectorAll('.eixo[data-grupo]').forEach(e => {
      if (modo === 'colunas') e.classList.add('prof');
      const g = +e.dataset.grupo, prof = e.classList.contains('prof');
      e.style.setProperty('--atraso', (g - 1) * 26 + 'ms');
      e.style.left = (xDaColuna(g) + (g - 9.5) * vC).toFixed(1) + 'px';
      e.style.top  = (yDaLinha(1) - 3 * vL - LADO/2 - (prof ? 22 : 15)).toFixed(1) + 'px';
    });
  },
  series(m, modo){
    m.querySelectorAll('.casa.serie').forEach(d => {
      const row = d.classList.contains('act') ? 7 : 6;
      d.style.left = (xDaColuna(3) + (modo === 'colunas' ? (3 - 9.5) * this.vao : 0)).toFixed(1) + 'px';
      d.style.top  = (yDaLinha(row) + (modo === 'linhas' ? (row - 4) * this.vao : 0)).toFixed(1) + 'px';
    });
  },
  ordemLinhas(){
    return this._ordL || (this._ordL = TP.todos().slice().sort((a, b) => a.dataset.z - b.dataset.z));
  },
  ordemColunas(){
    return this._ordC || (this._ordC = TP.todos().slice().sort((a, b) =>
      (a.dataset.col - b.dataset.col) || (a.dataset.linha - b.dataset.linha)));
  },
  /* o relógio da "2.5": a leitura da vez, e a onda de brilho */
  tick(t){
    if (trilhaAtual !== '2.5' || !FINAL.feito){ if (this.suja) this.apaga(); return; }
    /* acabada a narração (o toque já livre), quem manda na tabela é o aluno:
     o relógio parado no fim da "2.5" não a volta a abrir */
    if (this.livre) return;
    this.poe(t >= this.colunas.de ? 'colunas' : t >= this.linhas.de ? 'linhas' : 'junta');
    const nasLinhas = t < this.colunas.de;
    const o = nasLinhas ? this.linhas.onda : this.colunas.onda;
    const ordem = nasLinhas ? this.ordemLinhas() : this.ordemColunas();
    const frente = (t - o.de) / (o.ate - o.de) * (ordem.length - 1);
    ordem.forEach((c, k) => {
      /* forte na frente, a apagar-se atrás ao longo de 'cauda' cards */
      const d = frente - k;
      let b = t < o.de || d < -1 ? 0 : d < 0 ? d + 1 : Math.max(0, 1 - d / this.cauda);
      if (b < .02) b = 0;
      if (Math.abs(b - (c._b25 || 0)) < .01) return;
      this.brilha(c, b);
    });
    this.suja = true;
  },
  brilha(c, b){
    c._b25 = b;
    c.classList.toggle('luz-verde', b > 0);
    if (b > 0){
      c.style.setProperty('--verde', b.toFixed(3));
      c.style.setProperty('--onda', (1 + this.cresce * b).toFixed(3));
      c.style.setProperty('--tsobe', '90ms');
    } else ['--verde', '--onda', '--tsobe'].forEach(v => c.style.removeProperty(v));
  },
  apaga(){
    TP.todos().forEach(c => { if (c._b25) this.brilha(c, 0); });
    this.suja = false;
  },
  /* acabada a "2.5": junta, a "2.5A" e o toque livre */
  fimDa25(){
    this.apaga();
    this.poe('junta');
    this.liga();
    setTimeout(() => { if (atual === 2 && trilhaAtual === '2.5') tocaTrilha('2.5A'); }, 400);
  },
  /* o toque em qualquer lugar da tabela — num card ou no vão entre eles */
  liga(){
    this.livre = true;
    if (this.ouve || !slides[2]) return;
    this.ouve = true;
    slides[2].addEventListener('click', ev => {
      if (!this.livre || QUIZ3.aberto || atual !== 2) return;
      if (ev.target.closest && ev.target.closest('.quiz-cartao, button, .quiz3')) return;
      if (this.naTabela(ev)) this.alterna();
    });
  },
  naTabela(ev){
    if (ev.target.closest && ev.target.closest('.pc')) return true;
    let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
    TP.todos().forEach(c => {
      const q = c.getBoundingClientRect();
      l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    return ev.clientX >= l && ev.clientX <= r && ev.clientY >= t && ev.clientY <= b;
  },
  /* junta → linhas → colunas → junta */
  alterna(){ this.poe({ junta:'linhas', linhas:'colunas', colunas:'junta' }[this.modo]); },
  zera(){
    this.livre = false;
    this.apaga();
    const m = this.mesa();
    if (m && m.classList.contains('lc25')){
      m.classList.remove('lc25', 'aberta25');
      this.series(m, 'junta');
      m.style.removeProperty('--abre');
      m.querySelectorAll('.eixo').forEach(e => {
        e.classList.remove('prof', 'some25');
        e.style.removeProperty('--atraso');
      });
      m.querySelectorAll('.eixo[data-periodo]').forEach(e => {
        e.style.left = (TAB_ESQ - 19).toFixed(1) + 'px';
        e.style.top  = yDaLinha(+e.dataset.periodo).toFixed(1) + 'px';
      });
      m.querySelectorAll('.eixo[data-grupo]').forEach(e => {
        e.style.left = xDaColuna(+e.dataset.grupo).toFixed(1) + 'px';
        e.style.top  = (TAB_TOPO - 15).toFixed(1) + 'px';
      });
      TP.todos().forEach(c => {
        const a = alvoDe(+c.dataset.z);
        c.style.left = a.x.toFixed(1) + 'px';
        c.style.top  = a.y.toFixed(1) + 'px';
      });
    }
    this.modo = 'junta';
  }
};

/* ============================================================
   O SLIDE 4 · AS COORDENADAS PERIÓDICAS — a narração "3", no relógio dela
     0 → 5 s       a mesa ainda respira (a vida solta), e aos 5 s cala-se
     7 s           o Fe gira em 3D, cresce e acende de verde
     9 s           a faixa da linha dele (o 4.º período) acende
     9,8 s         e a da coluna (o grupo 8)
     11 s          tudo volta ao normal
     13 s          a tabela abre-se em linhas; 14 → 15 s "séries ou períodos"
     15,6 s        o áudio pára um segundo, e continua
     16 s          fecha, e o texto sai em fade
     16,4 s        abre-se em colunas; 16,8 → 18 s "grupos ou famílias"
     20,4 s        o texto sai e a tabela fecha
     22,5 s        o Na gira em 3D, cresce e acende (como o Fe), e o
                   símbolo dele vai para o vazio da tabela
     25,6 s        "3º período", ao lado do símbolo, e a faixa da linha
     26,8 s        "grupo 1", embaixo, e a faixa da coluna
   No fim, o botão "Entendi", à direita do símbolo: tocado, acende, toca
   o "right" e passa à narração "3.1":
     1 s           o Mn gira em 3D, cresce e acende, e o símbolo dele vai
                   para o vazio da tabela
     3,3 s         "4º período", e a faixa da linha
     5 s           "grupo"
     6,3 s         o 7 completa-o, e a faixa da coluna
   E o Entendi de novo, que leva à "3.2":
     0,6 s         o Pb gira em 3D, cresce e acende (o símbolo no vazio)
     1,9 s         "6º período", e a faixa da linha
     3,7 s         digita "grupo"
     5 s           digita o 14, e a faixa da coluna
   E o Entendi, que leva à "3.3", a primeira pergunta:
     2,2 → 5 s     digita "Toque no elemento que tá no 4º período, grupo"
     6 s           põe o 8; a partir daí, a resposta é um toque na tabela:
                   no acerto, confetes, fanfarra, aplausos e a voz; no
                   erro, o card balança em vermelho e vem a dica (no
                   segundo erro, a resposta pulsa em âmbar)
   Mudada a narração, a cena da anterior sai toda. Tudo é função
   do relógio do áudio: voltando atrás, a cena volta com ele. As linhas e
   as colunas abrem-se como no slide 3 (LC25), e a cruz e a ficha são as
   da mesa (as de TP.coordenadas).
   ============================================================ */
const FRASES_3 = [
  { de:14.0, ate:15.0, some:16.0, txt:'séries ou períodos' },
  { de:16.8, ate:18.0, some:20.4, txt:'grupos ou famílias' }
];
const EV3 = {
  vidaAte:5.0,
  fe:{ z:26, de:7.0, linha:9.0, coluna:9.8, ate:11.0 },
  linhas:{ de:13.0, ate:16.0 },
  colunas:{ de:16.4, ate:20.4 },
  na:{ z:11, de:22.5, periodo:25.6, grupo:26.8 },
  /* os exemplos: o elemento, e as coordenadas dele — a palavra "grupo"
     antes do número; na "3.2" os dois são digitados */
  exemplos:{
    '3.1':{ z:25, de:1.0, periodo:3.3, grupo:5.0, numero:6.3 },
    '3.2':{ z:82, de:0.6, periodo:1.9, grupo:3.7, numero:5.0, digita:true }
  },
  dig:null, botao:null, feOn:false, cruz:'', naK:0, k31:0, trilha:null, suja:false, pausaT:0,
  mesa(){ return slides[3] && slides[3].querySelector('.mesa'); },
  cartas(m){ return [...m.querySelectorAll('.pc:not(.serie-oculta)')]; },
  carta(m, z){ return m.querySelector('.pc[data-z="' + z + '"]'); },
  /* o quadro dos textos e o botão, criados uma vez */
  prepara(){
    if (this.dig || !slides[3]) return;
    const cx = document.createElement('div');
    cx.className = 'texto-colunas texto3';
    cx.setAttribute('aria-live', 'polite');
    slides[3].appendChild(cx);
    this.dig = criaDigitacao(cx, FRASES_3);
    /* e a folha dos confetes, que o slide 4 ainda não tinha */
    if (!slides[3].querySelector('.confete'))
      slides[3].insertAdjacentHTML('beforeend', '<canvas class="confete" width="1280" height="720" aria-hidden="true"></canvas>');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'entendi3';
    b.textContent = 'Entendi';
    /* tocado: acende, toca o "right", e só então a narração seguinte */
    b.addEventListener('click', () => {
      if (b.classList.contains('tocado')) return;
      b.classList.add('tocado');
      tocaEfeito('right').then(() => {
        this.entendi(false);
        const seguinte = { '3':'3.1', '3.1':'3.2', '3.2':'3.3' }[trilhaAtual];
        if (atual === 3 && seguinte) tocaTrilha(seguinte);
      });
    });
    /* na mesa, no vazio da tabela, à direita do símbolo e das duas
       coordenadas (e anda com a mesa, também no celular) */
    b.style.left = xDaColuna(10.9) + 'px';
    b.style.top  = yDaLinha(2) + 'px';
    this.mesa().appendChild(b);
    this.botao = b;
  },
  tick(t){
    const m = this.mesa();
    if (!m) return;
    this.prepara();
    /* mudada a trilha, a cena da anterior sai toda */
    if (trilhaAtual !== this.trilha){ if (this.suja) this.zera(); this.trilha = trilhaAtual; }
    const ex = this.exemplos[trilhaAtual];
    if (ex){ this.tickEx(m, t, ex); return; }
    if (QUIZ4.trilhas.includes(trilhaAtual)){ QUIZ4.tick(t); return; }
    if (trilhaAtual !== '3') return;
    /* a vida solta, só até aos 5 s da narração */
    if (VIDA.ligada && t >= this.vidaAte && !som.paused) VIDA.desliga();
    const f = this.fe, n = this.na, fe = this.carta(m, f.z), na = this.carta(m, n.z);
    /* o Fe: gira uma vez, cresce e acende de verde */
    const feOn = t >= f.de && t < f.ate;
    if (feOn !== this.feOn){
      this.feOn = feOn;
      fe.classList.toggle('verde', feOn);
      if (feOn) TP.gira(fe, { eixo:'y', graus:360, dur:900 });
    }
    /* a faixa da linha, depois a da coluna */
    /* e depois a do Na: a linha com "3º período", a coluna com "grupo 1" */
    const k = (t >= n.de ? 1 : 0) | (t >= n.periodo ? 2 : 0) | (t >= n.grupo ? 4 : 0);
    const doFe = t < f.ate;
    const linha  = doFe ? t >= f.linha  : !!(k & 2);
    const coluna = doFe ? t >= f.coluna : !!(k & 4);
    const cruz = (doFe ? 'fe' : 'na') + (linha ? 'L' : '') + (coluna ? 'C' : '');
    if (cruz !== this.cruz){ this.cruz = cruz; this.poeCruz(m, doFe ? fe : na, linha, coluna); }
    /* as linhas e as colunas */
    LC25.poe(t >= this.colunas.de && t < this.colunas.ate ? 'colunas'
           : t >= this.linhas.de && t < this.linhas.ate ? 'linhas' : 'junta');
    this.dig.escreve(t);
    /* o Na, a ficha dele e as duas coordenadas */
    if (k !== this.naK){
      /* ao acender, o Na gira como o Fe */
      if ((k & 1) && !(this.naK & 1)) TP.gira(na, { eixo:'y', graus:360, dur:900 });
      this.naK = k;
      this.poeNa(m, na, k);
    }
    this.suja = true;
  },
  /* UM EXEMPLO (a "3.1", a "3.2"): o elemento acende a girar; o período com
     a faixa da linha; "grupo"; e o número, com a faixa da coluna */
  tickEx(m, t, e){
    const c = this.carta(m, e.z);
    const k = (t >= e.de ? 1 : 0) | (t >= e.periodo ? 2 : 0) | (t >= e.grupo ? 4 : 0) | (t >= e.numero ? 8 : 0);
    if (k !== this.k31){
      if ((k & 1) && !(this.k31 & 1)) TP.gira(c, { eixo:'y', graus:360, dur:900 });
      this.k31 = k;
      this.poeNa(m, c, k & 7, !!(k & 8));
      const linha = !!(k & 2), coluna = !!(k & 8);
      const cruz = 'ex' + e.z + (linha ? 'L' : '') + (coluna ? 'C' : '');
      if (cruz !== this.cruz){ this.cruz = cruz; this.poeCruz(m, c, linha, coluna); }
      this.suja = true;
    }
    /* na "3.2" a palavra e o número são digitados */
    if (e.digita && (k & 4)){
      const pal = 'grupo', num = String(c.dataset.grupo);
      const np = Math.round(entre01((t - e.grupo) / 0.5) * pal.length);
      const nn = Math.round(entre01((t - e.numero) / 0.3) * num.length);
      const html = pal.slice(0, np) + (nn ? ' <b>' + num.slice(0, nn) + '</b>' : '');
      const sg = m.querySelector('.coords-el .grp');
      if (sg.dataset.html !== html){ sg.dataset.html = html; sg.innerHTML = html; }
    }
  },
  poeCruz(m, c, linha, coluna){
    const lin = +c.dataset.linha, col = +c.dataset.col;
    m.classList.toggle('tem-cruz', linha || coluna);
    this.cartas(m).forEach(p => p.classList.toggle('cruz',
      (linha && +p.dataset.linha === lin) || (coluna && +p.dataset.col === col)));
    const b1 = m.querySelector('.banda-linha'), b2 = m.querySelector('.banda-col');
    if (linha){
      const alt = LADO + 14;
      b1.style.left = (TAB_ESQ - 32) + 'px';
      b1.style.width = (TAB_LARG + 64) + 'px';
      b1.style.height = alt + 'px';
      b1.style.top = (yDaLinha(lin) - alt/2) + 'px';
    }
    b1.classList.toggle('on', linha);
    if (coluna){
      const larg = LADO + 14, acima = 30;
      b2.style.left = (xDaColuna(col) - larg/2) + 'px';
      b2.style.width = larg + 'px';
      b2.style.top = (TAB_TOPO - acima) + 'px';
      b2.style.height = (6*PASSO + LADO + acima + 8) + 'px';
    }
    b2.classList.toggle('on', coluna);
    m.querySelectorAll('.eixo.acesa').forEach(e => e.classList.remove('acesa'));
    const ep = m.querySelector('.eixo[data-periodo="' + c.dataset.periodo + '"]'),
          eg = m.querySelector('.eixo[data-grupo="' + col + '"]');
    if (ep) ep.classList.toggle('acesa', linha);
    if (eg) eg.classList.toggle('acesa', coluna);
  },
  poeNa(m, c, k, num){
    const on = !!(k & 1);
    c.classList.toggle('verde', on);
    const f = m.querySelector('.ficha'), r = m.querySelector('.coords-el');
    f.querySelector('span').textContent = c.dataset.z;
    f.querySelector('b').textContent = c.dataset.sym;
    f.classList.toggle('on', on);
    const sp = r.querySelector('.per'), sg = r.querySelector('.grp');
    sp.innerHTML = '<b>' + c.dataset.periodo + 'º</b> período';
    /* o número do grupo pode chegar depois da palavra (na "3.1") */
    sg.innerHTML = 'grupo' + (num === false ? '' : ' <b>' + c.dataset.grupo + '</b>');
    sp.classList.toggle('on', !!(k & 2));
    sg.classList.toggle('on', !!(k & 4));
  },
  /* aos 15,6 s: um segundo de silêncio, e a narração continua */
  pausa(){
    clearTimeout(this.pausaT);
    som.pause();
    this.pausaT = setTimeout(() => {
      if (atual === 3 && trilhaAtual === '3' && som.paused) som.play().catch(avisaSeNaoTocou);
    }, 1000);
  },
  /* o botão Entendi (e, com ele, o play sai de cena) */
  entendi(sim){
    this.prepara();
    if (!this.botao) return;
    this.botao.classList.toggle('on', sim);
    if (!sim) this.botao.classList.remove('tocado');
    stage.classList.toggle('em-entendi', sim);
  },
  zera(){
    this.entendi(false);
    clearTimeout(this.pausaT);
    const m = this.mesa();
    if (!m) return;
    if (this.dig) this.dig.limpa();
    const fe = this.carta(m, this.fe.z), na = this.carta(m, this.na.z);
    m.querySelectorAll('.pc.verde').forEach(x => x.classList.remove('verde'));
    this.poeCruz(m, fe, false, false);
    this.poeNa(m, na, 0);
    if (atual === 3) LC25.zera();
    m.querySelectorAll('.pc.certa3, .pc.errada3, .pc.pista3, .pc.frente3').forEach(x => {
      x.classList.remove('certa3', 'errada3', 'pista3', 'frente3');
      x.style.removeProperty('--onda');
      x.style.removeProperty('--tsobe');
    });
    const sg = m.querySelector('.coords-el .grp');
    if (sg) delete sg.dataset.html;
    QUIZ4.fecha();
    this.feOn = false; this.cruz = ''; this.naK = 0; this.k31 = 0; this.suja = false;
  }
};
function efeitos3(t){ EV3.tick(t); }

/* ============================================================
   O QUIZ DO SLIDE 4 — as perguntas das coordenadas, da "3.3" à "3.6"
   Começadas as perguntas, a sala escurece (o véu do quiz) e cada uma vem
   no quadro padrão (Questão 01, 02…), com a troca da esteira e o giro da
   tabela. Acabada a narração da pergunta, o play sai do canto: quem faz a
   aula andar é o toque no elemento certo. O erro balança em vermelho e dá
   a dica (no segundo, a resposta pulsa em âmbar); o acerto cresce, acende,
   confetes, fanfarra, aplausos e a voz — e toca a narração seguinte.
     3.3  Questão 01: 4.º período, grupo 8 (o Fe) — digitada no relógio
     3.4  Questão 02: 3.º período, grupo 17 (o Cl)
     3.5  Questão 03: 7.º período, grupo 2 (o Ra)
     3.6  Questão 04: depois do áudio, três elementos, um de cada vez: o
          elemento acende, e numa caixa do lado oposto ao dele o aluno
          gira os dois carrosséis (o período e o grupo) e confirma
   ============================================================ */
/* o véu do quiz num slide qualquer (o do slide 3 tem o seu, em QUIZ3) */
function breuNoSlide(sl, sim){
  if (!sl) return;
  let v = sl.querySelector(':scope > .breu-quiz');
  if (sim && !v){
    v = document.createElement('div');
    v.className = 'breu-quiz';
    sl.insertBefore(v, sl.firstChild);
    v.getBoundingClientRect();
  }
  sl.classList.toggle('quiz-escuro', sim);
  if (v) v.classList.toggle('on', sim);
}
/* os três da questão 04 (o carrossel): o K, o Sn e o Ba */
const CARROSSEL_Q4 = [19, 50, 56];
const QUIZ4 = {
  trilhas:['3.3', '3.4', '3.5', '3.6'],
  itens:[
    { id:'3.3', rotulo:'Questão 01', z:26, digita:{ de:2.2, ate:5.0, num:6.0 },
      txt:'Toque no elemento que tá no 4º\u00a0período, grupo', fim:' 8' },
    { id:'3.4', rotulo:'Questão 02', z:17,
      txt:'Agora toque no elemento que tá no terceiro período, grupo 17.' },
    { id:'3.5', rotulo:'Questão 03', z:88,
      txt:'Toque no elemento que tá no sétimo período, grupo 2.' },
    { id:'3.6', rotulo:'Questão 04', carrossel:true,
      txt:'Tá, agora vamos fazer assim: eu te dou o elemento e você seleciona o período e a família dele na tela, tá bom? Lá vai o primeiro.' }
  ],
  ativo:false, passo:-1, aceita:false, travado:false, tropecos:0, erros:0, g:0, sub:0,
  roda:null, giroT:0,
  sl(){ return slides[3]; },
  mesa(){ return slides[3] && slides[3].querySelector('.mesa'); },
  carta(z){ return this.mesa().querySelector('.pc[data-z="' + z + '"]'); },
  caixa(){ return this.sl().querySelector('.quiz3:not(.sai)'); },
  msg(){
    if (this.roda) return this.roda.querySelector('.rd-msg');
    const cx = this.caixa();
    return cx && cx.querySelector('.q3-msg');
  },
  /* a cada tique do relógio, nas trilhas das perguntas (chamado por EV3) */
  tick(t){
    if (!this.ativo) this.abre();
    const i = this.trilhas.indexOf(trilhaAtual);
    if (i > this.passo) this.poe(i);
    const it = this.itens[this.passo];
    if (it && it.digita && trilhaAtual === it.id) this.digita(it, t);
  },
  /* começadas as perguntas: a sala escurece */
  abre(){
    this.ativo = true; this.passo = -1; this.erros = 0; this.g++;
    breuNoSlide(this.sl(), true);
  },
  /* acabada a narração da pergunta, o play sai do canto */
  semPlay(){ if (this.ativo) stage.classList.add('em-quiz'); },
  /* a pergunta i: a da "3.3" entra no relógio (digitada); as outras, já */
  poe(i){
    this.passo = i; this.tropecos = 0; this.aceita = false; this.sub = 0;
    const it = this.itens[i];
    if (it.digita) return;
    this.caixaNova(it.rotulo, it.txt);
    if (!it.carrossel) this.aceita = true;
  },
  /* o quadro novo entra pela esquerda enquanto o anterior sai pela direita,
     e a tabela gira na troca (o do quiz do slide 3) */
  caixaNova(rotulo, txt){
    let houve = false;
    this.sl().querySelectorAll('.quiz3:not(.sai)').forEach(e => {
      e.classList.add('sai');
      setTimeout(() => e.remove(), 700);
      houve = true;
    });
    if (houve) this.giraTabela();
    const cx = document.createElement('div');
    cx.className = 'quiz3 q4';
    cx.setAttribute('aria-live', 'polite');
    cx.innerHTML = '<div class="q3-marca"></div><div class="q3-q"></div><div class="q3-msg"></div>';
    cx.querySelector('.q3-marca').textContent = rotulo;
    cx.querySelector('.q3-q').innerHTML = txt;
    this.sl().appendChild(cx);
    cx.getBoundingClientRect();
    cx.classList.add('on');
    return cx;
  },
  giraTabela(){
    const m = this.mesa();
    if (!m) return;
    m.querySelectorAll('.pc').forEach(c => {
      const p = posDe(+c.dataset.z);
      c.style.setProperty('--giro-atraso', ((p.col + p.row) * 22) + 'ms');
    });
    m.classList.remove('gira-troca');
    void m.offsetWidth;
    m.classList.add('gira-troca');
    clearTimeout(this.giroT);
    this.giroT = setTimeout(() => m.classList.remove('gira-troca'), 1500);
  },
  /* a questão 01, digitada no relógio da "3.3"; com o 8, vale o toque */
  digita(it, t){
    const d = it.digita;
    if (t < d.de) return;
    const cx = this.caixa() || this.caixaNova(it.rotulo, '');
    const n = Math.round(entre01((t - d.de) / (d.ate - d.de)) * it.txt.length);
    const txt = it.txt.slice(0, n) + (t >= d.num ? it.fim : '');
    const q = cx.querySelector('.q3-q');
    if (q.dataset.txt !== txt){ q.dataset.txt = txt; q.textContent = txt; }
    cx.classList.toggle('digitando', t < d.num);
    if (t >= d.num && !this.travado) this.aceita = true;
  },
  /* as questões 01 a 03: o toque num card */
  tocaCarta(c){
    const it = this.itens[this.passo];
    if (!it || it.carrossel || !this.aceita || this.travado) return;
    const z = +c.dataset.z;
    if (z !== it.z){
      const alvo = this.carta(it.z);
      this.erra(c, 'Ache a linha ' + alvo.dataset.periodo + ' e siga pela coluna ' + alvo.dataset.grupo +
                   ':<br>o elemento está no cruzamento das duas.');
      return;
    }
    this.acerta(c, 'É o ' + NOMES[z-1] + ' (' + SIMBOLOS[z-1] + ').', false, () => this.seguinte());
  },
  /* a pergunta seguinte: a narração dela, e o quadro com ela */
  seguinte(){
    const i = this.passo + 1;
    if (i >= this.itens.length) return;
    tocaTrilha(this.itens[i].id);
    this.poe(i);
  },
  /* O ERRO: balança em vermelho, a tela treme, error; a dica debaixo da
     pergunta; no segundo erro da mesma pergunta, a resposta pulsa */
  erra(el, dica){
    this.erros++; this.tropecos++;
    el.classList.remove('errada3'); void el.offsetWidth; el.classList.add('errada3');
    clearTimeout(el._erroT);
    el._erroT = setTimeout(() => el.classList.remove('errada3'), 700);
    const msg = this.msg();
    if (msg){ msg.innerHTML = dica; msg.className = 'q3-msg dica'; }
    if (this.tropecos >= 2){
      const it = this.itens[this.passo];
      const z = it.carrossel ? CARROSSEL_Q4[this.sub] : it.z;
      this.carta(z).classList.add('pista3');
    }
    tremeVermelho();
    const g = this.g, passo = this.passo, sub = this.sub, e = tocaEfeito('error');
    /* a voz de ânimo, só se a mesma pergunta ainda estiver por responder
       (acertada logo a seguir, ela tocaria por cima da festa) */
    if (this.tropecos === 1) e.then(() => {
      if (g === this.g && this.ativo && !this.travado && this.passo === passo && this.sub === sub) tocaEfeito('Calmanaproximaacerta');
    });
  },
  /* O ACERTO: o card cresce, à frente, e acende; confetes, fanfarra,
     aplausos e a voz; e depois, o que vem a seguir */
  async acerta(c, frase, ultima, depois){
    this.travado = true; this.aceita = false;
    const g = this.g;
    this.mesa().querySelectorAll('.pista3').forEach(x => x.classList.remove('pista3'));
    c.classList.add('certa3');
    QUIZ3.cresce(c);
    const voz = vozDoAcerto(ultima);
    const msg = this.msg();
    if (msg){ msg.textContent = voz.frase + ' ' + frase; msg.className = 'q3-msg ok'; }
    confete();
    const fanfarra = tocaEfeito('funfare');
    tocaEfeito('applause');
    await fanfarra;
    if (g !== this.g) return;
    await tocaEfeito(voz.som);
    if (g !== this.g) return;
    this.encolhe();
    this.travado = false;
    depois();
  },
  encolhe(){
    const m = this.mesa();
    if (!m) return;
    m.querySelectorAll('.pc.certa3').forEach(c => c.classList.remove('certa3'));
    m.querySelectorAll('.pc.frente3').forEach(c => {
      c.style.setProperty('--onda', '1');
      clearTimeout(c._frenteT);
      c._frenteT = setTimeout(() => {
        c.classList.remove('frente3');
        c.style.removeProperty('--onda');
        c.style.removeProperty('--tsobe');
      }, 500);
    });
  },
  /* A QUESTÃO 04, depois da "3.6": três elementos, um de cada vez. O
     elemento acende na tabela e, do lado oposto ao dele — sempre na mesma
     altura, para a caixa nunca o tapar —, vem a caixa: o elemento, os dois
     carrosséis (o período e o grupo) que o aluno gira, e o Confirmar. */
  coordsComeca(){
    if (!this.ativo) return;
    stage.classList.add('em-quiz');
    /* o quadro da explicação sai: a caixa do carrossel toma a cena */
    this.sl().querySelectorAll('.quiz3:not(.sai)').forEach(e => {
      e.classList.add('sai');
      setTimeout(() => e.remove(), 700);
    });

    this.rodaPoe();
  },
  rodaPoe(){
    const c = this.carta(CARROSSEL_Q4[this.sub]);
    this.tropecos = 0;
    c.classList.add('aceso');
    TP.gira(c, { eixo:'y', graus:360, dur:900 });
    this.roda = this.rodaNova(c);
    this.aceita = true;
  },
  /* A CAIXA, com o uso da do app de referência (o quiz do capítulo 2):
     pequena, sempre no meio da altura da tabela, e só muda de lado — do
     lado oposto ao do elemento, para nunca o tapar; entra com um salto; o
     elemento em cima, os dois carrosséis (três números à vista) e o
     confirmar. No desenho deste app. */
  rodaNova(c){
    const m = this.mesa();
    const b = document.createElement('div');
    b.className = 'roda4';
    b.style.left = (+c.dataset.grupo <= 9 ? xDaColuna(14.5) : xDaColuna(4.5)) + 'px';
    b.style.top  = (TAB_TOPO + 3.5 * PASSO) + 'px';
    const lista = n => '<div class="rd-pad"></div>' +
      Array.from({ length:n }, (_, i) => '<div class="rd-v">' + (i + 1) + '</div>').join('') +
      '<div class="rd-pad"></div>';
    b.innerHTML =
      '<div class="rd-marca">Questão 04 · ' + (this.sub + 1) + ' de ' + CARROSSEL_Q4.length + '</div>' +
      '<div class="rd-el"><span>' + c.dataset.z + '</span><b>' + c.dataset.sym + '</b><em>' + NOMES[c.dataset.z - 1] + '</em></div>' +
      '<div class="rd-colunas">' +
        '<div class="rd-col"><div class="rd-tit">período</div><div class="rd-roda" data-tipo="p">' + lista(7) + '</div></div>' +
        '<div class="rd-col"><div class="rd-tit">grupo</div><div class="rd-roda" data-tipo="g">' + lista(18) + '</div></div>' +
      '</div>' +
      '<div class="rd-msg"></div>' +
