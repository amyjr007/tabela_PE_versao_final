<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiobook interativo da Tabela Periódica Moderna</title>
<meta name="theme-color" content="#EDEAF2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audiobook da Tabela">
<meta name="description" content="O audiobook interativo da Tabela Periódica do Prof. Amauri Junior: a aula guiada por áudio, com os 118 elementos em cubos que giram.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<!-- AS FONTES MORAM AQUI DENTRO, como no app do professor: o aluno abre
     isto no celular da casa dele, e nada é pedido para fora. -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
/* ============================================================
   PALETA — as 3 cores do tema, as mesmas do app do professor
   papel-lavanda (fundo) · índigo (estrutura) · âmbar (destaque)
   ============================================================ */
:root{
  --fundo:      #EDEAF2;
  --fundo-alto: #F4F2F8;
  --fundo-2:    #E2DDEE;
  --tinta:      #201C42;
  --tinta-dim:  rgba(32,28,66,.62);
  --tinta-faint:rgba(32,28,66,.28);
  --indigo:     #4C3FBF;
  --indigo-dim: rgba(76,63,191,.22);
  --ouro:       #A96B10;
  --ouro-luz:   #E2A22B;
  --ouro-dim:   rgba(226,162,43,.26);

  /* ---- as cores das famílias da tabela ----
     Copiadas tal e qual da aula do professor: as duas telas têm de
     pintar a mesma casa da mesma cor, senão o aluno não reconhece em
     casa a tabela que viu na sala. */
  --cat-alcalinos:   #D2591F;
  --cat-alcterrosos: #C58A0E;
  --cat-transicao:   #2E7BAE;
  --cat-metais:      #1E8F7D;
  --fam-boro:        #6F8C1E;
  --cat-ametais:     #2E9450;
  --cat-halogenios:  #C13757;
  --cat-nobres:      #5B4BD6;
  --cat-lantanideos: #8B3FBE;
  --cat-actinideos:  #B1408C;
  --cat-calcogenios: #128B86;

  /* tempos e curvas das transições */
  --t-capa: .82s;
  --e-capa: cubic-bezier(.42,.02,.24,1);
  --t-desl: .58s;
  --e-desl: cubic-bezier(.32,.72,.24,1);
  --e-salto: cubic-bezier(.3,1.05,.35,1);

  --display: 'Space Grotesk', system-ui, sans-serif;
  --body:    'IBM Plex Sans', system-ui, sans-serif;
  --mono:    'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#DAD5E6}
body{
  font-family:var(--body);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:pan-y;
}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px;border-radius:4px}

/* ---------- palco 16:9 que escala pra qualquer tela ---------- */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{
  position:absolute;top:50%;left:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--fit,1));
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  box-shadow:0 26px 70px rgba(32,28,66,.28);
  overflow:hidden;
  touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  /* a profundidade em que o cubo da capa gira */
  perspective:1500px;perspective-origin:50% 50%;
}

/* a grade da tabela como papel de fundo: células, não milimetrado */
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(76,63,191,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,63,191,.07) 1px,transparent 1px);
  background-size:52px 58px;
}
/* duas luzes, uma fria e uma quente, para o papel não ficar chapado */
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
             radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%);
}

/* barra de progresso da apresentação */
#progress{position:absolute;top:0;left:0;height:3px;background:var(--ouro-luz);z-index:6;
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- a tabelinha colorida, a marca do tema ---------- */
#tabela{
  position:absolute;z-index:0;pointer-events:none;
  width:320px;right:-24px;bottom:-20px;opacity:.4;
  transition:width .8s var(--e-capa),right .8s var(--e-capa),
             bottom .8s var(--e-capa),opacity .8s var(--e-capa);
}
#tabela .cel{stroke:rgba(255,255,255,.72);stroke-width:.5;
  transition:fill 1.2s ease}
/* A CASA QUE ACENDE — de vez em quando uma casinha da capa diz quem é */
#tabela .luz{
  opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.84);
  transition:opacity .3s ease, transform .4s cubic-bezier(.2,1.35,.4,1);
}
#tabela .luz.on{opacity:1;transform:scale(1)}
#tabela .luz .carta{fill:#FFFDF8;fill-opacity:.96;stroke:var(--cl);stroke-width:.7}
#tabela .luz .n{font-family:var(--mono);font-size:2.7px;fill:var(--tinta-dim)}
#tabela .luz .s{font-family:var(--display);font-weight:600;font-size:5.4px;
  fill:var(--cl);text-anchor:middle}
/* Na capa a tabelinha é a ilustração, mas agora em ponto pequeno: o
   título cresceu e é ele que manda na folha. Ela fica no canto de
   baixo à direita, do tamanho de um selo — e acima do botão da
   narração, que mora no mesmo canto. */
#stage.na-capa #tabela{width:520px;right:30px;bottom:88px;opacity:1}
/* onde há uma tabela de verdade em cena, a do canto sai */
#stage.sem-marca #tabela{opacity:0}

/* ---------- slides ---------- */
/* o deck é o volume 3D onde as faces do cubo giram */
#deck{position:absolute;inset:0;z-index:1;transform-style:preserve-3d}
.slide{
  position:absolute;inset:0;
  padding:56px 80px 58px;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  backface-visibility:hidden;
}
.slide.is-active {opacity:1;visibility:visible;z-index:3}
.slide.is-leaving{opacity:1;visibility:visible;z-index:2}

/* ===== capa <-> slide 1: o cubo girando =====
   As duas faces giram juntas em torno do mesmo eixo, cada uma
   empurrada meia volta para longe do observador e trazida de volta —
   é isso que faz o vinco do canto do cubo aparecer no meio do giro. */
.slide::after{content:'';position:absolute;inset:0;z-index:9;pointer-events:none;
  background:#0B0D20;opacity:0}

.fx-cube-in-next {animation:cubeInNext  var(--t-capa) var(--e-capa) both}
.fx-cube-out-next{animation:cubeOutNext var(--t-capa) var(--e-capa) both}
.fx-cube-in-prev {animation:cubeInPrev  var(--t-capa) var(--e-capa) both}
.fx-cube-out-prev{animation:cubeOutPrev var(--t-capa) var(--e-capa) both}
.fx-cube-in-next::after,.fx-cube-in-prev::after {animation:faceClara var(--t-capa) var(--e-capa) both}
.fx-cube-out-next::after,.fx-cube-out-prev::after{animation:faceEscura var(--t-capa) var(--e-capa) both}

@keyframes cubeInNext{
  from{transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutNext{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
}
@keyframes cubeInPrev{
  from{transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutPrev{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
}
@keyframes faceClara {from{opacity:.5} to{opacity:0}}
@keyframes faceEscura{from{opacity:0}  to{opacity:.5}}

/* ---------- CAPA ----------
   Três faixas verticais, da esquerda para a direita: o título, o
   retrato, e a tabelinha no canto de baixo. O título é agora o nome do
   que isto é — um audiobook —, e é a peça mais comprida da capa: por
   ele ganhar largura, o retrato foi para a direita e a tabelinha
   encolheu para o canto. O endereço saiu de debaixo do nome e foi
   morar no rodapé, sozinho: ali ele se lê sem disputar com nada. */
.slide.capa{justify-content:center;padding-left:88px}
.capa .marca{
  font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:22px;
}
.capa h1{
  font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;
  letter-spacing:-.028em;color:var(--tinta);
}
.capa h1 em{font-style:normal;color:var(--ouro)}
/* a última palavra fica no meio da caixa do título, e não encostada à
   esquerda: sozinha numa linha curta, alinhada com as outras ela
   parecia uma sobra da linha de cima */
.capa h1 .ult{display:block;text-align:center}
/* e "Tabela Periódica" também, na linha dela: as duas linhas âmbar
   descem pelo eixo do título, uma debaixo da outra */
.capa h1 .linha{display:block;text-align:center}

/* ---- os blocos gigantes da capa ----
   Três cubos em tamanho grande, ao lado da tabelinha: o sódio, o ítrio
   e o lantânio — os três primeiros que a tabelinha acende. São os
   mesmos cubos da tabela do slide 1, na mesma construção de seis faces
   iguais; aqui em ponto grande, para quem chega ver de perto do que é
   feita a tabela que está ao lado. */
.capa .blocos{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ---- as frases digitadas ----
   Aparecem no vazio à direita do retrato, letra a letra, como alguém a
   escrever depressa. A caixa tem tamanho fixo mesmo vazia: é peça de
   montagem, e uma caixa de altura zero não se deixaria pegar. */
.capa .digitado{
  position:absolute;left:305px;top:350px;width:410px;height:250px;z-index:3;
  pointer-events:none;
}
body.montagem .capa .digitado{pointer-events:auto}
.capa .frase{
  display:none;margin:0 0 12px;
  font-family:var(--display);font-weight:500;font-size:27px;line-height:1.22;
  letter-spacing:-.01em;color:var(--tinta);
  transition:opacity .35s ease;
}
.capa .frase.on{display:block}
.capa .frase.saindo{opacity:0}
/* o tracinho: firme enquanto escreve, a piscar quando espera */
.capa .frase .cursor{
  display:inline-block;width:3px;height:.95em;margin-left:3px;vertical-align:-.12em;
  background:var(--ouro-luz);border-radius:1px;
}
.capa .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
@keyframes piscaCursor{50%{opacity:0}}
.capa .risco{
  width:200px;height:4px;margin:26px 0 20px;border-radius:2px;
  background:linear-gradient(90deg,var(--ouro-luz),var(--indigo));
}
.capa .autor{font-size:22px;font-weight:300;color:var(--tinta-dim);letter-spacing:.01em}
.capa .autor b{font-weight:500;color:var(--tinta)}
/* o endereço, no rodapé: quem lê isto de longe está lendo o título, e
   quem quer o contato está perto — e é no pé da folha que se procura */
.capa .email{
  position:absolute;left:88px;bottom:46px;
  font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:.01em;
  color:var(--indigo);text-decoration:none;cursor:pointer;
  /* é um link, e o palco inteiro não deixa selecionar texto: aqui deixa,
     para quem preferir copiar o endereço à mão */
  user-select:text;-webkit-user-select:text;
  border-bottom:1px solid transparent;transition:border-color .2s,color .2s;
}
.capa .email:hover{color:var(--ouro);border-bottom-color:var(--ouro-dim)}

/* ---- o menu do endereço (botão direito, ou dedo demorado) ----
   Uma opção só, com o desenho da barra de controles. */
#menu-email{
  position:fixed;z-index:95;min-width:180px;padding:6px;
  background:rgba(255,255,255,.97);border:1px solid var(--indigo-dim);
  border-radius:11px;backdrop-filter:blur(9px);
  box-shadow:0 14px 36px rgba(32,28,66,.24);
}
#menu-email[hidden]{display:none}
#menu-email button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border:0;border-radius:7px;background:transparent;cursor:pointer;
  font-family:var(--body);font-size:14px;color:var(--tinta);text-align:left;
}
#menu-email button:hover,#menu-email button:focus-visible{
  background:rgba(76,63,191,.1);color:var(--indigo);outline:none;
}
#menu-email svg{flex:none;color:var(--ouro)}
/* o retrato do autor, enquadrado como uma célula da tabela */
.capa .foto{
  position:absolute;left:790px;top:400px;width:164px;height:242px;margin:0;
  transform:translate(-50%,-50%) scale(1.1);
  padding:7px;background:#fff;border:1.5px solid var(--indigo);border-radius:6px;
  box-shadow:0 12px 28px rgba(32,28,66,.2);
}
.capa .foto img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}

/* ---------- cabeçalho: a tira do alto ----------
   É a arrumação que o professor deixou nos slides de conteúdo: régua,
   número, título e subtítulo lado a lado numa tira só, no alto. Vale
   aqui pela mesma razão que vale lá — a tabela precisa da folha
   inteira, e um cabeçalho de quatro andares comeria um terço dela. */
.slide:not(.capa){padding:0}
.tira{
  position:absolute;left:80px;right:80px;top:10px;height:48px;z-index:5;
  display:flex;align-items:center;gap:24px;
}
.num{
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1;
  color:var(--indigo);opacity:.34;
}
.title{
  font-family:var(--display);font-weight:700;font-size:35px;line-height:1.05;
  letter-spacing:-.02em;color:var(--tinta);
  max-width:none;white-space:nowrap;
}
/* a assinatura do tema: a régua dos períodos.
   Uma célula por slide; a acesa é onde a aula está. */
.regua{display:flex;gap:5px;flex:none}
.regua button{
  width:15px;height:15px;padding:0;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid rgba(76,63,191,.32);
  transition:background .25s,border-color .25s,transform .25s;
}
.regua button:hover{border-color:var(--indigo);transform:translateY(-2px)}
.regua button.feito{background:rgba(76,63,191,.42);border-color:transparent}
.regua button.aqui{
  background:var(--ouro-luz);border-color:var(--ouro);
  box-shadow:0 0 0 3px rgba(226,162,43,.24);
}
.subtitle{font-size:28px;font-weight:300;color:var(--ouro);letter-spacing:.005em;
  white-space:nowrap}

/* área de conteúdo — o palco inteiro, por baixo da tira.
   Como ela cobre o slide todo, as contas da tabela são feitas em
   coordenadas do palco: x e y aqui são os mesmos x e y de 1280x720. */
.body-area{position:absolute;inset:0}

/* ============================================================
   A MESA DOS 118 CUBOS  (slide 1)
   Uma camada que cobre o slide inteiro, para a tabela poder passar
   por baixo do cabeçalho sem ficar presa à caixa do conteúdo. Ela
   não pega o dedo: só o cubo pega.
   ============================================================ */
.cena{position:absolute;inset:0;z-index:4;pointer-events:none}
/* A mesa é plana: quem tem volume são os cubos, cada um no seu
   próprio espaço 3D. Sem 'preserve-3d' aqui, a ordem em que eles se
   cobrem continua a ser a do z-index — e é dela que precisamos para
   pôr por cima o cubo que está girando ou aceso. */
.mesa{
  position:absolute;inset:0;
  transform:translate(var(--px,0px),var(--py,0px)) scale(var(--zoom,1));
}

/* as coordenadas da tabela: o grupo em cima, o período à esquerda.
   Discretas — são a moldura, não o assunto. */
/* O número do eixo é uma bolinha que quase não se vê — e que, quando a
   cruz de um elemento acende, vira a medalha âmbar do app do
   professor. É a mesma peça nos dois estados: assim ela não aparece do
   nada, ela ACENDE. */
.eixo{
  position:absolute;display:grid;place-items:center;
  width:19px;height:19px;border-radius:50%;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;line-height:1;
  color:var(--tinta-faint);background:transparent;border:1px solid transparent;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:opacity .3s,color .25s,background .25s,border-color .25s,transform .25s;
}
/* a família que sobe passa por cima do número do grupo dela; o número
   dá-lhe passagem e volta quando ela pousa */
.eixo.recuado{opacity:0}
.eixo.acesa{
  background:var(--ouro-luz);border-color:var(--ouro);color:#fff;font-weight:600;
  transform:translate(-50%,-50%) scale(1.28);
}

/* ============================================================
   AS COORDENADAS DE UM ELEMENTO
   O sistema do slide 3 da aula do professor, trazido para cá: o
   elemento salta, dá a volta e cai no mesmo lugar — e enquanto está no
   ar, a linha e a coluna dele acendem inteiras, os dois números viram
   medalha, e o resto da tabela recua. É o encontro das duas faixas que
   dá o lugar dele, e é isso que a cena mostra sem dizer.
   ============================================================ */
.mesa.tem-cruz .pc{transition:transform var(--tsobe,.42s) var(--e-salto),opacity .35s ease}
.mesa.tem-cruz .pc:not(.cruz){opacity:.34}
.pc.escolhido{z-index:12}
.pc.escolhido .cubo{--sc:1.18}
.pc.escolhido .face{box-shadow:0 0 0 2px rgba(226,162,43,.9), 0 10px 24px rgba(80,40,0,.34)}

/* a faixa que acende a linha (ou a coluna) inteira, número junto */
.banda{
  position:absolute;opacity:0;pointer-events:none;z-index:0;border-radius:10px;
  background:rgba(226,162,43,.18);border:1px solid rgba(226,162,43,.5);
  transition:top .3s cubic-bezier(.3,.85,.3,1),left .3s cubic-bezier(.3,.85,.3,1),
             width .3s ease,height .3s ease,opacity .3s ease;
}
.banda.on{opacity:1}

/* a ficha do escolhido, no vazio que a tabela tem acima dos metais de
   transição — o mesmo lugar onde ela mora na aula do professor */
.ficha{
  position:absolute;z-index:8;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  font-family:var(--display);line-height:1;
}
.ficha.on{opacity:1}
.ficha span{font-family:var(--mono);font-size:19px;color:var(--tinta-dim);margin-bottom:5px}
.ficha b{font-size:58px;font-weight:600;color:var(--indigo);letter-spacing:-.02em}
/* e os nomes das duas coordenadas, ao lado dela */
.coords-el{
  position:absolute;z-index:8;transform:translateY(-50%);pointer-events:none;
  display:flex;flex-direction:column;gap:9px;
}
.coords-el span{
  opacity:0;transition:opacity .3s ease;white-space:nowrap;
  font-family:var(--display);font-weight:500;font-size:23px;color:var(--tinta);
}
.coords-el span.on{opacity:1}
.coords-el b{color:var(--ouro);font-weight:700}

/* A CASA — o encaixe vazio onde o cubo pousa. É ela que faz a sombra
   do cubo: um cubo sem chão flutua, e a tabela deixa de ser uma mesa. */
.casa{
  position:absolute;transform:translate(-50%,-50%);
  border-radius:2px;background:rgba(32,28,66,.07);
  box-shadow:inset 0 1px 2px rgba(32,28,66,.10);
  pointer-events:none;
}
/* as duas casas que guardam as séries: elas não têm elemento dentro,
   têm um bilhete dizendo onde procurar */
.casa.serie{
  display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;line-height:1.4;text-align:center;
  color:var(--tinta-dim);background:rgba(139,63,190,.10);
  border:1px dashed rgba(139,63,190,.45);
}
.casa.serie.act{background:rgba(177,64,140,.10);border-color:rgba(177,64,140,.45)}

/* ---------- O CUBO ----------
   Cada elemento é um cubo de seis faces iguais: em todas elas o mesmo
   número atômico, o mesmo símbolo, a mesma massa e o mesmo nome. É
   assim de propósito — o cubo pode girar para qualquer lado, em
   qualquer jogo, que a informação nunca se perde de vista.

   A perspectiva é de cada cubo, e não do palco inteiro: cada um tem o
   seu ponto de fuga, e por isso o da ponta da tabela não sai deitado
   quando gira. */
/* O SALTO E A SUBIDA vão na carta, e não no cubo: o cubo já usa o
   transform dele para os três giros, e animar a mesma propriedade nos
   dois lugares apagaria um deles. Aqui a peça sobe e desce; lá dentro,
   ela gira. As duas coisas podem acontecer ao mesmo tempo. */
.pc{
  position:absolute;width:var(--L,58px);height:var(--L,58px);
  /* --onda é o crescer das ondas da narração; o brilho delas vai num
     filter escrito à mão, só enquanto a onda passa — um filter fixo nos
     118 obrigaria o navegador a manter 118 camadas acesas à toa */
  transform:translate(-50%,-50%) translateY(var(--sobe,0px)) scale(var(--onda,1));
  transition:transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease;
  perspective:var(--persp,620px);
  pointer-events:auto;cursor:pointer;
}
/* quem está no ar passa por cima de quem ficou na mesa */
.pc.sobe{z-index:6}
/* A ordem importa: o LEVANTAR (--dz) vem primeiro, para ser sempre na
   direção do olho e não na do cubo já virado; depois a CORREÇÃO da
   leitura (--rzc), que é um giro no plano da tela; e só então os três
   giros do cubo. */
.cubo{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:translateZ(var(--dz,0px)) rotateZ(var(--rzc,0deg))
            rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg))
            scale(var(--sc,1));
  transition:transform var(--dur,.7s) var(--curva,cubic-bezier(.3,.85,.3,1));
}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:calc(3px * var(--k,1)) calc(4px * var(--k,1)) calc(4px * var(--k,1));
  background:linear-gradient(145deg,color-mix(in srgb,var(--cor) 84%,#fff),
                                    color-mix(in srgb,var(--cor) 86%,#000));
  border:1px solid rgba(255,255,255,.24);
  backface-visibility:hidden;
  overflow:hidden;
}
/* o vidro por cima: claro no alto, some antes da metade */
.face::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 42%)}
/* as seis faces do cubo, meio lado para fora cada uma */
.f1{transform:translateZ(var(--H,29px))}
.f2{transform:rotateY( 90deg) translateZ(var(--H,29px))}
.f3{transform:rotateY(180deg) translateZ(var(--H,29px))}
.f4{transform:rotateY(-90deg) translateZ(var(--H,29px))}
.f5{transform:rotateX( 90deg) translateZ(var(--H,29px))}
.f6{transform:rotateX(-90deg) translateZ(var(--H,29px))}
/* as faces de lado escurecem um fio: é o que dá volume ao cubo
   enquanto ele roda. Paradas, as seis são a mesma carta. */
.f2,.f4{filter:brightness(.93)}
.f5,.f6{filter:brightness(1.05)}
.f3{filter:brightness(.88)}

.face i,.face b,.face u,.face em{
  position:relative;z-index:3;font-style:normal;text-decoration:none;color:#fff;
}
/* A letra da carta anda com o tamanho do cubo: --k é o quanto ele é
   maior do que a carta da tabela. Na tabela vale 1; nos blocos
   gigantes da capa, quase dois e meio. Uma conta só, e as quatro
   linhas da face crescem todas juntas, na mesma proporção. */
.face i{font-family:var(--mono);font-size:calc(9.5px * var(--k,1));line-height:1;
  letter-spacing:.02em;align-self:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.face b{flex:1;display:grid;place-items:center;
  font-family:var(--display);font-weight:500;font-size:calc(21px * var(--k,1));line-height:1;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
.face u{font-family:var(--mono);font-size:calc(7.8px * var(--k,1));line-height:1.1;
  text-align:center;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.face em{
  font-size:calc(var(--fn,7px) * var(--k,1));line-height:1.15;text-align:center;font-weight:400;
  color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);
  white-space:nowrap;overflow:hidden;text-overflow:clip;
}

/* a entrada: cada cubo nasce do nada, passa do tamanho e assenta */
@keyframes pousa{
  0%  {opacity:0;transform:rotateY(-90deg) scale(.3)}
  62% {opacity:1;transform:rotateY(10deg)  scale(1.14)}
  100%{opacity:1;transform:rotateY(0deg)   scale(1)}
}
.pc.pousando .cubo{animation:pousa .62s cubic-bezier(.2,.9,.3,1) both}

/* GIRANDO — um cubo a meio de uma volta é mais largo do que a casa
   dele: a quina sai para os lados. Enquanto roda, ele passa por cima
   dos vizinhos, senão a volta aparece recortada pelas cartas ao lado. */
.pc.girando{z-index:7}

/* O CHAMADO — o cubo que a narração está apontando. Sobe um pouco,
   cresce e ganha um halo âmbar: dá para achá-lo no meio dos 118 mesmo
   do fundo da sala. */
.pc.aceso{z-index:9}
.pc.aceso .cubo{--sc:1.14;--dz:10px}
.pc.aceso .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 0 22px 4px rgba(226,162,43,.55)}
/* o apagado: quando a narração fala de um grupo, os outros recuam */
.pc.apagado .cubo{--sc:.96}
.pc.apagado .face{filter:saturate(.22) brightness(1.06) opacity(.55)}

/* O VERDE — o elemento que a narração sorteia: cresce e acende. */
.pc.verde{z-index:9}
.pc.verde .cubo{--sc:1.4;--dz:12px;--dur:.3s}
.pc.verde .face{box-shadow:0 0 0 2px #3EE08A, 0 0 26px 7px rgba(46,204,113,.78)}

/* O ELEITO — o que o aluno tocou: sai da casa a girar e a crescer, e
   pousa no vazio acima do ferro e do cobalto */
.pc.eleito{z-index:40;pointer-events:none}
.pc.eleito .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 18px 40px rgba(32,28,66,.35),
                            0 0 40px rgba(226,162,43,.5)}

/* ---- o eleito, pousado: o número e a massa em foco ----
   O número cresce a partir do canto dele (em cima, à esquerda), para
   não sair pela borda da face, que corta o que passa; a massa cresce do
   meio. Estão nas seis faces, e crescem nas seis. */
.face i{transform-origin:left top;transition:transform .35s var(--e-salto), text-shadow .35s ease}
.face u{transition:transform .35s var(--e-salto), text-shadow .35s ease}
.face b,.face em{transition:transform .35s var(--e-salto)}
/* O QUE CRESCE PEDE LICENÇA AOS VIZINHOS. A face é pequena, e crescido
   o número caía em cima do símbolo, e a massa em cima do nome. Por isso
   eles crescem um pouco menos — e, enquanto crescem, o símbolo encolhe
   e afasta-se do número, e o nome desce um fio para dar lugar à massa. */
.pc.foco-num .face i{
  transform:scale(1.75);color:#FFF6D2;
  text-shadow:0 0 6px rgba(255,208,90,1), 0 0 14px rgba(255,190,60,.8), 0 1px 3px rgba(0,0,0,.6);
}
.pc.foco-num .face b{transform:translate(4px,4px) scale(.84)}
.pc.foco-massa .face u{
  transform:scale(1.7);color:#FFF6D2;
  text-shadow:0 0 6px rgba(255,208,90,1), 0 0 14px rgba(255,190,60,.8), 0 1px 3px rgba(0,0,0,.6);
}
.pc.foco-massa .face b {transform:translateY(-3px) scale(.88)}
.pc.foco-massa .face em{transform:translateY(2.5px) scale(.92)}
.pc.pulsa .face{box-shadow:0 0 0 3px var(--ouro-luz), 0 0 60px 14px rgba(226,162,43,.7)}
/* ---- os eventos da "1.3A" ----
   As pulsadas de uma peça da face (o símbolo, o nome) vão numa escala
   escrita a cada tique; a transição é curta para seguir o tique. */
.pc.pulsa-sym .face b {transform:scale(var(--psym,1));transition:transform 80ms linear}
/* o símbolo partido em duas letras (só no card do escolhido, na "1.3B"):
   lado a lado, e a segunda pulsa sozinha */
.face b .sym{display:inline-flex;align-items:baseline}
.face b .l1,.face b .l2{display:inline-block}
/* a segunda letra cresce a partir da esquerda dela, para a direita: a
   partir do meio avançava sobre a primeira e as duas colavam */
.pc.pulsa-l2 .face b .l2{transform:scale(var(--pl2,1));transform-origin:left 78%;
  transition:transform 80ms linear}
.pc.pulsa-nome .face em{transform:scale(var(--pnome,1));transition:transform 80ms linear}
/* o nome a pulsar cresce para cima, por cima da massa: ela dá licença,
   sobe um fio e encolhe enquanto ele pulsa */
.pc.pulsa-nome .face u{transform:translateY(-3px) scale(.82);transition:transform 120ms ease-out}
/* as ondas de um em um: âmbar a dos de duas letras, marrom a dos que
   têm o nome a começar pelo símbolo */
.pc.luz-onda .face  {box-shadow:0 0 0 2px var(--ouro-luz), 0 0 18px 4px rgba(226,162,43,.6)}
.pc.luz-marrom .face{box-shadow:0 0 0 2px #8B5A2B, 0 0 24px 7px rgba(139,90,43,.8)}
/* e vinho a da "1.4": os que têm o símbolo sem nada a ver com o nome */
.pc.luz-vinho .face {box-shadow:0 0 0 2px #9C2F4A, 0 0 24px 7px rgba(156,47,74,.75)}
/* o nome escondido enquanto o elemento está lá fora ("1.4"): some, e na
   hora dele volta a aparecer, e pulsa */
.pc.nome-oculto .face em{color:transparent;text-shadow:none}
/* o F, o Ca e o O, a crescer no lugar: por cima de todos */
.pc.zoom-el{z-index:46}
.pc.zoom-el .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 16px 36px rgba(12,10,32,.35),
                              0 0 36px rgba(226,162,43,.55)}
.pc.zoom-el .face em{transition:color .35s ease, transform 80ms linear}

/* medir é fotografar em repouso, também por dentro do cubo */
.pc.medindo *{transition:none!important}

/* os nomes do que cresce, à esquerda do card, a apontar para ele */
.rotulo-el{
  position:absolute;z-index:41;transform:translate(-100%,-50%);
  display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none;
  font-family:var(--display);font-weight:600;font-size:25px;color:var(--tinta);
  opacity:0;transition:opacity .35s ease, color .35s ease, text-shadow .35s ease;
}
.rotulo-el.on{opacity:1}
.rotulo-el svg{flex:none;color:var(--ouro)}
.rotulo-el.brilha{
  color:var(--ouro);
  text-shadow:0 0 16px rgba(226,162,43,.9), 0 0 34px rgba(226,162,43,.5);
}

/* ---- o quiz ----
   Mora DENTRO da mesa, entre os cubos: o fundo escuro fica por cima da
   tabela, o cartão por cima do fundo, e o cubo da pergunta por cima do
   cartão. Fora da mesa isto não era possível — a mesa inteira desenha-se
   numa camada só, e o cubo ficava por baixo do fundo escuro. */
.quiz{
  position:absolute;inset:0;z-index:20;
  background:rgba(12,10,32,.55);
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
.quiz.on{opacity:1;pointer-events:auto}
.quiz-card{
  position:absolute;left:640px;top:372px;width:860px;min-height:330px;
  padding:34px 40px 28px 350px;border-radius:22px;text-align:left;
  background:#FFFDF8;border:1px solid var(--ouro-dim);
  box-shadow:0 30px 80px rgba(12,10,32,.45);
  transform:translate(-50%,-50%) scale(.92);opacity:0;
  transition:transform .5s var(--e-salto), opacity .35s ease;
}
.quiz.card-on .quiz-card{transform:translate(-50%,-50%);opacity:1}
/* a luz por trás do cubo, na coluna esquerda do cartão */
.quiz-card::before{
  content:'';position:absolute;left:40px;top:50%;width:260px;height:260px;margin-top:-130px;
  border-radius:50%;background:radial-gradient(circle,rgba(226,162,43,.3),transparent 70%);
}
.quiz-marca{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ouro);margin-bottom:8px}
.quiz-q{margin:0 0 20px;font-family:var(--display);font-weight:600;font-size:32px;
  line-height:1.15;color:var(--tinta)}
.quiz-ops{display:flex;flex-direction:column;gap:12px}
.quiz-op{
  height:56px;padding:0 24px;border-radius:14px;text-align:left;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:24px;color:var(--tinta);
  background:#fff;border:2px solid var(--indigo-dim);
  box-shadow:0 4px 12px rgba(32,28,66,.08);
  transition:transform .22s var(--e-salto), border-color .2s, background .3s, color .3s, opacity .3s;
}
.quiz-op:hover:not(:disabled){border-color:var(--indigo);transform:translateX(5px)}
.quiz-op:disabled{cursor:default}
.quiz-op.certa{
  background:linear-gradient(135deg,#3CC47A,#1F8A4C);color:#fff;border-color:transparent;
  box-shadow:0 0 0 3px rgba(62,224,138,.45), 0 0 30px rgba(46,204,113,.6);
}
.quiz-op.errada{background:linear-gradient(135deg,#D9546E,#A92742);color:#fff;border-color:transparent}
.quiz-op.fora{opacity:.35}
.quiz-msg{min-height:28px;margin-top:14px;font-family:var(--display);font-weight:600;font-size:21px}
.quiz-msg.ok{color:#1F8A4C}
.quiz-msg.erro{color:#B42E48}

/* durante o quiz o play sai de cena: quem faz a aula andar é a escolha */
#stage.em-quiz #som, #stage.em-quiz #som-dica{display:none!important}
/* e com a tela escura também: ali o que faz a aula seguir é o toque na tela */
#stage.tela-escura #som, #stage.tela-escura #som-dica{display:none!important}

/* ---- o cartão da nota, no fim do quiz ---- */
.nota-card{
  position:absolute;left:640px;top:360px;width:580px;padding:32px 44px 30px;
  border-radius:24px;text-align:center;
  background:#FFFDF8;border:1px solid var(--ouro-dim);
  box-shadow:0 30px 80px rgba(12,10,32,.45);
  transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;
  transition:transform .6s var(--e-salto), opacity .35s ease;
}
.quiz.nota-on .nota-card{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.nota-rotulo{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ouro)}
.nota-valor{margin:6px 0 4px;font-family:var(--display);font-weight:700;line-height:1;color:var(--indigo)}
.nota-num{font-size:128px;letter-spacing:-.04em}
.nota-de{font-size:36px;color:var(--tinta-faint);margin-left:4px}
.nota-acertos{font-size:20px;color:var(--tinta-dim);margin-bottom:14px}
.nota-msg{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.25;color:var(--ouro)}
.quiz.sem-seta .nota-seta{display:none}
.nota-seta{margin-top:20px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--tinta-faint)}

/* o cubo da pergunta: à frente do cartão, e com um "?" no lugar do nome */
.pc.pergunta{z-index:45;pointer-events:none}
.pc.pergunta .face{box-shadow:0 0 0 2px var(--ouro-luz), 0 18px 40px rgba(12,10,32,.4),
                                0 0 44px rgba(226,162,43,.55)}
.pc.sem-nome .face em{color:transparent;text-shadow:none}
.pc.sem-nome .face em::after{
  content:'?';position:absolute;left:0;right:0;top:0;text-align:center;
  color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* o erro: a tela treme e pisca de vermelho. O tremor vai em 'translate',
   que se soma ao transform com que o palco se ajusta à janela. */
#stage.treme{animation:telaTreme .5s ease}
@keyframes telaTreme{0%,100%{translate:0 0} 15%{translate:-14px 0} 30%{translate:12px 0}
  45%{translate:-9px 0} 60%{translate:7px 0} 75%{translate:-4px 0}}
#flash-erro{
  position:absolute;inset:0;z-index:90;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(220,38,60,.12),rgba(220,38,60,.55));
}
#flash-erro.on{animation:flashErro .75s ease-out}
@keyframes flashErro{0%{opacity:0} 15%{opacity:1} 100%{opacity:0}}

.confete{position:absolute;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ---- a tela escura do slide 1 ----
   Cai por cima de tudo o que é do slide, mas não do botão da narração,
   que mora no palco e continua à mão. */
.veu{
  position:absolute;inset:0;z-index:30;
  background:rgba(12,10,32,.87);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .8s ease;
}
.veu.on{opacity:1;pointer-events:auto}
.veu-frases{width:1040px;text-align:center}
.veu .frase{
  display:none;margin:0 0 18px;
  font-family:var(--display);font-weight:600;font-size:46px;line-height:1.15;
  letter-spacing:-.015em;color:#F4F2F8;
}
.veu .frase:nth-child(2){color:var(--ouro-luz)}
.veu .frase.on{display:block}
.veu .frase .cursor{
  display:inline-block;width:4px;height:.9em;margin-left:6px;vertical-align:-.1em;
  background:var(--ouro-luz);border-radius:1px;
}
.veu .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
.toque-continuar{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
  font-family:var(--mono);font-size:14px;letter-spacing:.26em;text-transform:uppercase;
  color:#F4F2F8;opacity:0;transition:opacity .5s ease;pointer-events:none;white-space:nowrap;
}
/* visível por si, e a respirar por cima: sem animação (movimento
   reduzido no aparelho) o pedido continua lá */
.toque-continuar.on{opacity:1;animation:respira 2.2s ease-in-out infinite}
@keyframes respira{0%,100%{opacity:.4} 50%{opacity:1}}
.veu.pede-toque{cursor:pointer}

/* o convite para escolher um elemento, no rodapé do slide */
.dica-escolha{
  position:absolute;left:50%;bottom:18px;z-index:20;transform:translateX(-50%) translateY(10px);
  padding:10px 22px;border-radius:30px;white-space:nowrap;pointer-events:none;
  background:rgba(255,255,255,.94);border:1px solid var(--ouro-dim);
  font-family:var(--display);font-weight:600;font-size:17px;color:var(--ouro);
  opacity:0;transition:opacity .4s ease, transform .4s var(--e-salto);
}
.dica-escolha.on{opacity:1;transform:translateX(-50%) translateY(0);
  animation:somChama 2.6s ease-in-out infinite}

/* ---- o botão vira "Iniciar" quando a abertura acaba ----
   Cresce para a esquerda, a partir do canto onde estava: o lado direito
   dele fica no mesmo sítio, e a borda do palco não o corta. */
#som .rotulo-iniciar{display:none}
#som.iniciar{width:auto!important;padding:0 24px 0 28px;border-radius:30px}
#som.iniciar .anel,#som.iniciar .icone{display:none}
#som.iniciar .rotulo-iniciar{
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em;
}
#stage .solto#som.iniciar{transform:translate(calc(-100% + 29px),-50%) scale(var(--esc,1))}
#stage .solto#som.iniciar:hover{
  transform:translate(calc(-100% + 29px),-50%) scale(var(--esc,1)) translateY(-3px)}

/* ============================================================
   O BOTÃO DA NARRAÇÃO — canto de baixo, à direita
   É o único comando do aluno nesta tela: aperta, e a aula anda
   sozinha. O anel em volta é o quanto do áudio já correu.
   ============================================================ */
#som{
  position:absolute;right:26px;bottom:22px;z-index:12;
  width:58px;height:58px;padding:0;cursor:pointer;
  display:grid;place-items:center;
  background:rgba(255,255,255,.92);border:1px solid var(--ouro-dim);
  border-radius:50%;backdrop-filter:blur(9px);
  box-shadow:0 12px 30px rgba(32,28,66,.22);
  /* o âmbar do "Tabela Periódica": o botão é da cor do que a capa tem
     de mais importante escrito nela */
  color:var(--ouro);
  transition:transform .25s var(--e-salto),box-shadow .25s,color .2s,border-color .2s;
}
#som:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(32,28,66,.26)}
/* PARADO, ELE CHAMA. Um brilho que respira e um anel que se abre e se
   desfaz: é ali que a aula começa, e quem nunca viu esta tela precisa
   de o descobrir. A tocar, cala-se — já foi encontrado. */
#som.parado{animation:somChama 2.6s ease-in-out infinite}
@keyframes somChama{
  0%,100%{box-shadow:0 12px 30px rgba(32,28,66,.22),
                     0 0 22px rgba(226,162,43,.45),
                     0 0 0 0 rgba(226,162,43,.5)}
  55%    {box-shadow:0 12px 30px rgba(32,28,66,.22),
                     0 0 34px rgba(226,162,43,.75),
                     0 0 0 14px rgba(226,162,43,0)}
}
/* solto pela montagem, ele vive por left/top e um transform próprio —
   o pulinho do hover tem de ser somado a esse, e não escrito por cima */
#stage .solto#som:hover{transform:translate(-50%,-50%) scale(var(--esc,1)) translateY(-3px)}
#som.tocando{border-color:rgba(169,107,16,.4)}
/* sem o arquivo do áudio ainda no lugar, o botão fica à vista mas
   apagado: o lugar dele não dança quando a narração chegar */
#som.mudo{opacity:.72}
#som .anel{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#som .anel circle{fill:none;stroke-width:2.5;stroke-linecap:round}
#som .trilho{stroke:rgba(169,107,16,.18)}
#som .curso{stroke:var(--ouro-luz);
  stroke-dasharray:var(--volta,163);stroke-dashoffset:var(--falta,163);
  transition:stroke-dashoffset .2s linear}
#som .icone{position:relative;z-index:2;display:grid;place-items:center;
  width:22px;height:22px}
#som .icone svg{display:block}
#som .icone svg[hidden]{display:none}
/* slide sem narração: o botão sai de cena inteiro */
#som[hidden],#som-dica[hidden]{display:none}
/* o nome do que o botão faz, para quem nunca viu esta tela. Fica à
   ESQUERDA do botão, e não por cima dele: em cima ele cairia na última
   linha da tabela, que chega até ali. */
#som-dica{
  position:absolute;right:96px;bottom:38px;z-index:12;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tinta-faint);text-align:right;pointer-events:none;white-space:nowrap;
  transition:opacity .4s;
}
#som-dica.fora{opacity:0}

/* ---------- barra de controles ----------
   A mesma barra do app do professor, reduzida ao que o aluno precisa:
   ir e voltar entre a capa e a tabela. */
#bar{
  position:fixed;left:50%;bottom:18px;z-index:70;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;padding:7px 9px;
  background:rgba(255,255,255,.92);border:1px solid var(--indigo-dim);
  border-radius:14px;backdrop-filter:blur(9px);
  box-shadow:0 12px 34px rgba(32,28,66,.2);
  transition:transform .42s var(--e-desl),opacity .3s;
}
#bar.hidden{transform:translateX(-50%) translateY(140%);opacity:0;pointer-events:none}
#bar .btn{
  position:relative;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:0;border-radius:9px;color:var(--tinta-dim);
  transition:background .2s,color .2s;
}
#bar .btn:hover{background:rgba(76,63,191,.12);color:var(--indigo)}
/* o botão aceso: o modo que ele abriu está em cena */
#bar .btn.on{background:rgba(226,162,43,.26);color:var(--ouro)}
#bar .sep{width:1px;height:22px;background:var(--indigo-dim);margin:0 3px}
#counter{font-family:var(--mono);font-size:13px;color:var(--tinta-dim);
  min-width:58px;text-align:center;user-select:none}
#counter b{color:var(--tinta);font-weight:500}

/* a alça que chama a barra: a única coisa da interface que fica em
   cena durante a aula */
#puxador{
  position:fixed;left:50%;bottom:0;z-index:69;transform:translateX(-50%);
  width:82px;height:18px;cursor:pointer;border:0;
  background:transparent;display:grid;place-items:center;
  transition:transform .35s var(--e-desl),opacity .3s;
}
#puxador::before{content:'';width:46px;height:4px;border-radius:3px;
  background:rgba(76,63,191,.4);transition:background .25s,width .25s}
#puxador:hover::before{background:var(--ouro-luz);width:60px}
#puxador.fora{transform:translateX(-50%) translateY(120%);opacity:0;pointer-events:none}

/* ---------- visão geral (tecla O) ----------
   As miniaturas não são desenhos dos slides: são os próprios slides,
   copiados e postos em escala. O que estiver dentro deles aparece ali
   — a tabela montada, os cubos como estiverem virados, a carta que a
   narração deixou acesa. */
#overview{
  position:fixed;inset:0;z-index:80;background:rgba(237,234,242,.97);
  backdrop-filter:blur(8px);padding:44px 52px;overflow-y:auto;
}
#overview[hidden]{display:none}
#overview h2{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:24px;font-weight:400;text-align:center}
/* auto-FIT, e não auto-fill: as colunas que sobram encolhem a zero, e
   dois slides ficam mesmo no meio da tela em vez de encostados à
   esquerda de uma fila de lugares vazios. Enquanto a aula for curta os
   cartões crescem até 340; quando os onze slides chegarem, a fila se
   parte em linhas sozinha. */
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,340px));
  justify-content:center;gap:20px}
.card{
  position:relative;aspect-ratio:16/9;padding:0;cursor:pointer;text-align:left;display:block;
  background:var(--fundo);border:1px solid var(--indigo-dim);border-radius:8px;
  color:inherit;font:inherit;overflow:hidden;
  box-shadow:0 4px 14px rgba(32,28,66,.08);
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.card:hover{border-color:var(--indigo);transform:translateY(-3px);box-shadow:0 10px 24px rgba(32,28,66,.16)}
/* o cartão do slide em que a aula está: âmbar, como a casa acesa da régua */
.card.aqui{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro-dim),0 8px 20px rgba(32,28,66,.14)}
.mini{position:absolute;inset:0;overflow:hidden}
.mini-palco{
  position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  pointer-events:none;
}
.mini-palco .slide{opacity:1;visibility:visible}
/* na miniatura nada se mexe: ela é uma fotografia do slide */
.mini-palco *{animation:none!important;transition:none!important}
/* a tabelinha da capa mora fora do slide, no palco; a miniatura leva
   uma cópia dela para que a capa ali seja mesmo a capa */
.mini-marca{position:absolute;width:600px;right:20px;bottom:96px;pointer-events:none}
.mini-marca .cel{stroke:rgba(255,255,255,.72);stroke-width:.5}
.card .rot{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 12px 10px;
  background:linear-gradient(0deg,rgba(255,255,255,.97) 46%,rgba(255,255,255,0));
}
.card .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tinta-faint)}
.card .t{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.2;margin-top:2px}

/* ============================================================
   MODO MONTAGEM (tecla G) — a capa vira mesa de trabalho
   Ferramenta de montagem, não de aula: grade de 40px, e tudo o que
   está na capa passa a se pegar com a mão — um dedo arrasta, dois
   mudam o tamanho, a roda do mouse também. O Ctrl+C copia as posições
   e os tamanhos de tudo, e é esse texto que volta para mim: com ele eu
   fixo no arquivo, como valores, o que foi arrumado à mão aqui.
   ============================================================ */
#guias{position:absolute;inset:0;z-index:7;pointer-events:none;display:none;
  background-image:
    linear-gradient(rgba(76,63,191,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,63,191,.2) 1px,transparent 1px);
  background-size:40px 40px}
body.montagem #guias{display:block}
#coord{position:absolute;z-index:20;display:none;transform:translate(-50%,-140%);
  font-family:var(--mono);font-size:12px;padding:4px 8px;white-space:nowrap;border-radius:3px;
  background:var(--tinta);color:#fff;pointer-events:none}
body.montagem #coord.on{display:block}

/* Medir é fotografar a peça em repouso.
   Cortar transição e animação faz a peça saltar para onde ela ia
   parar: sem isso, quem apertasse o G no meio de uma entrada congelaria
   a peça no meio do voo, e ela ficaria morando lá.
   E o texto ainda encolhe até o próprio conteúdo — sem isso o título
   "seria" uma faixa da largura da coluna, e não a da letra escrita, e o
   centro dele cairia no meio da tela em vez de no meio da frase. */
.medindo{transition:none!important;animation:none!important}
.medindo.encolhe{width:max-content!important}

/* solto = tirado do fluxo e passando a viver por x, y e escala.
   A peça não se mexe ao ser solta: ela é congelada exatamente onde o
   layout a tinha posto — a medida é tirada da caixa já desenhada na
   tela, com a escala que ela tivesse, e a partir daí a escala é 1.
   Vai com o #stage à frente por causa da foto do autor: ela tem um
   scale(1.15) próprio, num seletor de duas classes, e sem o peso do id
   este transform perdia para ele — a foto era medida já crescida e
   depois crescia outra vez. */
#stage .solto{
  position:absolute;margin:0!important;max-width:none;
  /* duas escalas na mesma conta: a que a montagem pinçou, e a do
     destaque da narração. Cada uma mexe na sua, sem apagar a outra. */
  /* e o salto (--sobe) antes da escala: os blocos gigantes são peças
     soltas também, e sem ele aqui o pulinho deles era apagado por este
     transform — só a volta aparecia */
  transform:translate(-50%,-50%) translateY(var(--sobe,0px))
            scale(calc(var(--esc,1) * var(--luz,1)));
  /* o que viaja aqui é só o crescer do destaque e o salto. O LUGAR não:
     uma peça na mão não pode ter inércia, tem de ir para onde o dedo está. */
  transition:transform var(--tsobe,.42s) var(--e-salto), filter .42s ease, box-shadow .42s ease;
}
#stage .solto.pego{transition:none!important}
body.montagem .solto{
  cursor:move;touch-action:none;
  outline:1px dashed rgba(76,63,191,.5);outline-offset:4px;border-radius:2px;
  /* sem isto, arrastar um texto vira seleção de texto, e a foto do
     autor, que é uma imagem, sairia arrastada pelo próprio navegador */
  user-select:none;-webkit-user-select:none;
}
body.montagem .solto img{-webkit-user-drag:none;pointer-events:none}
body.montagem .solto:hover{outline:1px solid var(--ouro);background:rgba(226,162,43,.07)}
/* o que está sendo mexido agora */
body.montagem .solto.pego{outline:1.5px solid var(--ouro);background:rgba(226,162,43,.12)}

/* ---------- a folha das posições (Ctrl+C) ---------- */
#coords{
  position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(680px,92vw);height:min(560px,84vh);display:flex;flex-direction:column;
  background:#FFFDF7;border:1px solid var(--indigo-dim);border-radius:6px;
  box-shadow:0 30px 70px rgba(32,28,66,.32);overflow:hidden;
}
#coords[hidden]{display:none}
#coords .cab{
  flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:15px 14px 13px 19px;border-bottom:1px solid var(--indigo-dim);
  background:rgba(76,63,191,.07);
}
#coords h2{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--indigo);font-weight:400}
#coords .de{margin-top:5px;font-size:13px;font-weight:300;color:var(--tinta-dim)}
#coords .x{
  flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;
  border:1px solid var(--indigo-dim);border-radius:50%;
  background:transparent;color:var(--tinta-dim);cursor:pointer;
}
#coords .x:hover{border-color:var(--indigo);color:var(--indigo)}
#coords textarea{
  flex:1;min-height:0;resize:none;width:100%;background:transparent;color:var(--tinta);
  border:none;padding:14px 19px;font-family:var(--mono);font-size:12.5px;line-height:1.62;
  white-space:pre;
}
#coords textarea:focus{outline:none}
#coords .rod{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 19px 12px;border-top:1px solid var(--indigo-dim);
}
#coords .msg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ouro)}
#coords .hint2{font-size:11.5px;font-weight:300;color:var(--tinta-dim)}

/* ============================================================
   O DESTAQUE — a peça cresce e acende
   O que a narração está a dizer cresce um pouco e ganha um halo
   quente; o que ela já disse volta ao tamanho. Nunca há dois acesos:
   acender um apaga o anterior, e é essa troca que costura a fala à
   tela — o olho vai atrás do que cresceu.

   Nos textos o destaque é palavra a palavra: cada pedaço do título é
   uma peça própria, e cresce sozinho.
   ============================================================ */
.p-audio,.p-inter,.p-tabela{
  display:inline-block;transform-origin:center center;
  transition:transform .42s var(--e-salto), text-shadow .42s ease;
}
/* AS DUAS PALAVRAS DA PRIMEIRA LINHA CRESCEM PARA FORA, cada uma para
   o seu lado: "Audiobook" pela esquerda, ancorada no fim dela, e
   "interativo" pela direita, ancorada no começo. Crescendo a partir do
   centro, uma comia a outra — e com um aumento deste tamanho, comia
   inteira a palavra do lado. Assim o espaço entre elas nunca se mexe.
   "Tabela Periódica" tem a linha só para ela, e cresce do meio. */
.p-audio{transform-origin:right center;margin-right:.14em}
.p-inter{transform-origin:left center}
.p-audio.realce,.p-inter.realce,.p-tabela.realce{
  transform:scale(1.2) translateY(-3px);
  /* o halo quente por fora da letra, e uma sombra por baixo dela: um
     acende, o outro levanta-a do papel */
  text-shadow:0 0 20px rgba(226,162,43,.95), 0 0 40px rgba(226,162,43,.6),
              0 8px 22px rgba(32,28,66,.28);
}
/* as peças soltas — o retrato, a tabelinha, o nome do autor — crescem
   pelo mesmo caminho: --luz entra na conta da escala delas */
#stage .solto.realce{--luz:1.14}
/* o retrato e o nome acendem juntos, e crescendo encostam-se: o nome
   passa por cima da moldura, para a letra nunca ficar tapada */
.capa .foto.realce{
  z-index:5;
  box-shadow:0 0 0 3px rgba(226,162,43,.65), 0 0 52px rgba(226,162,43,.6),
             0 22px 50px rgba(32,28,66,.32);
}
.capa .autor.realce{
  z-index:6;
  text-shadow:0 0 20px rgba(226,162,43,.9), 0 6px 16px rgba(32,28,66,.2);
}
/* a tabelinha já é grande: cresce um pouco menos, para as últimas
   casas não saírem pela borda do palco */
#tabela.realce{--luz:1.12}
#tabela.realce{
  filter:drop-shadow(0 0 16px rgba(226,162,43,.85))
         drop-shadow(0 0 34px rgba(226,162,43,.45))
         drop-shadow(0 10px 22px rgba(32,28,66,.18));
}

/* ============================================================
   A MÃOZINHA — a demonstração dos comandos
   Quando a narração explica onde se aperta, ela vai lá e aperta. Mora
   na janela, e não no palco: os controles são fixos na tela, e ela
   precisa de alcançar tanto o que está no palco como o que está fora.
   ============================================================ */
#mao{
  position:fixed;z-index:100;width:48px;height:48px;pointer-events:none;opacity:0;
  transition:opacity .3s ease,
             left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 3px 7px rgba(32,28,66,.4));
}
#mao[hidden]{display:none}
#mao.on{opacity:1}
#mao svg{display:block;width:100%;height:100%;
  fill:#FFFDF8;stroke:var(--tinta);stroke-width:1.1;stroke-linejoin:round}
/* a onda do toque nasce na ponta do dedo */
#mao .onda{
  position:absolute;left:22px;top:7px;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;border:2.5px solid var(--ouro);opacity:0;
}
#mao.clica svg {animation:maoBate .5s ease}
#mao.clica .onda{animation:maoOnda .62s ease-out}
@keyframes maoBate{0%,100%{transform:scale(1)} 42%{transform:scale(.8)}}
@keyframes maoOnda{0%{opacity:.95;transform:scale(.35)} 100%{opacity:0;transform:scale(4.4)}}

/* a versão, no canto de baixo à esquerda: pequena, e só para quem a
   procura — é por ela que se confere, no aparelho do aluno, se a
   atualização já chegou */
#versao{
  position:absolute;left:14px;bottom:9px;z-index:13;pointer-events:none;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--tinta-faint);
}

/* o aviso curto, quando alguma coisa precisa ser dita ao aluno */
#aviso{
  position:absolute;left:50%;bottom:96px;z-index:14;transform:translateX(-50%) translateY(8px);
  padding:9px 16px;border-radius:10px;
  background:rgba(32,28,66,.92);color:#F4F2F8;
  font-size:13px;letter-spacing:.01em;
  box-shadow:0 12px 30px rgba(32,28,66,.3);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
#aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="progress"></div>
    <svg id="tabela" viewBox="0 0 186 116" aria-hidden="true"></svg>
    <div id="deck"></div>
    <div id="guias" aria-hidden="true"></div>
    <div id="coord" aria-hidden="true"></div>

    <div id="som-dica">tocar a narração</div>
    <button id="som" type="button" data-mont="som" title="Tocar a narração (espaço)" aria-label="Tocar a narração">
      <svg class="anel" viewBox="0 0 58 58" aria-hidden="true">
        <circle class="trilho" cx="29" cy="29" r="26"/>
        <circle class="curso"  cx="29" cy="29" r="26"/>
      </svg>
      <span class="icone">
        <svg id="ic-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8.5 5.6c0-.8.9-1.3 1.6-.9l8.1 5.4c.6.4.6 1.4 0 1.8l-8.1 5.4c-.7.4-1.6-.1-1.6-.9z"/>
        </svg>
        <svg id="ic-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
          <rect x="6.5" y="5" width="4.2" height="14" rx="1.3"/>
          <rect x="13.3" y="5" width="4.2" height="14" rx="1.3"/>
        </svg>
      </span>
    </button>

    <div id="aviso" role="status" aria-live="polite"></div>
    <div id="versao" aria-label="Versão do app"></div>
  </div>
</div>

<nav id="bar" class="hidden" aria-label="Controles">
  <button class="btn" id="prev" title="Voltar (←)" aria-label="Voltar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div id="counter"><b>1</b> / 2</div>
  <button class="btn" id="next" title="Avançar (→)" aria-label="Avançar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="sep"></div>
  <button class="btn" id="over" title="Ver todos os slides (O)" aria-label="Ver todos os slides">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  </button>
  <button class="btn" id="full" title="Tela cheia (F)" aria-label="Tela cheia">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div class="sep"></div>
  <!-- a montagem: fora da aula, é aqui que a capa se arruma -->
  <button class="btn" id="mont-btn" title="Modo montagem: arrastar e redimensionar (G)" aria-label="Modo montagem">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v19M2.5 12h19"/><path d="M12 2.5l-2.6 2.8M12 2.5l2.6 2.8M12 21.5l-2.6-2.8M12 21.5l2.6-2.8"/><path d="M2.5 12l2.8-2.6M2.5 12l2.8 2.6M21.5 12l-2.8-2.6M21.5 12l-2.8 2.6"/></svg>
  </button>
  <button class="btn" id="copia-btn" title="Copiar posições e tamanhos (Ctrl+C)" aria-label="Copiar posições e tamanhos" hidden>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M15 5.5A2.5 2.5 0 0012.5 3H5.5A2.5 2.5 0 003 5.5v7A2.5 2.5 0 005.5 15"/></svg>
  </button>
  <button class="btn" id="bar-close" title="Esconder os controles (Esc)" aria-label="Esconder os controles">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</nav>

<button id="puxador" aria-label="Mostrar os controles" aria-expanded="false"></button>

<!-- o menu do endereço: botão direito, ou o dedo demorado no tablet -->
<div id="menu-email" role="menu" hidden>
  <button type="button" role="menuitem" id="copia-email">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M15 5.5A2.5 2.5 0 0012.5 3H5.5A2.5 2.5 0 003 5.5v7A2.5 2.5 0 005.5 15"/></svg>
    Copiar e-mail
  </button>
</div>

<!-- a mãozinha da demonstração: o ícone de um dedo a tocar -->
<div id="mao" hidden aria-hidden="true">
  <svg viewBox="0 0 24 24">

<script>
/* ============================================================
   OS SLIDES
   A estrutura é a da aula do professor — capa, e depois os slides de
   conteúdo com número, título, régua e subtítulo. Aqui só existem os
   dois primeiros: a capa e a tabela pronta. Os outros entram nesta
   lista quando chegarem, e o resto do arquivo não muda.
   ============================================================ */
const SLIDES = [
  { kind:'capa',
    title:'Audiobook interativo da Tabela Periódica Moderna',
    autor:'Designed by Prof. Amauri Junior' },

  { title:'A Tabela Periódica',
    subtitle:'Os 118 elementos' }

/* A VERSÃO DO APP — sobe a cada mudança publicada. É daqui, e só daqui,
   que ela sai: o selo no canto de baixo à esquerda mostra-a, e o service
   worker recebe-a no endereço com que é registado (sw.js?v=…). Mudando
   este texto, muda o endereço, o aparelho instala o serviço novo e o
   cache velho vai-se embora — não há uma segunda versão para esquecer. */
const VERSAO = 'v1.6';

/* ============================================================
   OS ELEMENTOS
   Símbolos, massas e nomes. As massas são as mesmas do app do
   professor — arredondadas —, para os dois falarem os mesmos números
   diante da turma.
   ============================================================ */
const SIMBOLOS = (
  'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn ' +
  'Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce ' +
  'Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn ' +
  'Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl ' +
  'Mc Lv Ts Og').split(' ');

const MASSAS = [
  1,4,7,9,11,12,14,16,19,20,23,24,27,28,31,32,35,40,39,40,
  45,48,51,52,55,56,59,59,64,65,70,73,75,79,80,84,85,88,89,91,
  93,96,98,101,103,106,108,112,115,119,122,128,127,131,133,137,139,140,141,144,
  145,150,152,157,159,163,165,167,169,173,175,178,181,184,186,190,192,195,197,201,
  204,207,209,209,210,222,223,226,227,232,231,238,237,244,243,247,247,251,252,257,
  258,259,266,267,268,269,270,269,278,281,282,285,286,289,290,293,294,294
];

const NOMES = (

  'Sódio|Magnésio|Alumínio|Silício|Fósforo|Enxofre|Cloro|Argônio|Potássio|Cálcio|' +
  'Escândio|Titânio|Vanádio|Cromo|Manganês|Ferro|Cobalto|Níquel|Cobre|Zinco|' +
  'Gálio|Germânio|Arsênio|Selênio|Bromo|Criptônio|Rubídio|Estrôncio|Ítrio|Zircônio|' +
  'Nióbio|Molibdênio|Tecnécio|Rutênio|Ródio|Paládio|Prata|Cádmio|Índio|Estanho|' +
  'Antimônio|Telúrio|Iodo|Xenônio|Césio|Bário|Lantânio|Cério|Praseodímio|Neodímio|' +
  'Promécio|Samário|Európio|Gadolínio|Térbio|Disprósio|Hólmio|Érbio|Túlio|Itérbio|' +
  'Lutécio|Háfnio|Tântalo|Tungstênio|Rênio|Ósmio|Irídio|Platina|Ouro|Mercúrio|' +
  'Tálio|Chumbo|Bismuto|Polônio|Ástato|Radônio|Frâncio|Rádio|Actínio|Tório|' +

  'Mendelévio|Nobélio|Laurêncio|Rutherfórdio|Dúbnio|Seabórgio|Bóhrio|Hássio|Meitnério|Darmstácio|' +
  'Roentgênio|Copernício|Nihônio|Fleróvio|Moscóvio|Livermório|Tenessino|Oganessônio').split('|');

/* ------------------------------------------------------------
   O PALCO: um zoom só, para a cena caber inteira em qualquer tela
   ------------------------------------------------------------ */
const stage = document.getElementById('stage');
const deck  = document.getElementById('deck');
let fitScale = 1;

function ajustaPalco(){
  fitScale = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.setProperty('--fit', fitScale);
}
addEventListener('resize', ajustaPalco);
ajustaPalco();

/* ============================================================
   ONDE CADA ELEMENTO MORA
   Duas contas diferentes, e é de propósito:

   · posDe(z) dá a casa do BLOCO PRINCIPAL — a mesma conta do app do
     professor —, e serve para saber a FAMÍLIA de cada elemento. As
     duas séries caem na casa do grupo 3, e familiaDoZ corrige.

   · posFull(z) dá a casa no DESENHO desta tela, que é a tabela
     completa: sete linhas em cima e as duas séries abertas embaixo,
     como no cartaz da parede.
   ============================================================ */
function posDe(z){
  if (z === 1)  return {col:1,     row:1};
  if (z === 2)  return {col:18,    row:1};
  if (z <= 4)   return {col:z-2,   row:2};   /* 3,4 */
  if (z <= 10)  return {col:z+8,   row:2};   /* 5..10  -> 13..18 */
  if (z <= 12)  return {col:z-10,  row:3};   /* 11,12 */
  if (z <= 18)  return {col:z,     row:3};   /* 13..18 */
  if (z <= 36)  return {col:z-18,  row:4};
  if (z <= 54)  return {col:z-36,  row:5};
  if (z <= 56)  return {col:z-54,  row:6};   /* 55,56 */
  if (z <= 71)  return {col:3,     row:6};   /* os lantanídeos */
  if (z <= 86)  return {col:z-68,  row:6};   /* 72..86 -> 4..18 */
  if (z <= 88)  return {col:z-86,  row:7};   /* 87,88 */
  if (z <= 103) return {col:3,     row:7};   /* os actinídeos */
  return          {col:z-100, row:7};        /* 104..118 -> 4..18 */
}
/* as séries têm linha própria embaixo: a 8 é a dos lantanídeos, a 9 a
   dos actinídeos, e ambas começam na coluna 3, debaixo do grupo de
   onde saíram */
function posFull(z){
  if (z >= 57 && z <= 71)  return {col:z-57+3, row:8};
  if (z >= 89 && z <= 103) return {col:z-89+3, row:9};
  return posDe(z);
}

/* A que família pertence a célula do grupo e do período. É a regra do
   app do professor, palavra por palavra: uma regra só evita que as
   duas telas discordem sobre uma cor. */
function familiaDe(col, row){
  if (row === 8) return 'lantanideos';
  if (row === 9) return 'actinideos';
  if (row === 1) return col === 1 ? 'ametais' : 'nobres';
  if (col === 1) return 'alcalinos';
  if (col === 2) return 'alcterrosos';
  if (col >= 3 && col <= 12) return 'transicao';
  if (col === 18) return 'nobres';
  if (col === 17) return 'halogenios';
  const k = col + '-' + row;
  /* O sistema moderno não tem semimetais: há metais, ametais e gases
     nobres, e mais nada. */
  if (['14-2','15-2','16-2','15-3','16-3','16-4',   /* C N O P S Se */
       '13-2','14-3','15-4','16-5'].includes(k))    /* B Si As Te   */
    return 'ametais';
  return 'metais';                                  /* e aqui caem Ge e Sb */
}
/* a família é do elemento, não da casa: as duas séries dividem a casa
   do grupo 3, que sozinha diria "metal de transição" */
function familiaDoZ(z){
  if (z >= 57 && z <= 71)  return 'lantanideos';
  if (z >= 89 && z <= 103) return 'actinideos';
  const p = posDe(z);
  return familiaDe(p.col, p.row);
}

/* ------------------------------------------------------------
   A TABELINHA COLORIDA DA CAPA
   Não é a tabela de consulta — é o desenho dela: 18 grupos por 7
   períodos, mais as duas linhas f, cada célula pintada pela família.
   ------------------------------------------------------------ */
(function desenhaTabela(){
  const svg = document.getElementById('tabela');
  const L = 9, G = 1.2;                 /* lado da célula e o vão entre elas */
  const grupos = p => p > 3 ? Array.from({length:18},(_,i)=>i+1)
                    : (p === 1 ? [1,18] : [1,2,13,14,15,16,17,18]);

  const naSerie = z => (z >= 57 && z <= 71) || (z >= 89 && z <= 103);
  const zDaCasa = {};
  for (let z = 1; z <= 118; z++){
    if (naSerie(z)) continue;
    const p = posDe(z);
    zDaCasa[p.col + ':' + p.row] = z;
  }

  let html = '';
  for (let p = 1; p <= 7; p++)
    grupos(p).forEach(g => html += cel(g-1, p-1, familiaDe(g,p), zDaCasa[g+':'+p]));
  /* as duas linhas f, afastadas do bloco principal */
  for (let i = 0; i < 15; i++) html += cel(i+2, 8.4,  'lantanideos', 57+i);
  for (let i = 0; i < 15; i++) html += cel(i+2, 9.55, 'actinideos',  89+i);
  svg.innerHTML = html;

  function cel(c, r, cat, z){
    const x = (c*(L+G)).toFixed(2), y = (r*(L+G)).toFixed(2);
    return '<rect class="cel" x="'+x+'" y="'+y+'" width="'+L+'" height="'+L+
           '" rx="1.2" fill="var(--cat-'+cat+')"' +
           (z ? ' data-z="'+z+'"' : '') + '/>';
  }
})();

/* ------------------------------------------------------------
   A TABELA DA CAPA, VIVA
   De três em três segundos alguns pares de casas trocam de cor entre
   si — a paleta continua a mesma, só se rearranja — e uma das casas
   acende dizendo quem é. Só corre na capa.
   ------------------------------------------------------------ */
const ACENDE_NA_CAPA = [11, 39, 57, 52, 95, 8];   /* Na, Y, La, Te, Am, O */

function animaCapa(){
  const svg = document.getElementById('tabela');
  if (!svg) return;
  const casas = [...svg.querySelectorAll('.cel')];
  const comDono = casas.filter(c => c.dataset.z);
  if (!comDono.length) return;
  const aoAcaso = lista => lista[(Math.random()*lista.length)|0];

  let fila = [];
  function proxima(){
    if (!fila.length){
      fila = ACENDE_NA_CAPA.slice();
      for (let i = 0; i < 10; i++) fila.push(+aoAcaso(comDono).dataset.z);
    }
    return fila.shift();
  }

  /* trocar, e não sortear: as cores mudam de lugar, mas são sempre as
     mesmas dez, e a tabela continua parecendo uma tabela */
  function baralha(){
    for (let k = 0; k < 5; k++){
      const a = aoAcaso(casas), b = aoAcaso(casas);
      if (a === b) continue;
      const cor = a.getAttribute('fill');
      a.setAttribute('fill', b.getAttribute('fill'));
      b.setAttribute('fill', cor);
    }
  }

  function acende(z){
    const casa = svg.querySelector('.cel[data-z="'+z+'"]');
    if (!casa) return;
    const x = +casa.getAttribute('x'), y = +casa.getAttribute('y');
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'luz');
    g.style.setProperty('--cl', casa.getAttribute('fill'));
    g.innerHTML =
      '<rect class="carta" x="'+(x-0.9).toFixed(2)+'" y="'+(y-0.9).toFixed(2)+
        '" width="10.8" height="10.8" rx="1.7"/>' +
      '<text class="n" x="'+(x+1.3).toFixed(2)+'" y="'+(y+3.2).toFixed(2)+'">'+z+'</text>' +
      '<text class="s" x="'+(x+4.5).toFixed(2)+'" y="'+(y+7.6).toFixed(2)+'">' +
        SIMBOLOS[z-1] + '</text>';
    svg.appendChild(g);
    requestAnimationFrame(() => g.classList.add('on'));
    /* e o bloco gigante daquele elemento, se houver, responde */
    giraBlocoDaCapa(z);
    setTimeout(() => { g.classList.remove('on');
                       setTimeout(() => g.remove(), 500); }, 2100);
  }

  setInterval(() => {
    if (atual !== 0) return;            /* fora da capa, a tabelinha cala */
    baralha();
    acende(proxima());
  }, 3000);
}

/* ------------------------------------------------------------
   MONTAGEM DOS SLIDES
   ------------------------------------------------------------ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

SLIDES.forEach((sl,i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (sl.kind === 'capa' ? ' capa' : '');

        '<span class="p-inter">interativo</span>' +
        '<em><span class="linha"><span class="p-tabela">Tabela Periódica</span></span>' +
        '<span class="ult">Moderna</span></em></h1>' +
      '<div class="risco"></div>' +
      '<div class="autor">Designed by Prof. <b>Amauri Junior</b></div>' +
      /* o endereço abre o e-mail já endereçado a ele */
      '<a class="email" href="mailto:amauri.junior@escola.seduc.pa.gov.br">' +
        'amauri.junior@escola.seduc.pa.gov.br</a>' +
      /* a caixa onde a narração escreve; as linhas nascem em montaFrases() */
      '<div class="digitado" data-mont="frases" aria-live="polite"></div>' +

  } else {

        '<div class="subtitle">'+esc(sl.subtitle || '')+'</div>' +

    /* a régua: uma célula por slide, tocável */
