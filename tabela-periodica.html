.quiz-cartao{--neon:#FF2E4C;--natural:#1F9D55}
.quiz-cartao .trofeu{font-size:44px;line-height:1}
.quiz-cartao .chapeu{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta-faint);
}
.quiz-cartao .aluno{margin-top:-2px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:21px;font-weight:700;color:var(--indigo)}
.quiz-cartao .anel{position:relative;width:118px;height:118px}
.quiz-cartao .anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.quiz-cartao .anel .miolo{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;
}
.quiz-cartao .anel .miolo span{font-size:10px;color:var(--tinta-faint);font-weight:600}
.quiz-cartao .anel .miolo b{font-size:34px;color:var(--tinta);font-weight:800}
.quiz-cartao .conta{font-size:15px;color:var(--tinta-dim);font-weight:600}
.quiz-cartao .conta em{font-style:normal;font-weight:800}
.quiz-cartao .conta em.acerto{color:var(--natural)}
.quiz-cartao .conta em.erro{color:var(--neon)}
.quiz-cartao .recado{font-size:17px;color:var(--tinta);font-weight:600;max-width:270px}
.quiz-cartao .botoes{display:flex;gap:10px;margin-top:6px}
.quiz-cartao button{
  font-family:var(--display);font-weight:700;font-size:14px;
  padding:9px 18px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--indigo);background:#fff;color:var(--indigo);
  transition:background .2s,color .2s,transform .15s;
}
.quiz-cartao button:hover{background:var(--indigo);color:#fff}
.quiz-cartao button:active{transform:scale(.95)}
.quiz-cartao button.forte{background:var(--indigo);color:#fff}
.quiz-cartao button.forte:hover{background:var(--tinta)}
/* o botão que a fala aponta: duas pulsadas, com uma luz dourada */
.quiz-cartao button.pulsa2{animation:pulsa2 .5s ease-in-out 2}
@keyframes pulsa2{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(226,162,43,0)}
  50%    {transform:scale(1.14);box-shadow:0 0 0 4px rgba(226,162,43,.55), 0 0 18px 4px rgba(226,162,43,.45)}
}

/* ---------- o ajuste da tabela (temporário, só no celular) ----------
   Uma ferramenta de medida: ligado, a tabela do slide 1 fica travada e
   move-se com um dedo e cresce ou encolhe com a pinça. O painel no alto
   mostra a medida e copia-a. Fica fora do palco, como a barra. */
#ajuste{position:fixed;top:10px;left:50%;z-index:77;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;
  background:rgba(255,255,255,.94);border:1px solid var(--indigo-dim);border-radius:12px;
  backdrop-filter:blur(9px);box-shadow:0 10px 28px rgba(32,28,66,.2);
  font-family:var(--mono);font-size:12px;color:var(--tinta);white-space:nowrap;
  touch-action:manipulation}
#ajuste[hidden]{display:none}
#ajuste .aj-rot{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo)}
#ajuste output{min-width:176px}
#ajuste button{font-family:var(--display);font-weight:700;font-size:13px;padding:6px 12px;
  border-radius:9px;cursor:pointer;border:1.5px solid var(--indigo);background:#fff;color:var(--indigo)}
#ajuste button.forte{background:var(--indigo);color:#fff}
#ajuste button.x{border:0;background:transparent;color:var(--tinta-dim);font-size:18px;
  line-height:1;padding:4px 8px}
#ajuste.copiado .aj-copia{background:#1F9D55;border-color:#1F9D55;color:#fff}
/* travada: os cubos não recebem o dedo, e o arrastar é da mesa inteira */
#stage.ajustando .mesa .pc{pointer-events:none}
#stage.ajustando .slide{cursor:grab}

/* ---------- navegação rápida (tecla N) ----------
   Uma ferramenta de desenvolvimento: a alça na borda direita, a partir
   do slide da tabela, abre a gaveta com os tópicos do slide. Fica fora
   do palco, como a barra, e por baixo da visão geral. */
#nav-alca{
  position:fixed;right:0;top:50%;z-index:69;transform:translateY(-50%);
  width:26px;height:132px;padding:0;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.9);border:1px solid var(--indigo-dim);border-right:0;
  border-radius:12px 0 0 12px;
  box-shadow:-6px 8px 24px rgba(32,28,66,.14);color:var(--tinta-dim);
  transition:transform .35s var(--e-desl),opacity .3s,color .2s,background .2s;
}
#nav-alca span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase}
#nav-alca:hover{color:var(--ouro);background:#fff}
#nav-alca.fora,#nav-alca.some{transform:translate(110%,-50%);opacity:0;pointer-events:none}
/* a puxadinha da "4A5": a mão puxa a aba, e a gaveta espreita 64 px */
#nav-alca.espia{transform:translate(-64px,-50%)}
#nav.espia{transform:translateX(calc(100% - 64px))}
#nav-fundo{position:fixed;inset:0;z-index:75;background:rgba(32,28,66,.16);
  opacity:0;pointer-events:none;transition:opacity .3s}
#nav-fundo.on{opacity:1;pointer-events:auto}
#nav{
  position:fixed;top:0;right:0;bottom:0;z-index:76;width:min(360px,88vw);
  display:flex;flex-direction:column;font-family:var(--display);
  background:rgba(255,255,255,.97);border-left:1px solid var(--indigo-dim);
  box-shadow:-18px 0 44px rgba(32,28,66,.2);
  transform:translateX(104%);transition:transform .42s var(--e-desl);
}
#nav.aberta{transform:none}
#nav header{position:relative;padding:26px 24px 18px;border-bottom:1px solid var(--indigo-dim)}
.nav-rotulo{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--indigo)}
#nav h2{margin:8px 0 0;font-size:22px;font-weight:600;color:var(--tinta)}
/* A VELOCIDADE DA FALA, no sumário: um botão grande, dourado, à vista */
.nav-vel{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 16px;
  border:0;border-radius:14px;cursor:pointer;font:inherit;text-align:left;color:#fff;
  background:linear-gradient(135deg,var(--ouro-luz),var(--ouro));
  box-shadow:0 8px 20px rgba(226,162,43,.38);transition:transform .15s ease, box-shadow .15s ease}
.nav-vel:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(226,162,43,.5)}
.nav-vel:active{transform:scale(.97)}
.nav-vel svg{flex:none;width:26px;height:26px}
.nav-vel-txt{flex:1;font-size:17px;font-weight:700}
.nav-vel-v{flex:none;min-width:3.4ch;padding:4px 10px;border-radius:10px;text-align:center;
  font-size:17px;font-weight:800;color:var(--ouro);background:#fff;font-variant-numeric:tabular-nums}
/* AS LEGENDAS, logo abaixo da velocidade: o mesmo feitio, em índigo.
   Desligadas, o botão fica claro, com a chave à esquerda */
.nav-leg{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 16px;
  border:2px solid var(--indigo);border-radius:14px;cursor:pointer;font:inherit;text-align:left;
  color:var(--indigo);background:#fff;transition:transform .15s ease, box-shadow .15s ease, background .2s ease}
.nav-leg:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(32,28,66,.18)}
.nav-leg:active{transform:scale(.97)}
.nav-leg svg{flex:none;width:26px;height:26px}
.nav-leg-txt{flex:1;font-size:17px;font-weight:700}
.nav-leg-chave{flex:none;position:relative;width:46px;height:26px;border-radius:13px;
  background:rgba(32,28,66,.22);transition:background .2s ease}
.nav-leg-chave::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease}
.nav-leg.ligada{color:#fff;background:var(--indigo);box-shadow:0 8px 20px rgba(32,28,66,.3)}
.nav-leg.ligada .nav-leg-chave{background:var(--ouro-luz)}
.nav-leg.ligada .nav-leg-chave::after{transform:translateX(20px)}
/* a faixa da legenda, embaixo no palco; não pega o toque */
#legenda{position:absolute;left:50%;bottom:22px;z-index:70;transform:translateX(-50%);
  max-width:920px;width:max-content;padding:8px 18px;border-radius:12px;pointer-events:none;
  background:rgba(20,17,40,.84);color:#fff;font-size:26px;font-weight:600;line-height:1.3;
  text-align:center;opacity:0;transition:opacity .15s ease}
#legenda.on{opacity:1}
/* (o botão da velocidade saiu da tela: mora no sumário) */
#stage #vel{display:none!important}
.nav-fecha{position:absolute;top:18px;right:14px;width:34px;height:34px;border:0;border-radius:9px;
  background:transparent;color:var(--tinta-dim);cursor:pointer;display:grid;place-items:center}
.nav-fecha:hover{background:rgba(76,63,191,.12);color:var(--indigo)}
.nav-lista{list-style:none;margin:0;padding:12px;overflow-y:auto;flex:1}
.nav-item{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;position:relative;
  padding:12px;border:0;border-radius:12px;background:transparent;cursor:pointer;
  font:inherit;color:var(--tinta);transition:background .2s}
.nav-item:hover{background:rgba(76,63,191,.08)}
.nav-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;color:var(--ouro);
  border:1.5px solid var(--ouro-luz);background:rgba(226,162,43,.1)}
.nav-txt b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.nav-txt small{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;
  line-height:1.4;color:var(--tinta-dim)}
/* o tópico em que a aula está agora */
.nav-item.atual{background:rgba(226,162,43,.14)}
.nav-item.atual::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
  border-radius:2px;background:var(--ouro)}
.nav-item.atual .nav-n{background:var(--ouro);border-color:var(--ouro);color:#fff}
.nav-aqui{display:none;margin-left:8px;font-family:var(--mono);font-size:10px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);vertical-align:2px}
.nav-item.atual .nav-aqui{display:inline}
/* o engatilhado: ainda não existe */
.nav-item:disabled{cursor:default;opacity:.55}
.nav-item:disabled:hover{background:transparent}
.nav-breve{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:99px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta-dim);border:1px dashed var(--tinta-faint)}
/* os atalhos para uma variante do tópico (a 1.3A ou a 1.3B) */
.nav-variantes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px 54px}
.nav-var{padding:5px 10px;border-radius:8px;border:1px solid var(--indigo-dim);background:#fff;
  cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--tinta-dim);
  transition:border-color .2s,color .2s}
.nav-var:hover{border-color:var(--ouro-luz);color:var(--ouro)}
.nav-pe{margin:0;padding:14px 24px 22px;font-size:12px;line-height:1.45;color:var(--tinta-faint);
  border-top:1px solid var(--indigo-dim)}

/* ---- O SUMÁRIO: os capítulos (um por slide) e os subtópicos ---- */
#nav{width:min(420px,92vw)}
.nav-lista{position:relative;padding:10px 12px 16px}
.sum-cap{padding:4px 0 8px}
.sum-cap + .sum-cap{border-top:1px solid var(--indigo-dim);padding-top:10px}
/* o capítulo: "1." em dourado, o título, e o subtítulo do slide por baixo */
.sum-num{flex:none;min-width:26px;font-family:var(--display);font-size:17px;font-weight:700;
  line-height:1.25;color:var(--ouro);text-align:right}
.sum-cap-bt .nav-txt b{font-size:16.5px}
.sum-cap-bt .nav-txt small{font-family:var(--display);font-size:12.5px;color:var(--tinta-dim)}
.sum-cap-bt .nav-txt small:empty{display:none}
/* o capítulo em que a aula está, mesmo num subtópico dele */
.sum-cap.aqui > .sum-cap-bt .sum-num{color:var(--ouro);text-shadow:0 0 12px rgba(226,162,43,.35)}
/* os subtópicos: recuados, com a letra no lugar do número */
.sum-subs{list-style:none;margin:2px 0 0;padding:0 0 0 40px}
.sum-sub{padding:8px 12px;gap:10px}
.sum-letra{flex:none;min-width:22px;font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ouro)}
.sum-sub .nav-txt b{font-size:15px;font-weight:500}
/* as seções de um capítulo ("4.1. Os metais"): o número no lugar da letra,
   e o título mais forte; os subtópicos delas, um pouco mais para dentro */
.sum-sub.sum-secao .sum-letra{min-width:30px;font-family:var(--display);font-size:14px;font-weight:700}
.sum-sub.sum-secao .nav-txt b{font-weight:700}
.sum-sub.na-secao{padding-left:34px}
.sum-subs .nav-variantes{margin:0 0 6px 44px}
/* no celular deitado a tela é baixa: o cabeçalho encolhe e o rodapé sai,
   e a altura fica para a lista */
@media (max-height:500px){
  #nav header{padding:12px 20px 10px}
  #nav h2{margin-top:2px;font-size:17px}
  .nav-fecha{top:10px}
  .nav-pe{display:none}
}

/* ---------- visão geral (tecla O) ----------
   As miniaturas não são desenhos dos slides: são os próprios slides,
   copiados e postos em escala. O que estiver dentro deles aparece ali
   — a tabela montada, os cubos como estiverem virados, a carta que a
   narração deixou acesa. */
#overview{
  position:fixed;inset:0;z-index:80;background:rgba(237,234,242,.97);
  backdrop-filter:blur(8px);padding:44px 52px;overflow-y:auto;
}
#overview[hidden]{display:none}
#overview h2{font-family:var(--mono);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:24px;font-weight:400;text-align:center}
/* auto-FIT, e não auto-fill: as colunas que sobram encolhem a zero, e
   dois slides ficam mesmo no meio da tela em vez de encostados à
   esquerda de uma fila de lugares vazios. Enquanto a aula for curta os
   cartões crescem até 340; quando os onze slides chegarem, a fila se
   parte em linhas sozinha. */
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,340px));
  justify-content:center;gap:20px}
.card{
  position:relative;aspect-ratio:16/9;padding:0;cursor:pointer;text-align:left;display:block;
  background:var(--fundo);border:1px solid var(--indigo-dim);border-radius:8px;
  color:inherit;font:inherit;overflow:hidden;
  box-shadow:0 4px 14px rgba(32,28,66,.08);
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.card:hover{border-color:var(--indigo);transform:translateY(-3px);box-shadow:0 10px 24px rgba(32,28,66,.16)}
/* o cartão do slide em que a aula está: âmbar, como a casa acesa da régua */
.card.aqui{border-color:var(--ouro);box-shadow:0 0 0 2px var(--ouro-dim),0 8px 20px rgba(32,28,66,.14)}
.mini{position:absolute;inset:0;overflow:hidden}
.mini-palco{
  position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  pointer-events:none;
}
.mini-palco .slide{opacity:1;visibility:visible}
/* na miniatura nada se mexe: ela é uma fotografia do slide */
.mini-palco *{animation:none!important;transition:none!important}
/* a tabelinha da capa mora fora do slide, no palco; a miniatura leva
   uma cópia dela para que a capa ali seja mesmo a capa */
.mini-marca{position:absolute;width:600px;right:20px;bottom:96px;pointer-events:none}
.mini-marca .cel{stroke:rgba(255,255,255,.72);stroke-width:.5}
.card .rot{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 12px 10px;
  background:linear-gradient(0deg,rgba(255,255,255,.97) 46%,rgba(255,255,255,0));
}
/* ---------- o carrossel dos slides (o botão do canto de cima) ----------
   Mora DENTRO do palco, e não por cima da janela: as cópias dos slides
   continuam debaixo do #stage, e todo o CSS que pinta um slide (o da
   capa nova, o da mesa) vale nelas como vale no original. Cada cartão
   tem o tamanho exato do palco, 1280 × 720, e só a escala muda: na
   escala 1 ele cobre o palco ponto por ponto, e é por isso que o slide
   pode encolher até ao carrossel, e crescer de volta, sem corte. */
/* o lugar e o tamanho que o professor deixou na montagem (slide 6): o
   centro em x 1205, y 80 do palco, 66 px de lado */
#ver-slides{
  position:absolute;top:47px;right:42px;z-index:14;
  width:66px;height:66px;padding:0;cursor:pointer;display:grid;place-items:center;
  background:rgba(255,255,255,.88);border:1px solid var(--indigo-dim);border-radius:17px;
  color:var(--tinta-dim);box-shadow:0 6px 18px rgba(32,28,66,.12);
  transition:color .2s,transform .2s,opacity .25s;
}
/* solto na montagem, o transform é o do lugar e da escala: o pulinho não */
#ver-slides:not(.solto):hover{color:var(--indigo);transform:translateY(-2px)}
#ver-slides svg{width:35px;height:35px}
#stage.na-capa.capa-nova #ver-slides{background:rgba(255,255,255,.05);border-color:rgba(242,238,230,.35);color:#F2EEE6}
/* no celular deitado ele NÃO vai para a borda da tela: lá o canto é
   arredondado e tem a câmera, e o botão sumia debaixo deles. Fica no
   canto do palco, que está para dentro da folga */
/* (na montagem ele fica: é peça a arrastar e a mudar de tamanho) */
#stage.em-quiz #ver-slides, #stage.em-jogo #ver-slides, #stage.tela-escura #ver-slides{display:none}
/* com o carrossel aberto, os botões do palco saem de cena */
#stage.em-carrossel #som, #stage.em-carrossel #som-dica, #stage.em-carrossel #vel,
#stage.em-carrossel #ver-slides{opacity:0;pointer-events:none;transition:opacity .2s}
/* e a alça da navegação rápida, que mora fora do palco, também */
body.em-carrossel #nav-alca{transform:translate(110%,-50%);opacity:0;pointer-events:none}

#carrossel{position:absolute;inset:0;z-index:60;overflow:hidden;touch-action:none}
#carrossel[hidden]{display:none}
html.palco-largo #carrossel{left:calc(-1 * var(--folga));right:calc(-1 * var(--folga))}
.car-fundo{position:absolute;inset:0;background:#17152E;opacity:0;transition:opacity .6s ease}
#carrossel.aberto .car-fundo{opacity:1}
/* no celular deitado o cartão é a tela inteira — o palco e as duas
   faixas (--folga) —, porque a mesa ampliada do celular passa do palco */
.car-item{position:absolute;left:50%;top:0;height:720px;
  width:calc(1280px + 2 * var(--folga,0px));margin-left:calc(-640px - var(--folga,0px));
  /* a caixa tem o palco inteiro e as dos vizinhos sobrepõem-se: o toque
     é só do cartão que se vê, em escala, lá dentro */
  pointer-events:none;
  transition:transform .6s var(--e-capa), opacity .4s ease}
.car-palco{position:absolute;top:0;left:var(--folga,0px);width:1280px;height:720px;z-index:1}
.car-cartao{
  position:absolute;inset:0;overflow:hidden;cursor:pointer;transform-origin:center;pointer-events:auto;
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  /* SÓ O TRANSFORM ANDA. Os cantos e a sombra não se animam: animados,
     o celular redesenhava o cartão inteiro a cada quadro, e o cartão
     tremia. Os cantos arredondados podem estar lá desde o primeiro
     quadro: no tamanho do palco, o que eles deixam ver por baixo é o
     próprio slide, igual. Com o will-change, cada cartão é desenhado uma
     vez e só desliza e encolhe na placa de vídeo. */
  /* SEM will-change: com ele o celular guardava cada cartão na
     resolução da tela cheia, mesmo mostrado pequeno, e a memória da
     placa de vídeo acabava — pedaços das fotos sumiam. Sem ele, cada
     cartão é desenhado no tamanho em que aparece. */
  border-radius:30px;
  transition:transform .6s var(--e-capa);
}
/* o papel liso (sem a grade, como o palco) e as duas luzes */
.car-cartao::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
.car-cartao::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
             radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%)}
.car-cartao.capa::before{background-image:none;background:#14131B}
.car-cartao.capa::after{
  background:radial-gradient(70% 70% at 80% 32%,rgba(76,63,191,.18),transparent 62%),
             radial-gradient(55% 60% at 0% 100%,rgba(226,162,43,.07),transparent 60%)}
/* a sombra, curta: uma sombra larga e borrada pesa em cada cartão */
#carrossel.aberto .car-cartao{box-shadow:0 18px 40px rgba(0,0,0,.4)}
#carrossel.aberto .car-item.centro .car-cartao{box-shadow:0 0 0 6px var(--ouro-luz),0 18px 40px rgba(0,0,0,.45)}
.car-deck{position:absolute;inset:0;z-index:1;pointer-events:none}
.car-deck .slide{opacity:1;visibility:visible}
/* no cartão fica só o número: o título já vai escrito em cima dele */
.car-deck .tira .title, .car-deck .tira .subtitle{visibility:hidden!important}
/* na cópia nada se mexe: ela é uma fotografia do slide, já no fim de
   cada animação, e não no começo */
.car-deck *{animation-delay:-100s!important;animation-play-state:paused!important;transition:none!important}
/* a mesa da cópia, em 2D: sem perspectiva, sem os giros do cubo, e a
   face da frente no tamanho em que a perspectiva a mostrava (--plano) */
.car-deck .mesa .pc{perspective:none!important}
.car-deck .mesa .cubo{transform:none!important;transform-style:flat!important}
.car-deck .mesa .face.f1{transform:scale(var(--plano,1.05))!important}
/* e enquanto o carrossel cobre o palco, o slide de verdade não é
   desenhado: são 118 cubos 3D que ninguém está a ver */
#stage.car-cobre #deck{visibility:hidden;content-visibility:hidden}
.car-marca{position:absolute;z-index:0;pointer-events:none}
.car-marca .cel{fill-opacity:.3;stroke:rgba(255,255,255,.05)}
.car-tit{position:absolute;top:0;left:0;right:0;text-align:center;font-size:30px;
  transform-origin:50% 100%;color:#F2EEE6;opacity:0;pointer-events:none;
  transition:transform .6s var(--e-capa), opacity .4s ease}
/* a foto do slide, no lugar do palco; a do celular leva 100 px a mais de
   cada lado, porque a mesa do celular passa do palco */
.car-foto{position:absolute;top:0;left:0;width:1280px;height:720px;pointer-events:none;user-select:none}
.car-foto.cel{left:-100px;width:1480px}
#carrossel.troca .car-item.centro{opacity:0;transition:opacity .15s linear}
.car-tit .car-n{font-family:var(--display);font-weight:600;color:var(--ouro-luz);margin-right:.3em}
.car-tit b{font-family:var(--display);font-weight:600}
#carrossel.aberto .car-tit{opacity:.55}
#carrossel.aberto .car-item.centro .car-tit{opacity:1}
/* arrastando, o carrossel segue o dedo sem inércia */
#carrossel.arrastando .car-item, #carrossel.arrastando .car-cartao, #carrossel.arrastando .car-tit,
#carrossel.sem-trans .car-item, #carrossel.sem-trans .car-cartao, #carrossel.sem-trans .car-tit{transition:none}
.car-seta, .car-fecha{
  position:absolute;z-index:3;width:58px;height:58px;padding:0;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(242,238,230,.5);color:#F2EEE6;
  opacity:0;pointer-events:none;transition:opacity .35s ease, background .2s;
}
.car-seta:hover, .car-fecha:hover{background:rgba(255,255,255,.2)}
.car-seta svg, .car-fecha svg{width:26px;height:26px}
.car-seta{top:392px;transform:translateY(-50%)}
.car-seta.ant{left:calc(28px + var(--folga,0px))}
.car-seta.prox{right:calc(28px + var(--folga,0px))}
/* o X fica onde estava o botão que abriu o carrossel */
.car-fecha{top:47px;right:calc(42px + var(--folga,0px));width:66px;height:66px;border-radius:17px}
.car-fecha svg{width:32px;height:32px}
#carrossel.aberto .car-seta, #carrossel.aberto .car-fecha{opacity:1;pointer-events:auto}
#carrossel.aberto .car-seta[disabled]{opacity:.2;pointer-events:none}
.car-conta{position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:3;
  font-family:var(--mono);font-size:15px;letter-spacing:.2em;color:rgba(242,238,230,.6);
  opacity:0;transition:opacity .35s ease}
#carrossel.aberto .car-conta{opacity:1}
.card .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tinta-faint)}
.card .t{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.2;margin-top:2px}

/* ============================================================
   MODO MONTAGEM (tecla G) — a capa vira mesa de trabalho
   Ferramenta de montagem, não de aula: grade de 40px, e tudo o que
   está na capa passa a se pegar com a mão — um dedo arrasta, dois
   mudam o tamanho, a roda do mouse também. O Ctrl+C copia as posições
   e os tamanhos de tudo, e é esse texto que volta para mim: com ele eu
   fixo no arquivo, como valores, o que foi arrumado à mão aqui.
   ============================================================ */
#guias{position:absolute;inset:0;z-index:7;pointer-events:none;display:none;
  background-image:
    linear-gradient(rgba(76,63,191,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,63,191,.2) 1px,transparent 1px);
  background-size:40px 40px}
body.montagem #guias{display:block}
#coord{position:absolute;z-index:20;display:none;transform:translate(-50%,-140%);
  font-family:var(--mono);font-size:12px;padding:4px 8px;white-space:nowrap;border-radius:3px;
  background:var(--tinta);color:#fff;pointer-events:none}
body.montagem #coord.on{display:block}

/* Medir é fotografar a peça em repouso.
   Cortar transição e animação faz a peça saltar para onde ela ia
   parar: sem isso, quem apertasse o G no meio de uma entrada congelaria
   a peça no meio do voo, e ela ficaria morando lá.
   E o texto ainda encolhe até o próprio conteúdo — sem isso o título
   "seria" uma faixa da largura da coluna, e não a da letra escrita, e o
   centro dele cairia no meio da tela em vez de no meio da frase. */
.medindo{transition:none!important;animation:none!important}
.medindo.encolhe{width:max-content!important}

/* solto = tirado do fluxo e passando a viver por x, y e escala.
   A peça não se mexe ao ser solta: ela é congelada exatamente onde o
   layout a tinha posto — a medida é tirada da caixa já desenhada na
   tela, com a escala que ela tivesse, e a partir daí a escala é 1.
   Vai com o #stage à frente por causa da foto do autor: ela tem um
   scale(1.15) próprio, num seletor de duas classes, e sem o peso do id
   este transform perdia para ele — a foto era medida já crescida e
   depois crescia outra vez. */
#stage .solto{
  position:absolute;margin:0!important;max-width:none;
  /* duas escalas na mesma conta: a que a montagem pinçou, e a do
     destaque da narração. Cada uma mexe na sua, sem apagar a outra. */
  /* e o salto (--sobe) antes da escala: os blocos gigantes são peças
     soltas também, e sem ele aqui o pulinho deles era apagado por este
     transform — só a volta aparecia */
  transform:translate(-50%,-50%) translateY(var(--sobe,0px))
            scale(calc(var(--esc,1) * var(--luz,1)));
  /* o que viaja aqui é só o crescer do destaque e o salto. O LUGAR não:
     uma peça na mão não pode ter inércia, tem de ir para onde o dedo está. */
  transition:transform var(--tsobe,.42s) var(--e-salto), filter .42s ease, box-shadow .42s ease;
}
#stage .solto.pego{transition:none!important}
/* O TEXTO EDITADO NA MONTAGEM: as linhas são só as dos Enters (<br>) —
   nenhuma quebra pela largura —, e a caixa cresce com o que se escreve */
.texto-livre, .texto-livre *{white-space:nowrap!important}
.texto-livre *{width:auto!important;max-width:none!important}
.editando{user-select:text!important;-webkit-user-select:text!important;touch-action:auto!important;
  cursor:text!important;outline:2px dashed var(--ouro-luz)!important;outline-offset:6px;caret-color:var(--ouro-luz)}
/* a barrinha da edição, por cima do texto: quebrar a linha, ou uma só */
#edita-barra{position:fixed;z-index:120;display:flex;gap:6px;padding:5px;border-radius:12px;
  background:rgba(255,255,255,.97);border:1px solid var(--indigo-dim);box-shadow:0 10px 26px rgba(32,28,66,.25)}
#edita-barra[hidden]{display:none}
#edita-barra button{padding:7px 12px;border:0;border-radius:8px;cursor:pointer;background:transparent;
  font-family:var(--display);font-weight:600;font-size:14px;color:var(--indigo);white-space:nowrap}
#edita-barra button:hover{background:rgba(76,63,191,.1)}
body.montagem .solto{
  cursor:move;touch-action:none;
  outline:1px dashed rgba(76,63,191,.5);outline-offset:4px;border-radius:2px;
  /* sem isto, arrastar um texto vira seleção de texto, e a foto do
     autor, que é uma imagem, sairia arrastada pelo próprio navegador */
  user-select:none;-webkit-user-select:none;
}
body.montagem .solto img{-webkit-user-drag:none;pointer-events:none}
/* os textos que normalmente deixam o toque passar: na montagem, à vista,
   pegam-se com a mão (escondidos, continuam a deixá-lo passar) */
body.montagem .solto:is(.dica-escolha, .toque-continuar, .rotulo-el, .entendi3, .dica-final, .ficha, .conta-lc25).on,
body.montagem .solto.coords-el:has(span.on),
body.montagem .solto.texto-colunas:has(.frase.on:not(.saindo)),
body.montagem #som-dica.solto:not(.fora){pointer-events:auto}
body.montagem .solto:hover{outline:1px solid var(--ouro);background:rgba(226,162,43,.07)}
/* o que está sendo mexido agora */
body.montagem .solto.pego{outline:1.5px solid var(--ouro);background:rgba(226,162,43,.12)}

/* ---------- a folha das posições (Ctrl+C) ---------- */
#coords{
  position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(680px,92vw);height:min(560px,84vh);display:flex;flex-direction:column;
  background:#FFFDF7;border:1px solid var(--indigo-dim);border-radius:6px;
  box-shadow:0 30px 70px rgba(32,28,66,.32);overflow:hidden;
}
#coords[hidden]{display:none}
#coords .cab{
  flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:15px 14px 13px 19px;border-bottom:1px solid var(--indigo-dim);
  background:rgba(76,63,191,.07);
}
#coords h2{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--indigo);font-weight:400}
#coords .de{margin-top:5px;font-size:13px;font-weight:300;color:var(--tinta-dim)}
#coords .x{
  flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;
  border:1px solid var(--indigo-dim);border-radius:50%;
  background:transparent;color:var(--tinta-dim);cursor:pointer;
}
#coords .x:hover{border-color:var(--indigo);color:var(--indigo)}
#coords textarea{
  flex:1;min-height:0;resize:none;width:100%;background:transparent;color:var(--tinta);
  border:none;padding:14px 19px;font-family:var(--mono);font-size:12.5px;line-height:1.62;
  white-space:pre;
}
#coords textarea:focus{outline:none}
#coords .rod{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 19px 12px;border-top:1px solid var(--indigo-dim);
}
#coords .msg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ouro)}
#coords .hint2{font-size:11.5px;font-weight:300;color:var(--tinta-dim)}

/* ============================================================
   O DESTAQUE — a peça cresce e acende
   O que a narração está a dizer cresce um pouco e ganha um halo
   quente; o que ela já disse volta ao tamanho. Nunca há dois acesos:
   acender um apaga o anterior, e é essa troca que costura a fala à
   tela — o olho vai atrás do que cresceu.

   Nos textos o destaque é palavra a palavra: cada pedaço do título é
   uma peça própria, e cresce sozinho.
   ============================================================ */
.p-audio,.p-inter,.p-tabela{
  display:inline-block;transform-origin:center center;
  transition:transform .42s var(--e-salto), text-shadow .42s ease;
}
/* AS DUAS PALAVRAS DA PRIMEIRA LINHA CRESCEM PARA FORA, cada uma para
   o seu lado: "Audiobook" pela esquerda, ancorada no fim dela, e
   "interativo" pela direita, ancorada no começo. Crescendo a partir do
   centro, uma comia a outra — e com um aumento deste tamanho, comia
   inteira a palavra do lado. Assim o espaço entre elas nunca se mexe.
   "Tabela Periódica" tem a linha só para ela, e cresce do meio. */
.p-audio{transform-origin:right center;margin-right:.14em}
.p-inter{transform-origin:left center}
.p-audio.realce,.p-inter.realce,.p-tabela.realce{
  transform:scale(1.2) translateY(-3px);
  /* o halo quente por fora da letra, e uma sombra por baixo dela: um
     acende, o outro levanta-a do papel */
  text-shadow:0 0 20px rgba(226,162,43,.95), 0 0 40px rgba(226,162,43,.6),
              0 8px 22px rgba(32,28,66,.28);
}
/* as peças soltas — o retrato, a tabelinha, o nome do autor — crescem
   pelo mesmo caminho: --luz entra na conta da escala delas */
#stage .solto.realce{--luz:1.14}
/* o retrato e o nome acendem juntos, e crescendo encostam-se: o nome
   passa por cima da moldura, para a letra nunca ficar tapada */
.capa .foto.realce{
  z-index:5;
  box-shadow:0 0 0 3px rgba(226,162,43,.65), 0 0 52px rgba(226,162,43,.6),
             0 22px 50px rgba(32,28,66,.32);

  z-index:6;
  text-shadow:0 0 20px rgba(226,162,43,.9), 0 6px 16px rgba(32,28,66,.2);
}
/* a tabelinha já é grande: cresce um pouco menos, para as últimas
   casas não saírem pela borda do palco */
#tabela.realce{--luz:1.12}
#tabela.realce{
  filter:drop-shadow(0 0 16px rgba(226,162,43,.85))
         drop-shadow(0 0 34px rgba(226,162,43,.45))
         drop-shadow(0 10px 22px rgba(32,28,66,.18));
}

/* ============================================================
   A MÃOZINHA — a demonstração dos comandos
   Quando a narração explica onde se aperta, ela vai lá e aperta. Mora
   na janela, e não no palco: os controles são fixos na tela, e ela
   precisa de alcançar tanto o que está no palco como o que está fora.
   ============================================================ */
#mao{
  position:fixed;z-index:100;width:48px;height:48px;pointer-events:none;opacity:0;
  transition:opacity .3s ease,
             left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1),
             translate .35s var(--e-desl);
  filter:drop-shadow(0 3px 7px rgba(32,28,66,.4));
}
#mao[hidden]{display:none}
#mao.on{opacity:1}
/* puxando a aba do sumário: a mão vai com ela */
#mao.puxa{translate:-64px 0}
#mao svg{display:block;width:100%;height:100%;
  fill:#FFFDF8;stroke:var(--tinta);stroke-width:1.1;stroke-linejoin:round}
/* a onda do toque nasce na ponta do dedo */
#mao .onda{
  position:absolute;left:22px;top:7px;width:12px;height:12px;margin:-6px 0 0 -6px;
  border-radius:50%;border:2.5px solid var(--ouro);opacity:0;
}
#mao.clica svg {animation:maoBate .5s ease}
#mao.clica .onda{animation:maoOnda .62s ease-out}
@keyframes maoBate{0%,100%{transform:scale(1)} 42%{transform:scale(.8)}}
@keyframes maoOnda{0%{opacity:.95;transform:scale(.35)} 100%{opacity:0;transform:scale(4.4)}}

/* a versão, no canto de baixo à esquerda: pequena, e só para quem a
   procura — é por ela que se confere, no aparelho do aluno, se a
   atualização já chegou */
#versao{

  font-family:var(--mono);font-size:14.7px;letter-spacing:.08em;
  color:var(--tinta-faint);
  /* segurada 1 s, abre e fecha a montagem: sem seleção nem menu do toque */
  padding:6px 4px 3px;margin:-6px -4px -3px;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#versao::after{content:'';position:absolute;left:4px;right:4px;bottom:0;height:2px;border-radius:1px;
  background:var(--ouro-luz);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
#versao.segurando::after{transform:scaleX(1);transition:transform 1s linear}
body.montagem #versao{color:var(--ouro)}

/* o aviso curto, quando alguma coisa precisa ser dita ao aluno */

/* A VERSÃO DO APP — sobe a cada mudança publicada. É daqui, e só daqui,

const CAPA_NOVA = true;

/* ============================================================
   OS ELEMENTOS

const SIMBOLOS = (

const MASSAS = [

  45,48,51,52,55,56,59,59,64,65,70,73,75,79,80,84,85,88,89,91,

];

const NOMES = (
  'Hidrogênio|Hélio|Lítio|Berílio|Boro|Carbono|Nitrogênio|Oxigênio|Flúor|Neônio|' +
  'Sódio|Magnésio|Alumínio|Silício|Fósforo|Enxofre|Cloro|Argônio|Potássio|Cálcio|' +
  'Escândio|Titânio|Vanádio|Cromo|Manganês|Ferro|Cobalto|Níquel|Cobre|Zinco|' +
  'Gálio|Germânio|Arsênio|Selênio|Bromo|Criptônio|Rubídio|Estrôncio|Ítrio|Zircônio|' +
  'Nióbio|Molibdênio|Tecnécio|Rutênio|Ródio|Paládio|Prata|Cádmio|Índio|Estanho|' +

  'Lutécio|Háfnio|Tântalo|Tungstênio|Rênio|Ósmio|Irídio|Platina|Ouro|Mercúrio|' +
  'Tálio|Chumbo|Bismuto|Polônio|Ástato|Radônio|Frâncio|Rádio|Actínio|Tório|' +
  'Protactínio|Urânio|Netúnio|Plutônio|Amerício|Cúrio|Berquélio|Califórnio|Einstênio|Férmio|' +
  'Mendelévio|Nobélio|Laurêncio|Rutherfórdio|Dúbnio|Seabórgio|Bóhrio|Hássio|Meitnério|Darmstácio|' +
  'Roentgênio|Copernício|Nihônio|Fleróvio|Moscóvio|Livermório|Tenessino|Oganessônio').split('|');

/* ------------------------------------------------------------
   O PALCO: um zoom só, para a cena caber inteira em qualquer tela
   ------------------------------------------------------------ */
const stage = document.getElementById('stage');
const deck  = document.getElementById('deck');
let fitScale = 1;

/* celular: a tela com o lado menor até 540 px (os telefones andam entre
   360 e 430; tablets e Chromebooks, de 600 para cima) */
function ehCelular(){ return Math.min(screen.width, screen.height) <= 540; }
function ajustaPalco(){
  const W = innerWidth, H = innerHeight;
  fitScale = Math.min(W/1280, H/720);
  stage.style.setProperty('--fit', fitScale);
  /* O CELULAR DEITADO é mais largo do que 16:9: medida pela altura, a
     cena deixava duas faixas vazias nos lados. Nesse caso — e só nele —
     o palco vai até às bordas (ver o CSS de .palco-largo). A cena
     continua a mesma, de 1280 × 720, no meio; 'folga' é quanto sobra
     de cada lado, em pixels do palco.
     Celular é a tela com o lado menor até 540 px (os telefones andam
     entre 360 e 430). Não basta a janela ser larga: num Chromebook ou
     num computador, a barra do navegador come a altura e a janela fica
     mais larga do que 16:9 — e esses ficam como sempre foram. */
  const celular = ehCelular();
  document.documentElement.classList.toggle('celular', celular);
  const folga = celular ? Math.max(0, (W/fitScale - 1280) / 2) : 0;
  const largo = folga > 1;
  document.documentElement.classList.toggle('palco-largo', largo);
  stage.style.setProperty('--folga', (largo ? folga : 0).toFixed(1) + 'px');
  /* O TABLET (16:10, como o Galaxy Tab S9+): a tela é mais alta do que
     16:9, e a cena, medida pela largura, deixava duas faixas em cima e
     embaixo. Ali o papel vai até às bordas, o cabeçalho sobe para o alto
     da tela, os botões descem para os cantos, e a tabela cresce um fio no
     espaço que sobrou. Tablet: tela de toque (o dedo é o ponteiro), sem
     ser celular — o Chromebook, com o touchpad, fica como está. */
  const tablet = !celular && matchMedia('(pointer: coarse)').matches;
  const folgaV = tablet ? Math.max(0, (H/fitScale - 720) / 2) : 0;
  const alto = folgaV > 1;
  document.documentElement.classList.toggle('palco-alto', alto);
  stage.style.setProperty('--folgav', (alto ? folgaV : 0).toFixed(1) + 'px');
  stage.style.setProperty('--cresce-alto', (alto ? Math.min(1.06, 1 + folgaV * 1.2 / 720) : 1).toFixed(3));
  /* o papel da tela inteira, com a grade no mesmo passo e no mesmo
     sítio da grade do palco */
  const vp = document.getElementById('viewport');
  vp.style.setProperty('--fit', fitScale);
  vp.style.setProperty('--gx', (W/2 - 640*fitScale).toFixed(1) + 'px');
  vp.style.setProperty('--gy', (H/2 - 360*fitScale).toFixed(1) + 'px');
}
addEventListener('resize', ajustaPalco);
ajustaPalco();

/* ============================================================
   ONDE CADA ELEMENTO MORA
   Duas contas diferentes, e é de propósito:

   · posDe(z) dá a casa do BLOCO PRINCIPAL — a mesma conta do app do
     professor —, e serve para saber a FAMÍLIA de cada elemento. As
     duas séries caem na casa do grupo 3, e familiaDoZ corrige.

   · posFull(z) dá a casa no DESENHO desta tela, que é a tabela
     completa: sete linhas em cima e as duas séries abertas embaixo,
     como no cartaz da parede.
   ============================================================ */
function posDe(z){
  if (z === 1)  return {col:1,     row:1};
  if (z === 2)  return {col:18,    row:1};
  if (z <= 4)   return {col:z-2,   row:2};   /* 3,4 */
  if (z <= 10)  return {col:z+8,   row:2};   /* 5..10  -> 13..18 */
  if (z <= 12)  return {col:z-10,  row:3};   /* 11,12 */
  if (z <= 18)  return {col:z,     row:3};   /* 13..18 */
  if (z <= 36)  return {col:z-18,  row:4};
  if (z <= 54)  return {col:z-36,  row:5};
  if (z <= 56)  return {col:z-54,  row:6};   /* 55,56 */
  if (z <= 71)  return {col:3,     row:6};   /* os lantanídeos */
  if (z <= 86)  return {col:z-68,  row:6};   /* 72..86 -> 4..18 */
  if (z <= 88)  return {col:z-86,  row:7};   /* 87,88 */
  if (z <= 103) return {col:3,     row:7};   /* os actinídeos */
  return          {col:z-100, row:7};        /* 104..118 -> 4..18 */
}
/* as séries têm linha própria embaixo: a 8 é a dos lantanídeos, a 9 a
   dos actinídeos, e ambas começam na coluna 3, debaixo do grupo de
   onde saíram */
function posFull(z){
  if (z >= 57 && z <= 71)  return {col:z-57+3, row:8};
  if (z >= 89 && z <= 103) return {col:z-89+3, row:9};
  return posDe(z);
}

/* A que família pertence a célula do grupo e do período. É a regra do
   app do professor, palavra por palavra: uma regra só evita que as
   duas telas discordem sobre uma cor. */
function familiaDe(col, row){
  if (row === 8) return 'lantanideos';
  if (row === 9) return 'actinideos';
  if (row === 1) return col === 1 ? 'ametais' : 'nobres';
  if (col === 1) return 'alcalinos';
  if (col === 2) return 'alcterrosos';
  if (col >= 3 && col <= 12) return 'transicao';
  if (col === 18) return 'nobres';
  if (col === 17) return 'halogenios';
  const k = col + '-' + row;
  /* O sistema moderno não tem semimetais: há metais, ametais e gases
     nobres, e mais nada. */
  if (['14-2','15-2','16-2','15-3','16-3','16-4',   /* C N O P S Se */
       '13-2','14-3','15-4','16-5'].includes(k))    /* B Si As Te   */
    return 'ametais';
  return 'metais';                                  /* e aqui caem Ge e Sb */
}
/* a família é do elemento, não da casa: as duas séries dividem a casa
   do grupo 3, que sozinha diria "metal de transição" */
/* OS TIPOS: metais, ametais e gases nobres — o sistema moderno, sem
   semimetais —, e o hidrogênio à parte (um ametal sentado em cima dos
   metais alcalinos). É o tipoDe do app do professor, sobre a mesma
   familiaDe: os dois apps pintam os mesmos elementos da mesma cor. */
function tipoDe(z){
  if (z === 1) return 'hidrogenio';
  const f = familiaDoZ(z);
  if (f === 'nobres') return 'nobres';
  if (f === 'ametais' || f === 'halogenios') return 'ametais';
  return 'metais';
}
function familiaDoZ(z){
  if (z >= 57 && z <= 71)  return 'lantanideos';
  if (z >= 89 && z <= 103) return 'actinideos';
  const p = posDe(z);
  return familiaDe(p.col, p.row);
}

/* ------------------------------------------------------------
   A TABELINHA COLORIDA DA CAPA
   Não é a tabela de consulta — é o desenho dela: 18 grupos por 7
   períodos, mais as duas linhas f, cada célula pintada pela família.
   ------------------------------------------------------------ */
(function desenhaTabela(){
  const svg = document.getElementById('tabela');
  const L = 9, G = 1.2;                 /* lado da célula e o vão entre elas */
  const grupos = p => p > 3 ? Array.from({length:18},(_,i)=>i+1)
                    : (p === 1 ? [1,18] : [1,2,13,14,15,16,17,18]);

  const naSerie = z => (z >= 57 && z <= 71) || (z >= 89 && z <= 103);
  const zDaCasa = {};
  for (let z = 1; z <= 118; z++){
    if (naSerie(z)) continue;
    const p = posDe(z);
    zDaCasa[p.col + ':' + p.row] = z;
  }

  let html = '';
  for (let p = 1; p <= 7; p++)
    grupos(p).forEach(g => html += cel(g-1, p-1, familiaDe(g,p), zDaCasa[g+':'+p]));
  /* as duas linhas f, afastadas do bloco principal */
  for (let i = 0; i < 15; i++) html += cel(i+2, 8.4,  'lantanideos', 57+i);
  for (let i = 0; i < 15; i++) html += cel(i+2, 9.55, 'actinideos',  89+i);
  svg.innerHTML = html;

  /* cada casa leva o símbolo do elemento, apagado: só aparece quando a
     abertura traz a tabela para o meio da capa (efeitosCapa) */
  function cel(c, r, cat, z){
    const x = (c*(L+G)).toFixed(2), y = (r*(L+G)).toFixed(2);
    return '<rect class="cel" x="'+x+'" y="'+y+'" width="'+L+'" height="'+L+
           '" rx="1.2" fill="var(--cat-'+cat+')" data-cor="var(--cat-'+cat+')"' +
           (z ? ' data-z="'+z+'"' : '') + '/>' +
           (z ? '<text class="sim" x="'+(c*(L+G) + L/2).toFixed(2)+'" y="'+(r*(L+G) + 6.1).toFixed(2)+'">' +
                SIMBOLOS[z-1] + '</text>' : '');
  }
})();

/* ------------------------------------------------------------
   A TABELA DA CAPA, VIVA
   De três em três segundos alguns pares de casas trocam de cor entre
   si — a paleta continua a mesma, só se rearranja — e uma das casas
   acende dizendo quem é. Só corre na capa.
   ------------------------------------------------------------ */
const ACENDE_NA_CAPA = [11, 39, 57, 52, 95, 8];   /* Na, Y, La, Te, Am, O */

function animaCapa(){
  const svg = document.getElementById('tabela');
  if (!svg) return;
  const casas = [...svg.querySelectorAll('.cel')];
  const comDono = casas.filter(c => c.dataset.z);
  if (!comDono.length) return;
  const aoAcaso = lista => lista[(Math.random()*lista.length)|0];

  let fila = [];
  function proxima(){
    if (!fila.length){
      fila = ACENDE_NA_CAPA.slice();
      for (let i = 0; i < 10; i++) fila.push(+aoAcaso(comDono).dataset.z);
    }
    return fila.shift();
  }

  /* trocar, e não sortear: as cores mudam de lugar, mas são sempre as
     mesmas dez, e a tabela continua parecendo uma tabela */
  function baralha(){
    for (let k = 0; k < 5; k++){
      const a = aoAcaso(casas), b = aoAcaso(casas);
      if (a === b) continue;
      const cor = a.getAttribute('fill');
      a.setAttribute('fill', b.getAttribute('fill'));
      b.setAttribute('fill', cor);
    }
  }

  function acende(z){
    const casa = svg.querySelector('.cel[data-z="'+z+'"]');
    if (!casa) return;
    const x = +casa.getAttribute('x'), y = +casa.getAttribute('y');
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'luz');
    g.style.setProperty('--cl', casa.getAttribute('fill'));
    g.innerHTML =
      '<rect class="carta" x="'+(x-0.9).toFixed(2)+'" y="'+(y-0.9).toFixed(2)+
        '" width="10.8" height="10.8" rx="1.7"/>' +
      '<text class="n" x="'+(x+1.3).toFixed(2)+'" y="'+(y+3.2).toFixed(2)+'">'+z+'</text>' +
      '<text class="s" x="'+(x+4.5).toFixed(2)+'" y="'+(y+7.6).toFixed(2)+'">' +
        SIMBOLOS[z-1] + '</text>';
    svg.appendChild(g);
    requestAnimationFrame(() => g.classList.add('on'));
    /* e o bloco gigante daquele elemento, se houver, responde */
    giraBlocoDaCapa(z);
    setTimeout(() => { g.classList.remove('on');
                       setTimeout(() => g.remove(), 500); }, 2100);
  }

  setInterval(() => {
    if (atual !== 0) return;            /* fora da capa, a tabelinha cala */
    /* e no meio da capa, na abertura, ela fica com as cores da família */
    if (stage.classList.contains('abre-capa') && som.currentTime > MEIO.vai - 3 && som.currentTime < MEIO.fica) return;
    baralha();
    acende(proxima());
  }, 3000);
}

/* ------------------------------------------------------------
   MONTAGEM DOS SLIDES

SLIDES.forEach((sl,i) => {

      '<h1><span class="p-audio">Audiobook</span> ' +

        'amauri.junior@escola.seduc.pa.gov.br</a>' +

      '<figure class="foto"><img src="Imagens/amauri_jr.jpg" alt="Professor Amauri Junior" draggable="false"></figure>';
  } else {

      /* na montagem, cada parte da faixa do alto é peça: a régua, o

      '<div class="tira">' +

    const regua = el.querySelector('.regua');

      b.title = 'Slide ' + (j+1) + ': ' + s2.title;

      /* na montagem a régua é peça, não botão: ali o toque não navega */
      b.addEventListener('click', () => { if (!naMontagem()) go(j); });
      regua.appendChild(b);
    });
