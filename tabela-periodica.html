    m.appendChild(b);
    b.querySelectorAll('.rd-roda').forEach(r => this.giravel(r));
    b.querySelector('.rd-ok').addEventListener('click', () => this.confirma());
    /* acabado o salto da entrada, a caixa assenta (e o tremor do erro não
       o repete) */
    setTimeout(() => b.classList.add('pousada'), 950);
    return b;
  },
  /* O CARROSSEL rola sozinho, como no app de referência (o dedo e a roda do
     mouse, e assenta sempre num número); um toque num número também o
     escolhe. Onde o palco não deixar o dedo rolar, o arrasto é feito à mão —
     e se o navegador tomar o gesto para ele, chega o pointercancel e a mão
     larga. */
  giravel(r){
    const H = 36, vs = [...r.querySelectorAll('.rd-v')];
    const marca = () => {
      const i = Math.max(0, Math.min(vs.length - 1, Math.round(r.scrollTop / H)));
      if (r._i === i) return;
      r._i = i;
      vs.forEach((v, k) => v.classList.toggle('atual', k === i));
    };
    const vai = i => r.scrollTo({ top: Math.max(0, Math.min(vs.length - 1, i)) * H, behavior:'smooth' });
    r.addEventListener('scroll', marca, { passive:true });
    r.addEventListener('pointerdown', ev => {
      r._arr = { y:ev.clientY, top:r.scrollTop, moveu:false, v:ev.target.closest('.rd-v'),
                 k:(r.getBoundingClientRect().height / r.offsetHeight) || 1 };
      if (ev.pointerType === 'mouse'){ try { r.setPointerCapture(ev.pointerId); } catch(_){} }
    });
    r.addEventListener('pointermove', ev => {
      const a = r._arr;
      if (!a) return;
      const dy = (ev.clientY - a.y) / a.k;
      if (!a.moveu && Math.abs(dy) > 4){ a.moveu = true; r.classList.add('arrastando'); }
      if (a.moveu) r.scrollTop = a.top - dy;
    });
    r.addEventListener('pointerup', () => {
      const a = r._arr;
      if (!a) return;
      r._arr = null;
      r.classList.remove('arrastando');
      if (!a.moveu && a.v) vai(vs.indexOf(a.v));
      else if (a.moveu) vai(Math.round(r.scrollTop / H));
    });
    r.addEventListener('pointercancel', () => { r._arr = null; r.classList.remove('arrastando'); });
    marca();
  },
  valor(tipo){
    const r = this.roda.querySelector('.rd-roda[data-tipo="' + tipo + '"]');
    return Math.round(r.scrollTop / 36) + 1;
  },
  /* o confirmar: os dois certos, a festa; senão a caixa treme e fica
     avermelhada um instante (como na referência), e no segundo erro a
     linha e a coluna do elemento acendem na tabela */
  confirma(){
    if (!this.roda || !this.aceita || this.travado) return;
    const z = CARROSSEL_Q4[this.sub], c = this.carta(z), sym = SIMBOLOS[z-1];
    const p = this.valor('p'), g = this.valor('g');
    if (!(p === +c.dataset.periodo && g === +c.dataset.grupo)){
      this.erros++; this.tropecos++;
      const b = this.roda;
      b.classList.remove('treme'); void b.offsetWidth; b.classList.add('treme', 'errada');
      clearTimeout(b._erroT);
      b._erroT = setTimeout(() => b.classList.remove('errada'), 900);
      if (this.tropecos >= 2) EV3.poeCruz(this.mesa(), c, true, true);
      tremeVermelho();
      const gg = this.g, sub = this.sub, e = tocaEfeito('error');
      if (this.tropecos === 1) e.then(() => {
        if (gg === this.g && this.ativo && !this.travado && this.sub === sub) tocaEfeito('Calmanaproximaacerta');
      });
      return;
    }
    this.roda.querySelector('.rd-ok').disabled = true;
    c.classList.remove('aceso');
    EV3.poeCruz(this.mesa(), c, true, true);
    const ultimo = this.sub === CARROSSEL_Q4.length - 1;
    this.acerta(c, 'O ' + sym + ' está no ' + p + 'º período, grupo ' + g + '.', ultimo, () => this.rodaSeguinte());
  },
  rodaSeguinte(){
    EV3.poeCruz(this.mesa(), this.carta(CARROSSEL_Q4[this.sub]), false, false);
    if (this.roda){ const b = this.roda; b.classList.add('sai'); setTimeout(() => b.remove(), 400); this.roda = null; }
    this.sub++;
    if (this.sub < CARROSSEL_Q4.length){ this.rodaPoe(); return; }
    /* os três: a questão 04 acaba (o que vem depois ainda está por vir) */
    this.aceita = false;
    this.caixaNova('Questão 04', 'Muito bem! Você achou o período e o grupo dos três elementos.');
  },
  fecha(){
    const sl = this.sl();
    if (!sl) return;
    if (this.ativo) stage.classList.remove('em-quiz');
    this.g++;
    this.ativo = false; this.passo = -1; this.aceita = false; this.travado = false; this.sub = 0;
    this.roda = null;
    clearTimeout(this.giroT);
    breuNoSlide(sl, false);
    sl.querySelectorAll('.quiz3').forEach(e => e.remove());
    const m = this.mesa();
    if (m){
      m.classList.remove('gira-troca');
      m.querySelectorAll('.roda4').forEach(e => e.remove());
      m.querySelectorAll('.pc.aceso').forEach(x => x.classList.remove('aceso'));
      const qualquer = m.querySelector('.pc');
      if (qualquer) EV3.poeCruz(m, qualquer, false, false);
      m.querySelectorAll('.certa3, .errada3, .pista3, .frente3').forEach(x => {
        x.classList.remove('certa3', 'errada3', 'pista3', 'frente3');
        x.style.removeProperty('--onda');
        x.style.removeProperty('--tsobe');
      });
      m.querySelectorAll('.eixo.prof').forEach(e => e.classList.remove('prof'));
    }
  }
};

/* ============================================================
   O QUIZ DO SLIDE 3 — as cinco perguntas do slide 2 do app do professor
   (Os critérios de Organização), e mais três, todas respondidas com um
   toque na tabela. Os números saem sorteados a cada vez.
     1  o elemento de número atômico Z
     2  o imediatamente posterior (ou anterior) ao número atômico Z
     3  o primeiro elemento de uma linha
     4  o último elemento de outra linha
     5  um elemento quimicamente semelhante a X (qualquer um da coluna)
     6  o que fica logo abaixo de X, na mesma coluna          (nova)
     7  outro elemento da mesma linha de X                    (nova)
     8  o último elemento da coluna de X                      (nova)
   Os sons são os do quiz do slide 2: no acerto, confetes, fanfarra e
   aplausos e a voz (exato! e muitobem alternados, perfeito na última);
   no erro, a tela treme em vermelho, error e Calmanaproximaacerta — e a
   resposta certa acende. A pergunta seguinte entra com eesseaqui e
   próximo alternados (sómaisesse antes da última).
   ============================================================ */
const ORDINAL_F = ['', 'primeira', 'segunda', 'terceira', 'quarta', 'quinta', 'sexta', 'sétima'];
const naMesa = z => z >= 1 && z <= 118 && !ehDaSerie(z);
function zNaCasa3(linha, col){
  for (let z = 1; z <= 118; z++){
    if (!naMesa(z)) continue;
    const p = posDe(z);
    if (p.row === linha && p.col === col) return z;
  }
  return null;
}
const daLinha3  = l => { const zs = []; for (let z = 1; z <= 118; z++) if (naMesa(z) && posDe(z).row === l) zs.push(z); return zs; };
const daColuna3 = c => { const zs = []; for (let z = 1; z <= 118; z++) if (naMesa(z) && posDe(z).col === c) zs.push(z); return zs; };
const sorteia3  = a => a[(Math.random() * a.length) | 0];
const oEl       = z => NOMES[z-1] + ' (' + SIMBOLOS[z-1] + ')';
const doEl      = z => SIMBOLOS[z-1] + ' (' + z + ')';
function perguntasDoCriterio(){
  const todos = [];
  for (let z = 1; z <= 118; z++) if (naMesa(z)) todos.push(z);
  const perg = [];
  /* 1 · achar pelo número atômico */
  const z1 = sorteia3(todos.filter(z => z > 2));
  perg.push({ q:'Toque no elemento cujo número atômico é ' + z1 + '.', ok:z => z === z1,
              explica:'O número atômico ' + z1 + ' é o ' + oEl(z1) + '.' });
  /* 2 · o vizinho de numeração, para um lado ou para o outro */
  const z2 = sorteia3(todos.filter(z => z > 3 && z < 118 && naMesa(z - 1) && naMesa(z + 1)));
  const adiante = Math.random() < .5, a2 = adiante ? z2 + 1 : z2 - 1;
  perg.push({ q:'Toque no elemento imediatamente ' + (adiante ? 'posterior' : 'anterior') + ' ao número atômico ' + z2 + '.',
              ok:z => z === a2,
              explica:'O ' + (adiante ? 'posterior' : 'anterior') + ' ao ' + z2 + ' é o ' + a2 + ', o ' + oEl(a2) + '.' });
  /* 3 e 4 · as duas pontas de duas linhas diferentes */
  const duas = embaralha([2, 3, 4, 5, 6, 7]).slice(0, 2);
  const la = daLinha3(duas[0]), lb = daLinha3(duas[1]);
  const a3 = la[0], a4 = lb[lb.length - 1];
  perg.push({ q:'Toque no primeiro elemento da ' + ORDINAL_F[duas[0]] + ' linha.', ok:z => z === a3,
              explica:'O primeiro da ' + ORDINAL_F[duas[0]] + ' linha é o ' + oEl(a3) + '.' });
  perg.push({ q:'Toque no último elemento da ' + ORDINAL_F[duas[1]] + ' linha.', ok:z => z === a4,
              explica:'O último da ' + ORDINAL_F[duas[1]] + ' linha é o ' + oEl(a4) + '.' });
  /* 5 · a semelhança, que mora na coluna (o H senta em cima dos
     alcalinos sem ser um deles) */
  const col5 = sorteia3([1, 2, 13, 14, 15, 16, 17, 18]);
  const m5 = daColuna3(col5).filter(z => !(col5 === 1 && z === 1));
  const r5 = sorteia3(m5), outros5 = m5.filter(z => z !== r5);
  perg.push({ q:'Qual elemento é quimicamente semelhante ao ' + doEl(r5) + '?', ok:z => outros5.includes(z),
              explica:'Na coluna do ' + SIMBOLOS[r5-1] + ' todos são quimicamente semelhantes.' });
  /* 6 · o de baixo, na mesma coluna (nova) */
  const x6 = sorteia3(todos.filter(z => { const p = posDe(z), b = zNaCasa3(p.row + 1, p.col); return b && b !== z; }));
  const a6 = zNaCasa3(posDe(x6).row + 1, posDe(x6).col);
  perg.push({ q:'Toque no elemento que fica logo abaixo do ' + doEl(x6) + ', na mesma coluna.', ok:z => z === a6,
              explica:'Logo abaixo do ' + SIMBOLOS[x6-1] + ' fica o ' + oEl(a6) + '.' });
  /* 7 · outro da mesma linha (nova) */
  const x7 = sorteia3(todos.filter(z => daLinha3(posDe(z).row).length > 2));
  const l7 = daLinha3(posDe(x7).row).filter(z => z !== x7);
  perg.push({ q:'Toque em outro elemento da mesma linha do ' + doEl(x7) + '.', ok:z => l7.includes(z),
              explica:'O ' + SIMBOLOS[x7-1] + ' está na ' + ORDINAL_F[posDe(x7).row] + ' linha: qualquer outro dela serve.' });
  /* 8 · o último da coluna (nova) */
  const col8 = sorteia3([1, 2, 13, 14, 15, 16, 17, 18].filter(c => c !== col5));
  const m8 = daColuna3(col8).filter(z => !(col8 === 1 && z === 1));
  const x8 = sorteia3(m8.slice(0, -1)), a8 = m8[m8.length - 1];
  perg.push({ q:'Toque no último elemento da coluna do ' + doEl(x8) + '.', ok:z => z === a8,
              explica:'O último da coluna do ' + SIMBOLOS[x8-1] + ' é o ' + oEl(a8) + '.' });
  /* a dica de cada questão, para o erro (as cinco primeiras são as do
     professor; as três últimas, das questões novas) */
  const dicas = [
    'O número atômico é o número que fica em cima do símbolo.<br>Os elementos estão em ordem crescente, da esquerda para a direita.',
    'O elemento ' + (adiante ? 'posterior' : 'anterior') + ' ao ' + z2 + ' é o ' + a2 + '.<br>Os números crescem da esquerda para a direita, linha a linha.',
    'As linhas são horizontais, da esquerda para a direita.<br>Ache a linha ' + duas[0] + ' e toque no primeiro elemento dela.',
    'As linhas são horizontais, da esquerda para a direita.<br>Ache a linha ' + duas[1] + ' e toque no último elemento dela.',
    'Numa mesma coluna todos são quimicamente semelhantes.<br>Toque em qualquer elemento da coluna do ' + SIMBOLOS[r5-1] + ', menos ele.',
    'As colunas são verticais.<br>Ache o ' + SIMBOLOS[x6-1] + ' e toque no elemento logo abaixo dele.',
    'As linhas são horizontais.<br>O ' + SIMBOLOS[x7-1] + ' está na linha ' + posDe(x7).row + ': toque em qualquer outro elemento dela.',
    'As colunas são verticais.<br>Ache a coluna do ' + SIMBOLOS[x8-1] + ' e desça até o último elemento dela.'
  ];
  perg.forEach((p, i) => { p.dica = dicas[i]; });
  return perg;
}

const QUIZ3 = {
  aberto:false, passo:0, itens:[], acertos:0, travado:false, g:0,
  /* a caixa em cena: a que ainda não está a sair */
  caixa(){ return slides[2].querySelector('.quiz3:not(.sai)'); },
  /* a caixa de saída vai embora pela direita, e só depois da viagem
     sai do DOM */
  despede(){
    let houve = false;
    slides[2].querySelectorAll('.quiz3:not(.sai)').forEach(e => {
      e.classList.add('sai');
      setTimeout(() => e.remove(), 700);
      houve = true;
    });
    return houve;
  },
  giroT:null,
  /* O CERTO CRESCE e passa à frente dos outros; quando entra a questão
     seguinte, volta ao tamanho — ainda à frente, até assentar, para não
     encolher por baixo dos vizinhos */
  cresce(c){
    clearTimeout(c._frenteT);
    c.classList.add('frente3');
    c.style.setProperty('--tsobe', '.45s');
    c.style.setProperty('--onda', '1.5');
  },
  encolhe(){
    if (!slides[2]) return;
    slides[2].querySelectorAll('.pc.frente3').forEach(c => {
      c.style.setProperty('--onda', '1');
      clearTimeout(c._frenteT);
      c._frenteT = setTimeout(() => {
        c.classList.remove('frente3');
        c.style.removeProperty('--onda');
        c.style.removeProperty('--tsobe');
      }, 500);
    });
  },
  /* O ESCURO DO QUIZ, o do professor: um véu preto cobre o slide em
     fade, por baixo da tabela, e a letra do cabeçalho clareia com ele */
  escurece(sim){
    const sl = slides[2];
    if (!sl) return;
    let v = sl.querySelector(':scope > .breu-quiz');
    if (sim && !v){
      v = document.createElement('div');
      v.className = 'breu-quiz';
      sl.insertBefore(v, sl.firstChild);
      v.getBoundingClientRect();
    }
    sl.classList.toggle('quiz-escuro', sim);
    if (v) v.classList.toggle('on', sim);
  },
  /* a volta da tabela, na onda diagonal (a mesma do professor) */
  giraTabela(){
    const m = slides[2].querySelector('.mesa');
    if (!m) return;
    TP.todos().forEach(c => {
      const p = posDe(+c.dataset.z);
      c.style.setProperty('--giro-atraso', ((p.col + p.row) * 22) + 'ms');
    });
    m.classList.remove('gira-troca');
    void m.offsetWidth;
    m.classList.add('gira-troca');
    clearTimeout(this.giroT);
    this.giroT = setTimeout(() => m.classList.remove('gira-troca'), 1500);
  },
  /* abrir: o som do quiz e a pergunta 1, juntos */
  abre(){
    if (atual !== 2) return;
    this.tiraCartao();
    this.itens = perguntasDoCriterio();
    this.passo = 0; this.acertos = 0; this.erros = 0; this.tropecos = 0; this.aberto = true;
    const g = ++this.g;
    /* o play sai de cena: quem faz a aula andar é o toque na tabela */
    stage.classList.add('em-quiz');
    slides[2].querySelectorAll('.quiz3').forEach(e => e.remove());
    /* se o aluno a deixou aberta, a tabela junta-se: as respostas são
       na tabela de sempre */
    LC25.poe('junta');
    /* a sala apaga-se (é o sinal de que ali já não é a aula), toca o
       "quiz1", e só quando ele acaba vem a transição: a tabela gira as
       faces e a questão 1 entra pela esquerda. Até lá, o toque espera. */
    this.travado = true;
    this.escurece(true);
    tocaEfeito('Audios/quiz1.mp3').then(() => {
      if (g !== this.g) return;
      this.giraTabela();
      this.apresenta(g);
    });
  },
  apresenta(g){
    if (g !== this.g) return;
    const p = this.itens[this.passo];
    this.tropecos = 0;
    /* a tabela gira só na TROCA: a primeira questão não substitui ninguém */
    if (this.despede()) this.giraTabela();
    const cx = document.createElement('div');
    cx.className = 'quiz3';
    cx.setAttribute('aria-live', 'polite');
    cx.innerHTML = '<div class="q3-marca"></div><div class="q3-q"></div><div class="q3-msg"></div>';
    cx.querySelector('.q3-marca').textContent = 'Questão ' + (this.passo + 1) + ' de ' + this.itens.length;
    cx.querySelector('.q3-q').textContent = p.q;
    slides[2].appendChild(cx);
    cx.getBoundingClientRect();        /* nasce fora da tela, à esquerda */
    cx.classList.add('on');
    this.travado = false;
  },
  /* a resposta: o toque num card da tabela */
  async toca(c){
    if (!this.aberto || this.travado) return;
    const g = this.g, p = this.itens[this.passo], z = +c.dataset.z;
    const ultima = this.passo === this.itens.length - 1;
    const msg = this.caixa().querySelector('.q3-msg');
    if (!p.ok(z)){
      /* O ERRO NÃO TROCA A QUESTÃO: o card balança em vermelho, a dica
         aparece debaixo da pergunta, e o erro conta na nota. No segundo
         erro da mesma questão, a resposta acende em âmbar, para o aluno a
         achar (e tocar nela). */
      this.erros++; this.tropecos++;
      c.classList.remove('errada3'); void c.offsetWidth; c.classList.add('errada3');
      clearTimeout(c._erroT);
      c._erroT = setTimeout(() => c.classList.remove('errada3'), 700);
      msg.innerHTML = p.dica;
      msg.className = 'q3-msg dica';
      if (this.tropecos >= 2) TP.todos().filter(x => p.ok(+x.dataset.z)).forEach(x => x.classList.add('pista3'));
      tremeVermelho();
      const erro = tocaEfeito('error');
      /* a voz de ânimo, só no primeiro erro de cada questão */
      if (this.tropecos === 1) erro.then(() => { if (g === this.g && this.aberto) tocaEfeito('Calmanaproximaacerta'); });
      return;
    }
    this.travado = true;
    this.acertos++;
    TP.todos().forEach(x => x.classList.remove('pista3', 'errada3'));
    c.classList.add('certa3');
    this.cresce(c);
    const voz = vozDoAcerto(ultima);
    msg.textContent = voz.frase + ' ' + p.explica;
    msg.className = 'q3-msg ok';
    confete();
    const fanfarra = tocaEfeito('funfare');
    tocaEfeito('applause');
    await fanfarra;
    if (g !== this.g) return;
    await tocaEfeito(voz.som);
    if (g !== this.g) return;
    this.encolhe();
    TP.todos().forEach(x => x.classList.remove('certa3', 'errada3', 'pista3'));
    this.passo++;
    if (this.passo >= this.itens.length){ this.resultado(); return; }
    /* o som da entrada e a pergunta nova, juntos */
    tocaEfeito(somDaEntrada(this.passo, this.itens.length));
    this.apresenta(g);
  },
  /* o fim: o cartão do resultado, com Refazer (outro quiz, outro sorteio)
     e Continuar (fecha o quiz; o botão do quiz fica no canto) */
  resultado(){
    /* a última também sai pela direita: é o cartão que toma a cena */
    this.despede();
    /* cada erro desconta o valor de uma questão (e a nota não desce de 0) */
    const n = this.itens.length, e = this.erros;
    cartaoDoResultado(Math.round(Math.max(0, n - e) / n * 100) / 10,
      n + ' questões · <em class="erro">' + e + '</em> ' + (e === 1 ? 'erro' : 'erros'),
      slides[2], () => this.abre(), () => { this.fecha(); go(3); }, 'Audios/audio_tabela_2.5B.mp3');
  },
  tiraCartao(){ if (slides[2]) slides[2].querySelectorAll('.quiz-cartao').forEach(e => e.remove()); },
  fecha(){
    this.g++;
    this.aberto = false; this.travado = false;
    stage.classList.remove('em-quiz');
    this.escurece(false);
    this.encolhe();
    clearTimeout(this.giroT);
    if (slides[2]){
      slides[2].querySelectorAll('.quiz3').forEach(e => e.remove());
      const m = slides[2].querySelector('.mesa');
      if (m) m.classList.remove('gira-troca');
    }
    if (slides[2]) slides[2].querySelectorAll('.certa3, .errada3, .pista3').forEach(x => x.classList.remove('certa3', 'errada3', 'pista3'));
    this.tiraCartao();
  }
};

/* O FIM DO SLIDE 3: acabada a "2.4", o 37 brilha; tocado, a tabela
   inteira arruma-se — as colunas juntam-se e o H volta, e os que faltam
   voam um de cada vez para casa —, e, montada, brilha, com a fanfarra,
   os confetes e os aplausos */
const FINAL = {
  esperando:false, ativo:false, feito:false, g:0,
  proximo:37, passo:0.0875,
  /* acabada a "2.4", a tabela espera o toque no próximo — sem piscar:
     quem o procura é o aluno */
  chama(){
    this.esperando = true;
  },
  /* a pergunta do toque errado, no vazio da tabela */
  dica(){
    let d = slides[2].querySelector('.dica-final');
    if (!d){
      d = document.createElement('div');
      d.className = 'dica-final';
      d.setAttribute('aria-live', 'polite');
      slides[2].appendChild(d);
    }
    return d;
  },
  tiraDica(){
    const d = slides[2] && slides[2].querySelector('.dica-final');
    if (d) d.classList.remove('on');
  },
  toca(c){
    if (!this.esperando) return;
    if (+c.dataset.z !== this.proximo){
      /* o errado balança em vermelho, e a pergunta aparece */
      c.classList.remove('nao-verm'); void c.offsetWidth; c.classList.add('nao-verm');
      clearTimeout(c._naoT);
      c._naoT = setTimeout(() => c.classList.remove('nao-verm'), 700);
      const d = this.dica();
      d.textContent = 'Que elemento vem depois do ' + (this.proximo - 1) + '?';
      d.getBoundingClientRect();
      d.classList.add('on');
      return;
    }
    this.esperando = false;
    this.tiraDica();
    /* o tocado salta já, sem esperar pelos outros */
    encaixaCubo(c);
    this.monta(c);
  },
  monta(primeiro){
    this.ativo = true;
    const g = ++this.g;
    const cubos = TP.todos();
    cubos.forEach(c => c.classList.remove('chama'));
    /* as colunas juntam-se e o H volta ao lugar */
    cubos.filter(c => c._noLugar && c !== primeiro).forEach(c => {
      limpaColuna(c, true);
      voaEmArco(c, alvoDe(+c.dataset.z), SALTO, () => c.style.removeProperty('transition'), 0.15);
    });
    /* e os que faltam, um de cada vez, na ordem do número atômico */
    const falta = cubos.filter(c => !c._noLugar).sort((a, b) => +a.dataset.z - +b.dataset.z);
    let i = 0;
    const vai = () => {
      if (g !== this.g) return;
      if (i >= falta.length){ setTimeout(() => { if (g === this.g) this.festa(); }, 900); return; }
      encaixaCubo(falta[i++]);
      setTimeout(vai, this.passo * 1000);
    };
    /* os outros vêm logo atrás do tocado, no compasso da montagem */
    setTimeout(vai, this.passo * 1000);
  },
  festa(){
    this.ativo = false;
    this.feito = true;
    const m = slideDaMesa().querySelector('.mesa');
    m.classList.remove('brilho-final'); void m.offsetWidth; m.classList.add('brilho-final');
    confete();
    /* acabada a festa (a fanfarra e os aplausos), a narração "2.5" */
    const g = this.g;
    Promise.all([tocaEfeito('funfare'), tocaEfeito('applause')]).then(() => {
      if (g === this.g && atual === 2) tocaTrilha('2.5');
    });
  },
  zera(){
    this.esperando = false; this.ativo = false; this.feito = false; this.g++;
    this.tiraDica();
    const m = slides[2] && slides[2].querySelector('.mesa');
    if (m) m.classList.remove('brilho-final');
  }
};

/* A COR NEUTRA de quem está fora do lugar: um cinza morno que escurece
   devagar com o número atômico (o do professor). A cor da família volta
   quando o card assenta na casa dele. */
function neutro(c, sim){
  if (!!c._neutro === sim) return;
  c._neutro = sim;
  const z = +c.dataset.z;
  c.style.setProperty('--cor', sim ? 'hsl(30 16% ' + (52 - (z - 1)/117*20).toFixed(0) + '%)'
                                   : 'var(--cat-' + c.dataset.fam + ')');
}

/* O ENCAIXE — depois da "2.1": os cards voltam para casa ao toque, na
   ordem do número atômico. O próximo a tocar brilha, e só ele responde
   (os outros tremem um fio). O 1 dispara a "2.2"; depois do 4, a tabela
   arruma-se sozinha, um card de cada vez, até ao 36, e pára; a "2.3"
   dispara quando o 32 salta para o lugar dele. As casas vazias ficam escondidas até a
   tabela estar toda montada: ela forma-se do nada. */
const ENCAIXE = {
  ativo:false, auto:false, casas:false, proximo:1, g:0,
  /* até que número o aluno toca, até onde a tabela vai sozinha, e o
     compasso dela (segundos de um card para o seguinte) */
  /* 0,0875 s: 60 % mais rápido do que os 0,14 do começo */
  toqueAte:4, sozinhoAte:36, passo:0.0875,
  /* o card cujo salto dispara a "2.3" */
  gatilho:32,
  comeca(){
    this.ativo = true; this.auto = false; this.casas = true; this.proximo = 1;
    this.acende();
  },
  acende(){
    TP.todos().forEach(c => c.classList.toggle('chama',
      this.ativo && !this.auto && +c.dataset.z === this.proximo));
  },
  toca(c){
    if (!this.ativo || this.auto) return;
    const z = +c.dataset.z;
    if (z !== this.proximo || c._noLugar){
      c.classList.remove('nao'); void c.offsetWidth; c.classList.add('nao');
      return;
    }
    encaixaCubo(c);
    if (z === 1) tocaTrilha('2.2');
    this.proximo++;
    if (z >= this.toqueAte){ this.sozinho(); return; }
    this.acende();
  },
  /* do 5 ao 36, um de cada vez; o salto do 32 dispara a narração */
  sozinho(){
    this.auto = true;
    this.acende();
    const g = ++this.g;
    let z = this.proximo;
    const vai = () => {
      if (g !== this.g) return;
      if (z > this.sozinhoAte){ this.ativo = false; this.auto = false; return; }
      encaixaCubo(TP.cubo(z));
      /* a "2.3" começa no salto do 32 */
      if (z === this.gatilho) tocaTrilha('2.3');
      z++;
      setTimeout(vai, this.passo * 1000);
    };
    setTimeout(vai, 500);
  },
  zera(){
    this.ativo = false; this.auto = false; this.casas = false; this.proximo = 1; this.g++;
    TP.todos().forEach(c => c.classList.remove('chama', 'nao'));
  }
};
/* O PONTO DO ARCO: ao lado do meio do caminho, a uma fração da distância —
   do lado de cima; se o caminho for vertical, de lado. Com ele, a Bézier
   faz de todo o salto uma curva. */
function pontoDoArco(a, b, curva){
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
  let nx = -dy/d, ny = dx/d;
  if (ny > 0){ nx = -nx; ny = -ny; }
  const k = (curva === undefined ? 0.35 : curva) * d + 24;
  return { x:(a.x + b.x)/2 + nx*k, y:(a.y + b.y)/2 + ny*k };
}
/* UM VOO EM ARCO com relógio próprio (é o aluno quem o dispara, não a
   narração): do lugar de agora até ao destino, devagar-depressa-devagar,
   e a inclinação desfaz-se no caminho.
   O card fica logo no destino (left/top), e o que anda, quadro a quadro,
   é um deslocamento dentro do transform dele (--vx, --vy) — mudar o
   transform não obriga o navegador a refazer o desenho da página, e isto
   funciona em qualquer aparelho (a animação das propriedades 'translate'
   e 'rotate' à parte, da versão anterior, não anda nos mais antigos: o
   card sumia e aparecia no destino). O primeiro deslocamento é escrito já
   aqui, antes de o navegador pintar: o card nunca se vê no destino antes
   de voar. E o voo acaba no último quadro ou, se os quadros tardarem (a
   aba em segundo plano), no relógio: nunca fica preso. */
function voaEmArco(c, para, dur, fim, curva){
  const de = { x: parseFloat(c.style.left), y: parseFloat(c.style.top) };
  const k = pontoDoArco(de, para, curva);
  const cubo = c.querySelector('.cubo');
  const rot0 = parseFloat(cubo.style.getPropertyValue('--rz')) || 0;
  const ms = dur * 1000, t0 = performance.now();
  const g = (c._vooG || 0) + 1;
  c._vooG = g;
  c._voo = 1;
  /* sem transições no caminho: cada quadro vale na hora */
  c.style.setProperty('--tsobe', '0s');
  cubo.style.setProperty('--dur', '0s');
  const aplica = p => {
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2, u = 1 - e;
    const x = u*u*de.x + 2*u*e*k.x + e*e*para.x, y = u*u*de.y + 2*u*e*k.y + e*e*para.y;
    c.style.setProperty('--vx', (x - para.x).toFixed(1) + 'px');
    c.style.setProperty('--vy', (y - para.y).toFixed(1) + 'px');
    cubo.style.setProperty('--rz', (rot0 * (1 - Math.min(1, e/.6))).toFixed(1) + 'deg');
  };
  c.style.left = para.x.toFixed(1) + 'px';
  c.style.top  = para.y.toFixed(1) + 'px';
  aplica(0);
  let feito = false;
  const acaba = () => {
    if (feito || c._vooG !== g) return;
    feito = true;
    c._voo = 0;
    c.style.removeProperty('--vx');
    c.style.removeProperty('--vy');
    c.style.removeProperty('--tsobe');
    cubo.style.setProperty('--rz', '0deg');
    if (fim) fim();
  };
  const quadro = () => {
    if (feito || c._vooG !== g) return;
    const p = Math.min(1, (performance.now() - t0) / ms);
    aplica(p);
    if (p >= 1) acaba(); else requestAnimationFrame(quadro);
  };
  requestAnimationFrame(quadro);
  setTimeout(acaba, ms + 60);
}
/* quanto dura o salto de um card para casa: 0,26 s (0,7 s do começo,
   80 % mais rápido e depois mais 50 %) — o mesmo no toque, no
   automático e na junção das colunas */
const SALTO = 0.26;
/* um card volta à casa dele: voa em arco, endireita-se, e ganha a cor ao
   assentar */
function encaixaCubo(c){
  if (!c || c._noLugar) return;
  c._noLugar = true;
  c.classList.remove('chama', 'nao', 'desordem');
  c.classList.add('no-lugar', 'encaixando');
  voaEmArco(c, alvoDe(+c.dataset.z), SALTO, () => {
    if (!c._noLugar) return;
    c.classList.remove('encaixando');
    c.style.removeProperty('transition');
  });
  /* a cor chega no instante em que ele assenta */
  setTimeout(() => { if (c._noLugar) neutro(c, false); }, Math.round(SALTO * 820));
}

/* O BRILHO VERDE: uma faixa que atravessa a tabela — entra pela esquerda
   e sai pela direita até ao meio, e depois entra pela direita e sai pela
   esquerda. Forte na frente, e a apagar-se atrás dela ao longo de
   'cauda' colunas: o brilho não fica, passa. */
function ondaVerde(t){
  const o = ONDA_VERDE;
  const dentro = trilhaAtual === '2' && t >= o.de && t <= o.ate;
  if (!dentro && !o.suja) return;
  const curso = 18 + o.cauda;
  let frente = 0, ida = true;
  if (dentro){
    if (t < o.meio) frente = curso * (t - o.de)/(o.meio - o.de);
    else { ida = false; frente = 19 - curso * (t - o.meio)/(o.ate - o.meio); }
  }
  TP.todos().forEach(c => {
    let k = 0;
    if (dentro){
      /* quantas colunas o card está atrás da frente */
      const d = ida ? frente - +c.dataset.col : +c.dataset.col - frente;
      k = d < -0.5 ? 0 : d < 0 ? (d + 0.5)/0.5 : Math.max(0, 1 - d/o.cauda);
    }
    c.classList.toggle('luz-verde', k > 0.02);
    if (k > 0.02) c.style.setProperty('--verde', k.toFixed(3));
    else c.style.removeProperty('--verde');
  });
  o.suja = dentro;
}

/* AS VAGAS DA DESORDEM. Só os 48 primeiros (do 1 ao 48) ficam na tela, e
   todos na FAIXA DE BAIXO — o espaço das linhas 5 a 7, que fica livre
   enquanto a tabela se monta até à linha 4: a parte de cima é onde a
   tabela se forma, e nada lá fica por cima dela. A faixa partida em 12
   por 4, e cada um no meio da sua parte com um tremor pequeno (a grade
   é apertada). Os outros saem pela direita, para fora da tela, e só
   voltam quando são chamados (na arrumação final). O sorteio é fixo, e
   voltar o áudio refaz a mesma desordem. */
const NA_TELA = 48;
let VAGAS = null;
function vagasDaDesordem(){
  if (VAGAS) return VAGAS;
  let sem = 2024;
  const r = () => (sem = (sem*1664525 + 1013904223) % 4294967296) / 4294967296;
  /* longe do play, no canto de baixo à direita, e da borda de baixo */
  /* a faixa das linhas 5 a 7, longe do play (canto de baixo à direita) */
  const x0 = 50, x1 = 1150, y0 = 445, y1 = 690, cols = 12, linhas = 4;
  const dx = (x1 - x0)/cols, dy = (y1 - y0)/linhas, vagas = [];
  for (let l = 0; l < linhas; l++)
    for (let c = 0; c < cols; c++)
      vagas.push({ x: x0 + c*dx + dx/2 + (r() - .5)*dx*.34,
                   y: y0 + l*dy + dy/2 + (r() - .5)*dy*.18,
                   rot: r()*2*DESORDEM.giro - DESORDEM.giro });
  for (let i = vagas.length - 1; i > 0; i--){ const j = (r()*(i + 1))|0; [vagas[i], vagas[j]] = [vagas[j], vagas[i]]; }
  /* e a ordem em que saem, também sorteada: um de cada vez, ao acaso */
  const cubos = TP.todos().slice().sort((a, b) => +a.dataset.z - +b.dataset.z);
  const ordem = cubos.map((_, i) => i);
  for (let i = ordem.length - 1; i > 0; i--){ const j = (r()*(i + 1))|0; [ordem[i], ordem[j]] = [ordem[j], ordem[i]]; }
  VAGAS = new Map();
  cubos.forEach((c, i) => {
    /* os primeiros NA_TELA na grade; os outros, para lá da borda direita
       (longe o bastante para não aparecerem nem nas faixas do celular) */
    const v = i < NA_TELA ? vagas[i]
            : { x: 1500 + r()*260, y: 40 + r()*640, rot: r()*2*DESORDEM.giro - DESORDEM.giro, fora: true };
    VAGAS.set(+c.dataset.z, Object.assign({ ordem: ordem[i] }, v));
  });
  return VAGAS;
}

/* A DESORDEM, função do relógio: um de cada vez, na ordem sorteada, cada
   card sai da casa dele para a vaga num arco — devagar, depressa, e
   pousa —, já em cinza, e a inclinação chega até ao
   meio do caminho, como no voo do professor. Antes dos 18 s (voltando o
   áudio atrás, ou a chegar ao slide) a mesa está arrumada; nas trilhas
   seguintes do slide, desarrumada. */
function desordem(t){
  const o = DESORDEM;
  let q;
  if (trilhaAtual === '2') q = t - o.de;
  else if (DEPOIS_DA_2.includes(trilhaAtual)) q = Infinity;
  else q = -1;
  if (q < 0 && !o.suja) return;
  const cubos = TP.todos();
  const fim = o.dura + cubos.length * o.fila;
  /* a desordem não tem tabela por baixo: as casas vazias e os números
     dos grupos e dos períodos esmaecem com ela, e voltam com a ordem */
  const mesa = slideDaMesa().querySelector('.mesa');
  /* (e só voltam com a tabela toda montada: ela forma-se do nada) */
  if (mesa) mesa.classList.toggle('sem-casas', q >= 0 && !FINAL.feito);
  if (clarao2){
    const k = (q >= 0 && q < o.clarao) ? Math.pow(1 - q/o.clarao, 2) : 0;
    clarao2.style.opacity = k.toFixed(3);
  }
  /* pousados todos, já não há nada a escrever a cada tique */
  if (q > fim + 0.2 && o.pousou) return;
  const vagas = vagasDaDesordem();
  cubos.forEach((c, i) => {
    const cubo = c.querySelector('.cubo');
    const casa = alvoDe(+c.dataset.z), v = vagas.get(+c.dataset.z);
    if (q < 0){
      c.classList.remove('desordem');
      c.style.left = casa.x.toFixed(1) + 'px';
      c.style.top  = casa.y.toFixed(1) + 'px';
      cubo.style.setProperty('--rz', '0deg');
      c._noLugar = false;
      /* um voo a meio fica sem efeito */
      c._vooG = (c._vooG || 0) + 1;
      c._voo = 0;
      c.style.removeProperty('--vx');
      c.style.removeProperty('--vy');
      c.classList.remove('no-lugar', 'encaixando');
      neutro(c, false);
      return;
    }
    /* quem o encaixe já pôs em casa fica em casa */
    if (c._noLugar) return;
    const p = Math.max(0, Math.min(1, (q - v.ordem*o.fila) / o.dura));
    /* saiu do lugar, perdeu a cor */
    neutro(c, p > 0);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    c.classList.add('desordem');
    /* o salto é uma curva: a Bézier do arco, com o ponto de controlo ao
       lado do meio do caminho */
    const k = v.ctrl || (v.ctrl = pontoDoArco(casa, v, o.curva));
    const u = 1 - e;
    c.style.left = (u*u*casa.x + 2*u*e*k.x + e*e*v.x).toFixed(1) + 'px';
    c.style.top  = (u*u*casa.y + 2*u*e*k.y + e*e*v.y).toFixed(1) + 'px';
    cubo.style.setProperty('--dur', '90ms');
    cubo.style.setProperty('--rz', (v.rot * Math.min(1, e/.4)).toFixed(1) + 'deg');
  });
  o.suja = q >= 0;
  o.pousou = q > fim + 0.2;
}

/* A TELA ESCURA DE MOSELEY, nas duas narrações em que ele aparece. Na
   "2" escurece aos 29 s, a foto entra pela borda esquerda e pousa (sai
   depressa e chega devagar), e o critério 1 escreve-se à direita. Na
   "2.3" escurece aos 2,5 s com a foto já no lugar e "Critério 2" já
   escrito, e o resto escreve-se de 3,6 a 7 s. Fica até ao toque, que a
   desfaz (SEQ.dispensou). */
const CENAS_MOSELEY = {
  '2':   { escurece:29.0, entra:29.0, dura:1.4, criterio:1 },
  '2.3': { escurece:2.5, criterio:2 }
};
function cena2(t){
  if (!veu2) return;
  const tr = trilhaAtual, C = CENAS_MOSELEY[tr];
  const on = (!!C && t >= C.escurece && SEQ.dispensou !== tr) || !!SEQ.aguardaToque2;
  veu2.classList.toggle('on', on);
  /* fora destas narrações, ou já dispensada, a tela escura esmaece com o
     que tem */
  if (!C || SEQ.dispensou === tr) return;
  veu2.dataset.criterio = C.criterio;
  if (C.entra !== undefined){
    const p = Math.max(0, Math.min(1, (t - C.entra) / C.dura));
    const e = 1 - Math.pow(1 - p, 3);
    foto2.style.opacity = p > 0 ? '1' : '0';
    foto2.style.transform = 'translateX(' + (-(1 - e)*700).toFixed(1) + 'px) rotate(' + (-(1 - e)*10).toFixed(2) + 'deg)';
  } else {
    foto2.style.opacity = '1';
    foto2.style.transform = 'none';
  }
  (C.criterio === 1 ? DIG2 : DIG3).escreve(t);
}

/* ============================================================
   OS EVENTOS DA "1.4" — os símbolos que não saem do nome em português
     1 → 8 s      oito deles crescem, um a um, com luz vinho
     10 s         o Na gira e cresce no lugar, e o nome some;
                  15 s "Sódio" aparece e pulsa 2×; 16,8 s o símbolo
                  pulsa; 17,7 s o nome pulsa outra vez; 21 s "Natrium"
                  escrito à direita; 24 s volta, e a palavra sai a girar
     25 s         o Pb; 29 s "Chumbo" aparece e pulsa 2×; 30 s
                  "Plumbum" à esquerda; 34 s volta
     35,6 s       o Cu; 39,7 s "Cobre" aparece e pulsa 2×; 41 s
                  "Cuprum" à esquerda; 45 s volta
     54 s         o quiz, agora com os de nome diferente
   O zoom é o mesmo da "1.3A" (zoomNoLugar). Tudo é função do tempo da
   narração, menos o quiz (QUIZ_NA_HORA): aberto, fica aberto.
   ============================================================ */
const EV14 = {
  /* Na, Pb e Cu ficam de fora: são eles que aparecem logo a seguir */
  oito:['P','K','Ag','Sn','Sb','W','Au','Hg'],
  onda:{ de:1.0, ate:8.0, largura:1.0, cresce:0.6, classe:'luz-vinho', suja:false },
  zooms:[
    /* o Na: o nome pulsa aos 15 e aos 17,7 s, o símbolo aos 16,8 s */
    { sym:'Na', cresce:10.0, pulsa:[15.0, 17.7], pulsaSym:[16.8], volta:24.0, esconde:true,
      latim:{ texto:'Natrium', de:21.0, lado:'direita'  }, suja:false },
    { sym:'Pb', cresce:25.0, pulsa:29.0, volta:34.0, esconde:true,
      latim:{ texto:'Plumbum', de:30.0, lado:'esquerda' }, suja:false },
    { sym:'Cu', cresce:35.6, pulsa:39.7, volta:45.0, esconde:true,
      latim:{ texto:'Cuprum',  de:41.0, lado:'esquerda' }, suja:false }
  ],
  /* a palavra latina: quanto tempo leva cada letra a ser escrita */
  porLetra:0.09
};
let LISTA_14 = null;
function efeitos14(t){
  if (!LISTA_14) LISTA_14 = EV14.oito.map(s => TP.cubo(s)).filter(Boolean);
  ondaDeUmEmUm(t, EV14.onda, LISTA_14);
  EV14.zooms.forEach(z => zoomNoLugar(t, z));
}
function efeitos13(t){
  const c = SEQ.eleito;
  if (!c) return;
  /* o que a "1.2" deixou em foco volta ao normal com a trilha nova */
  c.classList.remove('foco-num','foco-massa','pulsa');
  if (rotNum){ rotNum.classList.remove('brilha'); rotMassa.classList.remove('brilha'); }

  const de = VOLTA13[trilhaAtual];
  /* ACABADA A VOLTA, A VOLTA LARGA O CUBO. Escreve o estado final uma vez
     e depois não mexe mais: os eventos seguintes da trilha podem pegar
     neste mesmo elemento (o escolhido pode ser o F ou o O), e duas mãos a
     escrever o mesmo tamanho a cada tique não se entendem. Voltando o
     áudio para trás, para dentro da volta, ela retoma. */
  if (t > de + VOLTA13.dura + 0.3){ if (c._voltou) return; c._voltou = true; }
  else c._voltou = false;
  const p = Math.max(0, Math.min(1, (t - de) / VOLTA13.dura));
  const feito = p*p*p;
  const alto = { x:(xDaColuna(8) + xDaColuna(9))/2, y:yDaLinha(2) };
  const casa = alvoDe(+c.dataset.z);

  const tr = 'transform 110ms ease-out, left 90ms linear, top 90ms linear';
  if (c.style.transition !== tr) c.style.transition = tr;
  c.style.left = (alto.x + (casa.x - alto.x)*feito).toFixed(1) + 'px';
  c.style.top  = (alto.y + (casa.y - alto.y)*feito).toFixed(1) + 'px';
  c.style.setProperty('--onda', (2.8 - 1.8*feito).toFixed(3));
  /* o giro de ida foi +720°; a volta desenrola-o até 0, de pé */
  const cubo = c.querySelector('.cubo');
  const ry = 720*(1 - feito);
  cubo.style.setProperty('--dur', '110ms');
  cubo.style.setProperty('--ry', ry.toFixed(1) + 'deg');
  cubo.style.setProperty('--rzc', '0deg');
  c.dataset.ry = ry;
  /* chegado, volta a ser um entre os 118: sem anel, sem ficar por cima */
  c.classList.toggle('eleito', p < 1);

  /* os dois nomes apontavam para o card lá em cima: saem quando ele parte */
  if (rotNum){
    rotNum.classList.toggle('on', t < de);
    rotMassa.classList.toggle('on', t < de && massaTxt.textContent.length > 0);
  }
}

/* ============================================================
   O QUIZ — no fim da "1.3A" ou da "1.3B", seis perguntas seguidas
   Um elemento sai da casa dele e vem para a frente, a girar, junto com
   o cartão "Qual o nome desse elemento?": o cubo à esquerda, com um "?"
   no lugar do nome — que está escrito nas seis faces e daria a
   resposta —, e as três respostas à direita, uma em cima da outra.

     acerto               confetes, fanfarra e aplausos, e depois a voz:
                          "exato!" e "muitobem" alternados, "perfeito"
                          na última
     erro em qualquer uma a tela treme em vermelho e toca "error", e
                          depois "Calmanaproximaacerta"

   Depois de cada resposta o cubo volta para casa, rápido e a girar, e o
   exemplo seguinte rola para a frente AO MESMO TEMPO que toca o som da
   entrada: "eesseaqui" e "próximo" alternados, "sómaisesse" antes da
   última. Errar não prende o aluno: a aula avança.

   ENQUANTO O QUIZ DURA, O PLAY SAI DE CENA: quem faz a aula andar é a
   escolha do aluno. No fim, o cartão da nota (de 1 a 10, pelos acertos)
   com uma mensagem boa, o som "statistics", e o play de volta.

   Os elementos saem de listas em que O SÍMBOLO SAI DO NOME EM
   PORTUGUÊS — Carbono dá C, Cobalto dá Co —, para o aluno poder chegar
   ao nome pelo símbolo. Ficaram de fora os que não batem: Sódio (Na),
   Potássio (K), Cobre (Cu), Prata (Ag), Ouro (Au)… Depois da "1.3A",
   seis de uma letra; depois da "1.3B", seis de duas; nunca o elemento
   que o aluno escolheu. Em cada item a primeira resposta é a certa; as
   outras são nomes de verdade, parecidos de propósito.

   Isto acontece com a narração parada, entre uma trilha e a seguinte:
   aqui quem marca o passo são os próprios efeitos sonoros — cada um
   espera o anterior acabar.
   ============================================================ */

/* os efeitos sonoros tocam e avisam quando acabam — é assim que a cena
   espera cada um antes de dar o passo seguinte. Um arquivo que não
   carregue não prende a aula: conta como acabado. */
const EFEITOS = new Set();
function tocaEfeito(nome){
  return new Promise(pronto => {
    /* um nome é um efeito da pasta vfx; com barra, é o caminho do arquivo */
    const a = new Audio(encodeURI(nome.includes('/') ? nome : 'Audios/vfx/' + nome + '.mp3'));
    EFEITOS.add(a);
    let feito = false;
    const fim = () => { if (feito) return; feito = true; EFEITOS.delete(a); pronto(a); };
    a.addEventListener('ended', fim);
    a.addEventListener('error', fim);
    setTimeout(fim, 12000);            /* rede de segurança: nunca fica preso */
    a.play().catch(fim);
  });
}
const espera = ms => new Promise(ok => setTimeout(ok, ms));

/* A MENSAGEM DA RESPOSTA. Com o nome latino (quiz da "1.4"): "Exato!
   Plumbum é o Chumbo.", e só "Plumbum é o Chumbo." no erro — as letras
   que viraram o símbolo em destaque. Sem ele: "Exato! É o Carbono." e
   "Era o Carbono.". 'inicio' é a frase do acerto; null no erro. */
const NOMES_FEMININOS = new Set(['Prata', 'Platina']);
function escreveResposta(msg, item, certa, inicio){
  const art = NOMES_FEMININOS.has(certa) ? 'a' : 'o';
  msg.textContent = '';
  if (!item.latim){
    msg.textContent = inicio ? inicio + ' É ' + art + ' ' + certa + '.' : 'Era ' + art + ' ' + certa + '.';
    return;
  }
  if (inicio) msg.append(inicio + ' ');
  msg.appendChild(palavraLatina(item.latim, SIMBOLOS[item.z-1]));
  msg.append(' é ' + art + ' ' + certa + '.');
}
/* a palavra latina com as letras do símbolo em destaque: a primeira, e a
   segunda letra do símbolo onde ela aparece depois (Hydrar-g-yrum) */
function palavraLatina(palavra, sym){
  const marca = new Set([0]);
  if (sym.length > 1){
    const j = palavra.toLowerCase().indexOf(sym[1].toLowerCase(), 1);
    if (j > 0) marca.add(j);
  }
  const w = document.createElement('span');
  w.className = 'quiz-latim';
  [...palavra].forEach((letra, i) => {
    if (marca.has(i)){ const b = document.createElement('b'); b.textContent = letra; w.appendChild(b); }
    else w.append(letra);
  });
  return w;
}

/* onde o cubo da pergunta fica: no meio da coluna esquerda do cartão */
const QUIZ_LUGAR = { x:380, y:372, escala:3.3 };
/* quantas perguntas o quiz faz */
const QUIZ_TOTAL = 6;
/* A VOZ DEPOIS DE CADA COMEMORAÇÃO — sorteada entre as quatro, sem
   repetir: um baralho que se embaralha de novo quando acaba, e cuja
   primeira carta nunca é a mesma que acabou de sair. A última questão
   de cada quiz tem sempre "perfeito". A frase escrita acompanha a voz. */
const VOZES_DO_ACERTO = [
  { som:'exato!',     frase:'Exato!'      },
  { som:'muitobem',   frase:'Muito bem!'  },
  { som:'issomesmo!', frase:'Isso mesmo!' },
  { som:'excelente',  frase:'Excelente!'  }
];
const VOZ_DA_ULTIMA = { som:'perfeito', frase:'Perfeito!' };
let BARALHO_VOZES = [], VOZ_ANTERIOR = null;
function vozDoAcerto(ultima){
  if (ultima) return (VOZ_ANTERIOR = VOZ_DA_ULTIMA);
  if (!BARALHO_VOZES.length){
    BARALHO_VOZES = embaralha(VOZES_DO_ACERTO.slice());
    if (BARALHO_VOZES[0] === VOZ_ANTERIOR) BARALHO_VOZES.push(BARALHO_VOZES.shift());
  }
  return (VOZ_ANTERIOR = BARALHO_VOZES.shift());
}

/* O SOM DA ENTRADA — toca ao mesmo tempo que o exemplo novo rola para a
   frente: "eesseaqui" e "próximo" alternados, e "sómaisesse" na entrada
   da última pergunta. Toca também depois de um erro: são sons neutros, e
   o ritmo da aula não muda por o aluno ter errado. */
function somDaEntrada(passo, total){
  if (passo === total - 1) return 'sómaisesse';
  return passo % 2 === 1 ? 'eesseaqui' : 'próximo';
}

const QUIZ = {
  aberto:false, passo:0, itens:[], cubo:null, travado:false,
  /* cada abertura tem o seu número: se o aluno sai do slide a meio, a
     sequência antiga reconhece que já não é a dela e pára */
  geracao:0,
  caixa(){ return slides[1].querySelector('.quiz'); },

  abre(trilha){
    const c = SEQ.eleito;
    this.origem = trilha;
    const lista = (trilha === '1.3A' ? QUIZ_UMA : trilha === '1.3B' ? QUIZ_DUAS : QUIZ_DIFERENTES)
      .filter(p => !c || p.z !== +c.dataset.z);
    this.itens = embaralha(lista.slice()).slice(0, QUIZ_TOTAL);
    this.passo = 0;
    this.acertos = 0;
    this.aberto = true;
    this.mostrandoNota = false;
    this.caixa().classList.remove('nota-on');
    /* o play sai de cena: daqui em diante quem faz a aula andar é a escolha */
    stage.classList.add('em-quiz');
    const g = ++this.geracao;
    this.caixa().classList.add('on');
    this.apresenta(g);
  },

  /* um exemplo: o cubo vem para a frente, sem o nome, e o cartão abre */
  apresenta(g){
    if (g !== this.geracao) return;
    const item = this.itens[this.passo];
    const cx = this.caixa();
    cx.querySelector('.quiz-marca').textContent =
      'Questão ' + (this.passo + 1) + ' de ' + this.itens.length;
    const msg = cx.querySelector('.quiz-msg');
    msg.textContent = ''; msg.className = 'quiz-msg';
    const ops = cx.querySelector('.quiz-ops');
    ops.innerHTML = '';
    embaralha(item.op.slice()).forEach(nome => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'quiz-op';
      b.textContent = nome;
      b.addEventListener('click', () => this.responde(b, nome, item, g));
      ops.appendChild(b);
    });
    cx.classList.add('card-on');

    const cubo = TP.cubo(item.z);
    this.cubo = cubo;
    const curva = '.9s cubic-bezier(.3,.8,.25,1)';
    cubo.classList.add('pergunta', 'sem-nome');
    cubo.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    cubo.style.left = QUIZ_LUGAR.x + 'px';
    cubo.style.top  = QUIZ_LUGAR.y + 'px';
    cubo.style.setProperty('--onda', QUIZ_LUGAR.escala);
    TP.gira(cubo, { eixo:'y', graus:720, dur:900 });
    this.travado = false;
  },

  async responde(b, nome, item, g){
    if (!this.aberto || this.travado || g !== this.geracao) return;
    this.travado = true;
    const cx = this.caixa(), msg = cx.querySelector('.quiz-msg');
    const certa = item.op[0], acertou = nome === certa;
    const ultima = this.passo === this.itens.length - 1;

    /* a resposta certa aparece sempre — no botão e no cubo, que ganha o
       nome de volta —, tenha o aluno acertado ou não */
    cx.querySelectorAll('.quiz-op').forEach(o => {
      if (o.textContent === certa) o.classList.add('certa');
      else if (o !== b) o.classList.add('fora');
      o.disabled = true;
    });
    this.cubo.classList.remove('sem-nome');

    if (acertou){
      this.acertos++;
      const voz = vozDoAcerto(ultima);
      escreveResposta(msg, item, certa, voz.frase);
      msg.className = 'quiz-msg ok';
      confete();
      /* todo acerto tem a festa inteira: fanfarra e aplausos juntos, e,
         quando a fanfarra acaba, a voz daquela pergunta — uma diferente
         em cada uma, para nada se repetir */
      const fanfarra = tocaEfeito('funfare');
      tocaEfeito('applause');                /* os aplausos continuam por baixo */
      await fanfarra;
      if (g !== this.geracao) return;
      await tocaEfeito(voz.som);
    } else {
      b.classList.add('errada');
      escreveResposta(msg, item, certa, null);
      msg.className = 'quiz-msg erro';
      tremeVermelho();
      await tocaEfeito('error');
      if (g !== this.geracao) return;
      await tocaEfeito('Calmanaproximaacerta');
    }
    if (g !== this.geracao) return;

    await this.devolve();
    if (g !== this.geracao) return;
    this.passo++;
    if (this.passo >= this.itens.length){ this.resultado(g); return; }
    /* o som da entrada e o exemplo novo, juntos: o som não é esperado,
       toca por cima do cubo a rolar para a frente */
    tocaEfeito(somDaEntrada(this.passo, this.itens.length));
    this.apresenta(g);
  },

  /* O CUBO VOLTA PARA CASA, rápido e a girar. É a vinda ao contrário:
     a vinda sai depressa e chega devagar, a volta sai devagar e chega
     depressa, e o giro desenrola-se até ficar de pé. */
  devolve(){
    const c = this.cubo, cx = this.caixa();
    cx.classList.remove('card-on');
    const casa = alvoDe(+c.dataset.z);
    const curva = '.6s cubic-bezier(.55,0,.75,.2)';
    c.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    c.style.left = casa.x.toFixed(1) + 'px';
    c.style.top  = casa.y.toFixed(1) + 'px';
    c.style.setProperty('--onda', '1');
    TP.gira(c, { eixo:'y', graus:-720, dur:600 });
    return espera(650).then(() => {
      c.classList.remove('pergunta', 'sem-nome');
      c.style.removeProperty('transition');
      c.style.removeProperty('--onda');
    });
  },

  /* O FIM: o cartão da nota — de 1 a 10, pela fração de acertos, e nunca
     abaixo de 1 —, com uma mensagem boa, o som "statistics", e o play de
     volta, já carregado com a narração seguinte */
  resultado(g){
    if (g !== this.geracao) return;
    const total = this.itens.length, a = this.acertos;
    const nota = Math.max(1, Math.round(a / total * 10));
    const cx = this.caixa();
    cx.querySelector('.nota-num').textContent = nota;
    cx.querySelector('.nota-acertos').textContent = 'Você acertou ' + a + ' de ' + total + ' perguntas.';
    cx.querySelector('.nota-msg').textContent = mensagemDaNota(nota);
    cx.classList.remove('card-on');
    cx.classList.add('nota-on');
    this.mostrandoNota = true;
    this.nota = nota;
    tocaEfeito('statistics');
    /* o play fica fora de cena: quem segue é o Continuar do cartão, que
       toca a narração seguinte, ou o Refazer, que abre outro quiz igual */
    cx.classList.toggle('sem-seguir', !DEPOIS_DO_QUIZ[this.origem]);
  },
  /* OS DOIS BOTÕES DO CARTÃO. Refazer: outro quiz igual, com outro
     sorteio. Continuar: o cartão sai, e toca a narração seguinte. */
  refaz(){
    if (!this.mostrandoNota) return;
    const o = this.origem;
    this.saiDaNota();
    this.abre(o);
  },
  continua(){
    if (!this.mostrandoNota) return;
    const p = DEPOIS_DO_QUIZ[this.origem];
    this.saiDaNota();
    stage.classList.remove('em-quiz');
    if (p) tocaTrilha(p);
  },
  /* começada a narração seguinte, o cartão da nota sai de cena */
  saiDaNota(){
    this.mostrandoNota = false;
    this.aberto = false;
    this.caixa().classList.remove('on', 'nota-on');
  },

  /* saindo do slide: tudo pára e fica arrumado (o cubo volta à casa pelo
     TP.reinicia, que corre logo a seguir) */
  fecha(){
    this.geracao++;
    EFEITOS.forEach(a => a.pause());
    EFEITOS.clear();
    const cx = slides[1] && slides[1].querySelector('.quiz');
    if (cx) cx.classList.remove('on', 'card-on', 'nota-on');
    stage.classList.remove('em-quiz');
    this.aberto = false; this.travado = false; this.cubo = null; this.mostrandoNota = false;
  }
};

/* a mensagem do cartão da nota: sempre boa, e cada vez mais festiva */
function mensagemDaNota(n){
  if (n === 10) return 'Nota máxima! Você já lê a tabela como quem lê um mapa.';
  if (n >= 8)   return 'Muito bem! Você está pegando o jeito dos símbolos.';
  if (n >= 5)   return 'Bom trabalho! Mais um pouco de prática e a tabela fica toda sua.';
  return 'Você está começando — e é assim que se aprende. Vamos em frente!';
}
som.addEventListener('play', () => { if (QUIZ.mostrandoNota) QUIZ.saiDaNota(); });
