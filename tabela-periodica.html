<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiobook interativo da Tabela Periódica Moderna</title>
<meta name="theme-color" content="#EDEAF2">
<!-- só clara: o modo escuro automático de alguns celulares escurecia
     o fundo fora do palco, e as laterais ficavam pretas -->

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabela Periódica">
<meta name="application-name" content="Tabela Periódica">
<meta name="description" content="O audiobook interativo da Tabela Periódica do Prof. Amauri Junior: a aula guiada por áudio, com os 118 elementos em cubos que giram.">
<link rel="manifest" href="manifest.webmanifest">
<!-- os ícones levam ?v=4: o endereço novo é o que faz o aparelho trocar o
     ícone que guardou do app instalado -->
<link rel="icon" type="image/png" sizes="32x32" href="icones/app-32.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="icones/app-192.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="icones/app-180.png?v=4">
<!-- AS FONTES MORAM AQUI DENTRO, como no app do professor: o aluno abre
     isto no celular da casa dele, e nada é pedido para fora. -->
<link rel="stylesheet" href="fontes/fontes.css">
<style>
/* ============================================================
   PALETA — as 3 cores do tema, as mesmas do app do professor
   papel-lavanda (fundo) · índigo (estrutura) · âmbar (destaque)
   ============================================================ */
:root{
  --fundo:      #EDEAF2;
  --fundo-alto: #F4F2F8;
  --fundo-2:    #E2DDEE;
  --tinta:      #201C42;
  --tinta-dim:  rgba(32,28,66,.62);
  --tinta-faint:rgba(32,28,66,.28);
  --indigo:     #4C3FBF;
  --indigo-dim: rgba(76,63,191,.22);
  --ouro:       #A96B10;
  --ouro-luz:   #E2A22B;
  --ouro-dim:   rgba(226,162,43,.26);

  /* ---- as cores das famílias da tabela ----
     Copiadas tal e qual da aula do professor: as duas telas têm de
     pintar a mesma casa da mesma cor, senão o aluno não reconhece em
     casa a tabela que viu na sala. */
  --cat-alcalinos:   #D2591F;
  --cat-alcterrosos: #C58A0E;
  --cat-transicao:   #2E7BAE;
  --cat-metais:      #1E8F7D;
  --fam-boro:        #6F8C1E;
  --cat-ametais:     #2E9450;
  --cat-halogenios:  #C13757;
  --cat-nobres:      #5B4BD6;
  --cat-lantanideos: #8B3FBE;
  --cat-actinideos:  #B1408C;
  --cat-calcogenios: #128B86;

  /* tempos e curvas das transições */
  --t-capa: .82s;
  --e-capa: cubic-bezier(.42,.02,.24,1);
  --t-desl: .58s;
  --e-desl: cubic-bezier(.32,.72,.24,1);
  --e-salto: cubic-bezier(.3,1.05,.35,1);

  --display: 'Space Grotesk', system-ui, sans-serif;
  --body:    'IBM Plex Sans', system-ui, sans-serif;
  --mono:    'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#DAD5E6}
body{
  font-family:var(--body);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:pan-y;
}
:focus-visible{outline:2px solid var(--ouro);outline-offset:3px;border-radius:4px}

/* ---------- palco 16:9 que escala pra qualquer tela ---------- */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{
  position:absolute;top:50%;left:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--fit,1));
  background:linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  box-shadow:0 26px 70px rgba(32,28,66,.28);
  overflow:hidden;
  touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  /* a profundidade em que o cubo da capa gira */
  perspective:1500px;perspective-origin:50% 50%;
}

/* a grade da tabela como papel de fundo: células, não milimetrado */
/* (a grade do papel saiu a pedido do professor: o fundo é liso, só com
   as duas luzes de baixo) */
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
}
/* duas luzes, uma fria e uma quente, para o papel não ficar chapado */
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
             radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%);
}

/* ---- O CELULAR DEITADO: o palco até às bordas (ver ajustaPalco) ----
   A tela é mais larga do que 16:9, e a cena, medida pela altura, deixava
   duas faixas nos lados. Aqui o papel de fundo passa para a tela inteira
   (a grade alinhada com a do palco), o palco deixa de cortar o que sai
   dele, as camadas que cobrem a cena cobrem também as faixas — por uma
   sombra sem desfoque, que não mexe no que está dentro delas —, e o play
   e a versão vão para os cantos de verdade. Só no celular: tablets,
   Chromebooks e computadores nunca entram aqui. */
html.palco-largo #viewport{
  background-color:var(--fundo);
  /* (sem a grade, como no palco) */
  background-image:
    radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
    radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%),
    linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  background-size:100% 100%, 100% 100%, 100% 100%;
  background-repeat:no-repeat;
}
html.palco-largo #stage{background:transparent;box-shadow:none;overflow:visible}
html.palco-largo #stage::before, html.palco-largo #stage::after{display:none}
html.palco-largo .veu     {box-shadow:0 0 0 var(--folga) rgba(12,10,32,.87)}
html.palco-largo .quiz    {box-shadow:0 0 0 var(--folga) rgba(12,10,32,.55)}
html.palco-largo .memoria {box-shadow:0 0 0 var(--folga) rgba(7,6,22,.995)}
html.palco-largo #flash-erro{box-shadow:0 0 0 var(--folga) rgba(220,38,60,.55)}
html.palco-largo #som, html.palco-largo #som-dica{translate:var(--folga) 0}
/* o da velocidade fica no canto do palco, junto do botão do carrossel, e
   não vai para a borda: no canto da tela, arredondado e com a câmera,
   ele sumiria */
/* solto na montagem, o botão da velocidade já foi medido com a folga:
   somá-la outra vez o faria saltar para o lado */
html.palco-largo #vel.solto{translate:none}
/* o mesmo para o play solto fora da capa (na capa ele vive do layout fixado) */
html.palco-largo #stage:not(.na-capa) :is(#som, #som-dica).solto{translate:none}
html.palco-largo #versao{translate:calc(-1 * var(--folga)) 0}
/* e a barrinha do progresso, de borda a borda: a fração vem em --prog */
html.palco-largo #progress{left:calc(-1 * var(--folga));right:calc(-1 * var(--folga));width:auto!important;
  transform-origin:left center;transform:scaleX(var(--prog,0));transition:transform .45s cubic-bezier(.4,0,.2,1)}

/* ---- O TABLET: o palco até às bordas de cima e de baixo (ver ajustaPalco) ----
   O mesmo do celular deitado, mas na vertical: o papel na tela inteira,
   as camadas que cobrem a cena cobrem também as faixas, o cabeçalho e os
   botões do alto sobem, o play e a versão descem, e a tabela cresce um
   pouco (--cresce-alto) no espaço que ficou. */
html.palco-alto #viewport{
  background-color:var(--fundo);
  background-image:
    radial-gradient(115% 85% at 82% 6%,rgba(76,63,191,.09),transparent 58%),
    radial-gradient(85% 75% at 4% 100%,rgba(226,162,43,.14),transparent 62%),
    linear-gradient(160deg,var(--fundo-alto),var(--fundo) 52%,var(--fundo-2));
  background-size:100% 100%, 100% 100%, 100% 100%;
  background-repeat:no-repeat;
}
html.palco-alto.capa-escura #viewport{background:#14131B}
html.palco-alto #stage{background:transparent;box-shadow:none;overflow:visible}
html.palco-alto #stage::before, html.palco-alto #stage::after{display:none}
html.palco-alto .veu     {box-shadow:0 0 0 var(--folgav) rgba(12,10,32,.87)}
html.palco-alto .quiz    {box-shadow:0 0 0 var(--folgav) rgba(12,10,32,.55)}
html.palco-alto .memoria {box-shadow:0 0 0 var(--folgav) rgba(7,6,22,.995)}
html.palco-alto .breu-quiz{box-shadow:0 0 0 var(--folgav) #000}
html.palco-alto #flash-erro{box-shadow:0 0 0 var(--folgav) rgba(220,38,60,.55)}
/* o alto: o cabeçalho, o progresso, o carrossel e a velocidade */
html.palco-alto .tira, html.palco-alto #ver-slides, html.palco-alto #vel{translate:0 calc(-1 * var(--folgav))}
html.palco-alto #progress{top:calc(-1 * var(--folgav))}
/* o baixo: o play e a versão */
html.palco-alto #som, html.palco-alto #som-dica, html.palco-alto #versao{translate:0 var(--folgav)}
/* soltos na montagem, já foram medidos no lugar novo */
html.palco-alto :is(#som, #som-dica, #vel, #ver-slides).solto{translate:none}
/* a tabela cresce um fio, a partir do meio */
html.palco-alto .slide:not(.capa) .cena{scale:var(--cresce-alto,1)}

/* barra de progresso da apresentação */
#progress{position:absolute;top:0;left:0;height:3px;background:var(--ouro-luz);z-index:6;
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- a tabelinha colorida, a marca do tema ---------- */
#tabela{
  position:absolute;z-index:0;pointer-events:none;
  width:320px;right:-24px;bottom:-20px;opacity:.4;
  transition:width .8s var(--e-capa),right .8s var(--e-capa),
             bottom .8s var(--e-capa),opacity .8s var(--e-capa);
}
#tabela .cel{stroke:rgba(255,255,255,.72);stroke-width:.5;
  transition:fill 1.2s ease}
/* A CASA QUE ACENDE — de vez em quando uma casinha da capa diz quem é */
#tabela .luz{
  opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.84);
  transition:opacity .3s ease, transform .4s cubic-bezier(.2,1.35,.4,1);
}
#tabela .luz.on{opacity:1;transform:scale(1)}
#tabela .luz .carta{fill:#FFFDF8;fill-opacity:.96;stroke:var(--cl);stroke-width:.7}
#tabela .luz .n{font-family:var(--mono);font-size:2.7px;fill:var(--tinta-dim)}
#tabela .luz .s{font-family:var(--display);font-weight:600;font-size:5.4px;
  fill:var(--cl);text-anchor:middle}
/* Na capa a tabelinha é a ilustração, mas agora em ponto pequeno: o
   título cresceu e é ele que manda na folha. Ela fica no canto de
   baixo à direita, do tamanho de um selo — e acima do botão da
   narração, que mora no mesmo canto. */
#stage.na-capa #tabela{width:520px;right:30px;bottom:88px;opacity:1}
/* onde há uma tabela de verdade em cena, a do canto sai */
#stage.sem-marca #tabela{opacity:0}

/* ---------- slides ---------- */
/* o deck é o volume 3D onde as faces do cubo giram */
#deck{position:absolute;inset:0;z-index:1;transform-style:preserve-3d}
.slide{
  position:absolute;inset:0;
  padding:56px 80px 58px;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  backface-visibility:hidden;
}
.slide.is-active {opacity:1;visibility:visible;z-index:3}
.slide.is-leaving{opacity:1;visibility:visible;z-index:2}

/* ===== capa <-> slide 1: o cubo girando =====
   As duas faces giram juntas em torno do mesmo eixo, cada uma
   empurrada meia volta para longe do observador e trazida de volta —
   é isso que faz o vinco do canto do cubo aparecer no meio do giro. */
.slide::after{content:'';position:absolute;inset:0;z-index:9;pointer-events:none;
  background:#0B0D20;opacity:0}

.fx-cube-in-next {animation:cubeInNext  var(--t-capa) var(--e-capa) both}
.fx-cube-out-next{animation:cubeOutNext var(--t-capa) var(--e-capa) both}
.fx-cube-in-prev {animation:cubeInPrev  var(--t-capa) var(--e-capa) both}
.fx-cube-out-prev{animation:cubeOutPrev var(--t-capa) var(--e-capa) both}
.fx-cube-in-next::after,.fx-cube-in-prev::after {animation:faceClara var(--t-capa) var(--e-capa) both}
.fx-cube-out-next::after,.fx-cube-out-prev::after{animation:faceEscura var(--t-capa) var(--e-capa) both}

@keyframes cubeInNext{
  from{transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutNext{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
}
@keyframes cubeInPrev{
  from{transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutPrev{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
}
@keyframes faceClara {from{opacity:.5} to{opacity:0}}
@keyframes faceEscura{from{opacity:0}  to{opacity:.5}}

/* ---------- CAPA ----------
   Três faixas verticais, da esquerda para a direita: o título, o
   retrato, e a tabelinha no canto de baixo. O título é agora o nome do
   que isto é — um audiobook —, e é a peça mais comprida da capa: por
   ele ganhar largura, o retrato foi para a direita e a tabelinha
   encolheu para o canto. O endereço saiu de debaixo do nome e foi
   morar no rodapé, sozinho: ali ele se lê sem disputar com nada. */
.slide.capa{justify-content:center;padding-left:88px}
.capa .marca{
  font-family:var(--mono);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--indigo);margin-bottom:22px;
}
.capa h1{
  font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;
  letter-spacing:-.028em;color:var(--tinta);
}
.capa h1 em{font-style:normal;color:var(--ouro)}
/* a última palavra fica no meio da caixa do título, e não encostada à
   esquerda: sozinha numa linha curta, alinhada com as outras ela
   parecia uma sobra da linha de cima */
.capa h1 .ult{display:block;text-align:center}
/* e "Tabela Periódica" também, na linha dela: as duas linhas âmbar
   descem pelo eixo do título, uma debaixo da outra */
.capa h1 .linha{display:block;text-align:center}

/* ---- os blocos gigantes da capa ----
   Três cubos em tamanho grande, ao lado da tabelinha: o sódio, o ítrio
   e o lantânio — os três primeiros que a tabelinha acende. São os
   mesmos cubos da tabela do slide 1, na mesma construção de seis faces
   iguais; aqui em ponto grande, para quem chega ver de perto do que é
   feita a tabela que está ao lado. */
.capa .blocos{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ---- as frases digitadas ----
   Aparecem no vazio à direita do retrato, letra a letra, como alguém a
   escrever depressa. A caixa tem tamanho fixo mesmo vazia: é peça de
   montagem, e uma caixa de altura zero não se deixaria pegar. */
.capa .digitado{
  position:absolute;left:305px;top:350px;width:410px;height:250px;z-index:3;
  pointer-events:none;
}
body.montagem .capa .digitado{pointer-events:auto}
.capa .frase{
  display:none;margin:0 0 12px;
  font-family:var(--display);font-weight:500;font-size:27px;line-height:1.22;
  letter-spacing:-.01em;color:var(--tinta);
  transition:opacity .35s ease;
}
.capa .frase.on{display:block}
.capa .frase.saindo{opacity:0}
/* o tracinho: firme enquanto escreve, a piscar quando espera */
.capa .frase .cursor{
  display:inline-block;width:3px;height:.95em;margin-left:3px;vertical-align:-.12em;
  background:var(--ouro-luz);border-radius:1px;
}
.capa .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
@keyframes piscaCursor{50%{opacity:0}}
.capa .risco{
  width:200px;height:4px;margin:26px 0 20px;border-radius:2px;
  background:linear-gradient(90deg,var(--ouro-luz),var(--indigo));
}
.capa .autor{font-size:22px;font-weight:300;color:var(--tinta-dim);letter-spacing:.01em}
.capa .autor b{font-weight:500;color:var(--tinta)}
/* o endereço, no rodapé: quem lê isto de longe está lendo o título, e
   quem quer o contato está perto — e é no pé da folha que se procura */
.capa .email{
  position:absolute;left:88px;bottom:46px;
  font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:.01em;
  color:var(--indigo);text-decoration:none;cursor:pointer;
  /* é um link, e o palco inteiro não deixa selecionar texto: aqui deixa,
     para quem preferir copiar o endereço à mão */
  user-select:text;-webkit-user-select:text;
  border-bottom:1px solid transparent;transition:border-color .2s,color .2s;
}
.capa .email:hover{color:var(--ouro);border-bottom-color:var(--ouro-dim)}

/* ---- o menu do endereço (botão direito, ou dedo demorado) ----
   Uma opção só, com o desenho da barra de controles. */
#menu-email{
  position:fixed;z-index:95;min-width:180px;padding:6px;
  background:rgba(255,255,255,.97);border:1px solid var(--indigo-dim);
  border-radius:11px;backdrop-filter:blur(9px);
  box-shadow:0 14px 36px rgba(32,28,66,.24);
}
#menu-email[hidden]{display:none}
#menu-email button{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  border:0;border-radius:7px;background:transparent;cursor:pointer;
  font-family:var(--body);font-size:14px;color:var(--tinta);text-align:left;
}
#menu-email button:hover,#menu-email button:focus-visible{
  background:rgba(76,63,191,.1);color:var(--indigo);outline:none;
}
#menu-email svg{flex:none;color:var(--ouro)}
/* o retrato do autor, enquadrado como uma célula da tabela */
.capa .foto{
  position:absolute;left:790px;top:400px;width:164px;height:242px;margin:0;
  transform:translate(-50%,-50%) scale(1.1);
  padding:7px;background:#fff;border:1.5px solid var(--indigo);border-radius:6px;
  box-shadow:0 12px 28px rgba(32,28,66,.2);
}
.capa .foto img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}

/* ============================================================
   A CAPA NOVA (CAPA_NOVA) — fundo escuro, o título claro à esquerda,
   a tabelinha apagada ao fundo e as três cartas por cima dela
   ============================================================ */
#stage.na-capa.capa-nova::before{background-image:none;background:#14131B}
#stage.na-capa.capa-nova::after{
  background:radial-gradient(70% 70% at 80% 32%,rgba(76,63,191,.18),transparent 62%),
             radial-gradient(55% 60% at 0% 100%,rgba(226,162,43,.07),transparent 60%)}
html.palco-largo.capa-escura #viewport{background:#14131B}
#stage.capa-nova .capa .marca{color:#C9A15B;font-size:12.5px;letter-spacing:.3em;white-space:nowrap}
#stage.capa-nova .capa h1{font-size:80px;line-height:1.0;letter-spacing:-.032em;color:#F2EEE6;text-align:left}
#stage.capa-nova .capa h1 .p-audio,
#stage.capa-nova .capa h1 .p-inter{font-size:26px;font-weight:600;letter-spacing:-.005em;color:#D08A4A}
#stage.capa-nova .capa h1 em{display:block;width:430px;margin-top:14px;color:#F2EEE6}
#stage.capa-nova .capa h1 .linha,
#stage.capa-nova .capa h1 .ult{display:block;text-align:left}
#stage.capa-nova .capa .risco{width:140px;height:3px;background:#C9A15B}
/* o nome e o endereço numa linha só, sempre: com a caixa na largura
   medida, uma letra que chegasse mais larga partia o nome em dois */
#stage.capa-nova .capa .autor{font-size:21px;color:#F2EEE6;white-space:nowrap}
#stage.capa-nova .capa .email{white-space:nowrap}
#stage.capa-nova .capa .autor .por{display:none}
#stage.capa-nova .capa .autor b{font-weight:700;color:#F2EEE6}
#stage.capa-nova .capa .email{font-size:14px;color:rgba(242,238,230,.55)}
#stage.capa-nova .capa .email:hover{color:#C9A15B;border-bottom-color:rgba(201,161,91,.4)}
/* o retrato, redondo e pequeno, ao lado do nome */
#stage.capa-nova .capa .foto{width:92px;height:92px;padding:0;border-radius:50%;overflow:hidden;
  background:#24222E;border:1.5px solid rgba(242,238,230,.22);box-shadow:none}
#stage.capa-nova .capa .foto img{border-radius:50%;object-position:50% 16%}
#stage.capa-nova .capa .frase{color:#EDE8F5;text-shadow:0 2px 14px rgba(12,11,18,.95), 0 0 4px rgba(12,11,18,.9)}
/* sem o vão entre as duas palavras */
#stage.capa-nova .capa h1 .p-audio{margin-right:0}
/* a tabelinha apagada ao fundo: a cor da família, mas quase no escuro */
#stage.na-capa.capa-nova #tabela .cel{stroke:rgba(255,255,255,.05)}
/* as cartas: o texto à esquerda — o número, o símbolo, o nome e a massa */
#stage.capa-nova .capa .blocos .face{align-items:flex-start;text-align:left;
  padding:calc(6px * var(--k,1)) calc(9px * var(--k,1)) calc(6px * var(--k,1))}
#stage.capa-nova .capa .blocos .face i{order:1}
/* o símbolo cede o espaço (e não o nome, que se cortava até sumir) */
#stage.capa-nova .capa .blocos .face b{order:2;place-items:center start;align-self:stretch;min-height:0;
  font-size:calc(17.5px * var(--k,1))}
#stage.capa-nova .capa .blocos .face em{order:3;align-self:stretch;text-align:left;flex-shrink:0;
  font-size:calc(8.2px * var(--k,1));margin-bottom:calc(1.5px * var(--k,1))}
#stage.capa-nova .capa .blocos .face u{order:4;align-self:stretch;text-align:left;flex-shrink:0}
/* o play, em anel claro */
#stage.na-capa.capa-nova #som{background:rgba(255,255,255,.04);border:1.5px solid rgba(242,238,230,.75);
  color:#F2EEE6;box-shadow:none}
#stage.na-capa.capa-nova #som .trilho{stroke:rgba(242,238,230,.14)}
#stage.na-capa.capa-nova #som-dica{color:rgba(242,238,230,.5)}
/* e a versão do app, no canto de baixo: clara, para se ler no escuro */
html.capa-escura #versao{color:rgba(242,238,230,.55)}

/* ============================================================
   A ABERTURA (a narração 0) — efeitosCapa() decide, pelo segundo do
   áudio, as classes do palco e das peças:
   · abre-capa  a narração corre: a parte esquerda apaga e só volta
                peça a peça — digitada (.dig) ou esmaecendo (.ve)
   · tab-meio   a tabelinha está no meio da capa: o resto sai de cena
   ============================================================ */
#stage.abre-capa .capa :is(.marca, h1, .risco, .autor, .email, .foto){
  opacity:0;
  transition:transform var(--tsobe,.42s) var(--e-salto), filter .8s ease, box-shadow .42s ease, opacity .6s ease}
#stage.abre-capa .capa .ve{opacity:1}
/* digitada, a peça acende de uma vez: quem aparece aos poucos são as letras */
#stage.abre-capa .capa .dig{opacity:1;transition-duration:.42s,.8s,.42s,0s}
#stage.abre-capa .capa .dig .lt{visibility:hidden}
#stage.abre-capa .capa .dig .lt.vis{visibility:visible}
/* o tracinho de quem escreve: fora do fluxo, para não partir a palavra */
.capa .cursor-dig{position:absolute;display:inline-block;width:0;height:1em}
.capa .cursor-dig::after{content:'';position:absolute;left:2px;top:.08em;width:3px;height:.9em;
  border-radius:1px;background:var(--ouro-luz)}
/* "Desenvolvido pelo", por cima do nome, só durante a abertura */
.capa .autor .desenv{display:none;position:absolute;left:0;bottom:100%;margin-bottom:2px;
  font-size:17px;font-weight:400;color:rgba(242,238,230,.72)}
#stage.abre-capa .capa .autor .desenv{display:block}
/* a tabela no meio: as peças da capa saem em fade out, e voltam em fade
   in — pelo filtro (a opacidade é da digitação); as cartas, pela opacidade */
#stage.tab-meio .capa :is(h1, .risco, .autor, .foto, .digitado){filter:opacity(0)}
#stage .capa .digitado{transition:filter .8s ease}
.capa .blocos{transition:opacity .8s ease}
#stage.tab-meio .capa .blocos{opacity:0}
/* os símbolos das casas: apagados, e a narração acende-os (--sim). Sem o
   #tabela no seletor: as cópias da tabelinha (carrossel, visão geral)
   perdem o id e têm de os esconder também */
text.sim{font-family:var(--display);font-weight:700;font-size:4.1px;text-anchor:middle;
  fill:#fff;opacity:var(--sim,0);pointer-events:none}
#stage.na-capa.capa-nova #tabela .cel{fill-opacity:var(--celop,.3)}

/* O BOTÃO INSTALAR, na capa, no canto de cima à direita; e a ajuda do
   iPhone e do iPad, logo abaixo dele */
/* à esquerda do botão dos slides, que mora no canto, e na mesma altura */
.capa .instalar{position:absolute;top:15px;right:106px;z-index:8;display:flex;align-items:center;gap:8px;
  padding:9px 17px 9px 13px;border-radius:999px;cursor:pointer;
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;
  color:var(--indigo);background:rgba(255,255,255,.92);border:1px solid var(--indigo-dim);
  box-shadow:0 8px 20px rgba(32,28,66,.14);transition:transform .2s var(--e-salto), background .2s}
.capa .instalar:hover{transform:translateY(-2px)}
.capa .instalar:active{transform:scale(.96)}
.capa .instalar[hidden], .capa .instalar-ajuda[hidden]{display:none}
.capa .instalar svg{flex:none}
#stage.capa-nova .capa .instalar{color:#F2EEE6;background:rgba(255,255,255,.06);
  border-color:rgba(242,238,230,.35);box-shadow:none}
#stage.capa-nova .capa .instalar:hover{background:rgba(255,255,255,.13)}
.capa .instalar-ajuda{position:absolute;top:67px;right:106px;z-index:8;width:290px;padding:12px 15px;
  border-radius:12px;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--tinta);
  background:#fff;border:1px solid var(--indigo-dim);box-shadow:0 14px 34px rgba(20,17,46,.3)}
.capa .instalar-ajuda svg{vertical-align:-3px;color:var(--indigo)}

/* ---------- cabeçalho: a tira do alto ----------
   É a arrumação que o professor deixou nos slides de conteúdo: régua,
   número, título e subtítulo lado a lado numa tira só, no alto. Vale
   aqui pela mesma razão que vale lá — a tabela precisa da folha
   inteira, e um cabeçalho de quatro andares comeria um terço dela. */
.slide:not(.capa){padding:0}
.tira{
  position:absolute;left:80px;right:80px;top:10px;height:48px;z-index:5;
  display:flex;align-items:center;gap:24px;
}
.num{
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1;
  color:var(--indigo);opacity:.34;
}
/* as letras do título na abertura do capítulo (animaTituloNaAbertura):
   crescem a partir do pé e ficam douradas, uma de cada vez */
.title .letra-ab.oculta{visibility:hidden}
.title .cursor-ab{display:inline-block;width:3px;height:.85em;margin-left:2px;margin-right:-5px;
  vertical-align:-.08em;background:var(--ouro);border-radius:1px}
.title{
  font-family:var(--display);font-weight:700;font-size:35px;line-height:1.05;
  letter-spacing:-.02em;color:var(--tinta);
  max-width:none;white-space:nowrap;
}
/* a assinatura do tema: a régua dos períodos.
   Uma célula por slide; a acesa é onde a aula está. */
.regua{display:flex;gap:5px;flex:none}
.regua button{
  width:15px;height:15px;padding:0;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid rgba(76,63,191,.32);
  transition:background .25s,border-color .25s,transform .25s;
}
.regua button:hover{border-color:var(--indigo);transform:translateY(-2px)}
.regua button.feito{background:rgba(76,63,191,.42);border-color:transparent}
.regua button.aqui{
  background:var(--ouro-luz);border-color:var(--ouro);
  box-shadow:0 0 0 3px rgba(226,162,43,.24);
}
.subtitle{font-size:28px;font-weight:300;color:var(--ouro);letter-spacing:.005em;
  white-space:nowrap}
/* o subtítulo comprido (o slide 6, com as quatro famílias) desce de
   corpo para caber na tira, ao lado do título, sem passar da borda */
.subtitle.longo{font-size:20px}

/* área de conteúdo — o palco inteiro, por baixo da tira.
   Como ela cobre o slide todo, as contas da tabela são feitas em
   coordenadas do palco: x e y aqui são os mesmos x e y de 1280x720. */
.body-area{position:absolute;inset:0}

/* ============================================================
   A MESA DOS 118 CUBOS  (slide 1)
   Uma camada que cobre o slide inteiro, para a tabela poder passar
   por baixo do cabeçalho sem ficar presa à caixa do conteúdo. Ela
   não pega o dedo: só o cubo pega.
   ============================================================ */
.cena{position:absolute;inset:0;z-index:4;pointer-events:none}
/* A mesa é plana: quem tem volume são os cubos, cada um no seu
   próprio espaço 3D. Sem 'preserve-3d' aqui, a ordem em que eles se
   cobrem continua a ser a do z-index — e é dela que precisamos para
   pôr por cima o cubo que está girando ou aceso. */
.mesa{
  position:absolute;inset:0;
  /* --abre: o encolher da tabela aberta em linhas ou em colunas (LC25) */
  transform:translate(var(--px,0px),var(--py,0px)) scale(calc(var(--zoom,1) * var(--abre,1)));
}
/* a mesa do slide 4 (As coordenadas periódicas), no lugar e no tamanho
   que o professor deixou na montagem: 3 px para a direita, 14 px para
   baixo, a 0,97. Fora do celular, que tem a medida dele (AJUSTE). */
html:not(.celular) .mesa[data-slide="3"]{--px:3px;--py:14px;--zoom:.97}
/* A TABELA ABERTA (LC25): as cartas andam para as linhas ou para as
   colunas, os números vão junto, e a mesa encolhe um fio para caber */
/* "São 7 linhas" / "São 18 colunas", na tabela aberta pelo toque (LC25.conta) */
.conta-lc25{position:absolute;z-index:30;transform:translate(-50%,-50%);white-space:nowrap;
  pointer-events:none;font-family:var(--display);font-weight:700;font-size:38px;color:var(--ouro);
  text-shadow:0 0 12px rgba(255,255,255,.95);opacity:0;transition:opacity .4s ease}
.conta-lc25.on{opacity:1}
.conta-lc25 .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;
  background:var(--ouro);border-radius:1px}
.conta-lc25 .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* a coluna que sobe inteira na onda da "1" (COLUNAS_1): uma caixa do
   tamanho da mesa, que não pega o dedo — os cubos dentro pegam */
.coluna-onda{position:absolute;inset:0;pointer-events:none;
  transition:transform 90ms linear;will-change:transform}
/* --t25: o tempo de abrir e fechar. Depois da "2.5A", no toque do aluno
   (rapido25), vai ao dobro da velocidade */
.mesa.lc25{--t25:.55s;transition:transform var(--t25) cubic-bezier(.3,.85,.3,1)}
.mesa.lc25.rapido25{--t25:.275s}
.mesa.lc25 .pc{transition:left var(--t25) cubic-bezier(.3,.85,.3,1), top var(--t25) cubic-bezier(.3,.85,.3,1),
  transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease, opacity .45s ease}
.mesa.lc25 .casa{transition:left var(--t25) cubic-bezier(.3,.85,.3,1), top var(--t25) cubic-bezier(.3,.85,.3,1), opacity .3s ease}
.mesa.aberta25 .casa:not(.serie){opacity:0}
.mesa.lc25 .eixo{transition:left var(--t25) cubic-bezier(.3,.85,.3,1), top var(--t25) cubic-bezier(.3,.85,.3,1),
  opacity .3s, color .25s, background .25s, border-color .25s, transform .25s}
/* o número no modelo do professor: a bolinha índigo, com o aro; entra
   em cascata — as linhas pela esquerda, as colunas caindo de cima */
.eixo.prof{width:30px;height:30px;font-family:var(--display);font-weight:600;font-size:16px;
  letter-spacing:0;color:var(--indigo);background:rgba(76,63,191,.12);border:1.5px solid var(--indigo);
  animation:numLinha25 .26s cubic-bezier(.2,1.5,.4,1) var(--atraso,0ms) backwards}
.eixo.prof[data-grupo]{width:27px;height:27px;font-size:14px;animation-name:numColuna25}
.eixo.some25{opacity:0}
@keyframes numLinha25{
  from{opacity:0;transform:translate(calc(-50% - 24px),-50%) scale(.5)}
  to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes numColuna25{
  from{opacity:0;transform:translate(-50%,calc(-50% - 24px)) scale(.5)}
  to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* as coordenadas da tabela: o grupo em cima, o período à esquerda.
   Discretas — são a moldura, não o assunto. */
/* O número do eixo é uma bolinha que quase não se vê — e que, quando a
   cruz de um elemento acende, vira a medalha âmbar do app do
   professor. É a mesma peça nos dois estados: assim ela não aparece do
   nada, ela ACENDE. */
.eixo{
  position:absolute;display:grid;place-items:center;
  width:19px;height:19px;border-radius:50%;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;line-height:1;
  color:var(--tinta-faint);background:transparent;border:1px solid transparent;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:opacity .3s,color .25s,background .25s,border-color .25s,transform .25s;
}
/* a família que sobe passa por cima do número do grupo dela; o número
   dá-lhe passagem e volta quando ela pousa */
.eixo.recuado{opacity:0}
.eixo.acesa{
  background:var(--ouro-luz);border-color:var(--ouro);color:#fff;font-weight:600;
  transform:translate(-50%,-50%) scale(1.28);
}

/* ============================================================
   AS COORDENADAS DE UM ELEMENTO
   O sistema do slide 3 da aula do professor, trazido para cá: o
   elemento salta, dá a volta e cai no mesmo lugar — e enquanto está no
   ar, a linha e a coluna dele acendem inteiras, os dois números viram
   medalha, e o resto da tabela recua. É o encontro das duas faixas que
   dá o lugar dele, e é isso que a cena mostra sem dizer.
   ============================================================ */
.mesa.tem-cruz .pc{transition:transform var(--tsobe,.42s) var(--e-salto),opacity .35s ease}
/* (e o card guarda uma transição de opacidade também sem a cruz — ver
   .pc —: apagada ela, a tabela volta em fade, e não de uma vez) */
.mesa.tem-cruz .pc:not(.cruz){opacity:.34}
.pc.escolhido{z-index:12}
/* o número aceso da cruz fica por cima dos cards: o elemento em destaque,
   crescido, não o tapa (o Na, na coluna 1, ficava por cima do seu 3) */
.mesa .eixo.acesa{z-index:15}
/* NO EDITOR os números são peças soltas: medidos sem o crescer do
   destaque (senão a largura guardada já vinha crescida), sempre redondos
   (a largura vem da medida e a altura acompanha — com a altura fixa de
   19 px eles ficavam achatados), e o destaque cresce pela escala da peça */
.mesa .eixo.medindo{transform:translate(-50%,-50%)!important;transition:none!important}
.mesa .eixo.solto, body.montagem .mesa .eixo.solto{height:auto!important;aspect-ratio:1;border-radius:50%}
.mesa .eixo.solto.acesa{--luz:1.28}
.pc.escolhido .cubo{--sc:1.18}
.pc.escolhido .face{box-shadow:0 0 0 2px rgba(226,162,43,.9), 0 10px 24px rgba(80,40,0,.34)}

/* a faixa que acende a linha (ou a coluna) inteira, número junto */
.banda{
  position:absolute;opacity:0;pointer-events:none;z-index:0;border-radius:10px;
  background:rgba(226,162,43,.18);border:1px solid rgba(226,162,43,.5);
  transition:top .3s cubic-bezier(.3,.85,.3,1),left .3s cubic-bezier(.3,.85,.3,1),
             width .3s ease,height .3s ease,opacity .45s ease;
}
.banda.on{opacity:1}
/* A ENTRADA DAS FAIXAS: a da linha corre da direita para a esquerda, e a
   da coluna de baixo para cima — e o número do período (à esquerda) e o do
   grupo (em cima) só acendem quando a faixa chega a eles (o atraso de
   .eixo.acesa, abaixo, é a duração da faixa) */
.banda-linha.on{animation:faixaLinha .3s cubic-bezier(.4,0,.6,1) both}
.banda-col.on  {animation:faixaColuna .3s cubic-bezier(.4,0,.6,1) both}
@keyframes faixaLinha {from{clip-path:inset(0 0 0 100% round 10px)} to{clip-path:inset(0 0 0 0 round 10px)}}
@keyframes faixaColuna{from{clip-path:inset(100% 0 0 0 round 10px)} to{clip-path:inset(0 0 0 0 round 10px)}}
.mesa:has(.banda.on) .eixo.acesa{transition-delay:.27s}
/* AS DUAS CORES DAS COORDENADAS: azul para as linhas (os períodos) e
   laranja para as colunas (os grupos) — nos números e nas faixas */
:root{--cor-linha:#2F7FD1;--cor-coluna:#E0782B}
.eixo[data-periodo]{color:var(--cor-linha)}
.eixo[data-grupo]{color:var(--cor-coluna)}
.eixo[data-periodo].acesa{background:var(--cor-linha);border-color:var(--cor-linha);color:#fff}
.eixo[data-grupo].acesa{background:var(--cor-coluna);border-color:var(--cor-coluna);color:#fff}
.banda-linha{background:rgba(47,127,209,.16);border-color:rgba(47,127,209,.55)}
.banda-col{background:rgba(224,120,43,.16);border-color:rgba(224,120,43,.55)}
/* os números em bolinha (o modelo do professor): sem contorno, o círculo
   todo na cor — azul nas linhas, laranja nas colunas —, e o número em
   branco; também no escuro do quiz */
.mesa .eixo.prof, .slide.quiz-escuro .mesa .eixo.prof{border-color:transparent;color:#fff}
/* na 2.5, o número da linha (ou da coluna) por onde o brilho passa: cresce
   e acende em verde, junto com os cards */
.mesa .eixo.brilha25{z-index:16;transform:translate(-50%,-50%) scale(1.3);
  transition:transform .15s ease, box-shadow .15s ease}
.mesa .eixo.brilha25[data-periodo]{box-shadow:0 0 0 2px rgba(111,174,240,.95), 0 0 16px 5px rgba(47,127,209,.65)}
.mesa .eixo.brilha25[data-grupo]{box-shadow:0 0 0 2px rgba(243,160,98,.95), 0 0 16px 5px rgba(224,120,43,.65)}
/* os cards da onda da 2.5: azul nas linhas, laranja nas colunas */
.pc.luz-linha25 .face{box-shadow:inset 0 0 0 60px rgba(47,127,209,calc(.3 * var(--verde,1))),
  0 0 0 2px rgba(111,174,240,var(--verde,1)), 0 0 20px 5px rgba(47,127,209,calc(.6 * var(--verde,1)))}
.pc.luz-coluna25 .face{box-shadow:inset 0 0 0 60px rgba(224,120,43,calc(.3 * var(--verde,1))),
  0 0 0 2px rgba(243,160,98,var(--verde,1)), 0 0 20px 5px rgba(224,120,43,calc(.6 * var(--verde,1)))}
.pc.luz-linha25 .cubo, .pc.luz-coluna25 .cubo{--sc:calc(1 + .06 * var(--verde,1))}
/* "São 7 linhas" em azul, "São 18 colunas" em laranja */
/* a segunda linha (nos toques depois da 2.5A), menor, centrada */
/* "Toque de novo pra ver as colunas": debaixo do "São 7 linhas", com a
   mãozinha a bater no fim dele (no .alvo) */
.pede-lc25{position:absolute;z-index:30;transform:translate(-50%,-50%);white-space:nowrap;
  pointer-events:none;display:flex;align-items:center;gap:10px;font-family:var(--display);
  font-weight:600;font-size:22px;color:var(--indigo);text-shadow:0 0 10px rgba(255,255,255,.95);
  opacity:0;transition:opacity .3s ease}
.pede-lc25.on{opacity:1}
.pede-lc25 .txt{order:1}
.pede-lc25 .alvo{order:2;width:26px;height:26px}
.conta-lc25{text-align:center}
.conta-lc25 .l2{font-size:.58em;font-weight:600}
/* os números das linhas (ou colunas) ainda não alcançados pelo brilho */
.mesa .eixo.oculto25{opacity:0!important}
.conta-lc25[data-vez="linhas"]{color:var(--cor-linha)}
.conta-lc25[data-vez="colunas"]{color:var(--cor-coluna)}
.conta-lc25[data-vez="linhas"] .cursor{background:var(--cor-linha)}
.conta-lc25[data-vez="colunas"] .cursor{background:var(--cor-coluna)}
.mesa .eixo.prof[data-periodo], .slide.quiz-escuro .mesa .eixo.prof[data-periodo]{background:var(--cor-linha)}
.mesa .eixo.prof[data-grupo],   .slide.quiz-escuro .mesa .eixo.prof[data-grupo]{background:var(--cor-coluna)}
/* os textos do slide 4 na cor da faixa deles: "séries ou períodos" da
   linha, "grupos ou famílias" da coluna */
.texto-colunas.texto3 .frase:nth-child(1){color:var(--cor-linha)}
.texto-colunas.texto3 .frase:nth-child(2){color:var(--cor-coluna)}
.texto-colunas.texto3 .frase:nth-child(1) .cursor{background:var(--cor-linha)}
.texto-colunas.texto3 .frase:nth-child(2) .cursor{background:var(--cor-coluna)}

/* a ficha do escolhido, no vazio que a tabela tem acima dos metais de
   transição — o mesmo lugar onde ela mora na aula do professor */
.ficha{
  position:absolute;z-index:8;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
  font-family:var(--display);line-height:1;
}
.ficha.on{opacity:1}
/* o número atômico em cima do símbolo, à vista (era pequeno e apagado) */
.ficha span{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ouro);margin-bottom:4px}
.ficha b{font-size:58px;font-weight:600;color:var(--indigo);letter-spacing:-.02em}
/* no escuro do quiz, o símbolo claro */
.slide.quiz-escuro .ficha b{color:#F3F0FB}
.slide.quiz-escuro .ficha span{color:var(--ouro-luz)}
/* e os nomes das duas coordenadas, ao lado dela */
.coords-el{
  position:absolute;z-index:8;transform:translateY(-50%);pointer-events:none;
  display:flex;flex-direction:column;gap:9px;
}
.coords-el span{
  opacity:0;transition:opacity .3s ease;white-space:nowrap;
  font-family:var(--display);font-weight:500;font-size:23px;color:var(--tinta);
}
.coords-el span.on{opacity:1}
/* as duas numa linha só ("3º período · grupo 1"), escolhido no editor */
.coords-el.uma-linha{flex-direction:row;gap:12px}
/* NO SLIDE 4, o arranjo que o professor deixou na montagem (em px da mesa,
   que lá anda 3 e 14 px e está a 0,97): o símbolo centrado em 411 × 224, e
   a localização numa linha só — "3º período, grupo 1." —, centrada em
   616 × 242,5, a 1,27 */
/* Um lugar por exemplo (data-ex, posto por EV3): o Na, o Mn e o Pb; por
   agora os três no lugar do Na. Sem !important: no editor, a peça solta
   escreve o lugar dela por cima. */
.mesa[data-slide="3"] .ficha{left:411px;top:224px}
/* (presa pela borda esquerda, em 474, e não pelo meio: digitada, a linha
   cresce para a direita sem andar) */
.mesa[data-slide="3"] .coords-el{left:474px;top:242.5px;
  transform:translateY(-50%) scale(1.27);transform-origin:0 50%;flex-direction:row;gap:.28em}
.mesa[data-slide="3"] .coords-el.duas-linhas{flex-direction:column;gap:9px}
/* o Mn (narração 3.1): o símbolo centrado em 396 × 241 do palco, e a
   localização centrada em 677 × 261 (em px da mesa, abaixo) */
.mesa[data-slide="3"][data-ex="Mn"] .ficha{left:385.4px;top:222.9px}
.mesa[data-slide="3"][data-ex="Mn"] .coords-el{left:536.4px;top:243.5px}
/* solta no editor, ela cresce em volta do meio, como as outras peças */
.mesa[data-slide="3"] .coords-el.solto{transform-origin:50% 50%}
.coords-el b{color:var(--ouro);font-weight:700}
/* o número do período na cor das linhas, o do grupo na cor das colunas */
.coords-el .per b{color:var(--cor-linha)}
.coords-el .grp b{color:var(--cor-coluna)}

/* A CASA — o encaixe vazio onde o cubo pousa. É ela que faz a sombra
   do cubo: um cubo sem chão flutua, e a tabela deixa de ser uma mesa. */
.casa{
  position:absolute;transform:translate(-50%,-50%);
  border-radius:2px;background:rgba(32,28,66,.07);
  box-shadow:inset 0 1px 2px rgba(32,28,66,.10);
  pointer-events:none;
}
/* as duas casas que guardam as séries: elas não têm elemento dentro,
   têm um bilhete dizendo onde procurar */
/* um card cinza, com o acabamento dos cubos (a luz de cima para baixo, a
   borda clara): é lugar de elemento, mas os dele estão lá embaixo */
.casa.serie{
  display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;line-height:1.4;text-align:center;
  color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.35);
  background:linear-gradient(145deg,#A3A1AE,#7E7C8B);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:0 2px 6px rgba(32,28,66,.18);
}
.casa.serie.act{background:linear-gradient(145deg,#A3A1AE,#7E7C8B)}

/* ---------- O CUBO ----------
   Cada elemento é um cubo de seis faces iguais: em todas elas o mesmo
   número atômico, o mesmo símbolo, a mesma massa e o mesmo nome. É
   assim de propósito — o cubo pode girar para qualquer lado, em
   qualquer jogo, que a informação nunca se perde de vista.

   A perspectiva é de cada cubo, e não do palco inteiro: cada um tem o
   seu ponto de fuga, e por isso o da ponta da tabela não sai deitado
   quando gira. */
/* O SALTO E A SUBIDA vão na carta, e não no cubo: o cubo já usa o
   transform dele para os três giros, e animar a mesma propriedade nos
   dois lugares apagaria um deles. Aqui a peça sobe e desce; lá dentro,
   ela gira. As duas coisas podem acontecer ao mesmo tempo. */
.pc{
  position:absolute;width:var(--L,58px);height:var(--L,58px);
  /* --onda é o crescer das ondas da narração; o brilho delas vai num
     filter escrito à mão, só enquanto a onda passa — um filter fixo nos
     118 obrigaria o navegador a manter 118 camadas acesas à toa */
  /* --vx/--vy: o deslocamento de um voo em arco (voaEmArco), que anda
     dentro do transform e não obriga a refazer o desenho da página */
  transform:translate(-50%,-50%) translate(var(--vx,0px),var(--vy,0px))
            translateY(var(--sobe,0px)) scale(var(--onda,1));
  transition:transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease,
             opacity .45s ease;
  perspective:var(--persp,620px);
  pointer-events:auto;cursor:pointer;
}
/* quem está no ar passa por cima de quem ficou na mesa */
.pc.sobe{z-index:6}
/* os lantanídeos e os actinídeos, enquanto não são revelados */
.pc.serie-oculta{display:none}
/* A ordem importa: o LEVANTAR (--dz) vem primeiro, para ser sempre na
   direção do olho e não na do cubo já virado; depois a CORREÇÃO da
   leitura (--rzc), que é um giro no plano da tela; e só então os três
   giros do cubo. O crescer é nas três dimensões (scale3d): um scale()
   só estica x e y do cubo, e num cubo deixado de lado por um giro de um
   quarto a face à vista crescia só num sentido — distorcida. */
.cubo{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:translateZ(var(--dz,0px)) rotateZ(var(--rzc,0deg))
            rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg))
            scale3d(var(--sc,1),var(--sc,1),var(--sc,1));
  transition:transform var(--dur,.7s) var(--curva,cubic-bezier(.3,.85,.3,1));
}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:calc(3px * var(--k,1)) calc(4px * var(--k,1)) calc(4px * var(--k,1));
  background:linear-gradient(145deg,color-mix(in srgb,var(--cor) 84%,#fff),
                                    color-mix(in srgb,var(--cor) 86%,#000));
  border:1px solid rgba(255,255,255,.24);
  backface-visibility:hidden;
  overflow:hidden;
}
/* o vidro por cima: claro no alto, some antes da metade */
.face::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 42%)}
/* as seis faces do cubo, meio lado para fora cada uma */
.f1{transform:translateZ(var(--H,29px))}
.f2{transform:rotateY( 90deg) translateZ(var(--H,29px))}
.f3{transform:rotateY(180deg) translateZ(var(--H,29px))}
.f4{transform:rotateY(-90deg) translateZ(var(--H,29px))}
.f5{transform:rotateX( 90deg) translateZ(var(--H,29px))}
.f6{transform:rotateX(-90deg) translateZ(var(--H,29px))}
/* as faces de lado escurecem um fio: é o que dá volume ao cubo
   enquanto ele roda. Paradas, as seis são a mesma carta.
   Não é um filter (eram mil e tantas faces filtradas nas duas mesas,
   e cada filter é uma superfície à parte para o navegador pintar): é
   um véu por cima da cor, abaixo da letra — o mesmo tom, de graça. */
.f2::after,.f3::after,.f4::after,.f5::after,.f6::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none}
.f2::after,.f4::after{background:rgba(0,0,0,.07)}
.f3::after{background:rgba(0,0,0,.12)}
.f5::after,.f6::after{background:rgba(255,255,255,.05)}
/* O TABULEIRO LISO (slide 4, as coordenadas): todas as cartas na mesma
   cor, o lilás claro do app do professor (FUNDO_FACE2) — a tabela deixa
   de falar de famílias. Em cor clara a letra branca se perderia, então
   ela escurece junto. */
.mesa.lisa .face{background:linear-gradient(145deg,#DCD7F3,#C0B8E8);border-color:rgba(76,63,191,.42)}
.mesa.lisa .face::before{opacity:0}
.mesa.lisa .face i,.mesa.lisa .face u,.mesa.lisa .face em{color:rgba(32,28,66,.58);text-shadow:none}
.mesa.lisa .face b{color:var(--tinta);text-shadow:none}
/* O SLIDE 5 PINTA POR TIPO (as cores do app do professor): os metais no
   azul dos de transição, que são a maior parte deles; os ametais no
   verde; os gases nobres no violeta; e o hidrogênio, que é um ametal, no
   verde. Com !important: a cor da família nasce na carta como estilo
   inline, e aqui é a folha que manda. */
.mesa.tipos .pc[data-tipo="metais"]     {--cor:var(--cat-transicao)!important}
.mesa.tipos .pc[data-tipo="ametais"]    {--cor:var(--cat-ametais)!important}
.mesa.tipos .pc[data-tipo="nobres"]     {--cor:var(--cat-nobres)!important}
.mesa.tipos .pc[data-tipo="hidrogenio"] {--cor:var(--cat-ametais)!important}
/* AS CLASSES ACESAS (a narração "4", EV4): a sala escurece (o breu, atrás
   da mesa) e só a classe da vez fica inteira; as outras cartas esmaecem.
   Tudo em fade, na ida e na volta. */
.breu4{position:absolute;inset:0;z-index:3;background:rgba(12,10,32,.84);
  opacity:0;pointer-events:none;transition:opacity .7s ease}
.breu4.on{opacity:1}
html.palco-largo .breu4{box-shadow:0 0 0 var(--folga) rgba(12,10,32,.84)}
html.palco-alto  .breu4{box-shadow:0 0 0 var(--folgav) rgba(12,10,32,.84)}
.mesa.tipos .pc{transition:transform var(--tsobe,.42s) var(--e-salto), filter var(--tsobe,.42s) ease, opacity .7s ease}
.mesa.tipos .eixo,.mesa.tipos .casa{transition:opacity .7s ease}
.mesa.tipos:not([data-luz=""])[data-luz] .pc{opacity:.13}
.mesa.tipos:not([data-luz=""])[data-luz] .eixo{opacity:.2}
/* as casas das duas séries (57–71, 89–103) são metais, mas não são cartas:
   acendem com os metais e apagam com o resto */
.mesa.tipos:not([data-luz=""]):not([data-luz="metais"])[data-luz] .casa{opacity:.13}
.mesa.tipos[data-luz="metais"]  .pc[data-tipo="metais"],
.mesa.tipos[data-luz="ametais"] .pc[data-tipo="ametais"],
.mesa.tipos[data-luz="nobres"]  .pc[data-tipo="nobres"],
.mesa.tipos[data-luz="h"]       .pc[data-z="1"]{opacity:1}
/* "São 3 classes de elementos:" solto, em cima, só o texto; e cada classe
   escrita acima do bloco dela, na cor dele: "Metais" acima dos de
   transição, "Ametais | Não Metais" acima dos ametais, "Gases Nobres"
   acima da coluna 18. Os lugares vêm de EV4.posiciona (medidos, para a
   escrita crescer da esquerda sem saltar), na mesa: andam com ela */
.classes4{position:absolute;inset:0;z-index:25;pointer-events:none}
.classes4 .frase,.classes4 .mede4{position:absolute;margin:0;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:27px;line-height:1}
.classes4 .frase{display:none;transform:translateY(-50%);transition:opacity .5s ease, color .7s ease}
.classes4 .frase.on{display:block}
.classes4 .mede4{visibility:hidden}
.classes4 .frase:first-child,.classes4 .mede4.titulo{font-weight:600;font-size:30px}
.classes4 .frase:first-child{color:var(--indigo)}
/* no celular a mesa sobe e o botão do carrossel fica logo acima das
   colunas 17 e 18: "Gases Nobres" vai em duas linhas, menor, na folga
   à direita dele */
html.celular .classes4 .nobres4{font-size:21px;line-height:1.08}
html.celular .classes4 .frase.nobres4{white-space:normal}
/* "Não Metais", do lado de "Ametais", com um fio entre eles */
.classes4 .frase:nth-child(4){padding-left:14px;border-left:2px solid currentColor;border-left-color:color-mix(in srgb,currentColor 40%,transparent)}
.classes4 .frase[data-classe="metais"] {color:var(--cat-transicao)}
.classes4 .frase[data-classe="ametais"]{color:var(--cat-ametais)}
.classes4 .frase[data-classe="nobres"] {color:var(--cat-nobres)}
/* com a sala escura, o título vira claro, e os nomes ganham o tom claro do
   próprio bloco (o da carta acesa), senão sumiam no escuro */
.mesa.tipos:not([data-luz=""])[data-luz] .classes4 .frase:first-child{color:#F4F2F8}
.mesa.tipos:not([data-luz=""])[data-luz] .classes4 .frase[data-classe="metais"] {color:color-mix(in srgb,var(--cat-transicao) 72%,#fff)}
.mesa.tipos:not([data-luz=""])[data-luz] .classes4 .frase[data-classe="ametais"]{color:color-mix(in srgb,var(--cat-ametais) 72%,#fff)}
.mesa.tipos:not([data-luz=""])[data-luz] .classes4 .frase[data-classe="nobres"] {color:color-mix(in srgb,var(--cat-nobres) 66%,#fff)}
.classes4 .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;
  vertical-align:-.1em;background:var(--ouro)}
.classes4 .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* com uma classe acesa, os nomes das outras recuam também */
.classes4:not([data-luz=""])[data-luz] .frase[data-classe]{opacity:.32}
.classes4:not([data-luz=""])[data-luz="metais"]  .frase[data-classe="metais"],
.classes4:not([data-luz=""])[data-luz="ametais"] .frase[data-classe="ametais"],
.classes4:not([data-luz=""])[data-luz="nobres"]  .frase[data-classe="nobres"]{opacity:1}
/* na "4B": "Ametais" cresce para a esquerda e "Não Metais" para a direita
   (o fio entre eles fica no lugar), e os dois sobem com o bloco crescido */
.classes4 .frase[data-classe="ametais"]{transition:opacity .5s ease, color .7s ease, transform .5s cubic-bezier(.4,0,.2,1)}
.classes4 .frase:nth-child(3){transform-origin:right center}
.classes4 .frase:nth-child(4){transform-origin:left center}
.classes4 .frase.cresceAm{transform:translateY(-50%) scale(1.35)}
.classes4 .frase.sobeAm{transform:translateY(calc(-50% - 36px))}
/* a escolha: os nomes viram botões, e chamam */
.classes4.escolha .cursor{display:none}
.classes4.escolha .frase[data-classe]{pointer-events:auto;cursor:pointer;animation:chamaClasse 1.8s ease-in-out infinite}
.classes4.escolha .frase[data-classe="ametais"]{animation-delay:.3s}
.classes4.escolha .frase[data-classe="nobres"]{animation-delay:.6s}
@keyframes chamaClasse{0%,100%{text-shadow:none} 50%{text-shadow:0 0 14px color-mix(in srgb,currentColor 55%,transparent)}}
#stage.em-classes #som, #stage.em-classes #som-dica, #stage.em-classes #vel{display:none!important}
/* A "4A" (EV4.cena4A): só os metais ficam — os outros somem de todo, com
   os números dos eixos, as casas das séries e os textos —, e os metais
   saltam até a grade da esquerda. O relógio escreve o lugar de 60 em 60 ms:
   a transição curta alisa o caminho */
.classes4{transition:opacity .7s ease}
.mesa.tipos.arruma4 .pc:not([data-tipo="metais"]){opacity:0;pointer-events:none}
.mesa.tipos.arruma4[data-luz] .eixo,.mesa.tipos.arruma4 .casa,.mesa.tipos.arruma4 .classes4{opacity:0}
.mesa.tipos .pc.anda4{transition:left 90ms linear, top 90ms linear, transform 90ms linear, opacity .7s ease}
.pc.no-ar4{z-index:12}
.pc.hg4{z-index:40}
/* no fim da narração o tempo pára: a volta do Hg à grade é uma transição */
.mesa.tipos .pc.anda4.volta4{transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1),
  transform .9s cubic-bezier(.4,0,.2,1), opacity .7s ease}
.pc.hg4 .face{box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 6px 14px rgba(0,0,0,.4), 0 0 14px 3px rgba(210,220,232,.55)}
/* a grade inteira de metal: o brilho passa uma vez só (64 a correr sem
   parar pesariam no celular) */
.mat.quieto .brilho{animation-iteration-count:1}
/* O HG QUE VIRA POÇA (--morf, de 0 a 1, escrito pelo relógio): o card
   arredonda até ser uma gota, a letra dele apaga e ele esmaece, enquanto
   a poça nasce por cima. Registrada, a --morf também transiciona: na "4A1"
   (volta4) o card refaz-se aos poucos */
@property --morf{syntax:'<number>';inherits:true;initial-value:0}
/* (a opacidade do card vai no estilo dele, escrita com o --morf: a regra
   dos metais acesos, mais forte, ganharia de uma regra daqui) */
.pc.hg4 .face{border-radius:calc(var(--morf) * 50%)}
.pc.hg4 .face :is(i,b,u,em){opacity:calc(1 - var(--morf) * 1.8)}
.mesa.tipos .pc.anda4.hg4:not(.volta4){transition:left 90ms linear, top 90ms linear, transform 90ms linear,
  opacity 90ms linear, --morf 90ms linear}
.mesa.tipos .pc.anda4.hg4.volta4{transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1),
  transform .9s cubic-bezier(.4,0,.2,1), opacity .9s ease, --morf .9s ease}
/* A POÇA DE MERCÚRIO (POCA4): segue o Hg pelo relógio, com a opacidade do
   --morf (a transição curta alisa), e na "4A1" volta para a vaga dele, a
   encolher e a esmaecer */
.poca4{position:absolute;left:0;top:0;width:340px;height:180px;z-index:41;
  opacity:0;pointer-events:none;touch-action:none;
  transform:translate(-50%,-50%) scale(var(--s,1));
  transition:left 90ms linear, top 90ms linear, transform 90ms linear, opacity 90ms linear}
.poca4.on{pointer-events:auto;cursor:grab}
/* "Toque no metal": o alerta, amarelo e a piscar, acima da poça */
.toque4{position:absolute;z-index:42;pointer-events:none;white-space:nowrap;
  transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:26px;
  letter-spacing:.02em;color:#FFD43B;opacity:0;transition:opacity .4s ease;
  text-shadow:0 0 12px rgba(255,212,59,.65), 0 2px 4px rgba(0,0,0,.6)}
/* o piscar mexe na opacidade e no 'scale', e não no transform: solto na
   montagem, o transform é o do lugar e da escala que ela lhe deu */
.toque4.on{animation:alerta4 .9s ease-in-out infinite}
@keyframes alerta4{0%,100%{opacity:1;scale:1} 50%{opacity:.25;scale:.96}}
/* na montagem, o aviso do fio fica à vista para ser pego e editado */
body.montagem .alerta4C{opacity:1!important;animation:none!important;pointer-events:auto}
.poca4.on:active{cursor:grabbing}
.poca4.volta{opacity:0;transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1),
  transform .9s cubic-bezier(.4,0,.2,1), opacity .6s ease .3s}
.poca4 svg{display:block;width:100%;height:100%;overflow:visible}
/* "Metais", acima da grade, quando o último pousa: as letras de metal
   cromado (o gradiente recortado na letra), que entram de um desfoque, um
   reflexo que corre por elas, e uma faísca no fim */
.titulo4A{position:absolute;z-index:25;pointer-events:none;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1;letter-spacing:.03em;
  background:linear-gradient(100deg,#7F8995 0%,#F4F7FA 16%,#9BA5B0 30%,#4E5762 44%,#DDE3E9 56%,#FFFFFF 62%,#A9B2BC 76%,#626B76 100%);
  background-size:260% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
  transform:translate(-50%,-50%);opacity:0;transition:opacity .4s ease}
/* no celular a mesa sobe até perto do cabeçalho: menor, e mais rente à grade */
html.celular .titulo4A{font-size:36px;margin-top:9px}
.titulo4A.on{animation:metalEntra 1s cubic-bezier(.2,.8,.2,1) forwards, metalReflexo 1.7s .25s ease-in-out forwards}
@keyframes metalEntra{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(1.3);filter:blur(7px) drop-shadow(0 2px 3px rgba(0,0,0,.55))}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);  filter:blur(0)   drop-shadow(0 2px 3px rgba(0,0,0,.55))}}
@keyframes metalReflexo{from{background-position:100% 0} to{background-position:0 0}}
.titulo4A::after{content:'';position:absolute;right:-12px;top:-6px;width:20px;height:20px;opacity:0;
  background:radial-gradient(circle,#fff 0 12%,transparent 13%),
             linear-gradient(0deg,transparent 46%,#fff 50%,transparent 54%),
             linear-gradient(90deg,transparent 46%,#fff 50%,transparent 54%)}
.titulo4A.on::after{animation:faisca 1s 1.5s ease-out 1}
/* A "4A1" (EV4.cena4B): a onda de brilho pela grade (reluz4) e as cartas em
   destaque (brilha4B) — o reflexo corre outra vez pela carta (outro nome de
   animação, para recomeçar), e um halo na cor do metal dela */
.pc.reluz4{filter:brightness(1.3)}
.pc.reluz4 .mat .brilho{animation:brilhoOnda .5s ease-in-out 1}
@keyframes brilhoOnda{from{transform:translateX(-60%)} to{transform:translateX(60%)}}
/* (acima do Hg, que fica em 40 desde a "4A": o Au crescido passa por cima dele) */
.pc.brilha4B{z-index:45}
.pc.brilha4B .mat .brilho{animation:brilhoDestaque 1.1s ease-in-out 1}
@keyframes brilhoDestaque{0%{transform:translateX(-60%)} 70%,100%{transform:translateX(60%)}}
.pc.brilha4B .face{box-shadow:0 0 0 1.5px rgba(255,255,255,.95), 0 10px 22px rgba(0,0,0,.45),
  0 0 24px 6px color-mix(in srgb,var(--mm,#C8D0D8) 75%,transparent)}
/* "2. Os metais têm um brilho característico", no lugar da propriedade 1 */
.prop4B{position:absolute;inset:0;z-index:25;pointer-events:none}
.prop4B .frase{position:absolute;display:none;margin:0;white-space:nowrap;transform:translateY(-50%);
  font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:#F4F2F8;
  text-shadow:0 2px 4px rgba(0,0,0,.5)}
.prop4B .frase.on{display:block}
.prop4B .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.prop4B .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* A "4A2" (EV4.cena4C): a propriedade 2 sai em fade, e a 3 vem digitada */
.prop4B .frase{transition:opacity .6s ease}
.prop4B .frase.fim{opacity:0}
.prop4C{position:absolute;z-index:25;pointer-events:none;margin:0;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:28px;line-height:1.3;color:#F4F2F8;
  text-shadow:0 2px 4px rgba(0,0,0,.5)}
.prop4C .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.prop4C .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* "calor": incandescente — o degradê de um ferro em brasa, que corre pelas
   letras, e o halo laranja a tremer como chama */
.calor4{background:linear-gradient(90deg,#FFF6C2,#FFC23D 22%,#FF6A1F 45%,#D9230F 62%,#FF8A2A 80%,#FFF0A8);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 6px rgba(255,110,30,.85)) drop-shadow(0 0 14px rgba(255,60,10,.45));
  animation:brasa4 1.8s linear infinite, chama4 .55s ease-in-out infinite alternate}
@keyframes brasa4{from{background-position:0 0} to{background-position:-220% 0}}
@keyframes chama4{from{filter:drop-shadow(0 0 5px rgba(255,110,30,.8)) drop-shadow(0 0 12px rgba(255,60,10,.4))}
  to{filter:drop-shadow(0 0 8px rgba(255,150,40,.95)) drop-shadow(0 0 18px rgba(255,70,10,.6))}}
/* "eletricidade": azul-branco, a faiscar aos solavancos, com tremidas */
.eletrico4{display:inline-block;color:#E4F8FF;
  text-shadow:0 0 3px #BFEFFF, 0 0 9px #55BFFF, 0 0 20px #2A7BFF;
  animation:faisca4C 1.6s steps(1) infinite}
@keyframes faisca4C{
  0%  {opacity:1;transform:none;text-shadow:0 0 3px #BFEFFF,0 0 9px #55BFFF,0 0 20px #2A7BFF}
  6%  {opacity:1;transform:translate(1px,-1px);text-shadow:0 0 4px #fff,0 0 14px #9FE3FF,0 0 34px #4FA3FF,0 0 50px #2A7BFF}
  8%  {opacity:.55;transform:translate(-1px,0)}
  10% {opacity:1;transform:none;text-shadow:0 0 3px #BFEFFF,0 0 9px #55BFFF,0 0 20px #2A7BFF}
  41% {opacity:1;transform:translate(-1px,1px);text-shadow:0 0 4px #fff,0 0 16px #9FE3FF,0 0 38px #4FA3FF}
  43% {opacity:.4;transform:none}
  45% {opacity:1;text-shadow:0 0 5px #fff,0 0 20px #BFEFFF,0 0 44px #4FA3FF}
  47% {opacity:1;transform:none;text-shadow:0 0 3px #BFEFFF,0 0 9px #55BFFF,0 0 20px #2A7BFF}
  77% {opacity:.7}
  79% {opacity:1}}
/* O CUBO DA PANELA E DO CHOQUE: duas faces de 440 (a da frente, a panela;
   a do lado, o choque), e o giro de um quarto escrito pelo relógio */
.cubo4C{position:absolute;width:440px;height:440px;z-index:30;pointer-events:none;
  transform:scale(calc(var(--esc,1) * .86));opacity:0;
  transition:opacity .6s ease, transform .7s var(--e-salto);perspective:1600px}
.cubo4C.on{opacity:1;transform:scale(var(--esc,1))}
.gira4{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(-220px)}
.face4C{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%,rgba(255,255,255,.07),rgba(255,255,255,.015) 70%),rgba(16,14,34,.55);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 24px 50px rgba(0,0,0,.35)}
.face4C.frente{transform:translateZ(220px)}
.face4C.lado{transform:rotateY(90deg) translateZ(220px)}
.panela4{display:block;width:100%;height:100%}
.panela4 .pn-passa{animation:panelaBrilho 3.2s 1s ease-in-out infinite}
@keyframes panelaBrilho{0%{transform:skewX(-22deg) translateX(0)} 55%,100%{transform:skewX(-22deg) translateX(520px)}}
/* VIRADA, A FACE FICA PLANA: no fim do giro ela está exatamente de frente,
   e sem o 3D o navegador acerta o dedo nela (dentro do preserve-3d o
   toque atravessava a face) — a mesma imagem, sem salto */
.cubo4C.virou .gira4{transform:none!important;transform-style:flat}
.cubo4C.virou .face4C.frente{display:none}
.cubo4C.virou .face4C.lado{transform:none}
.cubo4C.virou .face4C.tras{display:none}
/* o segundo giro (a "4A3"): virada outra vez, só a fieira, plana */
.cubo4C.virou2 .gira4{transform:none!important;transform-style:flat}
.cubo4C.virou2 .face4C:not(.tras){display:none}
.cubo4C.virou2 .face4C.tras{transform:none}
.face4C.tras{transform:rotateY(180deg) translateZ(220px)}
/* a quarta face (a "4A5": as chapas), e o terceiro giro, plano no fim */
.face4C.esq{transform:rotateY(270deg) translateZ(220px)}
.cubo4C.virou .face4C.esq{display:none}
.cubo4C.virou3 .gira4{transform:none!important;transform-style:flat}
.cubo4C.virou3 .face4C:not(.esq){display:none}
.cubo4C.virou3 .face4C.esq{transform:none}
/* as chapas: a mesma, em três metais, que se trocam em fade */
.chapas4{position:absolute;inset:0}
.chapas4 .ch4{opacity:0;transition:opacity .6s ease}
.chapas4[data-metal="cobre"] .ch4-cobre,.chapas4[data-metal="zinco"] .ch4-zinco,.chapas4[data-metal="ferro"] .ch4-ferro{opacity:1}
.chapas4 .ch-nome{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;fill:#F4F2F8}
/* A "4A3": o choque esvazia (7,6 s), e o fio desencapado vem (20 s) */
.choque4{transition:opacity .6s ease}
.cubo4C.apaga4D .choque4{opacity:0;pointer-events:none!important}
.fiod4{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.fiod4 svg{display:block;width:100%;height:100%}
.cubo4C.fio4D .fiod4{opacity:1}
/* a fieira: só pega o dedo virada */
.fieira4{position:absolute;inset:0;touch-action:none}
.cubo4C.virou2 .fieira4{pointer-events:auto}
.fieira4 svg{display:block;width:100%;height:100%}
.fieira4 .fr-nome{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;fill:#F4F2F8}
/* por partes: a máquina, e depois o metal com o resto */
.fieira4 .fr-maq,.fieira4 .fr-met{opacity:0;transition:opacity .7s ease}
.fieira4.maquina .fr-maq,.fieira4.metal .fr-met{opacity:1}
.fieira4 .fr-conta{font-family:var(--display);font-weight:600;font-size:17px;fill:#F4F2F8}
.fieira4 .fr-conta.alerta{fill:#FFD43B}
.fieira4 .fr-garra{cursor:grab}
.fieira4.pegando .fr-garra{cursor:grabbing}
/* o anel que chama, na garra, até ao primeiro puxão */
.fieira4 .fr-chama{animation:chamaGarra 1.2s ease-in-out infinite;transform-origin:16px 0;transform-box:view-box}
.fieira4.puxou .fr-chama{display:none}
@keyframes chamaGarra{0%,100%{opacity:.9} 50%{opacity:.15}}
/* um cubo apagado não pega o dedo em nada de dentro dele */
.cubo4C:not(.on) *{pointer-events:none!important}
/* A "4A4": a maleabilidade (a definição quebra em duas linhas), o laminador */
.prop4D{transition:opacity .6s ease}
.prop4D.fim{opacity:0}
.prop4E{position:absolute;inset:0;z-index:25;pointer-events:none;transition:opacity .6s ease}
.prop4E.fim{opacity:0}
.prop4E .frase{position:absolute;display:none;margin:0;line-height:1.28;
  font-family:var(--display);font-weight:600;font-size:25px;color:#F4F2F8;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.prop4E .frase.on{display:block}
.prop4E .frase:first-child{font-weight:700;font-size:34px;color:var(--ouro-luz);white-space:nowrap;transform:translateY(-50%)}
.prop4E .frase:nth-child(2){width:630px}
.prop4E .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.prop4E .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
.face4C svg{display:block;width:100%;height:100%}
.lam4{position:absolute;inset:0}
.cubo4E.virou .lam4{pointer-events:auto}
.lam4 .lm-bt{cursor:pointer}
/* a máquina vazia, e o metal (a barra, a cunha, a folha e o rolo dela)
   que entra em fade aos 22,4 s */
.lam4 :is(.lm-metal,.lm-bob){opacity:0;transition:opacity .7s ease}
.lam4.metal :is(.lm-metal,.lm-bob){opacity:1}
.lam4:not(.metal) .lm-bt{cursor:default}
.lam4.rodando .lm-bt,.lam4.feito .lm-bt{cursor:default}
.lam4 .lm-bt-txt{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.14em;fill:#E6ECF2}
.lam4 .lm-nome{font-family:var(--display);font-weight:600;font-size:24px;fill:#F4F2F8}
/* o botão chama, até ser ligado */
.lam4:not(.rodando):not(.feito) .lm-bt-luz{animation:chamaBotao 1.1s ease-in-out infinite}
@keyframes chamaBotao{0%,100%{opacity:1} 50%{opacity:.55}}
/* ligada, a máquina treme um fio */
.cubo4E:has(.lam4.rodando){animation:vibra4 .12s linear infinite}
@keyframes vibra4{0%,100%{translate:0 0} 25%{translate:.8px -.6px} 50%{translate:-.7px .5px} 75%{translate:.5px .7px}}
body.montagem .alerta4E{opacity:1!important;animation:none!important;pointer-events:auto}
/* A "4A5": a tabela volta ao lugar andando, e os metais, vistos, ficam
   verdes (sem marca de ✓: o professor pediu-os fora) */
.mesa.tipos.reorganiza .pc{transition:left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1),
  transform .9s cubic-bezier(.4,0,.2,1), opacity .7s ease}
/* (um verde claro e vivo: o dos ametais, #2E9450, é escuro, e as duas
   classes não se confundem) */
.mesa.tipos.metais-ok .pc[data-tipo="metais"]{--cor:#3FCB72!important}
/* os textos da "4A3" */
.prop4C{transition:opacity .6s ease}
.prop4C.fim{opacity:0}
.prop4D{position:absolute;inset:0;z-index:25;pointer-events:none}
.prop4D .frase{position:absolute;display:none;margin:0;white-space:nowrap;line-height:1;
  font-family:var(--display);font-weight:600;font-size:28px;color:#F4F2F8;text-shadow:0 2px 4px rgba(0,0,0,.5);
  transform:translateY(-50%);transform-origin:left center;transition:opacity .4s ease, transform .5s var(--e-salto)}
.prop4D .frase.on{display:block}
.prop4D .frase.saindo{opacity:0}
.prop4D .frase:nth-child(2){font-weight:700;font-size:34px;color:var(--ouro-luz)}
.prop4D .frase.cresce{transform:translateY(-50%) scale(1.35)}
.prop4D .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.prop4D .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* o choque: a face só pega o dedo depois de virada */
.choque4{position:absolute;inset:0;touch-action:none}
.cubo4C.virou .choque4{pointer-events:auto}
.eletro4{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.barra4{position:absolute;width:170px;height:56px;margin:-28px 0 0 -85px;cursor:grab}
.choque4.pegando .barra4{cursor:grabbing}
.barra4 svg{display:block;width:100%;height:100%;overflow:visible}
.barra4.viva{filter:drop-shadow(0 0 14px rgba(150,225,255,.95)) drop-shadow(0 0 34px rgba(90,170,255,.6))}
.choque4 .lampejo{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 70% 50% at var(--lx,50%) var(--ly,42%),
    rgba(198,238,255,.5) 0%, rgba(96,168,255,.22) 40%, rgba(30,60,140,0) 72%)}
.choque4.chocando .lampejo{animation:lampeja4 .16s steps(2,end) infinite}
@keyframes lampeja4{0%{opacity:.25} 50%{opacity:1} 100%{opacity:.45}}
.cubo4C.chocando{animation:balanca4 .34s linear infinite}
@keyframes balanca4{0%,100%{translate:0 0} 10%{translate:-9px 3px} 22%{translate:8px -4px}
  35%{translate:-7px -3px} 48%{translate:6px 4px} 61%{translate:-5px 2px} 74%{translate:4px -2px} 87%{translate:-2px 1px}}
/* os textos da "4A" (EV4.prepara4A dá o lugar de cada um): as
   propriedades no alto do lado direito — o título no dourado, a
   propriedade clara, a exceção prateada e um pouco para dentro — e
   "Metal líquido" debaixo do Hg crescido, que sai no fim */
.liq4{position:absolute;inset:0;z-index:25;pointer-events:none}
.liq4 .frase,.liq4 .mede4{position:absolute;margin:0;white-space:nowrap;font-family:var(--display);line-height:1}
.liq4 .mede4{visibility:hidden}
.liq4 .frase{display:none;transform:translateY(-50%);transition:opacity .6s ease;
  text-shadow:0 2px 4px rgba(0,0,0,.5)}
.liq4 .frase.on{display:block}
.liq4 .frase.fim{opacity:0}
.liq4 .frase:nth-child(1){font-weight:700;font-size:34px;color:var(--ouro-luz)}
.liq4 .frase:nth-child(2){font-weight:600;font-size:28px;color:#F4F2F8}
.liq4 .frase:nth-child(3){font-weight:600;font-size:26px;color:#C9D2DC}
.liq4 .frase:nth-child(4),.liq4 .mede4{font-weight:700;font-size:36px;color:#E6ECF2;
  text-shadow:0 0 14px rgba(200,214,230,.55), 0 2px 4px rgba(0,0,0,.5)}
.liq4 .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.liq4 .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* A "4B" (EV4.cenaAm): aos 15,4 s só os ametais ficam — os outros somem
   de todo, com os eixos, as casas e os textos —, e saltam até a grade da
   direita, como os metais na "4A" */
.mesa.tipos.arrumaAm .pc:not([data-tipo="ametais"]){opacity:0;pointer-events:none}
.mesa.tipos.arrumaAm[data-luz] .eixo,.mesa.tipos.arrumaAm .classes4{opacity:0}
/* (as casas das séries apagam com a regra das classes acesas, mais forte:
   a mesma, com o arrumaAm a mais) */
.mesa.tipos.arrumaAm:not([data-luz=""]):not([data-luz="metais"])[data-luz] .casa{opacity:0}
.pc.realceAm{z-index:30}
/* na vez de um estado físico, os outros ametais apagam (a transição de
   opacidade do anda4 faz o fade, na ida e na volta) */
.mesa.tipos[data-luz] .pc.apagaAm{opacity:.25}
/* "Ametais", acima da grade, quando o último pousa: entra de um desfoque,
   como o "Metais" — mas fosco, no verde claro do bloco, sem o reflexo
   que corre pelas letras de metal */
.tituloAm{position:absolute;z-index:25;pointer-events:none;white-space:nowrap;
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1;letter-spacing:.03em;
  background:linear-gradient(180deg,#B7EBC6 0%,#7FD49A 45%,#3FA866 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
  transform:translate(-50%,-50%);opacity:0;transition:opacity .4s ease}
html.celular .tituloAm{font-size:36px}
.tituloAm.on{animation:metalEntra 1s cubic-bezier(.2,.8,.2,1) forwards}
/* os textos dos ametais, à esquerda, nas cores dos dos metais: o título
   no dourado, a propriedade clara, os itens prateados e para dentro */
.propAm{position:absolute;inset:0;z-index:25;pointer-events:none}
.propAm .frase{position:absolute;display:none;margin:0;white-space:nowrap;font-family:var(--display);line-height:1;
  transform:translateY(-50%);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.propAm .frase.on{display:block}
.propAm .frase:nth-child(1){font-weight:700;font-size:34px;color:var(--ouro-luz)}
.propAm .frase:nth-child(2){font-weight:600;font-size:28px;color:#F4F2F8}
.propAm .frase:nth-child(n+3){font-weight:600;font-size:26px;color:#C9D2DC}
.propAm .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.propAm .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* o botão "Ver" à direita dos itens a), b) e c), os três numa coluna logo
   depois do fim do c) (EV4.alinhaVer dá o left); aparece com o item
   escrito, e só se deixa tocar acabada a narração. DESLIGADO: vermelho
   escuro, afundado, com a luzinha apagada. LIGADO: verde vivo, saltado, com
   o halo verde e a luzinha acesa */
.verAm{position:absolute;top:50%;left:0;translate:0 -50%;display:flex;align-items:center;gap:7px;
  padding:5px 13px 5px 9px;border:2px solid #B33A32;border-radius:999px;
  font:700 15px/1 var(--display);letter-spacing:.03em;color:#F6CFCB;background:#7E241F;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.5);
  opacity:0;scale:.6;pointer-events:none;
  transition:opacity .3s ease, scale .35s var(--e-salto), background .25s ease, border-color .25s ease,
             box-shadow .3s ease, color .25s ease}
.verAm::before{content:'';width:9px;height:9px;border-radius:50%;background:#3E0F0C;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7);transition:background .25s ease, box-shadow .25s ease}
.verAm.on{color:#fff;background:#1FB85C;border-color:#8DF5B4;
  box-shadow:0 0 0 3px rgba(39,196,107,.28), 0 0 18px 4px rgba(39,196,107,.6), inset 0 1px 0 rgba(255,255,255,.4)}
.verAm.on::before{background:#F2FFF6;box-shadow:0 0 6px 2px rgba(214,255,228,.95)}
.propAm .frase.comVer .verAm{opacity:1;scale:1}
.propAm .frase.comVer .verAm.livre{pointer-events:auto;cursor:pointer}
.propAm .frase.comVer .verAm.livre:active{scale:.92}
.propAm .frase.comVer .verAm.on{scale:1.06}
/* na montagem, as frases dos ametais pegam o dedo: andam e editam */
body.montagem .propAm .frase,body.montagem .propAm1 .frase{pointer-events:auto}
/* os sólidos dos ametais, foscos: sem as faíscas */
.mat.solido.fosco .faisca{display:none}
/* A "4B1": os itens da 4B saem em fade, e a propriedade 2, clara, vem no
   lugar da 1; o cubo dos pós à esquerda, embaixo do texto */
.propAm .frase{transition:opacity .6s ease}
.propAm .frase.fim{opacity:0}
.propAm1{position:absolute;inset:0;z-index:25;pointer-events:none}
.propAm1 .frase{position:absolute;display:none;margin:0;white-space:nowrap;line-height:1;transform:translateY(-50%);
  font-family:var(--display);font-weight:600;font-size:28px;color:#F4F2F8;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.propAm1 .frase.on{display:block}
.propAm1 .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.propAm1 .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* O PASSEIO pelos pós (fim da "4B1"): as setas na base das imagens, e o
   giro do cubo, agora uma transição (cada toque, um quarto de volta) */
.po-img{position:absolute;inset:0}
.cuboAm.passeia .gira4{transition:transform .8s cubic-bezier(.45,0,.25,1)}
.setasAm{position:absolute;z-index:35;translate:-50% -50%;display:flex;gap:10px;
  opacity:0;scale:.6;pointer-events:none;transition:opacity .3s ease, scale .35s var(--e-salto)}
.setasAm.on{opacity:1;scale:1;pointer-events:auto}
.setasAm button{width:38px;height:30px;padding:0;border-radius:999px;cursor:pointer;
  font:700 14px/1 var(--display);color:var(--ouro-luz);background:rgba(255,255,255,.08);
  border:2px solid color-mix(in srgb,var(--ouro-luz) 70%,transparent);
  box-shadow:0 2px 8px rgba(0,0,0,.35);transition:background .2s ease, scale .15s ease}
.setasAm button:hover{background:rgba(255,255,255,.16)}
.setasAm button:active{scale:.9}
.setasAm.on button{animation:chamaSeta 1.6s ease-in-out 3}
.setasAm.on button + button{animation-delay:.2s}
@keyframes chamaSeta{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.35)} 50%{box-shadow:0 0 14px 3px color-mix(in srgb,var(--ouro-luz) 60%,transparent)}}
/* A "4B2": a propriedade 3 (duas linhas, clara) e a exceção (prateada) */
.propAm2{position:absolute;inset:0;z-index:25;pointer-events:none}
.propAm2 .frase{position:absolute;display:none;margin:0;font-family:var(--display);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.propAm2 .frase.on{display:block}
.propAm2 .frase:nth-child(1){width:560px;font-weight:600;font-size:28px;line-height:1.28;color:#F4F2F8}
.propAm2 .frase:nth-child(2){white-space:nowrap;line-height:1;transform:translateY(-50%);font-weight:600;font-size:26px;color:#C9D2DC}
.propAm2 .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.propAm2 .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
/* A "4C" (EV4.cenaNb): aos 18,7 s só os gases nobres ficam — os outros
   somem de todo, com os eixos, as casas e os textos —, e saltam para a
   grade da direita */
.mesa.tipos.arrumaNb .pc:not([data-tipo="nobres"]){opacity:0;pointer-events:none}
.mesa.tipos.arrumaNb[data-luz] .eixo,.mesa.tipos.arrumaNb .classes4{opacity:0}
.mesa.tipos.arrumaNb:not([data-luz=""])[data-luz] .casa{opacity:0}
/* a coluna que brilha em verde (13 → 18,7 s) */
.pc.brilhaNb{z-index:30;filter:brightness(1.15)}
.pc.brilhaNb .face{box-shadow:0 0 0 2px #7DFFA8, 0 0 22px 6px rgba(61,220,120,.7), 0 8px 18px rgba(0,0,0,.4)}
/* "Gases Inertes", ao lado da coluna, no tom claro do violeta dela */
.inertesNb{position:absolute;inset:0;z-index:25;pointer-events:none;transition:opacity .6s ease}
.inertesNb.fim{opacity:0}
.inertesNb .frase{position:absolute;display:none;margin:0;white-space:nowrap;line-height:1;transform:translateY(-50%);
  font-family:var(--display);font-weight:700;font-size:32px;color:color-mix(in srgb,var(--cat-nobres) 60%,#fff);
  text-shadow:0 0 14px color-mix(in srgb,var(--cat-nobres) 55%,transparent), 0 2px 4px rgba(0,0,0,.5)}
.inertesNb .frase.on{display:block}
.inertesNb .mede{display:block;visibility:hidden}
.inertesNb .frase .cursor{display:inline-block;width:3px;height:.9em;margin-left:5px;vertical-align:-.1em;background:var(--ouro-luz)}
.inertesNb .frase .cursor.pisca{animation:piscaCursor 1.05s steps(1) infinite}
body.montagem .inertesNb .frase{pointer-events:auto}
/* "Gases Nobres", acima da grade: o violeta claro do bloco */
.tituloNb{background:linear-gradient(180deg,#E4DCFF 0%,#B4A6FF 45%,#7C69E8 100%);
  -webkit-background-clip:text;background-clip:text}
/* o item, com as três palavras que crescem (uma de cada vez) e ficam âmbar */
.propAm .frase.nbFrase2.on{display:block}
/* (crescida, ela abre espaço dos dois lados: não tapa as vizinhas) */
.nbPal{display:inline-block;transform-origin:50% 80%;margin:0;
  transition:transform .35s var(--e-salto), margin .35s var(--e-salto), color .3s ease, text-shadow .3s ease}
