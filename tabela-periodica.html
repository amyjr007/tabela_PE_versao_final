  { z:16, latim:'Sulfur', op:['Enxofre','Silício','Sódio'] }
];
/* a narração que o play carrega depois de cada quiz (null: ainda não há) */
const DEPOIS_DO_QUIZ = { '1.3A':'1.4', '1.3B':'1.4', '1.4':'1.jogo' };
/* A HORA DO QUIZ, no relógio da narração: o primeiro exemplo rola para a
   frente com o fim da fala ainda a tocar */
const QUIZ_NA_HORA = { '1.3A':35.8, '1.3B':35.5, '1.4':47.0 };
function quizNaHora(t){
  const h = QUIZ_NA_HORA[trilhaAtual];
  if (h !== undefined && t >= h) SEQ.abreQuiz(trilhaAtual);
}

/* os efeitos sonoros tocam e avisam quando acabam — é assim que a cena
   espera cada um antes de dar o passo seguinte. Um arquivo que não
   carregue não prende a aula: conta como acabado. */
const EFEITOS = new Set();
/* A VIBRAÇÃO (celular e tablet Android; o iPhone e o iPad não deixam a
   página vibrar). Vai junto com os sons que pedem um toque na mão: o erro
   treme forte, o acerto dá um toque firme, a festa um "tum-tum-tum", e o
   card que vira ou encaixa um toque leve. E os toques do aluno nos botões
   e nos cards dão um clique curtinho. Nunca na montagem. */
const VIBRA = {
  error:[70, 50, 70],                 /* errou: duas batidas */
  right:[25], yes:[35],               /* acertou */
  funfare:[30, 60, 30, 60, 60],       /* a festa do acerto */
  statistics:[20, 80, 40],            /* o cartão da nota */
  flip:[8], flipcard:[10],            /* o card que vira ou encaixa */
  transition_cube:[12]                /* a troca de slide */
};
let vibraAte = 0;
function vibra(padrao){
  if (!navigator.vibrate || naMontagem() || document.hidden) return;
  /* muitos seguidos (os flips da arrumação) não viram um zumbido */
  const agora = performance.now();
  if (padrao.length === 1 && agora < vibraAte) return;
  vibraAte = agora + (padrao.length === 1 && padrao[0] <= 5 ? 30 : 60);   /* o tique da roda é mais miúdo */
  try { navigator.vibrate(padrao); } catch (_) {}
}
/* o clique curtinho dos toques do aluno: botões e cards */
addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse') return;
  const alvo = ev.target.closest && ev.target.closest('button, .pc, .mem-carta, .quiz-op, .eixo, .rd-v, [role="button"]');
  if (alvo) vibra([6]);
}, true);
function tocaEfeito(nome){
  if (VIBRA[nome]) vibra(VIBRA[nome]);
  return new Promise(pronto => {
    /* um nome é um efeito da pasta vfx; com barra, é o caminho do arquivo */
    const a = new Audio(encodeURI(nome.includes('/') ? nome : 'Audios/vfx/' + nome + '.mp3'));
    if (nome.includes('/')) Velocidade.aplicar(a);   /* as falas, e não os efeitos */
    EFEITOS.add(a);
    let feito = false;
    const fim = () => { if (feito) return; feito = true; EFEITOS.delete(a); pronto(a); };
    a.addEventListener('ended', fim);
    a.addEventListener('error', fim);
    /* rede de segurança: nunca fica preso. Com o app fora da tela (o som
       pausado pela saída), ela espera a volta: senão a cena andava sozinha
       lá atrás, sem ninguém a ver nem a ouvir */
    const seguranca = () => (document.hidden || a._pausadoNaSaida) ? setTimeout(seguranca, 1000) : fim();
    setTimeout(seguranca, 12000);
    a.play().catch(fim);
  });
}

/* A ABERTURA DE CADA CAPÍTULO (audio_tabela_N.0): chegando a um slide —
   pelas setas, pelo "Iniciar" da capa, pelo carrossel ou pelo sumário —,
   toca a apresentação dele. Ela é uma fala à parte, e não a trilha do
   slide: a narração continua à espera do play, como sempre. Apertado o
   play (ou mudado o slide), a abertura cala-se, para as vozes não se
   sobreporem; e um subtópico do sumário, que já chega a falar, não a
   toca (ABERTURA_SUSPENSA). */
var ABERTURA = null, ABERTURA_SUSPENSA = false;
function calaAbertura(){
  if (!ABERTURA) return;
  ABERTURA.pause();
  EFEITOS.delete(ABERTURA);
  ABERTURA = null;
}
function tocaAbertura(i){
  calaAbertura();
  if (i < 1 || ABERTURA_SUSPENSA) return;
  const a = new Audio(encodeURI('Audios/audio_tabela_' + i + '.0.mp3'));
  Velocidade.aplicar(a);
  EFEITOS.add(a);
  ABERTURA = a;
  const fim = () => { EFEITOS.delete(a); if (ABERTURA === a) ABERTURA = null; };
  a.addEventListener('ended', fim);
  a.addEventListener('error', fim);
  /* acabada a abertura, a narração do capítulo começa sozinha, 1,5 s
     depois — se o aluno ainda estiver ali, à espera do play */
  if (SEGUE_ABERTURA[i]) a.addEventListener('ended', () => setTimeout(() => {
    const id = SEGUE_ABERTURA[i];
    if (atual === i && trilhaAtual === id && som.paused && (som.currentTime || 0) < 0.1 && !naMontagem())
      som.play().catch(avisaSeNaoTocou);
  }, 1500));
  a.play().catch(fim);
  animaTituloNaAbertura(i, a);
}
/* os capítulos em que a narração segue a abertura sem esperar o play */
const SEGUE_ABERTURA = { 1:'1', 2:'2', 3:'3' };
som.addEventListener('play', calaAbertura);

/* O TÍTULO NA ABERTURA DO CAPÍTULO, no relógio do áudio N.0:
     num      o número do slide aparece
     letras   o título é digitado, letra a letra, 'passo' s cada uma
   Pausada a abertura, a escrita pára onde está; calada (o play, a troca
   de slide) ou acabada, o título fica inteiro. */
/* em todos os capítulos: o número aos 0,5 s e as letras a partir de 1 s
   (no capítulo 2, que veio primeiro, as letras começam aos 1,2 s) */
const TITULO_NA_ABERTURA = {
  padrao: { num:0.5, letras:1.0, passo:0.07 },
  2:      { num:0.5, letras:1.2, passo:0.07 }
};
function animaTituloNaAbertura(i, a){
  const o = TITULO_NA_ABERTURA[i] || TITULO_NA_ABERTURA.padrao, sl = slides[i];
  if (!o || !sl) return;
  const num = sl.querySelector('.tira .num'), tit = sl.querySelector('.tira .title');
  if (!num || !tit || tit.children.length) return;   /* editado na montagem: fica quieto */
  const texto = tit.textContent;
  tit.textContent = '';
  const letras = [];
  [...texto].forEach(ch => {
    if (!ch.trim()){ tit.append(ch); return; }
    const s = document.createElement('span');
    s.className = 'letra-ab';
    s.textContent = ch;
    tit.appendChild(s);
    letras.push(s);
  });
  /* A DIGITAÇÃO (no lugar da pulsada e das cores em sequência): o número
     aparece aos 'num' s, e as letras do título, escondidas, são escritas
     uma a uma a partir de 'letras', com o som das teclas e o cursor no
     fim. Cada letra já tem o seu lugar, e o título não salta. */
  const cursor = document.createElement('span');
  cursor.className = 'cursor-ab';
  let escritas = -1;
  const limpa = () => {
    tit.textContent = texto;
    num.style.removeProperty('visibility');
  };
  (function quadro(){
    if (ABERTURA !== a || atual !== i){ limpa(); return; }
    const t = a.currentTime;
    num.style.visibility = t >= o.num ? '' : 'hidden';
    const n = t < o.letras ? 0 : Math.min(letras.length, Math.floor((t - o.letras) / o.passo) + 1);
    if (n !== escritas){
      if (n > Math.max(0, escritas)) TECLAS.bate();
      escritas = n;
      letras.forEach((s, j) => s.classList.toggle('oculta', j >= n));
      if (n > 0 && n < letras.length) letras[n - 1].after(cursor); else cursor.remove();
    }
    requestAnimationFrame(quadro);
  })();
  a.addEventListener('ended', limpa, { once:true });
}

/* SAINDO DO APP, TUDO PÁRA. O aluno vai para outro aplicativo, ou a tela
   apaga: a narração pausa — e com ela a cena, que segue o relógio dela —,
   e os efeitos que estiverem a tocar (o "error", a fanfarra, a fala do
   fim do jogo) pausam também. Na volta, os efeitos continuam de onde
   estavam, para a cena que esperava por eles seguir; a narração fica
   parada, à espera do play, para o aluno retomar quando estiver pronto. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (!som.paused) som.pause();
    TECLAS.cala();
    EFEITOS.forEach(a => { if (!a.paused){ a._pausadoNaSaida = true; a.pause(); } });
  } else {
    EFEITOS.forEach(a => {
      if (!a._pausadoNaSaida) return;
      a._pausadoNaSaida = false;
      a.play().catch(() => {});
    });
  }
});
const espera = ms => new Promise(ok => setTimeout(ok, ms));

/* A MENSAGEM DA RESPOSTA. Com o nome latino (quiz da "1.4"): "Exato!
   Plumbum é o Chumbo.", e só "Plumbum é o Chumbo." no erro — as letras
   que viraram o símbolo em destaque. Sem ele: "Exato! É o Carbono." e
   "Era o Carbono.". 'inicio' é a frase do acerto; null no erro. */
const NOMES_FEMININOS = new Set(['Prata', 'Platina']);
function escreveResposta(msg, item, certa, inicio){
  const art = NOMES_FEMININOS.has(certa) ? 'a' : 'o';
  msg.textContent = '';
  if (!item.latim){
    msg.textContent = inicio ? inicio + ' É ' + art + ' ' + certa + '.' : 'Era ' + art + ' ' + certa + '.';
    return;
  }
  if (inicio) msg.append(inicio + ' ');
  msg.appendChild(palavraLatina(item.latim, SIMBOLOS[item.z-1]));
  msg.append(' é ' + art + ' ' + certa + '.');
}
/* a palavra latina com as letras do símbolo em destaque: a primeira, e a
   segunda letra do símbolo onde ela aparece depois (Hydrar-g-yrum) */
function palavraLatina(palavra, sym){
  const marca = new Set([0]);
  if (sym.length > 1){
    const j = palavra.toLowerCase().indexOf(sym[1].toLowerCase(), 1);
    if (j > 0) marca.add(j);
  }
  const w = document.createElement('span');
  w.className = 'quiz-latim';
  [...palavra].forEach((letra, i) => {
    if (marca.has(i)){ const b = document.createElement('b'); b.textContent = letra; w.appendChild(b); }
    else w.append(letra);
  });
  return w;
}

/* a tela treme e pisca de vermelho. Com 'pecas', tremem só elas (o
   cartão e o cubo da pergunta), e não o palco inteiro: o palco leva a
   tabela de 118 cubos, e sacudido inteiro pesava no celular, que perdia
   pedaços da tela */
function tremeVermelho(pecas){
  const alvos = pecas ? pecas.filter(Boolean) : [stage];
  alvos.forEach(p => {
    const cls = p === stage ? 'treme' : 'treme-peca';
    p.classList.remove(cls); void p.offsetWidth; p.classList.add(cls);
    if (p !== stage) setTimeout(() => p.classList.remove(cls), 550);
  });
  const f = document.getElementById('flash-erro');
  if (f){ f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
}

/* onde o cubo da pergunta fica: no meio da coluna esquerda do cartão */
const QUIZ_LUGAR = { x:380, y:372, escala:3.3 };
/* quantas perguntas o quiz faz */
const QUIZ_TOTAL = 6;
/* A VOZ DEPOIS DE CADA COMEMORAÇÃO — sorteada entre as quatro, sem
   repetir: um baralho que se embaralha de novo quando acaba, e cuja
   primeira carta nunca é a mesma que acabou de sair. A última questão
   de cada quiz tem sempre "perfeito". A frase escrita acompanha a voz. */
const VOZES_DO_ACERTO = [
  { som:'exato!',     frase:'Exato!'      },
  { som:'muitobem',   frase:'Muito bem!'  },
  { som:'issomesmo!', frase:'Isso mesmo!' },
  { som:'excelente',  frase:'Excelente!'  }
];
const VOZ_DA_ULTIMA = { som:'perfeito', frase:'Perfeito!' };
let BARALHO_VOZES = [], VOZ_ANTERIOR = null;
function vozDoAcerto(ultima){
  if (ultima) return (VOZ_ANTERIOR = VOZ_DA_ULTIMA);
  if (!BARALHO_VOZES.length){
    BARALHO_VOZES = embaralha(VOZES_DO_ACERTO.slice());
    if (BARALHO_VOZES[0] === VOZ_ANTERIOR) BARALHO_VOZES.push(BARALHO_VOZES.shift());
  }
  return (VOZ_ANTERIOR = BARALHO_VOZES.shift());
}
/* A VOZ DE ÂNIMO DO ERRO (depois do "error", no primeiro erro de cada
   questão, em todos os quizzes): as três, uma de cada vez, em revezamento */
const VOZES_DO_ERRO = ['Calmanaproximaacerta', 'calmavaidenovo', 'pera'];
let vozErroVez = 0;
function vozDoErro(){ return VOZES_DO_ERRO[vozErroVez++ % VOZES_DO_ERRO.length]; }

/* O SOM DA ENTRADA — toca ao mesmo tempo que o exemplo novo rola para a
   frente: "eesseaqui" e "próximo" alternados, e "sómaisesse" na entrada
   da última pergunta. Toca também depois de um erro: são sons neutros, e
   o ritmo da aula não muda por o aluno ter errado. */
function somDaEntrada(passo, total){
  if (passo === total - 1) return 'sómaisesse';
  return passo % 2 === 1 ? 'eesseaqui' : 'próximo';
}

const QUIZ = {
  aberto:false, passo:0, itens:[], cubo:null, travado:false,
  /* cada abertura tem o seu número: se o aluno sai do slide a meio, a
     sequência antiga reconhece que já não é a dela e pára */
  geracao:0,
  caixa(){ return slides[1].querySelector('.quiz'); },

  abre(trilha){
    const c = SEQ.eleito;
    this.origem = trilha;
    const lista = (trilha === '1.3A' ? QUIZ_UMA : trilha === '1.3B' ? QUIZ_DUAS : QUIZ_DIFERENTES)
      .filter(p => !c || p.z !== +c.dataset.z);
    this.itens = embaralha(lista.slice()).slice(0, QUIZ_TOTAL);
    this.passo = 0;
    this.acertos = 0;
    this.erros = 0;
    this.aberto = true;
    this.mostrandoNota = false;
    this.caixa().classList.remove('nota-on');
    /* o play sai de cena: daqui em diante quem faz a aula andar é a escolha */
    stage.classList.add('em-quiz');
    const g = ++this.geracao;
    this.caixa().classList.add('on');
    this.apresenta(g);
  },

  /* o quiz de uma aula guardada (ONDE): as mesmas perguntas, na mesma, com
     os mesmos acertos e erros — ou o cartão da nota, se já tinha acabado */
  retoma(e){
    const fonte = e.origem === '1.3A' ? QUIZ_UMA : e.origem === '1.3B' ? QUIZ_DUAS : QUIZ_DIFERENTES;
    const itens = e.itens.map(z => fonte.find(p => p.z === z)).filter(Boolean);
    if (!itens.length){ SEQ.abreQuiz(e.origem); return; }
    SEQ.quizDa = e.origem;
    this.origem = e.origem;
    this.itens = itens;
    this.passo = Math.min(e.passo || 0, itens.length - 1);
    this.acertos = e.acertos || 0;
    this.erros = e.erros || 0;
    this.aberto = true;
    this.mostrandoNota = false;
    this.caixa().classList.remove('nota-on');
    stage.classList.add('em-quiz');
    const g = ++this.geracao;
    this.caixa().classList.add('on');
    if (e.nota) this.resultado(g); else this.apresenta(g);
  },

  /* um exemplo: o cubo vem para a frente, sem o nome, e o cartão abre */
  apresenta(g){
    if (g !== this.geracao) return;
    const item = this.itens[this.passo];
    const cx = this.caixa();
    this.errouAqui = false;
    cx.querySelector('.quiz-marca').textContent =
      'Questão ' + (this.passo + 1) + ' de ' + this.itens.length;
    const msg = cx.querySelector('.quiz-msg');
    msg.textContent = ''; msg.className = 'quiz-msg';
    const ops = cx.querySelector('.quiz-ops');
    ops.innerHTML = '';
    embaralha(item.op.slice()).forEach(nome => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'quiz-op';
      b.textContent = nome;
      b.addEventListener('click', () => this.responde(b, nome, item, g));
      ops.appendChild(b);
    });
    cx.classList.add('card-on');

    const cubo = TP.cubo(item.z);
    this.cubo = cubo;
    const curva = '.9s cubic-bezier(.3,.8,.25,1)';
    cubo.classList.add('pergunta', 'sem-nome');
    cubo.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    cubo.style.left = QUIZ_LUGAR.x + 'px';
    cubo.style.top  = QUIZ_LUGAR.y + 'px';
    cubo.style.setProperty('--onda', QUIZ_LUGAR.escala);
    TP.gira(cubo, { eixo:'y', graus:720, dur:900 });
    this.travado = false;
  },

  async responde(b, nome, item, g){
    if (!this.aberto || this.travado || g !== this.geracao) return;
    this.travado = true;
    const cx = this.caixa(), msg = cx.querySelector('.quiz-msg');
    const certa = item.op[0], acertou = nome === certa;
    const ultima = this.passo === this.itens.length - 1;

    /* O ERRO NÃO PASSA À FRENTE: a opção errada fica marcada e apagada, o
       erro conta, e a pergunta continua até o aluno acertar. A certa não
       se mostra — é ele quem a encontra. */
    if (!acertou){
      b.classList.add('errada');
      b.disabled = true;
      this.erros++;
      this.errouAqui = true;
      msg.textContent = 'Tudo bem. Tente de novo';
      msg.className = 'quiz-msg erro';
      tremeVermelho([cx.querySelector('.quiz-card'), this.cubo]);
      await tocaEfeito('error');
      if (g !== this.geracao) return;
      this.travado = false;
      return;
    }

    /* acertou: a certa acende — no botão e no cubo, que ganha o nome de
       volta — e as outras saem */
    cx.querySelectorAll('.quiz-op').forEach(o => {
      if (o.textContent === certa) o.classList.add('certa');
      else if (o !== b) o.classList.add('fora');
      o.disabled = true;
    });
    this.cubo.classList.remove('sem-nome');

    /* só conta como acerto o que veio na primeira tentativa */
    if (!this.errouAqui) this.acertos++;
    const voz = vozDoAcerto(ultima);
    escreveResposta(msg, item, certa, voz.frase);
    msg.className = 'quiz-msg ok';
    confete();
    /* todo acerto tem a festa inteira: fanfarra e aplausos juntos, e,
       quando a fanfarra acaba, a voz daquela pergunta — uma diferente
       em cada uma, para nada se repetir */
    const fanfarra = tocaEfeito('funfare');
    tocaEfeito('applause');                /* os aplausos continuam por baixo */
    await fanfarra;
    if (g !== this.geracao) return;
    await tocaEfeito(voz.som);
    if (g !== this.geracao) return;

    await this.devolve();
    if (g !== this.geracao) return;
    this.passo++;
    if (this.passo >= this.itens.length){ this.resultado(g); return; }
    /* o som da entrada e o exemplo novo, juntos: o som não é esperado,
       toca por cima do cubo a rolar para a frente */
    tocaEfeito(somDaEntrada(this.passo, this.itens.length));
    this.apresenta(g);
  },

  /* O CUBO VOLTA PARA CASA, rápido e a girar. É a vinda ao contrário:
     a vinda sai depressa e chega devagar, a volta sai devagar e chega
     depressa, e o giro desenrola-se até ficar de pé. */
  devolve(){
    const c = this.cubo, cx = this.caixa();
    cx.classList.remove('card-on');
    const casa = alvoDe(+c.dataset.z);
    const curva = '.6s cubic-bezier(.55,0,.75,.2)';
    c.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    c.style.left = casa.x.toFixed(1) + 'px';
    c.style.top  = casa.y.toFixed(1) + 'px';
    c.style.setProperty('--onda', '1');
    TP.gira(c, { eixo:'y', graus:-720, dur:600 });
    return espera(650).then(() => {
      c.classList.remove('pergunta', 'sem-nome');
      c.style.removeProperty('transition');
      c.style.removeProperty('--onda');
    });
  },

  /* O FIM: o cartão da nota — de 1 a 10, pela fração de acertos, e nunca
     abaixo de 1 —, com uma mensagem boa, o som "statistics", e o play de
     volta, já carregado com a narração seguinte */
  resultado(g){
    if (g !== this.geracao) return;
    const total = this.itens.length, a = this.acertos;
    const nota = Math.max(1, Math.round(a / total * 10));
    const cx = this.caixa();
    cx.querySelector('.nota-num').textContent = nota;
    cx.querySelector('.nota-nome').textContent = NOME.le();
    /* a nota é dos acertos de primeira; os erros contam-se à parte */
    const e = this.erros;
    cx.querySelector('.nota-acertos').textContent = 'Você acertou ' + a + ' de ' + total + ' de primeira' +
      (e ? ' · ' + e + (e === 1 ? ' erro' : ' erros') : '') + '.';
    cx.querySelector('.nota-msg').textContent = mensagemDaNota(nota);
    cx.classList.remove('card-on');
    cx.classList.add('nota-on');
    this.mostrandoNota = true;
    this.nota = nota;
    tocaEfeito('statistics');
    /* o play fica fora de cena: quem segue é o Continuar do cartão, que
       toca a narração seguinte, ou o Refazer, que abre outro quiz igual */
    cx.classList.toggle('sem-seguir', !DEPOIS_DO_QUIZ[this.origem]);
  },
  /* OS DOIS BOTÕES DO CARTÃO. Refazer: outro quiz igual, com outro
     sorteio. Continuar: o cartão sai, e toca a narração seguinte. */
  refaz(){
    if (!this.mostrandoNota) return;
    const o = this.origem;
    this.saiDaNota();
    this.abre(o);
  },
  continua(){
    if (!this.mostrandoNota) return;
    const p = DEPOIS_DO_QUIZ[this.origem];
    this.saiDaNota();
    stage.classList.remove('em-quiz');
    if (p) tocaTrilha(p);
  },
  /* começada a narração seguinte, o cartão da nota sai de cena */
  saiDaNota(){
    this.mostrandoNota = false;
    this.aberto = false;
    this.caixa().classList.remove('on', 'nota-on');
  },

  /* saindo do slide: tudo pára e fica arrumado (o cubo volta à casa pelo
     TP.reinicia, que corre logo a seguir) */
  fecha(){
    this.geracao++;
    EFEITOS.forEach(a => a.pause());
    EFEITOS.clear();
    const cx = slides[1] && slides[1].querySelector('.quiz');
    if (cx) cx.classList.remove('on', 'card-on', 'nota-on');
    stage.classList.remove('em-quiz');
    this.aberto = false; this.travado = false; this.cubo = null; this.mostrandoNota = false;
  }
};

/* a mensagem do cartão da nota: sempre boa, e cada vez mais festiva */
function mensagemDaNota(n){
  if (n === 10) return 'Nota máxima! Você já lê a tabela como quem lê um mapa.';
  if (n >= 8)   return 'Muito bem! Você está pegando o jeito dos símbolos.';
  if (n >= 5)   return 'Bom trabalho! Mais um pouco de prática e a tabela fica toda sua.';
  return 'Você está começando — e é assim que se aprende. Vamos em frente!';
}
som.addEventListener('play', () => { if (QUIZ.mostrandoNota) QUIZ.saiDaNota(); });

/* ============================================================
   O JOGO DA MEMÓRIA — o do slide 2 do app do professor (lá, o "quiz 2")
   Vinte cartas viradas para baixo, dez pares: de um lado o SÍMBOLO
   com o número atômico e a massa, do outro o NOME com o grupo e o
   período. Achar o par é reconhecer que "Fe" e "Ferro" são a mesma
   casa da tabela.
   As regras são as de lá: dez pontos por par, vinte se for prata ou
   ouro, mais cinco se o par seguinte for do mesmo grupo do anterior, e
   menos dois por engano. Os sons também: flipcard ao virar, right no
   par, error com a tela a tremer no engano, e no fim os confetes, o
   cartão do resultado e o statistics.
   Abre pelo botão do canto, que vira o do jogo quando a narração
   "1_jogo_memória" acaba. O estado é var, e não let: o slide pode
   fechá-lo (SEQ.reinicia, go) antes de o script chegar aqui.
   ============================================================ */
/* Cada par tem a SUA cor, e é por ela que os dois se reconhecem depois de
   virados: os dez matizes espalham-se pela roda inteira, e onde deu, a
   cor é a do elemento — o ouro é dourado, o cobre é cor de cobre. */
const MEM_PARES = [
  { z:1,  sym:'H',  nome:'Hidrogênio', g:1,  p:1, massa:'1,008',  cat:'Ametal',              emoji:'💧', h:208, s:60 },
  { z:8,  sym:'O',  nome:'Oxigênio',   g:16, p:2, massa:'15,999', cat:'Ametal',              emoji:'🔥', h:330, s:52 },
  { z:6,  sym:'C',  nome:'Carbono',    g:14, p:2, massa:'12,011', cat:'Ametal',              emoji:'💎', h:272, s:45 },
  { z:7,  sym:'N',  nome:'Nitrogênio', g:15, p:2, massa:'14,007', cat:'Ametal',              emoji:'🌿', h:138, s:45 },
  { z:11, sym:'Na', nome:'Sódio',      g:1,  p:3, massa:'22,990', cat:'Metal alcalino',      emoji:'🧂', h: 92, s:45 },
  { z:26, sym:'Fe', nome:'Ferro',      g:8,  p:4, massa:'55,845', cat:'Metal de transição',  emoji:'⚙️', h:  8, s:42 },
  { z:29, sym:'Cu', nome:'Cobre',      g:11, p:4, massa:'63,546', cat:'Metal de transição',  emoji:'⚡', h: 34, s:70 },
  { z:47, sym:'Ag', nome:'Prata',      g:11, p:5, massa:'107,87', cat:'Metal de transição',  emoji:'🌟', h:224, s:14 },
  { z:79, sym:'Au', nome:'Ouro',       g:11, p:6, massa:'196,97', cat:'Metal de transição',  emoji:'👑', h: 56, s:78 },
  { z:30, sym:'Zn', nome:'Zinco',      g:12, p:4, massa:'65,38',  cat:'Metal de transição',  emoji:'🛡️', h:166, s:52 }
];
var memAberto = null, memCartas = [], memViradas = [], memGeracao = 0;
var memPontos = 0, memPares = 0, memErros = 0, memUltimoG = null, memConferindo = false;

function cartaDaMemoria(d, tipo){
  const corpo = tipo === 'sym'
    ? '<div class="chapeu">Símbolo</div>' +
      '<div class="simbolo">' + d.sym + '</div>' +
      '<div class="miudo z">Z = ' + d.z + '</div>'
    /* a carta do nome leva só o nome (e o desenho): o tipo e o lugar na
       tabela saíram, e o nome cresce no espaço que eles deixaram */
    : '<div class="chapeu">Nome do elemento</div>' +
      '<div class="emoji">' + d.emoji + '</div>' +
      '<div class="nome">' + d.nome + '</div>';
  return '<div class="mem-carta" data-z="' + d.z + '" data-tipo="' + tipo + '" data-g="' + d.g + '"' +
              ' style="--ph:' + d.h + ';--ps:' + d.s + '%">' +
           '<div class="giro">' +
             '<div class="mem-face costas">⚛</div>' +
             '<div class="mem-face frente">' + corpo + '</div>' +
           '</div>' +
         '</div>';
}
function baralhaMemoria(){
  const baralho = [];
  MEM_PARES.forEach(d => { baralho.push({d, tipo:'sym'}); baralho.push({d, tipo:'nome'}); });
  return embaralha(baralho);
}

/* 'ordem': as cartas na ordem de uma partida guardada (ONDE), como
   "11:sym"; sem ela, um baralho novo */
function abreMemoria(ordem){
  if (memAberto || atual !== 1) return;
  const baralho = Array.isArray(ordem)
    ? ordem.map(s => { const [z, tipo] = s.split(':'); return { d: MEM_PARES.find(d => d.z === +z), tipo }; }).filter(c => c.d)
    : baralhaMemoria();
  const sl = slides[1];
  if (!sl) return;
  fechaNav();
  memPontos = 0; memPares = 0; memErros = 0; memUltimoG = null; memConferindo = false;
  memViradas = [];
  memGeracao++;
  const ov = document.createElement('div');
  ov.className = 'memoria';
  ov.innerHTML =
    '<h2 class="mem-titulo">Jogo da memória dos elementos</h2>' +
    '<div class="mem-topo"><span><b class="pt">0</b><i>pontos</i></span>' +
    '<span><b class="pr">0</b><i>de 10 pares</i></span></div>' +
    '<div class="mem-grade">' + baralho.map(c => cartaDaMemoria(c.d, c.tipo)).join('') + '</div>' +
    '<div class="mem-dica">Ache o símbolo e o nome do mesmo elemento</div>';
  sl.appendChild(ov);
  memAberto = ov;
  memCartas = [...ov.querySelectorAll('.mem-carta')];
  memCartas.forEach((el, i) => el.addEventListener('click', () => viraMemoria(i)));
  /* o play sai de cena enquanto o jogo dura, como no quiz */
  stage.classList.add('em-jogo');
  ov.getBoundingClientRect();
  ov.classList.add('on');
}

/* A ENTRADA DO JOGO, pelo botão do jogo: a tela escurece, e as vinte
   cartas entram todas ao mesmo tempo, cada uma de um ponto de fora da
   tela — os pontos repartidos por igual à volta dela —, e pousam no lugar
   delas na grade. Pousadas, brilham, e toca a fala das regras. */
const ENTRADA_JOGO = { voo:900, brilho:700, raio:1050 };
function entraNoJogo(){
  JOGO_ENTROU = true;         /* a espera da tabela acaba aqui */
  VIDA.desliga();
  abreMemoria();
  if (!memAberto) return;
  const ov = memAberto, g = memGeracao, n = memCartas.length;
  const rs = stage.getBoundingClientRect();
  /* a volta à tela dividida em n, e cada carta com o seu ângulo, sorteado
     (senão as vizinhas na grade viriam de pontos vizinhos) */
  const angulos = embaralha(memCartas.map((_, i) => i * 2*Math.PI / n));
  ov.classList.add('entrando');
  memCartas.forEach((c, i) => {
    const r = c.getBoundingClientRect();
    const cx = (r.left + r.width/2  - rs.left) / fitScale;
    const cy = (r.top  + r.height/2 - rs.top ) / fitScale;
    const a = angulos[i];
    c.style.setProperty('--ex', (640 + Math.cos(a)*ENTRADA_JOGO.raio - cx).toFixed(0) + 'px');
    c.style.setProperty('--ey', (360 + Math.sin(a)*ENTRADA_JOGO.raio - cy).toFixed(0) + 'px');
    c.style.setProperty('--eg', ((Math.random() < .5 ? -1 : 1) * (180 + Math.random()*180)).toFixed(0) + 'deg');
  });
  ov.getBoundingClientRect();
  /* no quadro seguinte, todas partem juntas */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (g !== memGeracao) return;
    ov.classList.add('voando');
    ov.classList.remove('entrando');
  }));
  setTimeout(() => {
    if (g !== memGeracao) return;
    ov.classList.remove('voando');
    ov.classList.add('pousou');
    tocaEfeito('flip');
    falaDoJogo();
    setTimeout(() => { if (g === memGeracao) ov.classList.remove('pousou'); }, ENTRADA_JOGO.brilho + 400);
  }, ENTRADA_JOGO.voo + 60);
}
/* A FALA DA ABERTURA DO JOGO (audio_tabela_1_jogo_memória1): toca quando o
   botão do jogo é apertado, com as cartas já na mesa; o Refazer não a
   repete. Fechado o jogo, cala-se. */
var FALA_JOGO = null;
function falaDoJogo(){
  calaFalaDoJogo();
  const a = new Audio(encodeURI('Audios/audio_tabela_1_jogo_memória1.mp3'));
  Velocidade.aplicar(a);
  EFEITOS.add(a);
  FALA_JOGO = a;
  const fim = () => { EFEITOS.delete(a); if (FALA_JOGO === a) FALA_JOGO = null; };
  a.addEventListener('ended', fim);
  a.addEventListener('error', fim);
  a.play().catch(fim);
}
function calaFalaDoJogo(){
  if (!FALA_JOGO) return;
  FALA_JOGO.pause();
  EFEITOS.delete(FALA_JOGO);
  FALA_JOGO = null;
}

/* ja: sem esmaecer (o slide está a ser deixado ou recomeçado) */
function fechaMemoria(ja){
  if (!memAberto) return;
  const ov = memAberto;
  memAberto = null; memCartas = []; memViradas = []; memConferindo = false;
  memGeracao++;
  calaFalaDoFim();
  calaFalaDoJogo();
  stage.classList.remove('em-jogo');
  ov.classList.remove('on');
  if (ja) ov.remove();
  else setTimeout(() => ov.remove(), 450);
}
function placarMemoria(){
  if (!memAberto) return;
  memAberto.querySelector('.pt').textContent = memPontos;
  memAberto.querySelector('.pr').textContent = memPares;
}
function viraMemoria(i){
  if (memConferindo || !memAberto) return;
  const el = memCartas[i];
  if (!el || el.classList.contains('casada') || el.classList.contains('virada')) return;
  if (memViradas.length >= 2) return;
  el.classList.add('virada');
  tocaEfeito('flipcard');
  memViradas.push(i);
  if (memViradas.length === 2) conferePar();
}
function conferePar(){
  memConferindo = true;
  const g = memGeracao;
  const [ia, ib] = memViradas;
  const a = memCartas[ia], b = memCartas[ib];
  const igual = a.dataset.z === b.dataset.z && a.dataset.tipo !== b.dataset.tipo;
  if (igual){
    /* prata e ouro valem o dobro, e dois pares seguidos do mesmo grupo
       dão um bônus: são as regras do jogo de onde ele veio */
    const z = +a.dataset.z, gr = a.dataset.g;
    let pts = (z === 47 || z === 79) ? 20 : 10;
    if (memUltimoG !== null && memUltimoG === gr) pts += 5;
    memUltimoG = gr;
    memPontos += pts; memPares++;
    placarMemoria();
    tocaEfeito('right');
    setTimeout(() => {
      if (g !== memGeracao) return;
      a.classList.remove('virada'); a.classList.add('casada');
      b.classList.remove('virada'); b.classList.add('casada');
      memViradas = []; memConferindo = false;
      if (memPares === MEM_PARES.length) setTimeout(() => { if (g === memGeracao) fimDaMemoria(); }, 700);
    }, 420);
  } else {
    memErros++; memPontos = Math.max(0, memPontos - 2); memUltimoG = null;
    placarMemoria();
    tocaEfeito('error');
    /* treme a grade das cartas, e não o palco com a tabela por baixo */
    tremeVermelho([document.querySelector('.memoria .mem-grade')]);
    a.classList.add('errada'); b.classList.add('errada');
    setTimeout(() => {
      if (g !== memGeracao) return;
      a.classList.remove('virada', 'errada');
      b.classList.remove('virada', 'errada');
      memViradas = []; memConferindo = false;
    }, 1200);
  }
}
/* o fim: a nota é a dos pontos sobre o melhor possível — dez pares,
   com prata e ouro a dobrar */
function fimDaMemoria(){
  if (!memAberto) return;
  const teto = 10 * 10 + 20;
  /* os bônus de grupo podem passar do teto: a nota pára nos 10 */
  const nota = Math.min(10, Math.max(0, Math.round(memPontos / teto * 100) / 10));
  confete();
  memAberto.querySelector('.mem-dica').textContent = 'Todos os pares encontrados';
  poeCartaoDaMemoria(nota);
}
function poeCartaoDaMemoria(nota){
  cartaoDoResultado(nota,
    '<em class="acerto">' + memPares + '</em> pares · ' +
    '<em class="erro">' + memErros + '</em> enganos · ' + memPontos + ' pontos',
    memAberto,
    () => { fechaMemoria(); setTimeout(abreMemoria, 520); },
    () => go(2),                        /* Continuar: o slide 3 */
    'Audios/audio_tabela_1_jogo_memória_fim.mp3');
}
/* O CARTÃO DO RESULTADO, o do professor: a pontuação de 0 a 10 num anel
   que se enche, a conta, um recado (bom a partir de 5), e Refazer e
   Continuar (no jogo da memória, Continuar leva ao slide 3). Depois do
   som do placar toca a fala do fim ('fala'); um botão tocado com ela a
   meio corta-a, e a aula segue para o que foi escolhido. */
var FALA_FIM = null;
function calaFalaDoFim(){
  if (!FALA_FIM) return;
  FALA_FIM.pause();
  EFEITOS.delete(FALA_FIM);
  FALA_FIM = null;
}
const RECADOS_BONS   = ['Você está aprendendo bem!', 'Ótimo resultado!', 'Muito bem! Continue assim!'];
const RECADOS_FRACOS = ['Continue praticando!', 'Quase lá, não desista!', 'Pratique mais um pouco!'];
const PULSOS_DA_FALA = {
  'Audios/audio_tabela_3.7B.mp3': [ { t:3.5, botao:'.refaz' }, { t:6.5, botao:'.segue' } ]
};
function cartaoDoResultado(nota, contaHTML, onde, refazer, seguir, fala){
  if (!onde) return;
  const bom = nota >= 5;
  const recado = (bom ? RECADOS_BONS : RECADOS_FRACOS)[Math.floor(Math.random() * 3)];
  const volta = 2 * Math.PI * 38;
  const c = document.createElement('div');
  c.className = 'quiz-cartao';
  c.innerHTML =
    '<div class="trofeu">🏆</div>' +
    '<div class="chapeu">Seu resultado</div>' +
    /* o nome do aluno, o que ele deu no Iniciar da capa (sem ele, nada) */
    (NOME.le() ? '<div class="aluno">' + esc(NOME.le()) + '</div>' : '') +
    '<div class="anel">' +
      '<svg viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="38" fill="none" stroke="rgba(76,63,191,.16)" stroke-width="9"/>' +
        '<circle cx="50" cy="50" r="38" fill="none" stroke-width="9" stroke-linecap="round" ' +
          'stroke="' + (bom ? 'var(--natural)' : 'var(--ouro-luz)') + '" ' +
          'stroke-dasharray="' + volta.toFixed(1) + '" ' +
          'stroke-dashoffset="' + volta.toFixed(1) + '" ' +
          'style="transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1) .35s"/>' +
      '</svg>' +
      '<div class="miolo"><span>Pontuação</span><b>' + nota.toFixed(1).replace('.', ',') + '</b></div>' +
    '</div>' +
    '<div class="conta">' + contaHTML + '</div>' +
    '<div class="recado">' + recado + '</div>' +
    '<div class="botoes"><button type="button" class="refaz">Refazer</button>' +
      '<button type="button" class="forte segue">Continuar →</button></div>';
  onde.appendChild(c);
  c.getBoundingClientRect();
  c.classList.add('on');
  /* o som do placar, e depois dele a fala do fim, se o cartão ainda
     estiver à espera de uma escolha */
  const g = memGeracao;
  tocaEfeito('statistics').then(() => {
    if (!fala || g !== memGeracao || !c.isConnected || !c.classList.contains('on')) return;
    calaFalaDoFim();
    const a = new Audio(encodeURI(fala));
    FALA_FIM = a;
    EFEITOS.add(a);
    Velocidade.aplicar(a);
    a.addEventListener('ended', () => { EFEITOS.delete(a); if (FALA_FIM === a) FALA_FIM = null; });
    /* os botões que a fala aponta pulsam duas vezes, no relógio dela
       (PULSOS_DA_FALA: na 3.7B, o Refazer aos 3,5 s e o Continuar aos 6,5 s) */
    const pulsos = (PULSOS_DA_FALA[fala] || []).map(p => Object.assign({ feito:false }, p));
    if (pulsos.length) a.addEventListener('timeupdate', () => {
      pulsos.forEach(p => {
        if (p.feito || a.currentTime < p.t) return;
        p.feito = true;
        const b = c.querySelector(p.botao);
        if (!b) return;
        b.classList.remove('pulsa2'); void b.offsetWidth; b.classList.add('pulsa2');
      });
    });
    a.play().catch(() => {});
  });
  /* o anel só se enche depois de o cartão entrar */
  setTimeout(() => {
    const arco = c.querySelectorAll('circle')[1];
    if (arco) arco.setAttribute('stroke-dashoffset', (volta * (1 - nota/10)).toFixed(1));
  }, 120);
  c.querySelector('.segue').addEventListener('click', () => {
    calaFalaDoFim();
    c.classList.remove('on');
    setTimeout(() => c.remove(), 400);
    seguir();
  });
  c.querySelector('.refaz').addEventListener('click', () => {
    calaFalaDoFim();
    c.classList.remove('on');
    setTimeout(() => c.remove(), 400);
    refazer();
  });
}

/* OS CONFETES — dois canhões, um em cada canto de baixo, a atirar para o
   meio. Não é coreografia da narração (acontece com ela parada), e por
   isso pode andar ao ritmo dos quadros. */
function confete(){
  /* no slide em que se está (o 1 e o 3 têm a folha deles) */
  const cv = (slides[atual] && slides[atual].querySelector('.confete')) || slides[1].querySelector('.confete');
  if (!cv) return;
  const g = cv.getContext('2d');
  const cores = ['#E2A22B','#4C3FBF','#2E9450','#C13757','#2E7BAE','#8B3FBE','#D2591F','#3EE08A'];
  const pedacos = [];
  [[160, 1], [1120, -1]].forEach(([x0, lado]) => {
    for (let i = 0; i < 110; i++) pedacos.push({
      x: x0, y: 720,
      vx: lado*(3 + Math.random()*11), vy: -(13 + Math.random()*15),
      gr: .32 + Math.random()*.14, r: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      w: 7 + Math.random()*8, h: 4 + Math.random()*5,
      cor: cores[(Math.random()*cores.length)|0]
    });
  });
  const inicio = performance.now();
  let antes = inicio;
  (function quadro(agora){
    const dt = Math.min(2.5, (agora - antes)/16.7);
    antes = agora;
    g.clearRect(0, 0, 1280, 720);
    let vivos = 0;
    pedacos.forEach(p => {
      p.vy += p.gr*dt; p.vx *= Math.pow(.985, dt);
      p.x += p.vx*dt;  p.y += p.vy*dt;  p.r += p.vr*dt;
      if (p.y > 760) return;
      vivos++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.cor; g.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      g.restore();
    });
    if (vivos && agora - inicio < 7000) requestAnimationFrame(quadro);
    else g.clearRect(0, 0, 1280, 720);
  })(inicio);
}

/* ============================================================
   O FOCO E A MÃOZINHA — o que a narração aponta
   ============================================================ */
const mao = document.getElementById('mao');
let maoT = [], emDemo = false;

/* Acende uma peça, ou um punhado delas: ela cresce e ganha o halo.
   Acender apaga o que estava aceso — nunca há dois ao mesmo tempo, e é
   a troca que o olho segue.

   E NÃO HÁ AQUI DURAÇÃO NENHUMA, de propósito: um destaque que se
   apagasse sozinho ao fim de tantos milésimos usaria o relógio de
   parede, e continuaria a contar com a narração em pausa. Quem diz
   quando ele sai é outra marca do roteiro, no tempo do áudio. */
function foca(sel){
  const lista = (Array.isArray(sel) ? sel : [sel]).reduce((a,s) =>
    a.concat(typeof s === 'string' ? [...document.querySelectorAll(s)] : [s]), []);
  semFoco();
  lista.forEach(el => el && el.classList.add('realce'));
}
function semFoco(){
  document.querySelectorAll('.realce').forEach(el => el.classList.remove('realce'));
}

/* ---- a mãozinha ----
   A ponta do dedo do ícone fica a 22px da esquerda e 7px do alto: é
   por aí que ela é encostada no ponto que quer apontar. */
function limpaMao(){ maoT.forEach(clearTimeout); maoT = []; }
function levaMao(el, o){
  o = o || {};
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return;
  /* escondida, ela aparece já no sítio; à vista, desliza até ele */
  const novo = mao.hidden;
  if (novo) mao.style.transition = 'none';
  mao.hidden = false;
  mao.style.left = (r.left + r.width *(o.fx === undefined ? .5 : o.fx) - 22) + 'px';
  mao.style.top  = (r.top  + r.height*(o.fy === undefined ? .5 : o.fy) -  7) + 'px';
  if (novo){ void mao.offsetWidth; mao.style.transition = ''; }
  mao.classList.add('on');
}
function bateMao(){
  mao.classList.remove('clica');
  void mao.offsetWidth;
  mao.classList.add('clica');
}
function tiraMao(){
  mao.classList.remove('on');
  maoT.push(setTimeout(() => { mao.hidden = true; mao.classList.remove('clica'); }, 400));
}

/* ---- as demonstrações ----
   A mão faz mesmo o que mostra: abre o carrossel, entra no slide 1, abre
   e rola o sumário, e volta à capa — tudo com a narração da capa a
   correr por cima (DEMO.guia: a troca de slide não pára o som, não
   carrega a narração nem a abertura do slide 1). Só o play e o Iniciar
   são mímica — um clique de verdade ali pararia a narração no meio da
   frase que a está a explicar.

   CADA PASSO É UMA MARCA DO ROTEIRO, e não um setTimeout encadeado: o
   relógio desta cena é o do áudio, e mais nenhum. Parada a narração,
   a mão pára onde está; seguindo, ela segue de onde parou; e voltando
   o áudio atrás, a demonstração recomeça com ele. Uma corrente de
   temporizadores correria sozinha com o som em pausa, e a mão acabaria
   a apontar coisas que a voz ainda não disse. */
const DEMO = {
  guia:false,      /* é a demonstração que está a trocar de slide */
  /* troca de slide pela mão da demonstração: só a imagem, o som segue */
  conduz(fn){ this.guia = true; try { fn(); } finally { this.guia = false; } },

  /* 1 · a mão aparece, no meio da capa */
  aparece(){ limpaMao(); emDemo = true; levaMao(stage, {fx:.62, fy:.52}); },
  /* 2 · vai ao carrossel, no canto de cima, e abre-o */
  vaiAoCarrossel(){ levaMao(document.getElementById('ver-slides')); },
  abreCarrossel(){ bateMao(); this.conduz(() => CAR.abre()); },
  /* 3 · a seta da direita passa ao tópico 1 */
  vaiASeta(){ levaMao(CAR.el.querySelector('.car-seta.prox')); },
  passaAo1(){ bateMao(); CAR.vai(1); },
  /* 4 · o cartão do meio, tocado, abre o slide */
  vaiAoCartao(){ const it = CAR.itens[1]; if (it) levaMao(it.querySelector('.car-cartao'), {fy:.6}); },
  entraNo1(){ bateMao(); this.conduz(() => CAR.entra(1)); },
  /* 5 · a alça do sumário, na borda direita: abre, a mão rola a lista
     (no tempo: DEMO.rola) e vai ao X fechar */
  vaiAoSumario(){ if (navAlca) levaMao(navAlca); },
  abreSumario(){ bateMao(); abreNav(); if (navGaveta) navGaveta.querySelector('.nav-lista').scrollTop = 0; },
  vaiAoFecha(){ mao.style.transition = ''; if (navGaveta) levaMao(navGaveta.querySelector('.nav-fecha')); },
  fechaSumario(){ bateMao(); fechaNav(); },
  /* 6 · o play: a mão chega de baixo e da esquerda, e aperta — mímica:
     o ícone passa a play por um instante, e a narração segue */
  pertoDoPlay(){ limpaMao(); levaMao(somBtn, {fx:-.9, fy:-.5}); },
  apontaPlay(){ limpaMao(); levaMao(somBtn); },
  apertaPlay(){
    bateMao();
    icPlay.removeAttribute('hidden'); icPause.setAttribute('hidden', '');
  },
  soltaPlay(){ mostraPausa(!som.paused); },
  /* 7 · de volta à capa, pelo cubo, e o Iniciar já no canto */
  voltaACapa(){
    tiraMao();
    this.conduz(() => go(0));
  },
  acaba(){ tiraMao(); emDemo = false; },

  /* a mão a rolar o sumário: dois arrastos para cima, dos 40,2 aos 43,8 s.
     O dedo sobe e a lista sobe com ele. É função do tempo do áudio, como
     a escrita: pausada a narração, a mão pára onde está. */
  rola(t){
    const ARRASTOS = [[40.2, 41.7], [42.1, 43.8]];
    if (!navAberta() || t < ARRASTOS[0][0] || t >= ARRASTOS[1][1]) return;
    const lista = navGaveta.querySelector('.nav-lista');
    const r = lista.getBoundingClientRect(), max = lista.scrollHeight - lista.clientHeight;
    const n = t < ARRASTOS[1][0] ? 0 : 1, [a, b] = ARRASTOS[n];
    const k = entre(t, a, b);
    /* entre um arrasto e o outro, o dedo levanta e volta para baixo */
    const voltando = n === 0 && t >= b;
    lista.scrollTop = max * (n + k) / 2;
    mao.hidden = false; mao.classList.add('on');
    mao.style.transition = voltando ? 'opacity .3s ease, top .35s ease' : 'opacity .3s ease';
    mao.style.left = (r.left + r.width*.55 - 22) + 'px';
    mao.style.top  = (r.top + r.height*(voltando ? .78 : .78 - .5*k) - 7) + 'px';
  },

  /* a narração mudou de slide: a demonstração não fica a meio */
  corta(){
    if (this.guia) return;
    limpaMao();
    if (emDemo){
      mostraOverview(false); fechaNav(); emDemo = false;
      /* a demonstração levou a capa a outro slide: a narração dela não
         continua lá — o próximo carregaTrilha recomeça-a do zero */
      if (trilhaAtual === 'capa') trilhaAtual = -1;
    }
    mao.style.transition = '';
    tiraMao();
    semFoco();
  }
};

/* ------------------------------------------------------------
   NAVEGAÇÃO
   ------------------------------------------------------------ */
const progress = document.getElementById('progress');
let atual = 0, andando = false;

function go(i, dir){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if (i === atual || andando) return;
  dir = dir || (i > atual ? 'next' : 'prev');

  const sai   = slides[atual];
  const entra = slides[i];

  /* a narração é de cada slide: mudando de slide, ela para e a do
     novo fica pronta para começar — a não ser que seja a mão da
     demonstração a mudar, com a narração da capa a explicar */
  const demo = DEMO.guia;
  if (!demo){ som.pause(); mostraPausa(false); }
  VIDA.desliga();
  DEMO.corta();          /* e a cena da capa não fica a meio */
  /* saindo do slide 1, o quiz e o jogo fecham: aberto, qualquer um
     deles escondia o play da capa */
  if (i !== 1){ QUIZ.fecha(); fechaMemoria(true); }
  if (i !== 2) SEQ.deixa2();
  if (i !== 3){ EV3.entendi(false); if (QUIZ4.ativo) QUIZ4.fecha(); }

  andando = true;
  sai.classList.add('is-leaving', 'fx-cube-out-' + dir);
  entra.classList.add('is-active', 'fx-cube-in-' + dir);
  /* o som do cubo a virar, junto com o giro */
  if (!demo) tocaEfeito('transition_cube');

  atual = i;
  atualizaCabecalho();

  /* a tabela pousa ENQUANTO a face gira: os cubos caem nos lugares ao
     mesmo tempo que o slide entra, e o aluno chega ao slide com a mesa
     a acabar de ser posta, e não posta de antemão */
  /* e a mesa começa a respirar assim que os cubos assentam */
  /* chegando ao slide 1, a história dele recomeça do princípio */
  recomecaMesa(i);

  setTimeout(() => {
    sai.classList.remove('is-active','is-leaving','fx-cube-out-next','fx-cube-out-prev');
    entra.classList.remove('fx-cube-in-next','fx-cube-in-prev');
    andando = false;
    /* o slide que chega vai para o lugar que ficou arrumado à mão; e
       só agora, que a passagem acabou: medir uma peça a meio do voo
       congelava-a lá */
    arrumaPecasDoPalco();
    if (LAYOUTS[atual]) aplicaLayout(atual);
    else if (naMontagem()) soltaSlide(slides[atual]);
  }, 880);

  if (demo) return;
  carregaTrilha(TRILHA_DO_SLIDE[i]);
  tocaAbertura(i);
}

function atualizaCabecalho(){
  stage.classList.toggle('na-capa',   atual === 0);
  /* a capa nova é escura: no celular deitado o papel da tela inteira
     escurece com ela */
  stage.classList.toggle('capa-nova', CAPA_NOVA);
  document.documentElement.classList.toggle('capa-escura', CAPA_NOVA && atual === 0);
  stage.classList.toggle('sem-marca', temMesa(atual));
  navNoSlide();
  ajusteNoSlide();
  progress.style.width = ((atual)/(SLIDES.length-1)*100) + '%';
  progress.style.setProperty('--prog', atual/(SLIDES.length-1));
  slides.forEach(sl => {
    const r = sl.querySelector('.regua');
    if (!r) return;
    [...r.children].forEach((b,j) => {
      b.classList.toggle('aqui', j === atual);
      b.classList.toggle('feito', j < atual);
    });
  });
}


/* ------------------------------------------------------------
   VISÃO GERAL — as miniaturas são os próprios slides em escala
   Cada cartão leva dentro uma cópia viva do slide, feita na hora em
   que a visão geral abre: o que estiver montado lá dentro aparece
   aqui — a tabela, os cubos como estiverem virados, a carta que a
   narração deixou acesa.
   ------------------------------------------------------------ */
const overview = document.getElementById('overview');
const grid     = document.getElementById('grid');

function montaMiniaturas(){
  grid.innerHTML = '';
  SLIDES.forEach((sl,i) => {
    /* o cartão é um div, e não um botão: dentro dele vai uma cópia do
       slide, que já traz os botões da régua — botão dentro de botão é
       coisa que o navegador desmonta */
    const c = document.createElement('div');
    c.setAttribute('role', 'button');
    c.tabIndex = 0;
    c.className = 'card' + (i === atual ? ' aqui' : '');
    c.setAttribute('aria-label', 'Ir para o slide ' + (i+1));
    c.innerHTML = '<div class="mini"><div class="mini-palco"></div></div>' +
      '<div class="rot"><div class="n">'+String(i+1).padStart(2,'0')+'</div>' +
      '<div class="t">'+esc(sl.kind === 'capa' ? 'Capa' : sl.title)+'</div></div>';
    const palco = c.querySelector('.mini-palco');

    /* a tabelinha do canto é do palco, e não do slide: a capa sem ela
       não seria a capa, e por isso a cópia vai primeiro, por baixo */
    if (sl.kind === 'capa'){
      const marca = document.getElementById('tabela').cloneNode(true);
      marca.removeAttribute('id');
      marca.setAttribute('class', 'mini-marca');
      marca.querySelectorAll('.luz').forEach(l => l.remove());
      palco.appendChild(marca);
    }

    const copia = slides[i].cloneNode(true);
    copia.classList.remove('is-leaving','fx-cube-in-next','fx-cube-in-prev',
                           'fx-cube-out-next','fx-cube-out-prev');
    copia.classList.add('is-active');
    /* na miniatura nada é clicável: ela inteira é um alvo só */
    copia.querySelectorAll('button').forEach(b => { b.tabIndex = -1; b.disabled = true; });
    palco.appendChild(copia);

    const abre = () => { mostraOverview(false); go(i); };
    c.addEventListener('click', abre);
    c.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abre(); }
    });
    grid.appendChild(c);
  });
  /* Só depois de estarem no documento é que se sabe a largura do
     cartão — e é ela que diz de quanto o palco de 1280 tem de
     encolher. A medida é tirada aqui mesmo, e não no quadro seguinte:
     ler a largura obriga o navegador a assentar o desenho na hora, e
     as miniaturas nunca chegam a aparecer em tamanho natural. */
  grid.querySelectorAll('.card').forEach(c => {
    const larg = c.clientWidth;
    if (!larg) return;
    c.querySelector('.mini-palco').style.transform = 'scale(' + (larg/1280) + ')';
  });
}

function mostraOverview(v){
  if (v) fechaNav();
  const abre = v === undefined ? overview.hidden : !!v;
  overview.hidden = !abre;
  if (abre){
    /* a narração não corre por cima do índice — a não ser que seja ela
       própria a abri-lo, na demonstração dos controles */
    if (!emDemo){ som.pause(); mostraPausa(false); }
    montaMiniaturas();
  }
}
/* o clique no fundo fecha; o clique num cartão é dele */
overview.addEventListener('click', e => { if (e.target === overview) mostraOverview(false); });

/* ------------------------------------------------------------
   O CARROSSEL DOS SLIDES — o botão do canto de cima, à direita
   Tocado, o palco afasta-se: o slide em que a aula está encolhe até
   virar o cartão do meio de uma fila, com o título em cima, e os
   outros entram pelos lados. Arrasta-se a fila com o dedo, ou pelas
   setas. Escolhido um slide, o cartão dele cresce até cobrir o palco —
   e, no instante em que o cobre, o slide de verdade já está por baixo,
   igualzinho: o cartão sai e ninguém vê a troca.
   ------------------------------------------------------------ */
const CAR = {
  el: document.getElementById('carrossel'),
  aberto:false, ocupado:false, sel:0, itens:[],
  S0:.5, S1:.34, GAP:44, CY:392,   /* as escalas, o vão e o centro da fila */
  get trilho(){ return this.el.querySelector('.car-trilho'); },

  /* O CARTÃO DE CADA SLIDE É UMA FOTO (Imagens/slides, feitas pelo
     ferramentas/gera-miniaturas.mjs): o slide como o aluno o encontra ao
     chegar. Uma foto pesa nada ao lado de 118 cubos copiados. Só o slide
     em que a aula está — que pode estar no meio da narração, com a mesa
     noutro estado — e a capa, que é leve, vão como cópia viva. */
  foto(i){
    const cel = ehCelular();
    return 'Imagens/slides/' + (cel ? 'cel' : 'pc') + '-' + String(i).padStart(2, '0') + '.webp?v=' + VERSAO;
  },
  copia(i, cartao){
    if (i === 0 || i === atual) return this.copiaViva(i, cartao);
    cartao.classList.remove('capa');
    cartao.innerHTML = '<div class="car-palco"><img class="car-foto' + (ehCelular() ? ' cel' : '') +
                       '" alt="" decoding="async" draggable="false"></div>';
    const img = cartao.querySelector('img');
    img.onerror = () => this.copiaViva(i, cartao);   /* sem a foto, a cópia viva */
    img.src = this.foto(i);
  },
  /* a cópia de um slide como ele está agora, aplainada: cada cubo só
     com a face da frente (a mesa plana, que desenha igual) */
  copiaViva(i, cartao){
    cartao.innerHTML = '<div class="car-palco"></div>';
    cartao.classList.toggle('capa', i === 0 && CAPA_NOVA);
    const palco = cartao.firstChild;
    if (i === 0){
      const marca = document.getElementById('tabela').cloneNode(true);
      marca.removeAttribute('id');
      marca.classList.add('car-marca');
      marca.querySelectorAll('.luz').forEach(l => l.remove());
      /* fora da capa a tabelinha volta ao canto do CSS: a cópia vai para
         o lugar que o layout fixado lhe dá na capa */
      const p = LAYOUTS[0] && LAYOUTS[0].tabelinha;
      if (!marca.classList.contains('solto') && p && p.x !== undefined)
        marca.setAttribute('style', 'left:' + p.x + 'px;top:' + p.y + 'px;width:520px;' +
          'transform:translate(-50%,-50%) scale(' + p.esc + ')');
      palco.appendChild(marca);
    }
    const deckC = document.createElement('div');
    deckC.className = 'car-deck';
    const c = slides[i].cloneNode(true);
    c.classList.remove('is-leaving','fx-cube-in-next','fx-cube-in-prev','fx-cube-out-next','fx-cube-out-prev');
    c.classList.add('is-active');
    c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
    c.querySelectorAll('button').forEach(b => { b.tabIndex = -1; b.disabled = true; });
    c.querySelectorAll('.pousando').forEach(e => e.classList.remove('pousando'));
    /* A MESA DA CÓPIA É PLANA, EM 2D: cada cubo só com a face da frente,
       de frente (ver o CSS de .car-deck .mesa). Um cubo 3D é uma camada à
       parte na placa de vídeo, e 118 deles a encolher dentro do cartão —
       além dos 118 do slide de verdade — faziam o celular perder pedaços
       da tela. Plana, a cópia inteira é desenhada como uma figura só. Um
       cubo que estivesse virado aparece de frente: no cartão, ninguém vê. */
    c.querySelectorAll('.mesa').forEach(m => m.classList.add('plana'));
    c.querySelectorAll('.mesa .pc .face:not(.f1)').forEach(f => f.remove());
    deckC.appendChild(c);
    palco.appendChild(deckC);
  },

  monta(){
    this.trilho.innerHTML = '';
    this.itens = SLIDES.map((sl, i) => {
      const it = document.createElement('div');
      it.className = 'car-item';
      /* o número do slide ao lado do título, "01. A Tabela Periódica" (a
         numeração é a do próprio slide; a capa vai sem número) */
      it.innerHTML = '<div class="car-tit">' + (i === 0 ? '' : '<span class="car-n">' + String(i).padStart(2,'0') + '.</span>') +
        '<b></b></div><div class="car-cartao"></div>';
      it.querySelector('b').textContent = i === 0 ? 'Audiobook da Tabela Periódica' : sl.title;
      this.copia(i, it.querySelector('.car-cartao'));
      it.dataset.i = i;
      this.trilho.appendChild(it);
      return it;
    });
  },

  /* onde fica cada cartão: d é a distância ao escolhido; cheio é o
     palco inteiro (escala 1), e o resto da fila fora dele, aos lados */
  lugar(d, cheio){
    /* cheio, os vizinhos ficam além das faixas do celular deitado: lá o
       palco vai até às bordas, e a folga não pode mostrar outro slide */
    const meia = 640 + (parseFloat(stage.style.getPropertyValue('--folga')) || 0);   /* meia largura do cartão */
    const s = d === 0 ? this.S0 : this.S1, a = Math.abs(d);
    /* cheio, só o do meio é do tamanho do palco; os vizinhos esperam fora
       da tela já pequenos — do tamanho da tela, o celular preparava cada
       um em vários megapixels só para os mostrar encolhidos */
    if (cheio){
      if (!d) return { x: 0, y: 0, s: 1 };
      return { x: Math.sign(d) * (meia + this.GAP + this.S1*meia + (a-1)*(this.S1*2*meia + this.GAP)), y: this.CY - 360, s: this.S1 };
    }
    const x = d === 0 ? 0 : Math.sign(d) * (this.S0*meia + this.GAP + this.S1*meia + (a-1)*(this.S1*2*meia + this.GAP));
    return { x, y: this.CY - 360, s };
  },
  aplica(cheio, arrasto){
    this.itens.forEach((it, k) => {
      const d = k - this.sel, p = this.lugar(d, cheio);
      it.style.transform = 'translate(' + (p.x + (arrasto || 0)).toFixed(1) + 'px,' + p.y + 'px)';
      it.querySelector('.car-cartao').style.transform = 'scale(' + p.s + ')';
      /* o título anda só por transform: mexer no top ou na letra refazia
         o desenho da página a cada quadro */
      it.querySelector('.car-tit').style.transform =
        'translateY(' + (360 - 360*p.s - 18) + 'px) translateY(-100%) scale(' + (d === 0 ? 1 : .74) + ')';
      it.classList.toggle('centro', d === 0);
      /* os longe do meio nem são desenhados: na placa de vídeo do celular
         cada foto ocupa memória, e com todas lá ele perdia pedaços delas */
      const longe = Math.abs(d) > 2;
      it.style.opacity = !cheio && longe ? 0 : 1;
      it.style.visibility = longe ? 'hidden' : '';
    });
    this.el.querySelector('.car-seta.ant').disabled  = this.sel === 0;
    this.el.querySelector('.car-seta.prox').disabled = this.sel === SLIDES.length - 1;
    this.el.querySelector('.car-conta').textContent = this.sel === 0 ? 'Capa' : this.sel + ' / ' + (SLIDES.length - 1);
  },

  abre(){
    if (this.aberto || this.ocupado || andando || naMontagem()) return;
    mostraOverview(false); fechaNav();
    if (!DEMO.guia){ som.pause(); mostraPausa(false); }
    VIDA.desliga();
    this.aberto = true;
    this.sel = atual;
    this.monta();
    /* o primeiro quadro é o palco tal como estava: o cartão do slide em
       escala 1, por cima do original; só depois a fila se afasta */
    this.el.classList.add('sem-trans');
    this.aplica(true);
    this.el.hidden = false;
    stage.classList.add('em-carrossel');
    document.body.classList.add('em-carrossel');
    /* o cartão do meio, do tamanho do palco, cobre o slide de verdade já
       neste quadro: ele sai de cena logo, e não depois de a fila se
       afastar — a abertura é o momento mais pesado */
    stage.classList.add('car-cobre');
    void this.el.offsetWidth;
    this.el.classList.remove('sem-trans');
    this.el.classList.add('aberto');
    this.aplica(false);
  },
  vai(k){
    if (!this.aberto || this.ocupado) return;
    this.sel = Math.max(0, Math.min(SLIDES.length - 1, k));
    this.aplica(false);
  },
  /* entra no slide k: o cartão dele cresce até ser o palco */
  entra(k){
    if (!this.aberto || this.ocupado) return;
    this.ocupado = true;
    this.sel = k;
    if (k !== atual){
      const viva = k === 0;
      vaiDireto(k);
      /* a cópia viva é refeita do slide já posto como ele vai aparecer;
         a foto já é ele assim */
      if (viva) this.copiaViva(k, this.itens[k].querySelector('.car-cartao'));
    }
    this.el.classList.remove('aberto');
    this.aplica(true);
    /* o slide de verdade só volta quando o cartão já cobre o palco
       inteiro — enquanto ele cresce, o celular só desenha o cartão. Volta
       por baixo dele, e só depois de desenhado (dois quadros) o cartão
       sai, num esmaecer curto que apaga a diferença de nitidez da foto */
    const fecha = () => {
      this.el.classList.remove('troca');
      this.el.hidden = true;
      this.trilho.innerHTML = '';
      this.itens = [];
      stage.classList.remove('em-carrossel');
      document.body.classList.remove('em-carrossel');
      this.aberto = this.ocupado = false;
      if (temMesa(atual)) VIDA.liga();
    };
    setTimeout(() => {
      stage.classList.remove('car-cobre');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        this.el.classList.add('troca');
        setTimeout(fecha, 160);
      }));
    }, 600);
  },
  fecha(){ this.entra(atual); }
};

/* ir direto para um slide, sem o giro do cubo: é o carrossel que faz a
   passagem. O resto é o mesmo que o go() faz ao chegar. */
function vaiDireto(i){
  if (i === atual) return;
  /* a demonstração da capa entra num slide sem lhe tocar a narração */
  const demo = DEMO.guia;
  if (!demo){ som.pause(); mostraPausa(false); }
  VIDA.desliga();
  DEMO.corta();
  if (i !== 1){ QUIZ.fecha(); fechaMemoria(true); }
  if (i !== 2) SEQ.deixa2();
  if (i !== 3){ EV3.entendi(false); if (QUIZ4.ativo) QUIZ4.fecha(); }
  slides[atual].classList.remove('is-active','is-leaving');
  slides[i].classList.add('is-active');
  atual = i;
  atualizaCabecalho();
  recomecaMesa(i, true);
  arrumaPecasDoPalco();
  if (LAYOUTS[atual]) aplicaLayout(atual);
  if (demo) return;
  carregaTrilha(TRILHA_DO_SLIDE[i]);
  tocaAbertura(i);
}

/* as fotos chegam antes de serem pedidas: com a página sossegada, uma de
   cada vez, para não disputar a rede com a narração */
setTimeout(() => {
  const fila = SLIDES.map((_, i) => i).filter(i => i > 0);
  const proxima = () => {
    const i = fila.shift();
    if (i === undefined) return;
    const img = new Image();
    img.onload = img.onerror = proxima;
    img.src = CAR.foto(i);
  };
  proxima();
}, 6000);

document.getElementById('ver-slides').addEventListener('click', () => CAR.abre());
CAR.el.querySelector('.car-seta.ant').addEventListener('click', () => CAR.vai(CAR.sel - 1));
CAR.el.querySelector('.car-seta.prox').addEventListener('click', () => CAR.vai(CAR.sel + 1));
CAR.el.querySelector('.car-fecha').addEventListener('click', () => CAR.fecha());
/* o dedo: arrastar anda pela fila; tocar num cartão do lado traz ele
   para o meio; tocar no do meio entra nele */
(() => {
  /* o cartão tocado é guardado na descida do dedo: com o dedo capturado
     pelo carrossel, o pointerup chega com o próprio carrossel como alvo */
  let x0 = null, dx = 0, mexeu = false, tocado = null;
  CAR.el.addEventListener('pointerdown', ev => {
    if (!CAR.aberto || CAR.ocupado || ev.target.closest('button')) return;
    x0 = ev.clientX; dx = 0; mexeu = false;
    tocado = ev.target.closest('.car-item');
    try { CAR.el.setPointerCapture(ev.pointerId); } catch(_){}
  });
  CAR.el.addEventListener('pointermove', ev => {
    if (x0 === null) return;
    dx = (ev.clientX - x0) / fitScale;
    if (!mexeu && Math.abs(dx) > 10){ mexeu = true; CAR.el.classList.add('arrastando'); }
    if (mexeu) CAR.aplica(false, dx);
  });
  const solta = ev => {
    if (x0 === null) return;
    x0 = null;
    CAR.el.classList.remove('arrastando');
    if (mexeu){
      const passo = CAR.S1*1280 + CAR.GAP;
      let n = Math.round(-dx / passo);
      if (!n && Math.abs(dx) > 50) n = dx < 0 ? 1 : -1;
      CAR.vai(CAR.sel + n);
      return;
    }
    const it = tocado;
    tocado = null;
    if (ev.type !== 'pointerup' || !it) return;
    const k = +it.dataset.i;
    if (k === CAR.sel) CAR.entra(k); else CAR.vai(k);
  };
  CAR.el.addEventListener('pointerup', solta);
  CAR.el.addEventListener('pointercancel', solta);
})();

/* ============================================================
   MODO MONTAGEM (tecla G)
   Fora da aula, a capa vira mesa de trabalho: tudo o que está nela se
   pega com a mão. Um dedo arrasta; dois dedos, em pinça, mudam o
   tamanho; a roda do mouse faz o mesmo que a pinça.

   Ao entrar na montagem, cada peça é SOLTA: sai do fluxo do layout e
   passa a viver por x, y — o centro dela, em px do palco 1280x720 — e
   uma escala. O truque é medir todas ANTES de soltar qualquer uma: se
   a primeira saísse do fluxo, as de baixo subiriam e as medidas
   seguintes já sairiam erradas.

   O Ctrl+C copia essas posições e tamanhos. É esse texto que volta
   para mim: com ele eu fixo no arquivo, como valores, o que foi
   arrumado à mão aqui.
   ============================================================ */
/* os textos que aparecem por cima dos slides — os convites, as frases das
   telas escuras, os rótulos, os quadros de frases, o Entendi: também são
   peças (nomeDe dá-lhes o nome) */
const TEXTOS_SOLTOS = '.dica-escolha, .toque-continuar, .veu-frases, .rotulo-el,' +
                      ' .texto-colunas, .entendi3, .dica-final, .ficha, .coords-el, .conta-lc25';
const MOVEIS = '.capa .marca, .capa h1, .capa .risco, .capa .autor,' +
               ' .capa .email, .capa .foto, [data-mont], ' + TEXTOS_SOLTOS;
/* quem encolhe até o conteúdo antes de ser medido — o texto.
   O risco e a foto já têm a caixa que têm. */
const ENCOLHE = '.capa .marca, .capa h1, .capa .autor, .capa .email';
/* quem tem caixa própria leva também a altura; texto fica com altura livre */
const COM_ALTURA = '.capa .risco, .capa .foto, .capa .digitado';
/* quem tem letra que interessa medir */
const COM_LETRA = '.capa .marca, .capa h1, .capa .autor, .capa .email';

const MEDIDAS = new WeakMap();     /* elemento -> {cx, cy, w, h, esc} */
const coord = document.getElementById('coord');

/* As peças de um slide. A tabelinha do canto mora no palco, e não no
   slide — mas na capa ela é peça da capa como as outras, e é preciso
   poder movê-la e mudá-la de tamanho junto com o resto. */
function pecasDe(sl){
  const lista = [...sl.querySelectorAll(MOVEIS)];
  if (sl.classList.contains('capa')){
    lista.push(document.getElementById('tabela'));
    lista.push(document.getElementById('som'));
  }
  /* o botão da velocidade mora no palco e fica fora da capa: nos outros
     slides, em cena, é peça como as outras — e o play também */
  else {
    if (!velBtn.hidden) lista.push(velBtn);
    if (!somBtn.hidden) lista.push(somBtn);
    if (!somDica.hidden) lista.push(somDica);   /* o "Tocar a narração" */
  }
  /* e o botão do carrossel, no canto de cima, que está em todos */
  lista.push(document.getElementById('ver-slides'));
  return lista;
}

function soltaSlide(sl){
  const alvos = pecasDe(sl).filter(el => el && !el.classList.contains('solto'));
  if (!alvos.length || andando) return;
  const rs = sl.getBoundingClientRect();
  /* mede todas primeiro; só depois solta */
  alvos.forEach(el => {
    el.classList.add('medindo');
    if (el.matches(ENCOLHE)) el.classList.add('encolhe');
  });
  const medidas = alvos.map(el => {
    const r = el.getBoundingClientRect();
    /* a peça que já vinha com uma escala do CSS (a localização do slide 4,
       a 1,27; a frase das colunas, a 0,88) entra no editor com ela: a
       caixa sem escala e a escala à parte — senão, solta, ela perdia a
       escala e a letra encolhia */
    const tf = getComputedStyle(el).transform, mt = tf && tf !== 'none' ? new DOMMatrix(tf) : null;
    const s = mt ? Math.hypot(mt.a, mt.b) : 1, k = Math.abs(s - 1) > .01 ? s : 1;
    return { el,
      cx:(r.left + r.width/2  - rs.left)/fitScale,
      cy:(r.top  + r.height/2 - rs.top )/fitScale,
      w: r.width /fitScale/k,
      h: r.height/fitScale/k, esc:k };
  });
  alvos.forEach(el => el.classList.remove('medindo','encolhe'));
  /* peça sem caixa não se solta: congelá-la agora prendia-a em largura
     zero, num canto, e lá ficaria para sempre */
  medidas.filter(m => m.w > 0.5 && m.h > 0.5).forEach(m => {
    MEDIDAS.set(m.el, m);
    m.el.classList.add('solto');
    m.el.style.right = m.el.style.bottom = 'auto';
    aplicaEl(m.el);
  });
}
function aplicaEl(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  /* as partes da faixa do alto moram dentro dela, e é a faixa (e não o
     slide) que lhes serve de referência: o lugar, medido no slide,
     desconta onde a faixa está */
  const tira = el.parentElement && el.parentElement.classList.contains('tira') ? el.parentElement : null;
  /* e os números das linhas e das colunas moram na mesa, que pode estar
     deslocada e em escala (no celular, ou movida na montagem): o lugar e
     a largura, medidos no slide, passam para as contas da mesa */
  const mesa = el.parentElement && el.parentElement.classList.contains('mesa') ? el.parentElement : null;
  if (mesa){
    const rs = mesa.closest('.slide').getBoundingClientRect(), rm = mesa.getBoundingClientRect();
    const z = (rm.width / mesa.offsetWidth) || fitScale;      /* px da tela por px da mesa */
    el.style.left  = ((rs.left + m.cx*fitScale - rm.left) / z).toFixed(1) + 'px';
    el.style.top   = ((rs.top  + m.cy*fitScale - rm.top ) / z).toFixed(1) + 'px';
    el.style.width = (m.w * fitScale / z).toFixed(1) + 'px';
    el.style.setProperty('--esc', m.esc.toFixed(3));
    return;
  }
  const dx = tira ? tira.offsetLeft : 0, dy = tira ? tira.offsetTop : 0;
  el.style.left  = (m.cx - dx).toFixed(1) + 'px';
  el.style.top   = (m.cy - dy).toFixed(1) + 'px';
  el.style.width = m.w.toFixed(1)  + 'px';
  if (el.matches(COM_ALTURA)) el.style.height = m.h.toFixed(1) + 'px';
  el.style.setProperty('--esc', m.esc.toFixed(3));
}
/* ------------------------------------------------------------

   Estas são as posições que o professor deixou na montagem e me
   mandou pelo Ctrl+C. x,y são o centro da peça no palco de 1280x720;
   esc é a escala que ele pinçou. O que não estiver aqui fica onde o
   layout normal o põe.
   ------------------------------------------------------------ */
const LAYOUTS = {
  /* slide 1 · Capa — o título e o retrato à esquerda, a tabelinha e os
     três blocos gigantes à direita, e o nome e o endereço no rodapé,
     um em cada canto. */
  0: {

    risco:       {x: 316, y:291, esc:1.00},
    autor:       {x: 232, y:646, esc:1.00},
    email:       {x:1056, y:695, esc:1.00},
    foto:        {x: 175, y:470, esc:1.09},
    tabelinha:   {x: 990, y:468, esc:1.00},
    'bloco-Na':  {x: 847, y:163, esc:0.72},

    /* a caixa das frases digitadas, no vazio à direita do retrato */
    frases:      {x: 510, y:475, esc:1.00},
    /* o play, no canto de baixo à direita: na faixa de papel que sobra
       entre a última linha da tabelinha e o endereço */
    som:         {x:1216, y:645, esc:1.00}
  }
