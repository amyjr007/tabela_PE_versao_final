];
/* a narração que o play carrega depois de cada quiz (null: ainda não há) */
const DEPOIS_DO_QUIZ = { '1.3A':'1.4', '1.3B':'1.4', '1.4':null };

/* os efeitos sonoros tocam e avisam quando acabam — é assim que a cena
   espera cada um antes de dar o passo seguinte. Um arquivo que não
   carregue não prende a aula: conta como acabado. */
const EFEITOS = new Set();
function tocaEfeito(nome){
  return new Promise(pronto => {
    const a = new Audio(encodeURI('Audios/vfx/' + nome + '.mp3'));
    EFEITOS.add(a);
    let feito = false;
    const fim = () => { if (feito) return; feito = true; EFEITOS.delete(a); pronto(a); };
    a.addEventListener('ended', fim);
    a.addEventListener('error', fim);
    setTimeout(fim, 12000);            /* rede de segurança: nunca fica preso */
    a.play().catch(fim);
  });
}
const espera = ms => new Promise(ok => setTimeout(ok, ms));

/* a tela treme e pisca de vermelho */
function tremeVermelho(){
  stage.classList.remove('treme'); void stage.offsetWidth; stage.classList.add('treme');
  const f = document.getElementById('flash-erro');
  if (f){ f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
}

/* onde o cubo da pergunta fica: no meio da coluna esquerda do cartão */
const QUIZ_LUGAR = { x:380, y:372, escala:3.3 };
/* quantas perguntas o quiz faz */
const QUIZ_TOTAL = 6;
/* A VOZ DEPOIS DE CADA COMEMORAÇÃO — alterna "exato!" e "muitobem"; a
   última é "perfeito". A frase escrita no cartão acompanha a voz. */
const VOZES_DO_ACERTO = [
  { som:'exato!',   frase:'Exato!'     },   /* 1.ª */
  { som:'muitobem', frase:'Muito bem!' },   /* 2.ª */
  { som:'exato!',   frase:'Exato!'     },   /* 3.ª */
  { som:'muitobem', frase:'Muito bem!' },   /* 4.ª */
  { som:'exato!',   frase:'Exato!'     }    /* 5.ª */
];
const VOZ_DA_ULTIMA = { som:'perfeito', frase:'Perfeito!' };   /* 6.ª */

/* O SOM DA ENTRADA — toca ao mesmo tempo que o exemplo novo rola para a
   frente: "eesseaqui" e "próximo" alternados, e "sómaisesse" na entrada
   da última pergunta. Toca também depois de um erro: são sons neutros, e
   o ritmo da aula não muda por o aluno ter errado. */
function somDaEntrada(passo, total){
  if (passo === total - 1) return 'sómaisesse';
  return passo % 2 === 1 ? 'eesseaqui' : 'próximo';
}

const QUIZ = {
  aberto:false, passo:0, itens:[], cubo:null, travado:false,
  /* cada abertura tem o seu número: se o aluno sai do slide a meio, a
     sequência antiga reconhece que já não é a dela e pára */
  geracao:0,
  caixa(){ return slides[1].querySelector('.quiz'); },

  abre(trilha){
    const c = SEQ.eleito;
    this.origem = trilha;
    const lista = (trilha === '1.3A' ? QUIZ_UMA : trilha === '1.3B' ? QUIZ_DUAS : QUIZ_DIFERENTES)
      .filter(p => !c || p.z !== +c.dataset.z);
    this.itens = embaralha(lista.slice()).slice(0, QUIZ_TOTAL);
    this.passo = 0;
    this.acertos = 0;
    this.aberto = true;
    this.mostrandoNota = false;
    this.caixa().classList.remove('nota-on');
    /* o play sai de cena: daqui em diante quem faz a aula andar é a escolha */
    stage.classList.add('em-quiz');
    const g = ++this.geracao;
    this.caixa().classList.add('on');
    this.apresenta(g);
  },

  /* um exemplo: o cubo vem para a frente, sem o nome, e o cartão abre */
  apresenta(g){
    if (g !== this.geracao) return;
    const item = this.itens[this.passo];
    const cx = this.caixa();
    cx.querySelector('.quiz-marca').textContent =
      'Pergunta ' + (this.passo + 1) + ' de ' + this.itens.length;
    const msg = cx.querySelector('.quiz-msg');
    msg.textContent = ''; msg.className = 'quiz-msg';
    const ops = cx.querySelector('.quiz-ops');
    ops.innerHTML = '';
    embaralha(item.op.slice()).forEach(nome => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'quiz-op';
      b.textContent = nome;
      b.addEventListener('click', () => this.responde(b, nome, item, g));
      ops.appendChild(b);
    });
    cx.classList.add('card-on');

    const cubo = TP.cubo(item.z);
    this.cubo = cubo;
    const curva = '.9s cubic-bezier(.3,.8,.25,1)';
    cubo.classList.add('pergunta', 'sem-nome');
    cubo.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    cubo.style.left = QUIZ_LUGAR.x + 'px';
    cubo.style.top  = QUIZ_LUGAR.y + 'px';
    cubo.style.setProperty('--onda', QUIZ_LUGAR.escala);
    TP.gira(cubo, { eixo:'y', graus:720, dur:900 });
    this.travado = false;
  },

  async responde(b, nome, item, g){
    if (!this.aberto || this.travado || g !== this.geracao) return;
    this.travado = true;
    const cx = this.caixa(), msg = cx.querySelector('.quiz-msg');
    const certa = item.op[0], acertou = nome === certa;
    const ultima = this.passo === this.itens.length - 1;

    /* a resposta certa aparece sempre — no botão e no cubo, que ganha o
       nome de volta —, tenha o aluno acertado ou não */
    cx.querySelectorAll('.quiz-op').forEach(o => {
      if (o.textContent === certa) o.classList.add('certa');
      else if (o !== b) o.classList.add('fora');
      o.disabled = true;
    });
    this.cubo.classList.remove('sem-nome');

    if (acertou){
      this.acertos++;
      const voz = ultima ? VOZ_DA_ULTIMA : VOZES_DO_ACERTO[this.passo];
      msg.textContent = voz.frase + ' É o ' + certa + '.';
      msg.className = 'quiz-msg ok';
      confete();
      /* todo acerto tem a festa inteira: fanfarra e aplausos juntos, e,
         quando a fanfarra acaba, a voz daquela pergunta — uma diferente
         em cada uma, para nada se repetir */
      const fanfarra = tocaEfeito('funfare');
      tocaEfeito('applause');                /* os aplausos continuam por baixo */
      await fanfarra;
      if (g !== this.geracao) return;
      await tocaEfeito(voz.som);
    } else {
      b.classList.add('errada');
      msg.textContent = 'Era o ' + certa + '.';
      msg.className = 'quiz-msg erro';
      tremeVermelho();
      await tocaEfeito('error');
      if (g !== this.geracao) return;
      await tocaEfeito('Calmanaproximaacerta');
    }
    if (g !== this.geracao) return;

    await this.devolve();
    if (g !== this.geracao) return;
    this.passo++;
    if (this.passo >= this.itens.length){ this.resultado(g); return; }
    /* o som da entrada e o exemplo novo, juntos: o som não é esperado,
       toca por cima do cubo a rolar para a frente */
    tocaEfeito(somDaEntrada(this.passo, this.itens.length));
    this.apresenta(g);
  },

  /* O CUBO VOLTA PARA CASA, rápido e a girar. É a vinda ao contrário:
     a vinda sai depressa e chega devagar, a volta sai devagar e chega
     depressa, e o giro desenrola-se até ficar de pé. */
  devolve(){
    const c = this.cubo, cx = this.caixa();
    cx.classList.remove('card-on');
    const casa = alvoDe(+c.dataset.z);
    const curva = '.6s cubic-bezier(.55,0,.75,.2)';
    c.style.transition = 'left ' + curva + ', top ' + curva + ', transform ' + curva;
    c.style.left = casa.x.toFixed(1) + 'px';
    c.style.top  = casa.y.toFixed(1) + 'px';
    c.style.setProperty('--onda', '1');
    TP.gira(c, { eixo:'y', graus:-720, dur:600 });
    return espera(650).then(() => {
      c.classList.remove('pergunta', 'sem-nome');
      c.style.removeProperty('transition');
      c.style.removeProperty('--onda');
    });
  },

  /* O FIM: o cartão da nota — de 1 a 10, pela fração de acertos, e nunca
     abaixo de 1 —, com uma mensagem boa, o som "statistics", e o play de
     volta, já carregado com a narração seguinte */
  resultado(g){
    if (g !== this.geracao) return;
    const total = this.itens.length, a = this.acertos;
    const nota = Math.max(1, Math.round(a / total * 10));
    const cx = this.caixa();
    cx.querySelector('.nota-num').textContent = nota;
    cx.querySelector('.nota-acertos').textContent = 'Você acertou ' + a + ' de ' + total + ' perguntas.';
    cx.querySelector('.nota-msg').textContent = mensagemDaNota(nota);
    cx.classList.remove('card-on');
    cx.classList.add('nota-on');
    this.mostrandoNota = true;
    this.nota = nota;
    tocaEfeito('statistics');
    /* o play volta só se houver narração a seguir; depois do quiz da
       "1.4" ainda não há, e o cartão fica sem a seta */
    const proxima = DEPOIS_DO_QUIZ[this.origem];
    cx.classList.toggle('sem-seta', !proxima);
    if (proxima){ stage.classList.remove('em-quiz'); carregaTrilha(proxima); }
  },
  /* começada a narração seguinte, o cartão da nota sai de cena */
  saiDaNota(){
    this.mostrandoNota = false;
    this.aberto = false;
    this.caixa().classList.remove('on', 'nota-on');
  },

  /* saindo do slide: tudo pára e fica arrumado (o cubo volta à casa pelo
     TP.reinicia, que corre logo a seguir) */
  fecha(){
    this.geracao++;
    EFEITOS.forEach(a => a.pause());
    EFEITOS.clear();
    const cx = slides[1] && slides[1].querySelector('.quiz');
    if (cx) cx.classList.remove('on', 'card-on', 'nota-on');
    stage.classList.remove('em-quiz');
    this.aberto = false; this.travado = false; this.cubo = null; this.mostrandoNota = false;
  }
};

/* a mensagem do cartão da nota: sempre boa, e cada vez mais festiva */
function mensagemDaNota(n){
  if (n === 10) return 'Nota máxima! Você já lê a tabela como quem lê um mapa.';
  if (n >= 8)   return 'Muito bem! Você está pegando o jeito dos símbolos.';
  if (n >= 5)   return 'Bom trabalho! Mais um pouco de prática e a tabela fica toda sua.';
  return 'Você está começando — e é assim que se aprende. Vamos em frente!';
}
som.addEventListener('play', () => { if (QUIZ.mostrandoNota) QUIZ.saiDaNota(); });

/* OS CONFETES — dois canhões, um em cada canto de baixo, a atirar para o
   meio. Não é coreografia da narração (acontece com ela parada), e por
   isso pode andar ao ritmo dos quadros. */
function confete(){
  const cv = slides[1].querySelector('.confete');
  if (!cv) return;
  const g = cv.getContext('2d');
  const cores = ['#E2A22B','#4C3FBF','#2E9450','#C13757','#2E7BAE','#8B3FBE','#D2591F','#3EE08A'];
  const pedacos = [];
  [[160, 1], [1120, -1]].forEach(([x0, lado]) => {
    for (let i = 0; i < 110; i++) pedacos.push({
      x: x0, y: 720,
      vx: lado*(3 + Math.random()*11), vy: -(13 + Math.random()*15),
      gr: .32 + Math.random()*.14, r: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      w: 7 + Math.random()*8, h: 4 + Math.random()*5,
      cor: cores[(Math.random()*cores.length)|0]
    });
  });
  const inicio = performance.now();
  let antes = inicio;
  (function quadro(agora){
    const dt = Math.min(2.5, (agora - antes)/16.7);
    antes = agora;
    g.clearRect(0, 0, 1280, 720);
    let vivos = 0;
    pedacos.forEach(p => {
      p.vy += p.gr*dt; p.vx *= Math.pow(.985, dt);
      p.x += p.vx*dt;  p.y += p.vy*dt;  p.r += p.vr*dt;
      if (p.y > 760) return;
      vivos++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.cor; g.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      g.restore();
    });
    if (vivos && agora - inicio < 7000) requestAnimationFrame(quadro);
    else g.clearRect(0, 0, 1280, 720);
  })(inicio);
}

/* ============================================================
   O FOCO E A MÃOZINHA — o que a narração aponta
   ============================================================ */
const mao = document.getElementById('mao');
let maoT = [], emDemo = false;

/* Acende uma peça, ou um punhado delas: ela cresce e ganha o halo.
   Acender apaga o que estava aceso — nunca há dois ao mesmo tempo, e é
   a troca que o olho segue.

   E NÃO HÁ AQUI DURAÇÃO NENHUMA, de propósito: um destaque que se
   apagasse sozinho ao fim de tantos milésimos usaria o relógio de
   parede, e continuaria a contar com a narração em pausa. Quem diz
   quando ele sai é outra marca do roteiro, no tempo do áudio. */
function foca(sel){
  const lista = (Array.isArray(sel) ? sel : [sel]).reduce((a,s) =>
    a.concat(typeof s === 'string' ? [...document.querySelectorAll(s)] : [s]), []);
  semFoco();
  lista.forEach(el => el && el.classList.add('realce'));
}
function semFoco(){
  document.querySelectorAll('.realce').forEach(el => el.classList.remove('realce'));
}

/* ---- a mãozinha ----
   A ponta do dedo do ícone fica a 22px da esquerda e 7px do alto: é
   por aí que ela é encostada no ponto que quer apontar. */
function limpaMao(){ maoT.forEach(clearTimeout); maoT = []; }
function levaMao(el, o){
  o = o || {};
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return;
  /* escondida, ela aparece já no sítio; à vista, desliza até ele */
  const novo = mao.hidden;
  if (novo) mao.style.transition = 'none';
  mao.hidden = false;
  mao.style.left = (r.left + r.width *(o.fx === undefined ? .5 : o.fx) - 22) + 'px';
  mao.style.top  = (r.top  + r.height*(o.fy === undefined ? .5 : o.fy) -  7) + 'px';
  if (novo){ void mao.offsetWidth; mao.style.transition = ''; }
  mao.classList.add('on');
}
function bateMao(){
  mao.classList.remove('clica');
  void mao.offsetWidth;
  mao.classList.add('clica');
}
function tiraMao(){
  mao.classList.remove('on');
  maoT.push(setTimeout(() => { mao.hidden = true; mao.classList.remove('clica'); }, 400));
}

/* ---- as demonstrações ----
   A mão faz mesmo o que mostra: abre a barra e abre a visão geral. Só
   o play é mímica — um clique de verdade ali pararia a narração no meio
   da frase que a está a explicar.

   CADA PASSO É UMA MARCA DO ROTEIRO, e não um setTimeout encadeado: o
   relógio desta cena é o do áudio, e mais nenhum. Parada a narração,
   a mão pára onde está; seguindo, ela segue de onde parou; e voltando
   o áudio atrás, a demonstração recomeça com ele. Uma corrente de
   temporizadores correria sozinha com o som em pausa, e a mão acabaria
   a apontar coisas que a voz ainda não disse. */
const DEMO = {
  /* 1 · a mão vai à alça dos controles */
  vaiAAlca(){ limpaMao(); emDemo = true; mostraBarra(false); levaMao(puxador); },
  /* 2 · e abre a barra */
  abreBarra(){ bateMao(); mostraBarra(true); },
  /* 3 · vai ao botão da visão geral */
  vaiAoOver(){ levaMao(document.getElementById('over')); },
  /* 4 · e abre-a */
  abreOver(){ bateMao(); mostraOverview(true); },
  /* 5 · aberta a visão geral, a barra fica por baixo dela — a mão sai
     de cima de um botão que já não se vê e vai mostrar o que apareceu */
  mostraSlides(){ levaMao(document.querySelector('#grid .card'), {fy:.62}); },
  /* 6 · fecha */
  fechaOver(){ mostraOverview(false); },
  /* 7 · e arruma a casa */
  arruma(){ mostraBarra(false); tiraMao(); emDemo = false; },

  apontaPlay(){ limpaMao(); levaMao(somBtn); },
  /* a narração mudou de slide: a demonstração não fica a meio */
  corta(){
    limpaMao();
    if (emDemo){ mostraOverview(false); mostraBarra(false); emDemo = false; }
    tiraMao();
    semFoco();
  }
};

/* ------------------------------------------------------------
   NAVEGAÇÃO
   ------------------------------------------------------------ */
const progress = document.getElementById('progress');
const counter  = document.getElementById('counter');
let atual = 0, andando = false;

function go(i, dir){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if (i === atual || andando) return;
  dir = dir || (i > atual ? 'next' : 'prev');

  const sai   = slides[atual];
  const entra = slides[i];

  /* a narração é de cada slide: mudando de slide, ela para e a do
     novo fica pronta para começar */
  som.pause();
  mostraPausa(false);
  VIDA.desliga();
  DEMO.corta();          /* e a cena da capa não fica a meio */

  andando = true;
  sai.classList.add('is-leaving', 'fx-cube-out-' + dir);
  entra.classList.add('is-active', 'fx-cube-in-' + dir);

  atual = i;
  atualizaCabecalho();

  /* a tabela pousa ENQUANTO a face gira: os cubos caem nos lugares ao
     mesmo tempo que o slide entra, e o aluno chega ao slide com a mesa
     a acabar de ser posta, e não posta de antemão */
  /* e a mesa começa a respirar assim que os cubos assentam */
  /* chegando ao slide 1, a história dele recomeça do princípio */
  if (i === 1){ SEQ.reinicia(); pousaTabela(); setTimeout(() => VIDA.liga(), 1500); }

  setTimeout(() => {
    sai.classList.remove('is-active','is-leaving','fx-cube-out-next','fx-cube-out-prev');
    entra.classList.remove('fx-cube-in-next','fx-cube-in-prev');
    andando = false;
    /* o slide que chega vai para o lugar que ficou arrumado à mão; e
       só agora, que a passagem acabou: medir uma peça a meio do voo
       congelava-a lá */
    arrumaPecasDoPalco();
    if (LAYOUTS[atual]) aplicaLayout(atual);
    else if (naMontagem()) soltaSlide(slides[atual]);
  }, 880);

  carregaTrilha(TRILHA_DO_SLIDE[i]);
}

function atualizaCabecalho(){
  stage.classList.toggle('na-capa',   atual === 0);
  stage.classList.toggle('sem-marca', atual === 1);
  progress.style.width = ((atual)/(SLIDES.length-1)*100) + '%';
  counter.innerHTML = '<b>'+(atual+1)+'</b> / '+SLIDES.length;
  slides.forEach(sl => {
    const r = sl.querySelector('.regua');
    if (!r) return;
    [...r.children].forEach((b,j) => {
      b.classList.toggle('aqui', j === atual);
      b.classList.toggle('feito', j < atual);
    });
  });
}

document.getElementById('prev').addEventListener('click', () => go(atual-1));
document.getElementById('next').addEventListener('click', () => go(atual+1));

/* ------------------------------------------------------------
   VISÃO GERAL — as miniaturas são os próprios slides em escala
   Cada cartão leva dentro uma cópia viva do slide, feita na hora em
   que a visão geral abre: o que estiver montado lá dentro aparece
   aqui — a tabela, os cubos como estiverem virados, a carta que a
   narração deixou acesa.
   ------------------------------------------------------------ */
const overview = document.getElementById('overview');
const grid     = document.getElementById('grid');
const overBtn  = document.getElementById('over');

function montaMiniaturas(){
  grid.innerHTML = '';
  SLIDES.forEach((sl,i) => {
    /* o cartão é um div, e não um botão: dentro dele vai uma cópia do
       slide, que já traz os botões da régua — botão dentro de botão é
       coisa que o navegador desmonta */
    const c = document.createElement('div');
    c.setAttribute('role', 'button');
    c.tabIndex = 0;
    c.className = 'card' + (i === atual ? ' aqui' : '');
    c.setAttribute('aria-label', 'Ir para o slide ' + (i+1));
    c.innerHTML = '<div class="mini"><div class="mini-palco"></div></div>' +
      '<div class="rot"><div class="n">'+String(i+1).padStart(2,'0')+'</div>' +
      '<div class="t">'+esc(sl.kind === 'capa' ? 'Capa' : sl.title)+'</div></div>';
    const palco = c.querySelector('.mini-palco');

    /* a tabelinha do canto é do palco, e não do slide: a capa sem ela
       não seria a capa, e por isso a cópia vai primeiro, por baixo */
    if (sl.kind === 'capa'){
      const marca = document.getElementById('tabela').cloneNode(true);
      marca.removeAttribute('id');
      marca.setAttribute('class', 'mini-marca');
      marca.querySelectorAll('.luz').forEach(l => l.remove());
      palco.appendChild(marca);
    }

    const copia = slides[i].cloneNode(true);
    copia.classList.remove('is-leaving','fx-cube-in-next','fx-cube-in-prev',
                           'fx-cube-out-next','fx-cube-out-prev');
    copia.classList.add('is-active');
    /* na miniatura nada é clicável: ela inteira é um alvo só */
    copia.querySelectorAll('button').forEach(b => { b.tabIndex = -1; b.disabled = true; });
    palco.appendChild(copia);

    const abre = () => { mostraOverview(false); go(i); };
    c.addEventListener('click', abre);
    c.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abre(); }
    });
    grid.appendChild(c);
  });
  /* Só depois de estarem no documento é que se sabe a largura do
     cartão — e é ela que diz de quanto o palco de 1280 tem de
     encolher. A medida é tirada aqui mesmo, e não no quadro seguinte:
     ler a largura obriga o navegador a assentar o desenho na hora, e
     as miniaturas nunca chegam a aparecer em tamanho natural. */
  grid.querySelectorAll('.card').forEach(c => {
    const larg = c.clientWidth;
    if (!larg) return;
    c.querySelector('.mini-palco').style.transform = 'scale(' + (larg/1280) + ')';
  });
}

function mostraOverview(v){
  const abre = v === undefined ? overview.hidden : !!v;
  overview.hidden = !abre;
  overBtn.classList.toggle('on', abre);
  if (abre){
    /* a narração não corre por cima do índice — a não ser que seja ela
       própria a abri-lo, na demonstração dos controles */
    if (!emDemo){ som.pause(); mostraPausa(false); }
    montaMiniaturas();
  }
}
overBtn.addEventListener('click', () => mostraOverview());
/* o clique no fundo fecha; o clique num cartão é dele */
overview.addEventListener('click', e => { if (e.target === overview) mostraOverview(false); });

/* ============================================================
   MODO MONTAGEM (tecla G)
   Fora da aula, a capa vira mesa de trabalho: tudo o que está nela se
   pega com a mão. Um dedo arrasta; dois dedos, em pinça, mudam o
   tamanho; a roda do mouse faz o mesmo que a pinça.

   Ao entrar na montagem, cada peça é SOLTA: sai do fluxo do layout e
   passa a viver por x, y — o centro dela, em px do palco 1280x720 — e
   uma escala. O truque é medir todas ANTES de soltar qualquer uma: se
   a primeira saísse do fluxo, as de baixo subiriam e as medidas
   seguintes já sairiam erradas.

   O Ctrl+C copia essas posições e tamanhos. É esse texto que volta
   para mim: com ele eu fixo no arquivo, como valores, o que foi
   arrumado à mão aqui.
   ============================================================ */
const MOVEIS = '.capa .marca, .capa h1, .capa .risco, .capa .autor,' +
               ' .capa .email, .capa .foto, [data-mont]';
/* quem encolhe até o conteúdo antes de ser medido — o texto.
   O risco e a foto já têm a caixa que têm. */
const ENCOLHE = '.capa .marca, .capa h1, .capa .autor, .capa .email';
/* quem tem caixa própria leva também a altura; texto fica com altura livre */
const COM_ALTURA = '.capa .risco, .capa .foto, .capa .digitado';
/* quem tem letra que interessa medir */
const COM_LETRA = '.capa .marca, .capa h1, .capa .autor, .capa .email';

const MEDIDAS = new WeakMap();     /* elemento -> {cx, cy, w, h, esc} */
const coord = document.getElementById('coord');

/* As peças de um slide. A tabelinha do canto mora no palco, e não no
   slide — mas na capa ela é peça da capa como as outras, e é preciso
   poder movê-la e mudá-la de tamanho junto com o resto. */
function pecasDe(sl){
  const lista = [...sl.querySelectorAll(MOVEIS)];
  if (sl.classList.contains('capa')){
    lista.push(document.getElementById('tabela'));
    lista.push(document.getElementById('som'));
  }
  return lista;
}

function soltaSlide(sl){
  const alvos = pecasDe(sl).filter(el => el && !el.classList.contains('solto'));
  if (!alvos.length || andando) return;
  const rs = sl.getBoundingClientRect();
  /* mede todas primeiro; só depois solta */
  alvos.forEach(el => {
    el.classList.add('medindo');
    if (el.matches(ENCOLHE)) el.classList.add('encolhe');
  });
  const medidas = alvos.map(el => {
    const r = el.getBoundingClientRect();
    return { el,
      cx:(r.left + r.width/2  - rs.left)/fitScale,
      cy:(r.top  + r.height/2 - rs.top )/fitScale,
      w: r.width /fitScale,
      h: r.height/fitScale, esc:1 };
  });
  alvos.forEach(el => el.classList.remove('medindo','encolhe'));
  /* peça sem caixa não se solta: congelá-la agora prendia-a em largura
     zero, num canto, e lá ficaria para sempre */
  medidas.filter(m => m.w > 0.5 && m.h > 0.5).forEach(m => {
    MEDIDAS.set(m.el, m);
    m.el.classList.add('solto');
    m.el.style.right = m.el.style.bottom = 'auto';
    aplicaEl(m.el);
  });
}
function aplicaEl(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  el.style.left  = m.cx.toFixed(1) + 'px';
  el.style.top   = m.cy.toFixed(1) + 'px';
  el.style.width = m.w.toFixed(1)  + 'px';
  if (el.matches(COM_ALTURA)) el.style.height = m.h.toFixed(1) + 'px';
  el.style.setProperty('--esc', m.esc.toFixed(3));
}
/* ------------------------------------------------------------
   O QUE FOI ARRUMADO À MÃO, FIXADO NO ARQUIVO
   Estas são as posições que o professor deixou na montagem e me
   mandou pelo Ctrl+C. x,y são o centro da peça no palco de 1280x720;
   esc é a escala que ele pinçou. O que não estiver aqui fica onde o
   layout normal o põe.
   ------------------------------------------------------------ */
const LAYOUTS = {
  /* slide 1 · Capa — o título e o retrato à esquerda, a tabelinha e os
     três blocos gigantes à direita, e o nome e o endereço no rodapé,
     um em cada canto. */
  0: {
    marca:       {x: 305, y: 73, esc:1.00},
    titulo:      {x: 321, y:197, esc:1.00},
    risco:       {x: 316, y:291, esc:1.00},
    autor:       {x: 232, y:646, esc:1.00},
    email:       {x:1056, y:695, esc:1.00},
    foto:        {x: 175, y:470, esc:1.09},
    tabelinha:   {x: 990, y:468, esc:1.00},
    'bloco-Na':  {x: 847, y:163, esc:0.72},
    'bloco-Y':   {x:1008, y:295, esc:0.72},
    'bloco-La':  {x:1115, y:172, esc:0.74},
    /* a caixa das frases digitadas, no vazio à direita do retrato */
    frases:      {x: 510, y:475, esc:1.00},
    /* o play, no canto de baixo à direita: na faixa de papel que sobra
       entre a última linha da tabelinha e o endereço */
    som:         {x:1216, y:645, esc:1.00}
  }
};

function aplicaLayout(i){
  const mapa = LAYOUTS[i];
  if (!mapa) return;
  const sl = slides[i];
  soltaSlide(sl);                    /* mede cada peça onde o layout a pôs */
  const pecas = pecasDe(sl).filter(Boolean);
  /* pôr no lugar não é uma viagem: as peças aparecem já lá. Sem isto, a
     escala que o layout lhes dá seria animada pela transição do
     destaque, e a capa abria com o retrato a crescer do nada. */
  pecas.forEach(el => { el.style.transition = 'none'; });
  pecas.forEach(el => {
    const p = mapa[nomeDe(el)], m = MEDIDAS.get(el);
    if (!p || !m) return;
    m.esc = p.esc;
    m.cy  = p.y;
    m.cx  = p.x !== undefined ? p.x : p.esq + (m.w*p.esc)/2;
    aplicaEl(el);
  });
  void sl.offsetWidth;
  pecas.forEach(el => { el.style.removeProperty('transition'); });
}

/* A TABELINHA E O BOTÃO MORAM NO PALCO, e não num slide: eles
   atravessam a apresentação inteira. Na capa quem manda neles é o
   layout fixado; fora dela têm de voltar ao lugar que o CSS lhes dá,
   senão ficariam para sempre onde a capa os deixou. */
function arrumaPecasDoPalco(){
  if (atual === 0) return;
  ['tabela','som'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}

/* tira as peças do slide da mão e devolve-as ao fluxo do CSS */
function desprende(sl){
  pecasDe(sl).forEach(el => {
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}
/* devolve o slide ao lugar de origem — o do arquivo, que é o que o
   layout fixado diz, e não o que o CSS sozinho faria */
function refazLayout(){
  const sl = slides[atual];
  desprende(sl);
  if (LAYOUTS[atual]) aplicaLayout(atual);
  else if (naMontagem()) soltaSlide(sl);
  TP.diz('Slide devolvido ao lugar de origem.');
}

/* ---- o gesto: um dedo move, dois dedos pinçam ----
   Os dois casos são a mesma conta. A cada toque novo guardo onde estão
   os dedos — o ponto médio deles e a distância entre eles — e o estado
   da peça. Enquanto os dedos andam, a peça segue o ponto médio e a
   escala segue a razão entre a distância de agora e a do começo. Com um
   dedo só a distância não existe, e sobra o arrasto puro. */
const gestos = new Map();

function centroDe(mapa){
  const pts = [...mapa.values()];
  const cx = pts.reduce((s,p) => s + p.x, 0)/pts.length;
  const cy = pts.reduce((s,p) => s + p.y, 0)/pts.length;
  const d  = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  return {cx, cy, d};
}
const estadoDedos = g => centroDe(g.ptr);
function reancora(el, g){
  const m = MEDIDAS.get(el);
  g.base = Object.assign(estadoDedos(g), {mcx:m.cx, mcy:m.cy, esc:m.esc});
}
const naMontagem = () => document.body.classList.contains('montagem');
function pecaDe(ev){
  const sl = slides[atual];
  const el = ev.target.closest(MOVEIS + ', #tabela');
  if (!el) return null;
  return (sl.contains(el) || el.id === 'tabela') ? el : null;
}
/* o rótulo que diz onde a peça está, enquanto ela anda */
function mostraCoord(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  coord.textContent = 'x: ' + Math.round(m.cx) + '   y: ' + Math.round(m.cy) +
                      '   esc: ' + m.esc.toFixed(2);
  coord.style.left = m.cx.toFixed(0) + 'px';
  coord.style.top  = (m.cy - m.h*m.esc/2).toFixed(0) + 'px';
  coord.classList.add('on');
}

stage.addEventListener('pointerdown', (ev) => {
  if (!naMontagem()) return;
  const el = pecaDe(ev);
  if (!el) return;
  soltaSlide(slides[atual]);
  let g = gestos.get(el);
  if (!g){ g = {ptr:new Map()}; gestos.set(el, g); }
  g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  try { el.setPointerCapture(ev.pointerId); } catch(_){}
  reancora(el, g);
  el.classList.add('pego');
  mostraCoord(el);
  ev.preventDefault();
  ev.stopPropagation();            /* na montagem, o gesto é da peça */
}, true);

document.addEventListener('pointermove', (ev) => {
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    const agora = estadoDedos(g), b = g.base, m = MEDIDAS.get(el);
    m.cx = b.mcx + (agora.cx - b.cx)/fitScale;
    m.cy = b.mcy + (agora.cy - b.cy)/fitScale;
    if (g.ptr.size > 1 && b.d > 12)
      m.esc = Math.max(.15, Math.min(8, b.esc * (agora.d / b.d)));
    aplicaEl(el);
    mostraCoord(el);
  });
}, true);

function largaDedo(ev){
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.delete(ev.pointerId);
    /* saiu um dedo dos dois: o que ficou recomeça a contar dali, senão
       a peça daria um salto no instante em que o outro se levanta */
    if (g.ptr.size) reancora(el, g);
    else { gestos.delete(el); el.classList.remove('pego'); }
  });
}
document.addEventListener('pointerup', largaDedo, true);
document.addEventListener('pointercancel', largaDedo, true);

/* a roda do mouse faz o que a pinça faz */
stage.addEventListener('wheel', (ev) => {
  if (!naMontagem()) return;
  const el = pecaDe(ev);
  if (!el) return;
  soltaSlide(slides[atual]);
  const m = MEDIDAS.get(el);
  if (!m) return;
  m.esc = Math.max(.15, Math.min(8, m.esc * (1 - ev.deltaY * 0.0015)));
  aplicaEl(el);
  mostraCoord(el);
  ev.preventDefault();
}, {passive:false});

/* o toque demorado no palco chama o menu do navegador, e aqui dentro
   não há o que copiar nem pesquisar: ele só atrapalha o arrasto */
stage.addEventListener('contextmenu', ev => { if (naMontagem()) ev.preventDefault(); });

const montBtn  = document.getElementById('mont-btn');
const copiaBtn = document.getElementById('copia-btn');
function modoMontagem(v){
  const abre = v === undefined ? !naMontagem() : !!v;
  document.body.classList.toggle('montagem', abre);
  montBtn.classList.toggle('on', abre);
  copiaBtn.hidden = !abre;
  if (abre){
    /* a tabela viva mexeria as peças por baixo da mão */
    VIDA.desliga();
    som.pause(); mostraPausa(false);
    soltaSlide(slides[atual]);
    mostraBarra(true);
    TP.diz(pecasDe(slides[atual]).length
      ? 'Montagem: arraste as peças · roda ou pinça muda o tamanho · Ctrl+C copia · R devolve'
      : 'Este slide não tem peças de montagem — a capa tem.', 4200);
  } else {
    coord.classList.remove('on');
    if (atual === 1) VIDA.liga();
  }
}
montBtn.addEventListener('click', () => modoMontagem());

/* ---- a folha das posições ---- */
const coordsCx  = document.getElementById('coords');
const coordsTxt = document.getElementById('coords-txt');
const coordsDe  = document.getElementById('coords-de');
const coordsMsg = document.getElementById('coords-msg');

function nomeDe(el){
  if (el.dataset.mont) return el.dataset.mont;   /* peça com nome próprio */
  if (el.id === 'tabela') return 'tabelinha';
  const c = el.classList;
  if (c.contains('marca')) return 'marca';
  if (c.contains('risco')) return 'risco';
  if (c.contains('autor')) return 'autor';
  if (c.contains('email')) return 'email';
  if (c.contains('foto'))  return 'foto';
  if (el.tagName === 'H1') return 'titulo';
  return el.tagName.toLowerCase();
}
/* mede tudo o que está no slide, em px do palco, com x,y no centro */
function medeSlide(i){
  const sl = slides[i], rs = sl.getBoundingClientRect();
  soltaSlide(sl);                  /* mede pelo mesmo critério da montagem */
  return pecasDe(sl).filter(el => el && el.classList.contains('solto')).map(el => {
    const r = el.getBoundingClientRect();   /* já vem com a escala aplicada */
    const m = MEDIDAS.get(el);
    const esc = m ? m.esc : 1;
    return {
      nome:  nomeDe(el),
      x:     Math.round((r.left + r.width/2  - rs.left)/fitScale),
      y:     Math.round((r.top  + r.height/2 - rs.top )/fitScale),
      larg:  Math.round(r.width /fitScale),
      alt:   Math.round(r.height/fitScale),
      /* a fonte medida não conhece a escala do transform: entra na conta */
      fonte: el.matches(COM_LETRA)
             ? Math.round(parseFloat(getComputedStyle(el).fontSize) * esc * 10)/10
             : null,
      esc:   Math.round(esc*100)/100
    };
  });
}
const pad = (v,n) => String(v).padStart(n, ' ');

function textoDoSlide(i){
  const sl = SLIDES[i];
  let out = '/* slide ' + (i+1) + ' · ' + (sl.kind === 'capa' ? 'Capa' : sl.title) + ' */\n';
  medeSlide(i).forEach(o => {
    out += '  { ' + ("el:'" + o.nome + "',").padEnd(16, ' ') +
           ' x:' + pad(o.x,4) + ', y:' + pad(o.y,3) +
           ', larg:' + pad(o.larg,4) + ', alt:' + pad(o.alt,3) +
           /* a peça sem letra deixa a coluna em branco, para a escala
              ficar debaixo da escala na linha de cima */
           (o.fonte === null ? ' '.repeat(13) : ', fonte:' + pad(o.fonte,5)) +
           ', esc:' + o.esc.toFixed(2) + ' },\n';
  });
  return out;
}
function copiaCoords(){
  const txt = textoDoSlide(atual);
  coordsTxt.value = txt;
  coordsDe.textContent = 'slide ' + (atual+1) + ' · ' +
    (SLIDES[atual].kind === 'capa' ? 'Capa' : SLIDES[atual].title);
  coordsCx.hidden = false;
  coordsTxt.focus();
  coordsTxt.select();
  coordsMsg.textContent = '';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)
      .then(() => { coordsMsg.textContent = 'copiado'; })
      .catch(() => { coordsMsg.textContent = 'selecionado — aperte Ctrl+C'; });
  } else coordsMsg.textContent = 'selecionado — aperte Ctrl+C';
}
copiaBtn.addEventListener('click', copiaCoords);
document.getElementById('coords-close').addEventListener('click', () => { coordsCx.hidden = true; });

/* ------------------------------------------------------------
   O ENDEREÇO: link e menu
   Clicado, abre o e-mail já endereçado. Com o botão direito — ou o
   dedo demorado, no tablet —, oferece copiá-lo. O menu é nosso, e não
   o do navegador: o do navegador muda de nome e de lugar em cada um, e
   no iPad nem aparece, porque o palco desliga o balão do toque longo.
   ------------------------------------------------------------ */
const EMAIL = 'amauri.junior@escola.seduc.pa.gov.br';
const menuEmail = document.getElementById('menu-email');

function abreMenuEmail(x, y){
  menuEmail.hidden = false;
  /* junto ao dedo, mas sempre inteiro dentro da janela */
  const r = menuEmail.getBoundingClientRect();
  menuEmail.style.left = Math.min(x, innerWidth  - r.width  - 8) + 'px';
  menuEmail.style.top  = Math.min(y, innerHeight - r.height - 8) + 'px';
  document.getElementById('copia-email').focus();
}
function fechaMenuEmail(){ menuEmail.hidden = true; }

function copiaTexto(txt){
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(txt);
  /* aberto do disco, ou sem https, a área de transferência moderna não
     existe: vai pelo caminho antigo, que funciona em todo o lado */
  return new Promise((ok, falha) => {
    const t = document.createElement('textarea');
    t.value = txt;
    t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy') ? ok() : falha(); }
    catch(e){ falha(e); }
    t.remove();
  });
}
document.getElementById('copia-email').addEventListener('click', () => {
  fechaMenuEmail();
  copiaTexto(EMAIL)
    .then(() => TP.diz('E-mail copiado: ' + EMAIL))
    .catch(() => TP.diz('Não deu para copiar — o endereço é ' + EMAIL, 4200));
});

stage.addEventListener('contextmenu', ev => {
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el || naMontagem()) return;
  ev.preventDefault();
  abreMenuEmail(ev.clientX, ev.clientY);
});
/* o dedo demorado: no iPad o contextmenu não chega a disparar */
let toqueEmail = null;
stage.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch' || naMontagem()) return;
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el) return;
  const x = ev.clientX, y = ev.clientY;
  toqueEmail = { x, y, t: setTimeout(() => {
    toqueEmail.abriu = true;
    abreMenuEmail(x, y);
  }, 550) };
});
stage.addEventListener('pointermove', ev => {
  if (toqueEmail && Math.hypot(ev.clientX - toqueEmail.x, ev.clientY - toqueEmail.y) > 10){
    clearTimeout(toqueEmail.t); toqueEmail = null;
  }
});
addEventListener('pointerup', () => { if (toqueEmail) clearTimeout(toqueEmail.t); });

stage.addEventListener('click', ev => {
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el) return;
  /* na montagem o endereço é peça a arrastar, e não link; e depois de
     um dedo demorado que abriu o menu, o toque não pode ainda abrir o
     e-mail por baixo dele */
  if (naMontagem() || (toqueEmail && toqueEmail.abriu)){ ev.preventDefault(); }
  toqueEmail = null;
});
/* fecha ao clicar fora, com o Esc, ou quando a janela muda */
addEventListener('pointerdown', ev => {
  if (!menuEmail.hidden && !menuEmail.contains(ev.target)) fechaMenuEmail();
}, true);
addEventListener('resize', fechaMenuEmail);

/* ---- a barra e a alça ---- */
const bar = document.getElementById('bar'), puxador = document.getElementById('puxador');
function mostraBarra(sim){
  bar.classList.toggle('hidden', !sim);
  puxador.classList.toggle('fora', sim);
  puxador.setAttribute('aria-expanded', sim ? 'true' : 'false');
}
puxador.addEventListener('click', () => mostraBarra(true));
document.getElementById('bar-close').addEventListener('click', () => mostraBarra(false));
document.getElementById('full').addEventListener('click', telaCheia);
function telaCheia(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}

/* ---- o teclado ----
   As setas andam entre a capa e a tabela; o espaço toca e pára a
   narração, que é o comando que esta tela tem. */
addEventListener('keydown', ev => {
  const k = ev.key;
  /* o menu do endereço aberto fecha com o Esc antes de tudo o resto */
  if (!menuEmail.hidden && k === 'Escape'){ fechaMenuEmail(); ev.preventDefault(); return; }
  /* ---- a montagem ---- */
  if ((ev.ctrlKey || ev.metaKey) && (k === 'c' || k === 'C')){
    /* com a folha aberta, o Ctrl+C é o do navegador: o texto já está
       selecionado ali dentro à espera dele */
    if (!coordsCx.hidden) return;
    if (naMontagem()){ copiaCoords(); ev.preventDefault(); }
    return;
  }
  if (k === 'Escape' && !coordsCx.hidden){ coordsCx.hidden = true; ev.preventDefault(); return; }
  if (k === 'g' || k === 'G'){ modoMontagem(); ev.preventDefault(); return; }
  if (naMontagem() && (k === 'r' || k === 'R')){ refazLayout(); ev.preventDefault(); return; }
  /* com a visão geral aberta, o teclado é só dela: as setas não podem
     trocar o slide por baixo de quem está a escolher um */
  if (!overview.hidden){
    if (k === 'Escape' || k === 'o' || k === 'O'){ mostraOverview(false); ev.preventDefault(); }
    return;
  }
  if (k === 'o' || k === 'O'){ mostraOverview(true); ev.preventDefault(); return; }
  if (k === 'ArrowRight' || k === 'PageDown'){ go(atual+1); ev.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ go(atual-1); ev.preventDefault(); }
  else if (k === ' '){ tocaOuPara(); ev.preventDefault(); }
  else if (k === 'Home'){ go(0); }
  else if (k === 'End'){ go(SLIDES.length-1); }
  else if (k === 'f' || k === 'F'){ telaCheia(); }
  else if (k === 'Escape'){ mostraBarra(false); }
  else if (k >= '1' && k <= '9'){ go(+k - 1); }
});

/* ------------------------------------------------------------
   A ABERTURA
   ------------------------------------------------------------ */
slides[0].classList.add('is-active');
montaTabela();
montaBlocosDaCapa();
montaFrases();
montaCenaDoSlide1();
atualizaCabecalho();
/* a capa vai para o lugar que ficou arrumado à mão */
aplicaLayout(0);
/* e vai outra vez quando as fontes chegarem: a medida de um texto é a
   medida da letra dele, e até a fonte de casa carregar quem está na
   tela é a do sistema, que tem outra largura */
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { desprende(slides[0]); aplicaLayout(0); });
animaCapa();
vidaDosBlocos();
carregaTrilha('capa');

/* o serviço que guarda a aula no aparelho */
/* o selo da versão, no canto */
document.getElementById('versao').textContent = VERSAO;
if ('serviceWorker' in navigator)
  addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(VERSAO)).catch(() => {}));
</script>
