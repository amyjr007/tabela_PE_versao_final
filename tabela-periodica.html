      '<div class="miudo">' + d.massa + ' g/mol</div>'
    : '<div class="chapeu">Nome do elemento</div>' +
      '<div class="emoji">' + d.emoji + '</div>' +
      '<div class="nome">' + d.nome + '</div>' +
      '<div class="miudo">' + d.cat + '</div>' +
      '<div class="miudo">Grupo ' + d.g + ' · ' + d.p + 'º período</div>';
  return '<div class="mem-carta" data-z="' + d.z + '" data-tipo="' + tipo + '" data-g="' + d.g + '"' +
              ' style="--ph:' + d.h + ';--ps:' + d.s + '%">' +
           '<div class="giro">' +
             '<div class="mem-face costas">⚛</div>' +
             '<div class="mem-face frente">' + corpo + '</div>' +
           '</div>' +
         '</div>';
}
function baralhaMemoria(){
  const baralho = [];
  MEM_PARES.forEach(d => { baralho.push({d, tipo:'sym'}); baralho.push({d, tipo:'nome'}); });
  return embaralha(baralho);
}

function abreMemoria(){
  if (memAberto || atual !== 1) return;
  const sl = slides[1];
  if (!sl) return;
  mostraBarra(false);
  fechaNav();
  memPontos = 0; memPares = 0; memErros = 0; memUltimoG = null; memConferindo = false;
  memViradas = [];
  memGeracao++;
  const ov = document.createElement('div');
  ov.className = 'memoria';
  ov.innerHTML =
    '<div class="mem-topo"><span><b class="pt">0</b><i>pontos</i></span>' +
    '<span><b class="pr">0</b><i>de 10 pares</i></span></div>' +
    '<div class="mem-grade">' + baralhaMemoria().map(c => cartaDaMemoria(c.d, c.tipo)).join('') + '</div>' +
    '<div class="mem-dica">Ache o símbolo e o nome do mesmo elemento</div>';
  sl.appendChild(ov);
  memAberto = ov;
  memCartas = [...ov.querySelectorAll('.mem-carta')];
  memCartas.forEach((el, i) => el.addEventListener('click', () => viraMemoria(i)));
  /* o play sai de cena enquanto o jogo dura, como no quiz */
  stage.classList.add('em-jogo');
  ov.getBoundingClientRect();
  ov.classList.add('on');
}
/* ja: sem esmaecer (o slide está a ser deixado ou recomeçado) */
function fechaMemoria(ja){
  if (!memAberto) return;
  const ov = memAberto;
  memAberto = null; memCartas = []; memViradas = []; memConferindo = false;
  memGeracao++;
  calaFalaDoFim();
  stage.classList.remove('em-jogo');
  ov.classList.remove('on');
  if (ja) ov.remove();
  else setTimeout(() => ov.remove(), 450);
}
function placarMemoria(){
  if (!memAberto) return;
  memAberto.querySelector('.pt').textContent = memPontos;
  memAberto.querySelector('.pr').textContent = memPares;
}
function viraMemoria(i){
  if (memConferindo || !memAberto) return;
  const el = memCartas[i];
  if (!el || el.classList.contains('casada') || el.classList.contains('virada')) return;
  if (memViradas.length >= 2) return;
  el.classList.add('virada');
  tocaEfeito('flipcard');
  memViradas.push(i);
  if (memViradas.length === 2) conferePar();
}
function conferePar(){
  memConferindo = true;
  const g = memGeracao;
  const [ia, ib] = memViradas;
  const a = memCartas[ia], b = memCartas[ib];
  const igual = a.dataset.z === b.dataset.z && a.dataset.tipo !== b.dataset.tipo;
  if (igual){
    /* prata e ouro valem o dobro, e dois pares seguidos do mesmo grupo
       dão um bônus: são as regras do jogo de onde ele veio */
    const z = +a.dataset.z, gr = a.dataset.g;
    let pts = (z === 47 || z === 79) ? 20 : 10;
    if (memUltimoG !== null && memUltimoG === gr) pts += 5;
    memUltimoG = gr;
    memPontos += pts; memPares++;
    placarMemoria();
    tocaEfeito('right');
    setTimeout(() => {
      if (g !== memGeracao) return;
      a.classList.remove('virada'); a.classList.add('casada');
      b.classList.remove('virada'); b.classList.add('casada');
      memViradas = []; memConferindo = false;
      if (memPares === MEM_PARES.length) setTimeout(() => { if (g === memGeracao) fimDaMemoria(); }, 700);
    }, 420);
  } else {
    memErros++; memPontos = Math.max(0, memPontos - 2); memUltimoG = null;
    placarMemoria();
    tocaEfeito('error');
    tremeVermelho();
    a.classList.add('errada'); b.classList.add('errada');
    setTimeout(() => {
      if (g !== memGeracao) return;
      a.classList.remove('virada', 'errada');
      b.classList.remove('virada', 'errada');
      memViradas = []; memConferindo = false;
    }, 1200);
  }
}
/* o fim: a nota é a dos pontos sobre o melhor possível — dez pares,
   com prata e ouro a dobrar */
function fimDaMemoria(){
  if (!memAberto) return;
  const teto = 10 * 10 + 20;
  /* os bônus de grupo podem passar do teto: a nota pára nos 10 */
  const nota = Math.min(10, Math.max(0, Math.round(memPontos / teto * 100) / 10));
  confete();
  memAberto.querySelector('.mem-dica').textContent = 'Todos os pares encontrados';
  poeCartaoDaMemoria(nota);
}
function poeCartaoDaMemoria(nota){
  cartaoDoResultado(nota,
    '<em class="acerto">' + memPares + '</em> pares · ' +
    '<em class="erro">' + memErros + '</em> enganos · ' + memPontos + ' pontos',
    memAberto,
    () => { fechaMemoria(); setTimeout(abreMemoria, 520); },
    () => go(2),                        /* Continuar: o slide 3 */
    'Audios/audio_tabela_1_jogo_memória_fim.mp3');
}
/* O CARTÃO DO RESULTADO, o do professor: a pontuação de 0 a 10 num anel
   que se enche, a conta, um recado (bom a partir de 5), e Refazer e
   Continuar (no jogo da memória, Continuar leva ao slide 3). Depois do
   som do placar toca a fala do fim ('fala'); um botão tocado com ela a
   meio corta-a, e a aula segue para o que foi escolhido. */
var FALA_FIM = null;
function calaFalaDoFim(){
  if (!FALA_FIM) return;
  FALA_FIM.pause();
  EFEITOS.delete(FALA_FIM);
  FALA_FIM = null;
}
const RECADOS_BONS   = ['Você está aprendendo bem!', 'Ótimo resultado!', 'Muito bem! Continue assim!'];
const RECADOS_FRACOS = ['Continue praticando!', 'Quase lá, não desista!', 'Pratique mais um pouco!'];
function cartaoDoResultado(nota, contaHTML, onde, refazer, seguir, fala){
  if (!onde) return;
  const bom = nota >= 5;
  const recado = (bom ? RECADOS_BONS : RECADOS_FRACOS)[Math.floor(Math.random() * 3)];
  const volta = 2 * Math.PI * 38;
  const c = document.createElement('div');
  c.className = 'quiz-cartao';
  c.innerHTML =
    '<div class="trofeu">🏆</div>' +
    '<div class="chapeu">Seu resultado</div>' +
    '<div class="anel">' +
      '<svg viewBox="0 0 100 100">' +
        '<circle cx="50" cy="50" r="38" fill="none" stroke="rgba(76,63,191,.16)" stroke-width="9"/>' +
        '<circle cx="50" cy="50" r="38" fill="none" stroke-width="9" stroke-linecap="round" ' +
          'stroke="' + (bom ? 'var(--natural)' : 'var(--ouro-luz)') + '" ' +
          'stroke-dasharray="' + volta.toFixed(1) + '" ' +
          'stroke-dashoffset="' + volta.toFixed(1) + '" ' +
          'style="transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1) .35s"/>' +
      '</svg>' +
      '<div class="miolo"><span>Pontuação</span><b>' + nota.toFixed(1).replace('.', ',') + '</b></div>' +
    '</div>' +
    '<div class="conta">' + contaHTML + '</div>' +
    '<div class="recado">' + recado + '</div>' +
    '<div class="botoes"><button type="button" class="refaz">Refazer</button>' +
      '<button type="button" class="forte segue">Continuar →</button></div>';
  onde.appendChild(c);
  c.getBoundingClientRect();
  c.classList.add('on');
  /* o som do placar, e depois dele a fala do fim, se o cartão ainda
     estiver à espera de uma escolha */
  const g = memGeracao;
  tocaEfeito('statistics').then(() => {
    if (!fala || g !== memGeracao || !c.isConnected || !c.classList.contains('on')) return;
    calaFalaDoFim();
    const a = new Audio(encodeURI(fala));
    FALA_FIM = a;
    EFEITOS.add(a);
    a.addEventListener('ended', () => { EFEITOS.delete(a); if (FALA_FIM === a) FALA_FIM = null; });
    a.play().catch(() => {});
  });
  /* o anel só se enche depois de o cartão entrar */
  setTimeout(() => {
    const arco = c.querySelectorAll('circle')[1];
    if (arco) arco.setAttribute('stroke-dashoffset', (volta * (1 - nota/10)).toFixed(1));
  }, 120);
  c.querySelector('.segue').addEventListener('click', () => {
    calaFalaDoFim();
    c.classList.remove('on');
    setTimeout(() => c.remove(), 400);
    seguir();
  });
  c.querySelector('.refaz').addEventListener('click', () => {
    calaFalaDoFim();
    c.classList.remove('on');
    setTimeout(() => c.remove(), 400);
    refazer();
  });
}

/* OS CONFETES — dois canhões, um em cada canto de baixo, a atirar para o
   meio. Não é coreografia da narração (acontece com ela parada), e por
   isso pode andar ao ritmo dos quadros. */
function confete(){
  /* no slide em que se está (o 1 e o 3 têm a folha deles) */
  const cv = (slides[atual] && slides[atual].querySelector('.confete')) || slides[1].querySelector('.confete');
  if (!cv) return;
  const g = cv.getContext('2d');
  const cores = ['#E2A22B','#4C3FBF','#2E9450','#C13757','#2E7BAE','#8B3FBE','#D2591F','#3EE08A'];
  const pedacos = [];
  [[160, 1], [1120, -1]].forEach(([x0, lado]) => {
    for (let i = 0; i < 110; i++) pedacos.push({
      x: x0, y: 720,
      vx: lado*(3 + Math.random()*11), vy: -(13 + Math.random()*15),
      gr: .32 + Math.random()*.14, r: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      w: 7 + Math.random()*8, h: 4 + Math.random()*5,
      cor: cores[(Math.random()*cores.length)|0]
    });
  });
  const inicio = performance.now();
  let antes = inicio;
  (function quadro(agora){
    const dt = Math.min(2.5, (agora - antes)/16.7);
    antes = agora;
    g.clearRect(0, 0, 1280, 720);
    let vivos = 0;
    pedacos.forEach(p => {
      p.vy += p.gr*dt; p.vx *= Math.pow(.985, dt);
      p.x += p.vx*dt;  p.y += p.vy*dt;  p.r += p.vr*dt;
      if (p.y > 760) return;
      vivos++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.fillStyle = p.cor; g.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      g.restore();
    });
    if (vivos && agora - inicio < 7000) requestAnimationFrame(quadro);
    else g.clearRect(0, 0, 1280, 720);
  })(inicio);
}

/* ============================================================
   O FOCO E A MÃOZINHA — o que a narração aponta
   ============================================================ */
const mao = document.getElementById('mao');
let maoT = [], emDemo = false;

/* Acende uma peça, ou um punhado delas: ela cresce e ganha o halo.
   Acender apaga o que estava aceso — nunca há dois ao mesmo tempo, e é
   a troca que o olho segue.

   E NÃO HÁ AQUI DURAÇÃO NENHUMA, de propósito: um destaque que se
   apagasse sozinho ao fim de tantos milésimos usaria o relógio de
   parede, e continuaria a contar com a narração em pausa. Quem diz
   quando ele sai é outra marca do roteiro, no tempo do áudio. */
function foca(sel){
  const lista = (Array.isArray(sel) ? sel : [sel]).reduce((a,s) =>
    a.concat(typeof s === 'string' ? [...document.querySelectorAll(s)] : [s]), []);
  semFoco();
  lista.forEach(el => el && el.classList.add('realce'));
}
function semFoco(){
  document.querySelectorAll('.realce').forEach(el => el.classList.remove('realce'));
}

/* ---- a mãozinha ----
   A ponta do dedo do ícone fica a 22px da esquerda e 7px do alto: é
   por aí que ela é encostada no ponto que quer apontar. */
function limpaMao(){ maoT.forEach(clearTimeout); maoT = []; }
function levaMao(el, o){
  o = o || {};
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width && !r.height) return;
  /* escondida, ela aparece já no sítio; à vista, desliza até ele */
  const novo = mao.hidden;
  if (novo) mao.style.transition = 'none';
  mao.hidden = false;
  mao.style.left = (r.left + r.width *(o.fx === undefined ? .5 : o.fx) - 22) + 'px';
  mao.style.top  = (r.top  + r.height*(o.fy === undefined ? .5 : o.fy) -  7) + 'px';
  if (novo){ void mao.offsetWidth; mao.style.transition = ''; }
  mao.classList.add('on');
}
function bateMao(){
  mao.classList.remove('clica');
  void mao.offsetWidth;
  mao.classList.add('clica');
}
function tiraMao(){
  mao.classList.remove('on');
  maoT.push(setTimeout(() => { mao.hidden = true; mao.classList.remove('clica'); }, 400));
}

/* ---- as demonstrações ----
   A mão faz mesmo o que mostra: abre a barra e abre a visão geral. Só
   o play é mímica — um clique de verdade ali pararia a narração no meio
   da frase que a está a explicar.

   CADA PASSO É UMA MARCA DO ROTEIRO, e não um setTimeout encadeado: o
   relógio desta cena é o do áudio, e mais nenhum. Parada a narração,
   a mão pára onde está; seguindo, ela segue de onde parou; e voltando
   o áudio atrás, a demonstração recomeça com ele. Uma corrente de
   temporizadores correria sozinha com o som em pausa, e a mão acabaria
   a apontar coisas que a voz ainda não disse. */
const DEMO = {
  /* 1 · a mão vai à alça dos controles */
  vaiAAlca(){ limpaMao(); emDemo = true; mostraBarra(false); levaMao(puxador); },
  /* 2 · e abre a barra */
  abreBarra(){ bateMao(); mostraBarra(true); },
  /* 3 · vai ao botão da visão geral */
  vaiAoOver(){ levaMao(document.getElementById('over')); },
  /* 4 · e abre-a */
  abreOver(){ bateMao(); mostraOverview(true); },
  /* 5 · aberta a visão geral, a barra fica por baixo dela — a mão sai
     de cima de um botão que já não se vê e vai mostrar o que apareceu */
  mostraSlides(){ levaMao(document.querySelector('#grid .card'), {fy:.62}); },
  /* 6 · fecha */
  fechaOver(){ mostraOverview(false); },
  /* 7 · e arruma a casa */
  arruma(){ mostraBarra(false); tiraMao(); emDemo = false; },

  apontaPlay(){ limpaMao(); levaMao(somBtn); },
  /* a narração mudou de slide: a demonstração não fica a meio */
  corta(){
    limpaMao();
    if (emDemo){ mostraOverview(false); mostraBarra(false); emDemo = false; }
    tiraMao();
    semFoco();
  }
};

/* ------------------------------------------------------------
   NAVEGAÇÃO
   ------------------------------------------------------------ */
const progress = document.getElementById('progress');
const counter  = document.getElementById('counter');
let atual = 0, andando = false;

function go(i, dir){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  if (i === atual || andando) return;
  dir = dir || (i > atual ? 'next' : 'prev');

  const sai   = slides[atual];
  const entra = slides[i];

  /* a narração é de cada slide: mudando de slide, ela para e a do
     novo fica pronta para começar */
  som.pause();
  mostraPausa(false);
  VIDA.desliga();
  DEMO.corta();          /* e a cena da capa não fica a meio */
  /* saindo do slide 1, o quiz e o jogo fecham: aberto, qualquer um
     deles escondia o play da capa */
  if (i !== 1){ QUIZ.fecha(); fechaMemoria(true); }
  if (i !== 2) SEQ.deixa2();
  if (i !== 3){ EV3.entendi(false); if (QUIZ4.ativo) QUIZ4.fecha(); }

  andando = true;
  sai.classList.add('is-leaving', 'fx-cube-out-' + dir);
  entra.classList.add('is-active', 'fx-cube-in-' + dir);

  atual = i;
  atualizaCabecalho();

  /* a tabela pousa ENQUANTO a face gira: os cubos caem nos lugares ao
     mesmo tempo que o slide entra, e o aluno chega ao slide com a mesa
     a acabar de ser posta, e não posta de antemão */
  /* e a mesa começa a respirar assim que os cubos assentam */
  /* chegando ao slide 1, a história dele recomeça do princípio */
  recomecaMesa(i);

  setTimeout(() => {
    sai.classList.remove('is-active','is-leaving','fx-cube-out-next','fx-cube-out-prev');
    entra.classList.remove('fx-cube-in-next','fx-cube-in-prev');
    andando = false;
    /* o slide que chega vai para o lugar que ficou arrumado à mão; e
       só agora, que a passagem acabou: medir uma peça a meio do voo
       congelava-a lá */
    arrumaPecasDoPalco();
    if (LAYOUTS[atual]) aplicaLayout(atual);
    else if (naMontagem()) soltaSlide(slides[atual]);
  }, 880);

  carregaTrilha(TRILHA_DO_SLIDE[i]);
}

function atualizaCabecalho(){
  stage.classList.toggle('na-capa',   atual === 0);
  stage.classList.toggle('sem-marca', temMesa(atual));
  navNoSlide();
  ajusteNoSlide();
  progress.style.width = ((atual)/(SLIDES.length-1)*100) + '%';
  progress.style.setProperty('--prog', atual/(SLIDES.length-1));
  counter.innerHTML = '<b>'+(atual+1)+'</b> / '+SLIDES.length;
  slides.forEach(sl => {
    const r = sl.querySelector('.regua');
    if (!r) return;
    [...r.children].forEach((b,j) => {
      b.classList.toggle('aqui', j === atual);
      b.classList.toggle('feito', j < atual);
    });
  });
}

document.getElementById('prev').addEventListener('click', () => go(atual-1));
document.getElementById('next').addEventListener('click', () => go(atual+1));

/* ------------------------------------------------------------
   VISÃO GERAL — as miniaturas são os próprios slides em escala
   Cada cartão leva dentro uma cópia viva do slide, feita na hora em
   que a visão geral abre: o que estiver montado lá dentro aparece
   aqui — a tabela, os cubos como estiverem virados, a carta que a
   narração deixou acesa.
   ------------------------------------------------------------ */
const overview = document.getElementById('overview');
const grid     = document.getElementById('grid');
const overBtn  = document.getElementById('over');

function montaMiniaturas(){
  grid.innerHTML = '';
  SLIDES.forEach((sl,i) => {
    /* o cartão é um div, e não um botão: dentro dele vai uma cópia do
       slide, que já traz os botões da régua — botão dentro de botão é
       coisa que o navegador desmonta */
    const c = document.createElement('div');
    c.setAttribute('role', 'button');
    c.tabIndex = 0;
    c.className = 'card' + (i === atual ? ' aqui' : '');
    c.setAttribute('aria-label', 'Ir para o slide ' + (i+1));
    c.innerHTML = '<div class="mini"><div class="mini-palco"></div></div>' +
      '<div class="rot"><div class="n">'+String(i+1).padStart(2,'0')+'</div>' +
      '<div class="t">'+esc(sl.kind === 'capa' ? 'Capa' : sl.title)+'</div></div>';
    const palco = c.querySelector('.mini-palco');

    /* a tabelinha do canto é do palco, e não do slide: a capa sem ela
       não seria a capa, e por isso a cópia vai primeiro, por baixo */
    if (sl.kind === 'capa'){
      const marca = document.getElementById('tabela').cloneNode(true);
      marca.removeAttribute('id');
      marca.setAttribute('class', 'mini-marca');
      marca.querySelectorAll('.luz').forEach(l => l.remove());
      palco.appendChild(marca);
    }

    const copia = slides[i].cloneNode(true);
    copia.classList.remove('is-leaving','fx-cube-in-next','fx-cube-in-prev',
                           'fx-cube-out-next','fx-cube-out-prev');
    copia.classList.add('is-active');
    /* na miniatura nada é clicável: ela inteira é um alvo só */
    copia.querySelectorAll('button').forEach(b => { b.tabIndex = -1; b.disabled = true; });
    palco.appendChild(copia);

    const abre = () => { mostraOverview(false); go(i); };
    c.addEventListener('click', abre);
    c.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abre(); }
    });
    grid.appendChild(c);
  });
  /* Só depois de estarem no documento é que se sabe a largura do
     cartão — e é ela que diz de quanto o palco de 1280 tem de
     encolher. A medida é tirada aqui mesmo, e não no quadro seguinte:
     ler a largura obriga o navegador a assentar o desenho na hora, e
     as miniaturas nunca chegam a aparecer em tamanho natural. */
  grid.querySelectorAll('.card').forEach(c => {
    const larg = c.clientWidth;
    if (!larg) return;
    c.querySelector('.mini-palco').style.transform = 'scale(' + (larg/1280) + ')';
  });
}

function mostraOverview(v){
  if (v) fechaNav();
  const abre = v === undefined ? overview.hidden : !!v;
  overview.hidden = !abre;
  overBtn.classList.toggle('on', abre);
  if (abre){
    /* a narração não corre por cima do índice — a não ser que seja ela
       própria a abri-lo, na demonstração dos controles */
    if (!emDemo){ som.pause(); mostraPausa(false); }
    montaMiniaturas();
  }
}
overBtn.addEventListener('click', () => mostraOverview());
/* o clique no fundo fecha; o clique num cartão é dele */
overview.addEventListener('click', e => { if (e.target === overview) mostraOverview(false); });

/* ============================================================
   MODO MONTAGEM (tecla G)
   Fora da aula, a capa vira mesa de trabalho: tudo o que está nela se
   pega com a mão. Um dedo arrasta; dois dedos, em pinça, mudam o
   tamanho; a roda do mouse faz o mesmo que a pinça.

   Ao entrar na montagem, cada peça é SOLTA: sai do fluxo do layout e
   passa a viver por x, y — o centro dela, em px do palco 1280x720 — e
   uma escala. O truque é medir todas ANTES de soltar qualquer uma: se
   a primeira saísse do fluxo, as de baixo subiriam e as medidas
   seguintes já sairiam erradas.

   O Ctrl+C copia essas posições e tamanhos. É esse texto que volta
   para mim: com ele eu fixo no arquivo, como valores, o que foi
   arrumado à mão aqui.
   ============================================================ */
const MOVEIS = '.capa .marca, .capa h1, .capa .risco, .capa .autor,' +
               ' .capa .email, .capa .foto, [data-mont]';
/* quem encolhe até o conteúdo antes de ser medido — o texto.
   O risco e a foto já têm a caixa que têm. */
const ENCOLHE = '.capa .marca, .capa h1, .capa .autor, .capa .email';
/* quem tem caixa própria leva também a altura; texto fica com altura livre */
const COM_ALTURA = '.capa .risco, .capa .foto, .capa .digitado';
/* quem tem letra que interessa medir */
const COM_LETRA = '.capa .marca, .capa h1, .capa .autor, .capa .email';

const MEDIDAS = new WeakMap();     /* elemento -> {cx, cy, w, h, esc} */
const coord = document.getElementById('coord');

/* As peças de um slide. A tabelinha do canto mora no palco, e não no
   slide — mas na capa ela é peça da capa como as outras, e é preciso
   poder movê-la e mudá-la de tamanho junto com o resto. */
function pecasDe(sl){
  const lista = [...sl.querySelectorAll(MOVEIS)];
  if (sl.classList.contains('capa')){
    lista.push(document.getElementById('tabela'));
    lista.push(document.getElementById('som'));
  }
  return lista;
}

function soltaSlide(sl){
  const alvos = pecasDe(sl).filter(el => el && !el.classList.contains('solto'));
  if (!alvos.length || andando) return;
  const rs = sl.getBoundingClientRect();
  /* mede todas primeiro; só depois solta */
  alvos.forEach(el => {
    el.classList.add('medindo');
    if (el.matches(ENCOLHE)) el.classList.add('encolhe');
  });
  const medidas = alvos.map(el => {
    const r = el.getBoundingClientRect();
    return { el,
      cx:(r.left + r.width/2  - rs.left)/fitScale,
      cy:(r.top  + r.height/2 - rs.top )/fitScale,
      w: r.width /fitScale,
      h: r.height/fitScale, esc:1 };
  });
  alvos.forEach(el => el.classList.remove('medindo','encolhe'));
  /* peça sem caixa não se solta: congelá-la agora prendia-a em largura
     zero, num canto, e lá ficaria para sempre */
  medidas.filter(m => m.w > 0.5 && m.h > 0.5).forEach(m => {
    MEDIDAS.set(m.el, m);
    m.el.classList.add('solto');
    m.el.style.right = m.el.style.bottom = 'auto';
    aplicaEl(m.el);
  });
}
function aplicaEl(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  el.style.left  = m.cx.toFixed(1) + 'px';
  el.style.top   = m.cy.toFixed(1) + 'px';
  el.style.width = m.w.toFixed(1)  + 'px';
  if (el.matches(COM_ALTURA)) el.style.height = m.h.toFixed(1) + 'px';
  el.style.setProperty('--esc', m.esc.toFixed(3));
}
/* ------------------------------------------------------------
   O QUE FOI ARRUMADO À MÃO, FIXADO NO ARQUIVO
   Estas são as posições que o professor deixou na montagem e me
   mandou pelo Ctrl+C. x,y são o centro da peça no palco de 1280x720;
   esc é a escala que ele pinçou. O que não estiver aqui fica onde o
   layout normal o põe.
   ------------------------------------------------------------ */
const LAYOUTS = {
  /* slide 1 · Capa — o título e o retrato à esquerda, a tabelinha e os
     três blocos gigantes à direita, e o nome e o endereço no rodapé,
     um em cada canto. */
  0: {
    marca:       {x: 305, y: 73, esc:1.00},
    titulo:      {x: 321, y:197, esc:1.00},
    risco:       {x: 316, y:291, esc:1.00},
    autor:       {x: 232, y:646, esc:1.00},
    email:       {x:1056, y:695, esc:1.00},
    foto:        {x: 175, y:470, esc:1.09},
    tabelinha:   {x: 990, y:468, esc:1.00},
    'bloco-Na':  {x: 847, y:163, esc:0.72},
    'bloco-Y':   {x:1008, y:295, esc:0.72},
    'bloco-La':  {x:1115, y:172, esc:0.74},
    /* a caixa das frases digitadas, no vazio à direita do retrato */
    frases:      {x: 510, y:475, esc:1.00},
    /* o play, no canto de baixo à direita: na faixa de papel que sobra
       entre a última linha da tabelinha e o endereço */
    som:         {x:1216, y:645, esc:1.00}
  }
};

function aplicaLayout(i){
  const mapa = LAYOUTS[i];
  if (!mapa) return;
  const sl = slides[i];
  soltaSlide(sl);                    /* mede cada peça onde o layout a pôs */
  const pecas = pecasDe(sl).filter(Boolean);
  /* pôr no lugar não é uma viagem: as peças aparecem já lá. Sem isto, a
     escala que o layout lhes dá seria animada pela transição do
     destaque, e a capa abria com o retrato a crescer do nada. */
  pecas.forEach(el => { el.style.transition = 'none'; });
  pecas.forEach(el => {
    const p = mapa[nomeDe(el)], m = MEDIDAS.get(el);
    if (!p || !m) return;
    m.esc = p.esc;
    m.cy  = p.y;
    m.cx  = p.x !== undefined ? p.x : p.esq + (m.w*p.esc)/2;
    aplicaEl(el);
  });
  void sl.offsetWidth;
  pecas.forEach(el => { el.style.removeProperty('transition'); });
}

/* A TABELINHA E O BOTÃO MORAM NO PALCO, e não num slide: eles
   atravessam a apresentação inteira. Na capa quem manda neles é o
   layout fixado; fora dela têm de voltar ao lugar que o CSS lhes dá,
   senão ficariam para sempre onde a capa os deixou. */
function arrumaPecasDoPalco(){
  if (atual === 0) return;
  ['tabela','som'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}

/* tira as peças do slide da mão e devolve-as ao fluxo do CSS */
function desprende(sl){
  pecasDe(sl).forEach(el => {
    if (!el || !el.classList.contains('solto')) return;
    el.classList.remove('solto','pego');
    MEDIDAS.delete(el);
    ['left','top','width','height','right','bottom'].forEach(p => el.style.removeProperty(p));
    el.style.removeProperty('--esc');
  });
}
/* devolve o slide ao lugar de origem — o do arquivo, que é o que o
   layout fixado diz, e não o que o CSS sozinho faria */
function refazLayout(){
  const sl = slides[atual];
  desprende(sl);
  if (LAYOUTS[atual]) aplicaLayout(atual);
  else if (naMontagem()) soltaSlide(sl);
  TP.diz('Slide devolvido ao lugar de origem.');
}

/* ---- o gesto: um dedo move, dois dedos pinçam ----
   Os dois casos são a mesma conta. A cada toque novo guardo onde estão
   os dedos — o ponto médio deles e a distância entre eles — e o estado
   da peça. Enquanto os dedos andam, a peça segue o ponto médio e a
   escala segue a razão entre a distância de agora e a do começo. Com um
   dedo só a distância não existe, e sobra o arrasto puro. */
const gestos = new Map();

function centroDe(mapa){
  const pts = [...mapa.values()];
  const cx = pts.reduce((s,p) => s + p.x, 0)/pts.length;
  const cy = pts.reduce((s,p) => s + p.y, 0)/pts.length;
  const d  = pts.length > 1 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) : 0;
  return {cx, cy, d};
}
const estadoDedos = g => centroDe(g.ptr);
function reancora(el, g){
  const m = MEDIDAS.get(el);
  g.base = Object.assign(estadoDedos(g), {mcx:m.cx, mcy:m.cy, esc:m.esc});
}
const naMontagem = () => document.body.classList.contains('montagem');
function pecaDe(ev){
  const sl = slides[atual];
  const el = ev.target.closest(MOVEIS + ', #tabela');
  if (!el) return null;
  return (sl.contains(el) || el.id === 'tabela') ? el : null;
}
/* o rótulo que diz onde a peça está, enquanto ela anda */
function mostraCoord(el){
  const m = MEDIDAS.get(el);
  if (!m) return;
  coord.textContent = 'x: ' + Math.round(m.cx) + '   y: ' + Math.round(m.cy) +
                      '   esc: ' + m.esc.toFixed(2);
  coord.style.left = m.cx.toFixed(0) + 'px';
  coord.style.top  = (m.cy - m.h*m.esc/2).toFixed(0) + 'px';
  coord.classList.add('on');
}

stage.addEventListener('pointerdown', (ev) => {
  if (!naMontagem()) return;
  const el = pecaDe(ev);
  if (!el) return;
  soltaSlide(slides[atual]);
  let g = gestos.get(el);
  if (!g){ g = {ptr:new Map()}; gestos.set(el, g); }
  g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  try { el.setPointerCapture(ev.pointerId); } catch(_){}
  reancora(el, g);
  el.classList.add('pego');
  mostraCoord(el);
  ev.preventDefault();
  ev.stopPropagation();            /* na montagem, o gesto é da peça */
}, true);

document.addEventListener('pointermove', (ev) => {
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    const agora = estadoDedos(g), b = g.base, m = MEDIDAS.get(el);
    m.cx = b.mcx + (agora.cx - b.cx)/fitScale;
    m.cy = b.mcy + (agora.cy - b.cy)/fitScale;
    if (g.ptr.size > 1 && b.d > 12)
      m.esc = Math.max(.15, Math.min(8, b.esc * (agora.d / b.d)));
    aplicaEl(el);
    mostraCoord(el);
  });
}, true);

function largaDedo(ev){
  gestos.forEach((g, el) => {
    if (!g.ptr.has(ev.pointerId)) return;
    g.ptr.delete(ev.pointerId);
    /* saiu um dedo dos dois: o que ficou recomeça a contar dali, senão
       a peça daria um salto no instante em que o outro se levanta */
    if (g.ptr.size) reancora(el, g);
    else { gestos.delete(el); el.classList.remove('pego'); }
  });
}
document.addEventListener('pointerup', largaDedo, true);
document.addEventListener('pointercancel', largaDedo, true);

/* a roda do mouse faz o que a pinça faz */
stage.addEventListener('wheel', (ev) => {
  if (!naMontagem()) return;
  const el = pecaDe(ev);
  if (!el) return;
  soltaSlide(slides[atual]);
  const m = MEDIDAS.get(el);
  if (!m) return;
  m.esc = Math.max(.15, Math.min(8, m.esc * (1 - ev.deltaY * 0.0015)));
  aplicaEl(el);
  mostraCoord(el);
  ev.preventDefault();
}, {passive:false});

/* o toque demorado no palco chama o menu do navegador, e aqui dentro
   não há o que copiar nem pesquisar: ele só atrapalha o arrasto */
stage.addEventListener('contextmenu', ev => { if (naMontagem()) ev.preventDefault(); });

const montBtn  = document.getElementById('mont-btn');
const copiaBtn = document.getElementById('copia-btn');
function modoMontagem(v){
  const abre = v === undefined ? !naMontagem() : !!v;
  document.body.classList.toggle('montagem', abre);
  montBtn.classList.toggle('on', abre);
  copiaBtn.hidden = !abre;
  if (abre){
    /* a tabela viva mexeria as peças por baixo da mão */
    VIDA.desliga();
    som.pause(); mostraPausa(false);
    soltaSlide(slides[atual]);
    mostraBarra(true);
    TP.diz(pecasDe(slides[atual]).length
      ? 'Montagem: arraste as peças · roda ou pinça muda o tamanho · Ctrl+C copia · R devolve'
      : 'Este slide não tem peças de montagem — a capa tem.', 4200);
  } else {
    coord.classList.remove('on');
    if (temMesa(atual)) VIDA.liga();
  }
}
montBtn.addEventListener('click', () => modoMontagem());

/* ---- a folha das posições ---- */
const coordsCx  = document.getElementById('coords');
const coordsTxt = document.getElementById('coords-txt');
const coordsDe  = document.getElementById('coords-de');
const coordsMsg = document.getElementById('coords-msg');

function nomeDe(el){
  if (el.dataset.mont) return el.dataset.mont;   /* peça com nome próprio */
  if (el.id === 'tabela') return 'tabelinha';
  const c = el.classList;
  if (c.contains('marca')) return 'marca';
  if (c.contains('risco')) return 'risco';
  if (c.contains('autor')) return 'autor';
  if (c.contains('email')) return 'email';
  if (c.contains('foto'))  return 'foto';
  if (el.tagName === 'H1') return 'titulo';
  return el.tagName.toLowerCase();
}
/* mede tudo o que está no slide, em px do palco, com x,y no centro */
function medeSlide(i){
  const sl = slides[i], rs = sl.getBoundingClientRect();
  soltaSlide(sl);                  /* mede pelo mesmo critério da montagem */
  return pecasDe(sl).filter(el => el && el.classList.contains('solto')).map(el => {
    const r = el.getBoundingClientRect();   /* já vem com a escala aplicada */
    const m = MEDIDAS.get(el);
    const esc = m ? m.esc : 1;
    return {
      nome:  nomeDe(el),
      x:     Math.round((r.left + r.width/2  - rs.left)/fitScale),
      y:     Math.round((r.top  + r.height/2 - rs.top )/fitScale),
      larg:  Math.round(r.width /fitScale),
      alt:   Math.round(r.height/fitScale),
      /* a fonte medida não conhece a escala do transform: entra na conta */
      fonte: el.matches(COM_LETRA)
             ? Math.round(parseFloat(getComputedStyle(el).fontSize) * esc * 10)/10
             : null,
      esc:   Math.round(esc*100)/100
    };
  });
}
const pad = (v,n) => String(v).padStart(n, ' ');

function textoDoSlide(i){
  const sl = SLIDES[i];
  let out = '/* slide ' + (i+1) + ' · ' + (sl.kind === 'capa' ? 'Capa' : sl.title) + ' */\n';
  medeSlide(i).forEach(o => {
    out += '  { ' + ("el:'" + o.nome + "',").padEnd(16, ' ') +
           ' x:' + pad(o.x,4) + ', y:' + pad(o.y,3) +
           ', larg:' + pad(o.larg,4) + ', alt:' + pad(o.alt,3) +
           /* a peça sem letra deixa a coluna em branco, para a escala
              ficar debaixo da escala na linha de cima */
           (o.fonte === null ? ' '.repeat(13) : ', fonte:' + pad(o.fonte,5)) +
           ', esc:' + o.esc.toFixed(2) + ' },\n';
  });
  return out;
}
function copiaCoords(){
  const txt = textoDoSlide(atual);
  coordsTxt.value = txt;
  coordsDe.textContent = 'slide ' + (atual+1) + ' · ' +
    (SLIDES[atual].kind === 'capa' ? 'Capa' : SLIDES[atual].title);
  coordsCx.hidden = false;
  coordsTxt.focus();
  coordsTxt.select();
  coordsMsg.textContent = '';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt)
      .then(() => { coordsMsg.textContent = 'copiado'; })
      .catch(() => { coordsMsg.textContent = 'selecionado — aperte Ctrl+C'; });
  } else coordsMsg.textContent = 'selecionado — aperte Ctrl+C';
}
copiaBtn.addEventListener('click', copiaCoords);
document.getElementById('coords-close').addEventListener('click', () => { coordsCx.hidden = true; });

/* ------------------------------------------------------------
   O ENDEREÇO: link e menu
   Clicado, abre o e-mail já endereçado. Com o botão direito — ou o
   dedo demorado, no tablet —, oferece copiá-lo. O menu é nosso, e não
   o do navegador: o do navegador muda de nome e de lugar em cada um, e
   no iPad nem aparece, porque o palco desliga o balão do toque longo.
   ------------------------------------------------------------ */
const EMAIL = 'amauri.junior@escola.seduc.pa.gov.br';
const menuEmail = document.getElementById('menu-email');

function abreMenuEmail(x, y){
  menuEmail.hidden = false;
  /* junto ao dedo, mas sempre inteiro dentro da janela */
  const r = menuEmail.getBoundingClientRect();
  menuEmail.style.left = Math.min(x, innerWidth  - r.width  - 8) + 'px';
  menuEmail.style.top  = Math.min(y, innerHeight - r.height - 8) + 'px';
  document.getElementById('copia-email').focus();
}
function fechaMenuEmail(){ menuEmail.hidden = true; }

function copiaTexto(txt){
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(txt);
  /* aberto do disco, ou sem https, a área de transferência moderna não
     existe: vai pelo caminho antigo, que funciona em todo o lado */
  return new Promise((ok, falha) => {
    const t = document.createElement('textarea');
    t.value = txt;
    t.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy') ? ok() : falha(); }
    catch(e){ falha(e); }
    t.remove();
  });
}
document.getElementById('copia-email').addEventListener('click', () => {
  fechaMenuEmail();
  copiaTexto(EMAIL)
    .then(() => TP.diz('E-mail copiado: ' + EMAIL))
    .catch(() => TP.diz('Não deu para copiar — o endereço é ' + EMAIL, 4200));
});

stage.addEventListener('contextmenu', ev => {
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el || naMontagem()) return;
  ev.preventDefault();
  abreMenuEmail(ev.clientX, ev.clientY);
});
/* o dedo demorado: no iPad o contextmenu não chega a disparar */
let toqueEmail = null;
stage.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch' || naMontagem()) return;
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el) return;
  const x = ev.clientX, y = ev.clientY;
  toqueEmail = { x, y, t: setTimeout(() => {
    toqueEmail.abriu = true;
    abreMenuEmail(x, y);
  }, 550) };
});
stage.addEventListener('pointermove', ev => {
  if (toqueEmail && Math.hypot(ev.clientX - toqueEmail.x, ev.clientY - toqueEmail.y) > 10){
    clearTimeout(toqueEmail.t); toqueEmail = null;
  }
});
addEventListener('pointerup', () => { if (toqueEmail) clearTimeout(toqueEmail.t); });

stage.addEventListener('click', ev => {
  const el = ev.target.closest && ev.target.closest('.capa .email');
  if (!el) return;
  /* na montagem o endereço é peça a arrastar, e não link; e depois de
     um dedo demorado que abriu o menu, o toque não pode ainda abrir o
     e-mail por baixo dele */
  if (naMontagem() || (toqueEmail && toqueEmail.abriu)){ ev.preventDefault(); }
  toqueEmail = null;
});
/* fecha ao clicar fora, com o Esc, ou quando a janela muda */
addEventListener('pointerdown', ev => {
  if (!menuEmail.hidden && !menuEmail.contains(ev.target)) fechaMenuEmail();
}, true);
addEventListener('resize', fechaMenuEmail);

/* ---- a barra e a alça ---- */
const bar = document.getElementById('bar'), puxador = document.getElementById('puxador');
function mostraBarra(sim){
  bar.classList.toggle('hidden', !sim);
  puxador.classList.toggle('fora', sim);
  puxador.setAttribute('aria-expanded', sim ? 'true' : 'false');
}
puxador.addEventListener('click', () => mostraBarra(true));
document.getElementById('bar-close').addEventListener('click', () => mostraBarra(false));

}

/* ---- o teclado ----
   As setas andam entre a capa e a tabela; o espaço toca e pára a
   narração, que é o comando que esta tela tem. */
/* ============================================================
   A NAVEGAÇÃO RÁPIDA — uma ferramenta de desenvolvimento
   Uma alça na borda direita, a partir do slide da tabela, abre uma
   gaveta com os tópicos do slide. Um toque num tópico leva direto a
   ele, COM A MESA MONTADA COMO SE O ALUNO TIVESSE PASSADO PELOS
   ANTERIORES: o slide recomeça do zero, cada tópico anterior deixa na
   mesa o que construiu (deixa), e só então o escolhido entra (entra).
   Voltar para trás é o mesmo caminho: tudo se desfaz, e o tópico é
   refeito como na primeira vez.

   Um tópico novo é um item a mais em NAV_TOPICOS:
     titulo, sub   o que a gaveta escreve
     slide         em que slide ele mora
     deixa()       o que ele deixa construído na mesa para os seguintes
                   (por enquanto nenhum deixa nada: a mesa só muda de
                   verdade quando as séries forem reveladas)
     entra(v, g)   como se chega a ele; v é a variante escolhida, g o
                   número desta ida (uma ida nova cancela a anterior)
     variantes     atalhos para uma versão do tópico
     engatilhado   o tópico ainda não existe: aparece, mas não abre
   ============================================================ */
const NAV_TOPICOS = [
  { titulo:'Visão geral da tabela', sub:'o slide desde o começo', slide:1,
    entra(){ /* o recomeço do slide já é o tópico */ } },
  { titulo:'Quiz 1', sub:'aos 42 s da 1.3A ou aos 35,5 s da 1.3B', slide:1,
    variantes:[ { id:'1.3A', rotulo:'1.3A · uma letra' }, { id:'1.3B', rotulo:'1.3B · duas letras' } ],
    entra(v, g){
      const c = eleitoDaNavegacao(v === '1.3A' ? 1 : v === '1.3B' ? 2 : 0);
      const id = c.dataset.sym.length === 1 ? '1.3A' : '1.3B';
      depoisDaMesa(g, () => tocaDesde(id, QUIZ_NA_HORA[id], g));
    } },
  { titulo:'Quiz 2', sub:'aos 54 s da 1.4 · os nomes diferentes', slide:1,
    entra(v, g){
      eleitoDaNavegacao(0);
      depoisDaMesa(g, () => tocaDesde('1.4', QUIZ_NA_HORA['1.4'], g));
    } },
  /* ---- o slide 3 · Os critérios de Organização ---- */
  { titulo:'Início', sub:'o começo do slide', slide:2,
    entra(){ /* o recomeço do slide já é o tópico */ } },
  { titulo:'O critério 1 de organização', sub:'aos 25 s da narração 2, com a tabela já desmontada', slide:2,
    entra(v, g){
      semTransicaoUmInstante();
      trilhaAtual = -1;
      carregaTrilha('2');
      TEMPO_FORCADO = { id:'2', t:25 };
      depoisDaMesa(g, () => tocaDesde('2', 25, g));
    } },
  { titulo:'O critério 2 de organização', sub:'a narração 2.3, com a tabela montada até à linha 4', slide:2,
    entra(v, g){
      semTransicaoUmInstante();
      trilhaAtual = -1;
      carregaTrilha('2.3');
      /* do 1 ao 36 em casa, coloridos; os outros, na desordem */
      TP.todos().filter(c => +c.dataset.z <= ENCAIXE.sozinhoAte).forEach(poeNoLugarJa);
      depoisDaMesa(g, () => tocaDesde('2.3', 0, g));
    } },
  { titulo:'Quiz', sub:'o quiz direto: o escuro, o quiz1 e a questão 1', slide:2,

      LC25.liga();
      /* e o quiz abre já, como se o botão tivesse sido tocado: a sala
         apaga-se, toca o quiz1 e entra a questão 1 */

    } },
  /* ---- o slide 4 · As coordenadas periódicas ---- */
  { titulo:'Início', sub:'o começo do slide', slide:3,

  { titulo:'Quiz', sub:'o começo da 3.3: as perguntas', slide:3,

  { titulo:'Jogo da memória', sub:'a narração do jogo, e o botão dele no canto', slide:1,

];
const NAV = { geracao:0, eleitoAntes:null };

function irPara(i, variante){
  const item = NAV_TOPICOS[i];
  if (!item || item.engatilhado) return;
  fechaNav();
  TEMPO_FORCADO = null;
  const g = ++NAV.geracao;
  /* o elemento que o aluno tinha escolhido fica guardado: chegando a um
     quiz, é ele que volta a valer (se servir) */
  if (SEQ.eleito) NAV.eleitoAntes = +SEQ.eleito.dataset.z;
  const segue = () => {
    if (g !== NAV.geracao || atual !== item.slide) return;
    NAV_TOPICOS.slice(0, i).forEach(t => { if (t.slide === item.slide && t.deixa) t.deixa(); });
    item.entra(variante, g);
  };
  /* de outro slide, o go() já recomeça este; no mesmo, recomeça-se à mão */
  if (atual !== item.slide){ go(item.slide); setTimeout(segue, 900); }
  else { recomecaSlide(item.slide); segue(); }
}

/* o slide recomeça no lugar, como se o aluno acabasse de chegar a ele: é o
   que o go() faz, e ele não faz nada quando o destino é o slide atual */
function recomecaSlide(i){
  som.pause();
  mostraPausa(false);
  VIDA.desliga();
  DEMO.corta();
  recomecaMesa(i);
  trilhaAtual = -1;          /* a mesma trilha também recomeça */
  carregaTrilha(TRILHA_DO_SLIDE[i]);
}

/* O ELEITO de quem chega direto: na aula ele sai da escolha do aluno na
   "1.1", e é o símbolo dele que decide entre a "1.3A" e a "1.3B" (e fica
   fora do quiz). Vale o que tinha sido escolhido antes, se servir; senão
   um ao acaso — de uma letra, de duas, ou qualquer um. Chegando ao
   quiz, ele já voltou para casa: não leva classe nenhuma. */
function eleitoDaNavegacao(letras){
  const serve = c => !!c && (!letras || c.dataset.sym.length === letras);
  const todos = TP.todos();
  let c = todos.find(x => +x.dataset.z === NAV.eleitoAntes);
  if (!serve(c)){
    const pool = todos.filter(serve);
    c = pool[Math.floor(Math.random() * pool.length)];
  }
  SEQ.eleito = c;
  return c;
}

/* por um instante, sem transições nos cards do slide 3 (ver o CSS de
   .mesa.sem-transicao) */
function semTransicaoUmInstante(){
  const m = slides[2] && slides[2].querySelector('.mesa');
  if (!m) return;
  m.classList.add('sem-transicao');
  setTimeout(() => m.classList.remove('sem-transicao'), 250);

/* um card do slide 3 já em casa, colorido, sem voo — como se o encaixe o
   tivesse posto lá */
function poeNoLugarJa(c){
  const casa = alvoDe(+c.dataset.z), cubo = c.querySelector('.cubo');
  c._vooG = (c._vooG || 0) + 1;
  c._voo = 0;
  c._noLugar = true;
  c.classList.remove('desordem', 'chama', 'nao', 'encaixando');
  c.classList.add('no-lugar');

  c.style.left = casa.x.toFixed(1) + 'px';
  c.style.top  = casa.y.toFixed(1) + 'px';

/* a narração só volta depois de a mesa pousar; e a mesa não se põe a
   respirar à espera do play, porque a aula já vai adiantada */
function depoisDaMesa(g, fn){
  SEQ.comecou = true;
  VIDA.desliga();
  setTimeout(() => { if (g === NAV.geracao) fn(); }, 1500);
}

/* toca uma trilha a partir de um segundo. O salto só pode ser dado com
   o áudio já a saber a duração (loadedmetadata). Os eventos seguem o
   relógio, e por isso a mesa fica logo como naquele segundo; e se o
   áudio não carregar, o quiz daquela trilha abre na mesma. */
function tocaDesde(id, t, g){
  trilhaAtual = -1;
  carregaTrilha(id);
  const vai = () => {
    if (g !== NAV.geracao || trilhaAtual !== id) return;
    som.currentTime = t;
    som.play().catch(avisaSeNaoTocou);
  };
  if (som.readyState >= 1) vai();
  else som.addEventListener('loadedmetadata', vai, { once:true });
  som.addEventListener('error', () => {
    if (g === NAV.geracao && trilhaAtual === id && id in QUIZ_NA_HORA) SEQ.abreQuiz(id);
  }, { once:true });
}

/* em que tópico a aula está agora — é o que a gaveta acende */
function topicoAtual(){
  if (atual === 3){
    const base = NAV_TOPICOS.findIndex(t => t.slide === 3);
    return base + (QUIZ4.ativo || QUIZ4.trilhas.includes(trilhaAtual) ? 1 : 0);
  }
  if (atual === 2){
    const base = NAV_TOPICOS.findIndex(t => t.slide === 2);
    const tr = trilhaAtual, t = som.currentTime || 0;
    if (QUIZ3.aberto || tr === '2.5' || tr === '2.5A') return base + 3;
    if (tr === '2.3' || tr === '2.4' || FINAL.feito) return base + 2;
    if ((tr === '2' && t >= 25) || tr === '2.1' || tr === '2.2') return base + 1;
    return base;
  }
  if (atual !== 1) return -1;
  if (memAberto || trilhaAtual === '1.jogo') return NAV_TOPICOS.findIndex(t => t.titulo === 'Jogo da memória');
  if (QUIZ.aberto && QUIZ.origem === '1.4') return 2;
  if (QUIZ.aberto || trilhaAtual === '1.4') return 1;
  return 0;
}

function navAberta(){ return !!navGaveta && navGaveta.classList.contains('aberta'); }

/* a alça só existe do slide da tabela em diante */

/* ============================================================
   O AJUSTE DA TABELA — a ferramenta de medir a mesa no celular
   GUARDADA E DESLIGADA (AJUSTE_LIGADO = false): a medida tirada com ela
   está em MESA_NO_CELULAR, e é aplicada no celular. Para medir outra vez
   — nesta mesa ou, mais adiante, noutra peça —, basta ligá-la.
   SÓ NO CELULAR (ehCelular): tablets, Chromebooks e computadores não
   veem nada disto, e a tabela deles não muda.
   Ligado (AJUSTE_LIGADO), a tabela do slide 1 fica travada: os cubos não
   respondem ao toque, os toques no slide não fazem nada, e a mesa não
   se mexe sozinha à espera do play. Um dedo arrasta a tabela; dois, em
   pinça, aumentam ou diminuem em volta do ponto entre eles, como num
   mapa (num computador que se passe por celular, o rato arrasta e a
   roda muda o tamanho).
   A medida — o deslocamento em pixels do palco e a escala — aparece no
   painel do alto, e o Copiar leva-a, com o tamanho da tela, para ser
   colada na conversa e aplicada no app. O × desliga o ajuste até a
   página recarregar (a medida fica aplicada, para ver a tabela assim).
   A medida vive nas variáveis que a .mesa já tinha para isso: --px,
   --py e --zoom, com a origem no meio do palco.
   ============================================================ */
/* DESLIGADO: a medida já foi tirada. Para medir de novo, true — o painel
   volta no celular, a começar da medida em uso. */
var AJUSTE_LIGADO = false;
/* A MESA NO CELULAR — a medida tirada no aparelho do professor (tela
   832 × 384, palco 0,533, folga 140): a tabela um fio acima e 15,6 %
   maior, a avançar pelas laterais que o celular tem a mais. Só no
   celular: nas telas maiores a mesa não é tocada. */
const MESA_NO_CELULAR = { x:2, y:-22, e:1.156 };
var AJUSTE = { ligado:false, x:MESA_NO_CELULAR.x, y:MESA_NO_CELULAR.y, e:MESA_NO_CELULAR.e,
               dedos:new Map(), ini:null };
const limitaEscala = e => Math.max(0.4, Math.min(2.5, e));
/* um ponto da tela, em pixels do palco */
function noPalco(pt){
  const r = stage.getBoundingClientRect();
  return { x:(pt.x - r.left) / fitScale, y:(pt.y - r.top) / fitScale };
}
function meioDosDedos(d){
  const n = d.length || 1;
  return { x:d.reduce((a, p) => a + p.x, 0) / n, y:d.reduce((a, p) => a + p.y, 0) / n };
}
const distDosDedos = d => d.length > 1 ? Math.hypot(d[0].x - d[1].x, d[0].y - d[1].y) : 0;

function montaAjuste(){
  const p = document.createElement('div');
  p.id = 'ajuste';
  p.hidden = true;
  p.innerHTML = '<span class="aj-rot">Ajuste da tabela</span><output></output>' +
    '<button type="button" class="aj-zera">Zerar</button>' +
    '<button type="button" class="forte aj-copia">Copiar</button>' +
    '<button type="button" class="x" aria-label="Desligar o ajuste da tabela">×</button>';
  document.body.appendChild(p);
  p.querySelector('.aj-zera').addEventListener('click', () => {
    AJUSTE.x = AJUSTE.y = 0; AJUSTE.e = 1; aplicaAjuste();
  });
  p.querySelector('.aj-copia').addEventListener('click', copiaAjuste);
  p.querySelector('.x').addEventListener('click', () => { AJUSTE_LIGADO = false; ajusteNoSlide(); });
  const sl = slides[1];
  sl.addEventListener('pointerdown', dedoDesce);
  sl.addEventListener('pointermove', dedoAnda);
  sl.addEventListener('pointerup', dedoSobe);
  sl.addEventListener('pointercancel', dedoSobe);
  sl.addEventListener('wheel', rodaAjuste, { passive:false });
  /* ZERO INTERAÇÕES: nenhum clique chega a quem está no slide (a tela
     escura, o quiz, os cubos) enquanto o ajuste está ligado */
  sl.addEventListener('click', ev => {
    if (AJUSTE.ligado){ ev.stopPropagation(); ev.preventDefault(); }
  }, true);
  ajusteNoSlide();
}
/* o ajuste só existe no slide da tabela, e só no celular: nas telas
   maiores a tabela continua como sempre, interativa, sem painel e sem
   nenhuma medida aplicada */
function ajusteNoSlide(){
  if (!window.AJUSTE) return;
  const celular = ehCelular();
  const on = AJUSTE_LIGADO && atual === 1 && celular;
  AJUSTE.ligado = on;
  AJUSTE.dedos.clear();
  stage.classList.toggle('ajustando', on);
  const p = document.getElementById('ajuste');
  if (p) p.hidden = !on;
  if (on) VIDA.desliga();
  /* no celular a mesa fica na medida (a de MESA_NO_CELULAR, ou a que o
     ajuste estiver a tirar); fora dele, volta ao desenho de sempre */
  if (celular) aplicaAjuste();
  else tiraAjuste();
}
function tiraAjuste(){
  document.querySelectorAll('#deck .mesa').forEach(m =>
    ['--px', '--py', '--zoom'].forEach(v => m.style.removeProperty(v)));
}
function aplicaAjuste(){
  /* a medida vale para a mesa de todos os slides com tabela */
  document.querySelectorAll('#deck .mesa').forEach(m => {
    m.style.setProperty('--px', AJUSTE.x.toFixed(1) + 'px');
    m.style.setProperty('--py', AJUSTE.y.toFixed(1) + 'px');
    m.style.setProperty('--zoom', AJUSTE.e.toFixed(3));
  });
  const o = document.querySelector('#ajuste output');
  if (o) o.textContent = 'x ' + Math.round(AJUSTE.x) + ' · y ' + Math.round(AJUSTE.y) +
                         ' · escala ' + AJUSTE.e.toFixed(2);
}

/* O GESTO. No começo de cada gesto (e sempre que um dedo entra ou sai)
   guarda-se onde a mesa estava e o ponto da mesa que está debaixo do meio
   dos dedos; a cada passo, a mesa é posta de modo que esse mesmo ponto
   continue debaixo do meio dos dedos, no tamanho que a pinça pede. Com um
   dedo só, isso é arrastar. */
function comecaGesto(){
  const d = [...AJUSTE.dedos.values()];
  const m0 = noPalco(meioDosDedos(d));
  AJUSTE.ini = { x:AJUSTE.x, y:AJUSTE.y, e:AJUSTE.e, dist:distDosDedos(d),
                 p:{ x:(m0.x - 640 - AJUSTE.x) / AJUSTE.e, y:(m0.y - 360 - AJUSTE.y) / AJUSTE.e } };
}
function dedoDesce(ev){
  if (!AJUSTE.ligado) return;
  ev.preventDefault();
  try { slides[1].setPointerCapture(ev.pointerId); } catch(_){}
  AJUSTE.dedos.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  comecaGesto();
}
function dedoAnda(ev){
  if (!AJUSTE.ligado || !AJUSTE.dedos.has(ev.pointerId)) return;
  AJUSTE.dedos.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  const d = [...AJUSTE.dedos.values()], i = AJUSTE.ini;
  const e = (d.length > 1 && i.dist > 0) ? limitaEscala(i.e * distDosDedos(d) / i.dist) : i.e;
  const m = noPalco(meioDosDedos(d));
  AJUSTE.e = e;
  AJUSTE.x = m.x - 640 - e * i.p.x;
  AJUSTE.y = m.y - 360 - e * i.p.y;
  aplicaAjuste();
}
function dedoSobe(ev){
  if (!AJUSTE.dedos.has(ev.pointerId)) return;
  AJUSTE.dedos.delete(ev.pointerId);
  /* o dedo que fica continua o arrasto, sem salto */
  if (AJUSTE.dedos.size) comecaGesto();
}
/* a roda do rato: cresce e encolhe em volta do ponteiro */
function rodaAjuste(ev){
  if (!AJUSTE.ligado) return;
  ev.preventDefault();
  const m = noPalco({ x:ev.clientX, y:ev.clientY });
  const p = { x:(m.x - 640 - AJUSTE.x) / AJUSTE.e, y:(m.y - 360 - AJUSTE.y) / AJUSTE.e };
  AJUSTE.e = limitaEscala(AJUSTE.e * Math.exp(-ev.deltaY * 0.0015));
  AJUSTE.x = m.x - 640 - AJUSTE.e * p.x;
  AJUSTE.y = m.y - 360 - AJUSTE.e * p.y;
  aplicaAjuste();
}

/* A MEDIDA PARA A CONVERSA: o deslocamento e a escala da mesa, e a tela
   em que foram medidos (com a folga dos lados, no celular) */
function textoDoAjuste(){
  const folga = parseFloat(stage.style.getPropertyValue('--folga')) || 0;
  return 'mesa: x ' + Math.round(AJUSTE.x) + ', y ' + Math.round(AJUSTE.y) +
         ', escala ' + AJUSTE.e.toFixed(3) + ' | tela ' + innerWidth + 'x' + innerHeight +
         ', palco ' + fitScale.toFixed(3) + ', folga ' + Math.round(folga);
}
async function copiaAjuste(){
  const t = textoDoAjuste();
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(_){}
  if (!ok){
    /* sem a área de transferência (alguns navegadores negam): o velho
       caminho, por um campo de texto escondido */
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove();
  }
  const p = document.getElementById('ajuste'), b = p.querySelector('.aj-copia');
  b.textContent = ok ? 'Copiado!' : 'Copie o aviso';
  p.classList.toggle('copiado', ok);
  /* e o texto aparece na tela, para conferir — ou copiar à mão */
  TP.diz(t);
  setTimeout(() => { p.classList.remove('copiado'); b.textContent = 'Copiar'; }, 1800);
}
montaAjuste();
/* a tela gira ou muda de tamanho: o celular pode deixar de o ser */
addEventListener('resize', ajusteNoSlide);

addEventListener('keydown', ev => {
  const k = ev.key;
  /* a gaveta aberta fecha com o Esc antes de tudo o resto */
  if (navAberta() && k === 'Escape'){ fechaNav(); ev.preventDefault(); return; }
  if (memAberto && k === 'Escape'){ fechaMemoria(); ev.preventDefault(); return; }
  /* o menu do endereço aberto fecha com o Esc antes de tudo o resto */
  if (!menuEmail.hidden && k === 'Escape'){ fechaMenuEmail(); ev.preventDefault(); return; }
  /* ---- a montagem ---- */
  if ((ev.ctrlKey || ev.metaKey) && (k === 'c' || k === 'C')){
    /* com a folha aberta, o Ctrl+C é o do navegador: o texto já está
       selecionado ali dentro à espera dele */
    if (!coordsCx.hidden) return;
    if (naMontagem()){ copiaCoords(); ev.preventDefault(); }
    return;
  }
  if (k === 'Escape' && !coordsCx.hidden){ coordsCx.hidden = true; ev.preventDefault(); return; }
  if (k === 'g' || k === 'G'){ modoMontagem(); ev.preventDefault(); return; }
  if (naMontagem() && (k === 'r' || k === 'R')){ refazLayout(); ev.preventDefault(); return; }
  /* com a visão geral aberta, o teclado é só dela: as setas não podem
     trocar o slide por baixo de quem está a escolher um */
  if (!overview.hidden){
    if (k === 'Escape' || k === 'o' || k === 'O'){ mostraOverview(false); ev.preventDefault(); }
    return;
  }
  if (k === 'o' || k === 'O'){ mostraOverview(true); ev.preventDefault(); return; }
  if ((k === 'n' || k === 'N') && atual >= 1 && !naMontagem()){ alternaNav(); ev.preventDefault(); return; }
  if (k === 'ArrowRight' || k === 'PageDown'){ go(atual+1); ev.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ go(atual-1); ev.preventDefault(); }
  else if (k === ' '){ tocaOuPara(); ev.preventDefault(); }
  else if (k === 'Home'){ go(0); }
  else if (k === 'End'){ go(SLIDES.length-1); }
  else if (k === 'f' || k === 'F'){ telaCheia(); }
  else if (k === 'Escape'){ mostraBarra(false); }
  else if (k >= '1' && k <= '9'){ go(+k - 1); }
});

/* ------------------------------------------------------------
   A ABERTURA
   ------------------------------------------------------------ */
slides[0].classList.add('is-active');
SLIDES_COM_MESA.forEach(i => montaTabela(i));
montaBlocosDaCapa();
montaFrases();
montaCenaDoSlide1();
montaCenaDoSlide3();
atualizaCabecalho();
/* a capa vai para o lugar que ficou arrumado à mão */
aplicaLayout(0);
/* e vai outra vez quando as fontes chegarem: a medida de um texto é a
   medida da letra dele, e até a fonte de casa carregar quem está na
   tela é a do sistema, que tem outra largura */
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { desprende(slides[0]); aplicaLayout(0); });
animaCapa();
vidaDosBlocos();
carregaTrilha('capa');

/* o serviço que guarda a aula no aparelho */
/* o selo da versão, no canto */
document.getElementById('versao').textContent = VERSAO;
if ('serviceWorker' in navigator)
  addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js?v=' + encodeURIComponent(VERSAO)).catch(() => {}));
</script>
